<title>Oferta Genesis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,200;9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
  /* Layout: el lenguaje del campus Genesis. Un tablero de una sola pantalla, como el mapa en Miro:
     Equipo (izq., alto completo) · Información + Bonus (centro) · Acompañamiento (der., alto completo).
     Cada bloque abre su detalle, y el detalle se recorre como slides. Look oscuro único, a propósito. */
  :root {
    --negro: #0A0807;
    --vidrio: rgba(255,255,255,.03);
    --borde: rgba(255,255,255,.08);
    --borde-2: rgba(255,255,255,.14);
    --hueso: #F3EEE8;
    --gris: #7E7873;
    --gris-2: #B3ACA6;
    --naranja: #E8823A;
    --naranja-fuerte: #D9661E;
    --verde: #4FD08A;
    --tinta: #170B03;
    --papel: #F7F5F2;
    --papel-tx: #1A1612;
    --f: "DM Sans", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { background: var(--negro); }
  body { background: var(--negro); color: var(--hueso); font-family: var(--f); font-size: 15px; line-height: 1.45; overflow: hidden; }
  body::after { content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(40vw 34vw at 70% 4%, rgba(201,92,24,.34), rgba(201,92,24,0) 70%),
      radial-gradient(46vw 40vw at -6% 104%, rgba(160,68,18,.2), rgba(160,68,18,0) 70%),
      linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px) 0 0 / 48px 48px,
      linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px) 0 0 / 48px 48px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--naranja); outline-offset: 3px; }
  h1, h2, h3 { margin: 0; line-height: 1.05; letter-spacing: -0.03em; font-weight: 300; text-wrap: balance; }
  p { margin: 0; }
  ul { margin: 0; padding: 0; list-style: none; }
  .num { font-variant-numeric: tabular-nums; }
  .eyebrow { font-size: 10.5px; font-weight: 500; letter-spacing: .26em; text-transform: uppercase; color: var(--gris-2); }
  .vidrio { background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.012)); border: 1px solid var(--borde); border-radius: 14px; }

  .app { position: relative; z-index: 1; height: 100%; max-width: 1480px; margin: 0 auto; display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: clamp(6px, 1.4vh, 14px); padding-block: clamp(10px, 1.8vh, 18px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  /* Barra */
  .barra { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 500; letter-spacing: .3em; font-size: 12px; }
  .logo svg { width: 26px; height: 26px; }
  .switch { display: inline-flex; padding: 4px; border-radius: 999px; border: 1px solid var(--borde-2); background: rgba(0,0,0,.35); }
  .switch button { border: 0; background: transparent; padding: 8px 18px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--gris-2); transition: background .2s, color .2s; }
  .switch button[aria-pressed="true"] { background: var(--naranja); color: var(--tinta); }
  .acciones { display: flex; justify-content: flex-end; }
  .btn { border: 1px solid var(--borde-2); background: var(--vidrio); padding: 8px 16px; border-radius: 999px; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
  .btn:hover { border-color: var(--naranja); }
  .btn.prim { background: var(--naranja); border-color: var(--naranja); color: var(--tinta); font-weight: 600; }

  /* Cabeza compacta */
  .cabeza { display: grid; justify-items: center; text-align: center; gap: 2px; }
  .cabeza h1 { font-size: clamp(34px, 7vh, 72px); font-weight: 700; letter-spacing: -0.04em; color: var(--naranja); line-height: .95; }
  .cabeza .dur { font-size: clamp(14px, 2vh, 19px); font-style: italic; color: var(--gris); font-weight: 500; }

  /* Tablero */
  .tablero { min-height: 0; display: grid; grid-template-columns: 1fr 1.3fr 1fr; grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "eq info ac" "eq bonus ac"; gap: clamp(8px, 1.4vh, 14px) clamp(12px, 1.6vw, 22px); }
  .zona { min-height: 0; min-width: 0; display: flex; flex-direction: column; gap: clamp(6px, 1vh, 10px); }
  .z-eq { grid-area: eq; } .z-info { grid-area: info; } .z-ac { grid-area: ac; } .z-bonus { grid-area: bonus; }
  .zona > h2 { text-align: center; font-size: clamp(16px, 2.6vh, 26px); font-weight: 700; letter-spacing: .01em; text-transform: uppercase; }

  .bloque { text-align: left; border: 1px solid var(--borde); border-radius: 14px; background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.012)); padding: clamp(10px, 1.5vh, 16px); display: flex; flex-direction: column; gap: clamp(6px, 1.1vh, 12px); position: relative; transition: border-color .2s, background .2s; min-width: 0; min-height: 0; width: 100%; }
  .bloque:hover { border-color: rgba(232,130,58,.65); background: linear-gradient(180deg, rgba(232,130,58,.07), rgba(255,255,255,.012)); }
  .bloque.crece { flex: 1 1 0; }
  .bloque .ver { position: absolute; top: 8px; right: 10px; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--gris); background: rgba(10,8,7,.7); padding: 2px 7px; border-radius: 999px; z-index: 2; transition: color .2s; }
  .bloque .ver { opacity: 0; transition: opacity .2s, color .2s; }
  .bloque:hover .ver, .bloque:focus-visible .ver { opacity: 1; color: var(--naranja); }
  @media (hover: none) { .bloque .ver { display: none; } }

  .persona { display: grid; grid-template-columns: clamp(34px, 5vh, 46px) 1fr; gap: 10px; align-items: center; }
  .avatar { width: clamp(34px, 5vh, 46px); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; font-weight: 600; background: radial-gradient(circle at 30% 25%, #3a2a20, #15100c); border: 1px solid var(--borde-2); }
  .persona b { display: block; font-weight: 600; font-size: 13.5px; color: var(--naranja); }
  .persona small { color: var(--gris-2); font-size: 12px; }
  .mini-dash { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
  .mini-dash div { background: var(--papel); color: var(--papel-tx); border-radius: 7px; padding: 5px 7px; display: grid; min-width: 0; }
  .mini-dash small { font-size: 9px; color: #6b6560; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini-dash strong { font-size: clamp(12px, 1.9vh, 15px); font-weight: 600; }

  .foto-dash img { width: 100%; display: block; border-radius: 8px; max-height: clamp(70px, 12vh, 130px); object-fit: cover; object-position: top left; }
  .resultados-top { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .galeria-movil { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .galeria-movil img { width: 100%; border-radius: 10px; border: 1px solid var(--borde); display: block; }
  .hueco { flex: 1 1 0; min-height: 40px; border: 1px dashed var(--borde-2); border-radius: 10px; display: grid; place-items: center; text-align: center; padding: 8px; font-size: 12px; color: var(--gris); background: radial-gradient(70% 80% at 30% 80%, rgba(232,130,58,.18), rgba(232,130,58,0) 70%); }

  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(2px, .55vh, 6px) 14px; font-size: clamp(10.5px, 1.55vh, 12.5px); font-weight: 600; }
  .checks li { display: flex; gap: 7px; align-items: baseline; min-width: 0; }
  .ok { flex: none; width: 13px; height: 13px; border-radius: 3px; background: var(--verde); display: inline-grid; place-items: center; transform: translateY(2px); }
  .ok::after { content: ""; width: 6px; height: 3.5px; border-left: 2px solid #0b2a17; border-bottom: 2px solid #0b2a17; transform: rotate(-45deg) translate(1px,-1px); }
  .herr { font-size: clamp(11px, 1.6vh, 13px); font-weight: 600; display: flex; gap: 7px; justify-content: center; }

  .acomp-item { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
  .pill { flex: none; background: var(--naranja-fuerte); color: #fff; font-weight: 700; text-align: center; padding: clamp(5px, .9vh, 9px) 12px; border-radius: 8px; font-size: clamp(13px, 1.9vh, 16px); }
  .pill small { display: block; font-weight: 400; font-size: 11.5px; opacity: .85; }
  .fotos { flex: 1 1 0; min-height: 0; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
  .fotos img { width: 100%; height: 100%; min-height: 0; object-fit: cover; border-radius: 8px; border: 1px solid var(--borde); display: block; background: #120d0a; }
  .fotos img.arriba { object-position: top left; }

  .bonus-grid { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 10px; }
  .bonus-grid .bloque { align-items: center; text-align: center; }
  .bonus-grid h3 { font-size: clamp(15px, 2.3vh, 22px); font-weight: 700; letter-spacing: 0; }
  .b-cuerpo { width: 100%; border-radius: 10px; background: #120d0a; border: 1px solid var(--borde); padding: clamp(6px, 1vh, 10px); display: grid; gap: 4px; justify-items: center; min-height: clamp(58px, 9vh, 92px); align-content: center; }
  .b-cuerpo .t { font-size: 13px; font-weight: 600; }
  .b-cuerpo .s { font-size: 11px; color: var(--gris-2); }
  .grande-verde { font-size: clamp(24px, 4.2vh, 38px); font-weight: 700; color: var(--verde); letter-spacing: -0.02em; line-height: 1; }
  .puentify { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .puentify i { font-style: normal; color: #A98BFF; font-size: 16px; }


  /* Campus: réplica navegable de la plataforma, dentro de un marco de navegador */
  .navegador { border: 1px solid var(--borde-2); border-radius: 14px; overflow: hidden; background: #070505; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  .nav-barra { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: #141010; border-bottom: 1px solid var(--borde); }
  .nav-barra .dots { display: flex; gap: 6px; }
  .nav-barra .dots i { width: 10px; height: 10px; border-radius: 50%; background: #3a3230; }
  .nav-barra .url { flex: 1; min-width: 0; text-align: center; font-size: 12px; color: var(--gris); background: #0b0808; border-radius: 6px; padding: 4px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .campus-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .campus-tabs button { border: 1px solid var(--borde-2); background: var(--vidrio); border-radius: 999px; padding: 7px 14px; font-size: 13px; color: var(--gris-2); }
  .campus-tabs button[aria-pressed="true"] { background: var(--naranja); border-color: var(--naranja); color: var(--tinta); font-weight: 600; }
  .cp { position: relative; min-height: 460px; padding: 28px clamp(16px, 4vw, 48px) 36px; overflow: hidden; font-size: 13px; color: #EDE6DF; }
  .cp::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(42% 55% at 82% 8%, rgba(228,98,20,.55), rgba(228,98,20,0) 70%), radial-gradient(38% 50% at 6% 96%, rgba(228,98,20,.45), rgba(228,98,20,0) 70%); }
  .cp > * { position: relative; }
  .cp-k { font-size: 9.5px; letter-spacing: .3em; text-transform: uppercase; color: var(--gris); }
  .cp-k.n { color: var(--naranja); }
  .cp h4 { margin: 0; font-weight: 300; letter-spacing: -0.035em; font-size: clamp(26px, 3.6vw, 36px); line-height: 1.05; }
  .cp-card { background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.07); border-radius: 12px; padding: 14px; min-width: 0; }
  .cp-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: -12px 0 22px; flex-wrap: wrap; }
  .cp-top .marca { font-size: 10px; letter-spacing: .34em; color: var(--naranja); font-weight: 600; }
  .cp-top nav { display: flex; gap: 4px; flex-wrap: wrap; }
  .cp-top nav button { border: 0; background: transparent; color: var(--gris-2); font-size: 11.5px; padding: 5px 10px; border-radius: 999px; }
  .cp-top nav button.on { background: rgba(232,130,58,.22); color: var(--naranja); border: 1px solid rgba(232,130,58,.4); }
  .cp-av { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: rgba(232,130,58,.25); color: var(--naranja); font-size: 11px; font-weight: 600; }
  /* ingreso */
  .cp-login { display: grid; justify-items: center; align-content: center; gap: 10px; min-height: 400px; }
  .cp-login .marca { font-size: 11px; letter-spacing: .36em; color: var(--naranja); font-weight: 600; margin-bottom: 8px; }
  .cp-login input { width: min(280px, 100%); background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.12); border-radius: 6px; padding: 9px 11px; color: var(--hueso); font: inherit; font-size: 12.5px; }
  .cp-login .flecha { border: 0; background: transparent; color: var(--naranja); font-size: 20px; margin-top: 6px; }
  .cp-login .sol { color: var(--naranja); font-size: 12px; font-weight: 500; }
  /* inicio */
  .cp-hola { display: grid; justify-items: center; text-align: center; gap: 8px; padding-top: 18px; }
  .cp-tres { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 22px; max-width: 760px; margin-inline: auto; }
  .cp-tres .cp-card { display: grid; gap: 6px; text-align: left; min-height: 150px; align-content: start; }
  .cp-tres .cp-card .fila { display: flex; justify-content: space-between; color: var(--naranja); font-size: 11px; }
  .cp-tres .cp-card b { font-weight: 400; font-size: 16px; margin-top: 18px; }
  .cp-tres .cp-card small { color: var(--gris); font-size: 11px; }
  .cp-tres .cp-card .bar { height: 2px; background: rgba(255,255,255,.08); border-radius: 2px; }
  .cp-tres .cp-card .bar i { display: block; height: 100%; width: 83%; background: var(--naranja); border-radius: 2px; }
  .cp-tres .cp-card button { justify-self: start; margin-top: auto; border: 0; background: transparent; color: var(--gris-2); font-size: 11px; padding: 0; }
  .cp-tres .cp-card button:hover { color: var(--naranja); }
  /* progreso */
  .cp-prog { display: grid; grid-template-columns: 180px 1fr; gap: 10px; margin-top: 16px; }
  .cp-ring { display: grid; place-items: center; }
  .cp-ring svg { width: 110px; height: 110px; }
  .cp-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .cp-stats .cp-card b { font-weight: 300; font-size: 22px; letter-spacing: -0.03em; }
  .cp-stats .cp-card b small { font-size: 11px; color: var(--gris); }
  .cp-cont { grid-column: 1 / -1; }
  .cp-cont a, .cp-cont span.l { color: var(--naranja); font-size: 13px; }
  .cp-mods { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .cp-mod { display: grid; grid-template-columns: 20px 1fr auto; gap: 4px 8px; align-items: center; padding: 10px 12px; }
  .cp-mod .i { color: var(--naranja); font-size: 10.5px; }
  .cp-mod .d { font-size: 10px; color: var(--gris); }
  .cp-mod .b { grid-column: 2 / -1; height: 2px; background: rgba(255,255,255,.08); border-radius: 2px; }
  .cp-mod .b i { display: block; height: 100%; background: var(--naranja); border-radius: 2px; }
  /* herramientas */
  .cp-filtros { display: flex; gap: 6px; flex-wrap: wrap; margin: 16px 0 14px; align-items: center; }
  .cp-filtros button { border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.02); border-radius: 999px; padding: 5px 11px; font-size: 11px; color: var(--gris-2); }
  .cp-filtros button.on { background: rgba(232,130,58,.22); border-color: rgba(232,130,58,.5); color: var(--naranja); }
  .cp-filtros input { margin-left: auto; min-width: 140px; background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.1); border-radius: 999px; padding: 6px 12px; color: var(--hueso); font: inherit; font-size: 11.5px; }
  .cp-herr { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .cp-herr .cp-card { display: grid; gap: 6px; align-content: start; }
  .cp-herr .tg { justify-self: start; font-size: 8.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--gris-2); border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: 2px 8px; }
  .cp-herr b { font-weight: 500; font-size: 14px; }
  .cp-herr p { color: var(--gris); font-size: 11.5px; }
  .cp-herr .ft { font-size: 8.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--gris); margin-top: 4px; }
  .cp-vacio { color: var(--gris); padding: 20px 0; }
  .campus-mini { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
  .campus-mini img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 5px; border: 1px solid var(--borde); display: block; }
  @media (max-width: 760px) {
    .cp-tres, .cp-herr, .cp-mods, .cp-stats { grid-template-columns: 1fr; }
    .cp-prog { grid-template-columns: 1fr; }
  }
  [hidden] { display: none !important; }
  /* Detalle / slides */
  .visor { position: fixed; inset: 0; z-index: 20; background: rgba(10,8,7,.95); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); display: grid; grid-template-rows: auto 1fr auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .visor::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(45vw 40vw at 80% 0%, rgba(201,92,24,.3), rgba(201,92,24,0) 70%); }
  .visor-top, .visor-pie { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .que { font-size: 12px; letter-spacing: .26em; text-transform: uppercase; color: var(--gris-2); }
  .que b { color: var(--naranja); font-weight: 600; }
  .pista { font-size: 12px; color: var(--gris); }
  .escena { position: relative; overflow-y: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .slide { max-width: 1120px; margin: 0 auto; padding-block: 20px 36px; display: grid; gap: 26px; animation: entra .35s ease both; }
  @keyframes entra { from { opacity: .3; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .slide { animation: none; } }
  .slide-head { display: grid; gap: 10px; max-width: 760px; }
  .slide-head .k { font-size: 12px; font-weight: 600; letter-spacing: .28em; text-transform: uppercase; color: var(--naranja); }
  .slide-head h2 { font-size: clamp(34px, 5.4vw, 60px); }
  .slide-head p { font-size: 17px; color: var(--gris-2); font-weight: 300; max-width: 60ch; }
  .tarjetas { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
  .tarjeta { padding: 20px; display: grid; gap: 10px; align-content: start; min-width: 0; }
  .tarjeta h3 { font-size: 21px; font-weight: 400; }
  .tarjeta p { color: var(--gris-2); font-weight: 300; font-size: 15px; }
  .tarjeta .big { font-size: 44px; font-weight: 200; letter-spacing: -0.05em; line-height: 1; }
  .tarjeta .big em { font-style: normal; color: var(--naranja); }
  .tag-n { font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: var(--gris); font-weight: 500; }
  .lista { display: grid; gap: 8px; }
  .lista li { display: flex; gap: 10px; align-items: baseline; font-size: 15px; }
  .sops { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
  .sops div { border: 1px solid var(--borde); border-radius: 12px; padding: 11px 14px; display: flex; gap: 10px; align-items: baseline; font-size: 14px; background: var(--vidrio); min-width: 0; }
  .sops small { color: var(--gris); font-size: 11px; margin-left: auto; }
  .etapas { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .etapa { padding: 15px; display: grid; gap: 6px; align-content: start; min-width: 0; }
  .etapa .n { color: var(--naranja); font-size: 13px; font-weight: 600; }
  .etapa b { font-weight: 500; }
  .etapa p { color: var(--gris-2); font-size: 13px; font-weight: 300; }
  .linea-ant { display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap; }
  .linea-ant .a { font-size: clamp(34px, 5vw, 52px); font-weight: 200; color: var(--gris-2); letter-spacing: -0.05em; line-height: 1; }
  .linea-ant .b { font-size: clamp(56px, 9vw, 96px); font-weight: 200; letter-spacing: -0.06em; line-height: .9; }

      </div>` });
  });

  S.push({ id: "cierre", nombre: "Cierre", html: `
    <div class="slide portada">
      <span class="eyebrow" style="color:var(--naranja)">${o.cierre.k}</span>
      <h2 style="font-size:clamp(40px,7vw,80px);font-weight:300;color:var(--hueso)">${o.cierre.t}</h2>
      <p style="color:var(--gris-2);font-weight:300;font-size:19px;max-width:56ch">${o.cierre.p}</p>
    </div>` });

  return S;
}


/* ---------- Campus (réplica navegable) ---------- */
const MODULOS = [["Fundamentos",4,4],["Oferta y posicionamiento",6,6],["Adquisición",8,8],["Ventas",7,7],["Operación y escala",9,9],["Suscripción y precios",10,10],["Retención y recompra",9,12],["Logística y stock",0,8]];
const HERRAMIENTAS = [
  ["Landing Pages","Landing page","Agente Landing Page","Plantilla de páginas de ventas optimizada para convertir tráfico en clientes."],
  ["Retención","Retención","Flujo de retención v1","Secuencia de emails y automatizaciones para aumentar la recompra y la vida del cliente."],
  ["Retención","Retención","Flujo de retención v2","Estrategia avanzada de retención por clientes, contenido y triggers de reactivación."],
  ["Email Marketing","Email","Flujo de email de onboarding","Secuencia de bienvenida para educar, activar y generar primeras ventas."],
  ["Automatizaciones","Automatización","Skill: Carrito abandonado","Recuperá ventas perdidas con un flujo inteligente de emails y mensajes."],
  ["Ecommerce","Landing page","Agente Upsell / Cross-sell","Página y flujo para ofrecer productos complementarios y aumentar el ticket promedio."],
  ["Analítica","Analítica","Dashboard de métricas","Visualizá ventas, tráfico y LTV en tiempo real."],
  ["Ecommerce","Ecommerce","Flujo de lanzamiento","Secuencia completa para lanzar un nuevo producto o línea."],
  ["Automatizaciones","Automatización","Skill: Reabastecimiento","Automatizá avisos y campañas para recuperar stock y maximizar ventas."]
];
const FILTROS = ["Todas","Landing Pages","Email Marketing","Automatizaciones","Retención","Ecommerce","Analítica"];
const VISTAS = [["ingreso","Ingreso"],["inicio","Inicio"],["progreso","Tu progreso"],["herramientas","Herramientas"]];
let vistaCampus = "inicio", filtroCampus = "Todas", buscaCampus = "";

function cpTop(on) {
  return `<div class="cp-top"><span class="marca">GENESIS</span><nav>${[["progreso","Tu avance"],["inicio","Módulos"],["herramientas","Baúl de herramientas"]].map(([v,t]) => `<button type="button" data-cp="${v}" class="${on === v ? "on" : ""}">${t}</button>`).join("")}</nav><span class="cp-av">L</span></div>`;
}
function vistaHTML(v) {
  if (v === "ingreso") return `
    <div class="cp-login">
      <span class="marca">GENESIS</span>
      <input type="email" id="cp-email" placeholder="Email" aria-label="Email" autocomplete="off">
      <input type="password" id="cp-pass" placeholder="Contraseña" aria-label="Contraseña" autocomplete="off">
      <button type="button" class="flecha" data-cp="inicio" aria-label="Entrar">→</button>
      <span class="sol">Solicitar acceso</span>
      <span class="cp-k">Solo miembros de Genesis OS</span>
    </div>`;
  if (v === "inicio") return `
    <div class="cp-hola">
      <span class="cp-k">Bienvenido de nuevo</span>
      <h4>Hola, Lauty</h4>
      <span style="color:var(--gris-2)">¿Por dónde querés continuar hoy?</span>
    </div>
    <div class="cp-tres">
      <div class="cp-card"><span class="fila"><span>01</span><span>↗</span></span><b>Tu avance</b><small>83% del programa completado</small><span class="bar"><i></i></span><button type="button" data-cp="progreso">Ingresar →</button></div>
      <div class="cp-card"><span class="fila"><span>02</span><span>▤</span></span><b>Módulos</b><small>8 módulos de contenido grabado</small><button type="button" data-cp="progreso">Ingresar →</button></div>
      <div class="cp-card"><span class="fila"><span>03</span><span>▣</span></span><b>Baúl de herramientas</b><small>42 plantillas y recursos</small><button type="button" data-cp="herramientas">Ingresar →</button></div>
    </div>`;
  if (v === "progreso") {
    const r = 46, c = 2 * Math.PI * r;
    return `${cpTop("progreso")}
    <span class="cp-k">01 · Tu avance</span><h4 style="margin-top:6px">Tu progreso</h4>
    <div class="cp-prog">
      <div class="cp-card cp-ring"><svg viewBox="0 0 110 110" aria-label="83% completado"><circle cx="55" cy="55" r="${r}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="4"/><circle cx="55" cy="55" r="${r}" fill="none" stroke="var(--naranja)" stroke-width="4" stroke-linecap="round" stroke-dasharray="${c * .83} ${c}" transform="rotate(-90 55 55)"/><text x="55" y="58" text-anchor="middle" fill="var(--hueso)" font-size="22" font-weight="300" font-family="DM Sans, sans-serif">83%</text><text x="55" y="72" text-anchor="middle" fill="var(--gris)" font-size="6" letter-spacing="1.5" font-family="DM Sans, sans-serif">COMPLETADO</text></svg></div>
      <div style="display:grid;gap:10px;min-width:0">
        <div class="cp-stats num">
          <div class="cp-card"><b>53<small>/64</small></b><div class="cp-k">Lecciones</div></div>
          <div class="cp-card"><b>6<small>/8</small></b><div class="cp-k">Módulos</div></div>
          <div class="cp-card"><b>38 h 40 min</b><div class="cp-k">Tiempo visto</div></div>
        </div>
        <div class="cp-card cp-cont"><div class="cp-k">Continuar · Módulo 7</div><span class="l">▷ Retención y recompra</span></div>
      </div>
    </div>
    <div class="cp-k" style="margin-top:18px">Por módulo</div>
    <div class="cp-mods num">${MODULOS.map((m, i) => `<div class="cp-card cp-mod"><span class="i">0${i+1}</span><span>${m[0]}</span><span class="d">${m[1]}/${m[2]} · ${Math.round(m[1]/m[2]*100)}%</span><span class="b"><i style="width:${m[1]/m[2]*100}%"></i></span></div>`).join("")}</div>`;
  }
  const q = buscaCampus.trim().toLowerCase();
  const lista = HERRAMIENTAS.filter(h => (filtroCampus === "Todas" || h[0] === filtroCampus) && (!q || (h[2] + " " + h[3]).toLowerCase().includes(q)));
  return `${cpTop("herramientas")}
    <span class="cp-k">02 · Baúl de herramientas</span><h4 style="margin-top:6px">Herramientas</h4>
    <p style="color:var(--gris-2);margin-top:6px">Plantillas, recursos y software para aplicar lo que aprendés.</p>
    <div class="cp-filtros">${FILTROS.map(f => `<button type="button" data-filtro="${f}" class="${f === filtroCampus ? "on" : ""}">${f}</button>`).join("")}<input type="search" id="cp-busca" placeholder="Buscar..." aria-label="Buscar herramientas" value="${buscaCampus.replace(/"/g, "&quot;")}"></div>
    <div class="cp-herr" id="cp-herr">${lista.length ? lista.map(h => `<div class="cp-card"><span class="tg">${h[1]}</span><b>${h[2]}</b><p>${h[3]}</p><span class="ft">${h[0]}</span></div>`).join("") : `<p class="cp-vacio">No hay herramientas con ese filtro.</p>`}</div>`;
}
function campusHTML() {
  return `
    <div style="display:grid;gap:12px">
      <div class="campus-tabs" role="group" aria-label="Pantallas del campus">${VISTAS.map(([v,t]) => `<button type="button" data-cpv="${v}" aria-pressed="${v === vistaCampus}">${t}</button>`).join("")}</div>
      <div class="navegador">
        <div class="nav-barra"><span class="dots"><i></i><i></i><i></i></span><span class="url">campus.genesis · ${VISTAS.find(x => x[0] === vistaCampus)[1]}</span></div>
        <div class="cp" id="cp-pantalla">${vistaHTML(vistaCampus)}</div>
      </div>
      <p class="pista">Es una réplica navegable del campus: tocá las pestañas, los filtros y los botones de "Ingresar".</p>
    </div>`;
}
function bindCampus(root) {
  const cont = root.querySelector("#campus");
  if (!cont) return;
  const redibujar = (foco) => { cont.innerHTML = campusHTML(); bindCampus(root); if (foco) { const el = cont.querySelector(foco); if (el) { el.focus(); if (el.setSelectionRange) el.setSelectionRange(el.value.length, el.value.length); } } };
  cont.querySelectorAll("[data-cpv]").forEach(b => b.addEventListener("click", () => { vistaCampus = b.dataset.cpv; redibujar(); }));
  cont.querySelectorAll("[data-cp]").forEach(b => b.addEventListener("click", () => { vistaCampus = b.dataset.cp; redibujar(); }));
  cont.querySelectorAll("[data-filtro]").forEach(b => b.addEventListener("click", () => { filtroCampus = b.dataset.filtro; redibujar(); }));
  const bus = cont.querySelector("#cp-busca");
  if (bus) bus.addEventListener("input", () => { buscaCampus = bus.value; redibujar("#cp-busca"); });
}

function abrir(id) {
  const i = slides.findIndex(s => s.id === id);
  idx = i < 0 ? 0 : i;
  $("#visor").hidden = false;
  pintar();
  $("#sig").focus();
}
function cerrar() {
  $("#visor").hidden = true;
  setHash(oferta);
}
function ir(d) {
  const n = idx + d;
  if (n < 0 || n >= slides.length) return;
  idx = n; pintar();
}
function pintar() {
  const s = slides[idx];
  $("#escena").innerHTML = s.html;
  $("#escena").scrollTop = 0;
  $("#que").innerHTML = `<b>${OFERTAS[oferta].nombre}</b> · ${s.nombre}`;
  $("#contador").textContent = `${idx + 1} / ${slides.length}`;
  $("#ant").disabled = idx === 0;
  $("#sig").disabled = idx === slides.length - 1;
  $("#puntos").innerHTML = slides.map((x, i) => `<button type="button" aria-label="${x.nombre}" ${i === idx ? 'aria-current="true"' : ""} data-i="${i}"></button>`).join("");
  $("#puntos").querySelectorAll("button").forEach(b => b.addEventListener("click", () => { idx = +b.dataset.i; pintar(); }));
  bindCampus($("#escena"));
  $("#escena").querySelectorAll("[data-salto]").forEach(b => b.addEventListener("click", () => abrir(b.dataset.salto)));
  setHash(`${oferta}-${s.id}`);
}

/* ---------- Oferta y hash ---------- */
function setOferta(o) {
  oferta = o;
  document.querySelectorAll(".switch button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.o === o)));
  render();
}
function setHash(h) {
  try { if (location.hash !== "#" + h) history.replaceState(null, "", "#" + h); } catch (e) {}
}
function leerHash() {
  const h = (location.hash || "").slice(1);
  if (!h) { setOferta("os"); return; }
  const [o, ...rest] = h.split("-");
  setOferta(OFERTAS[o] ? o : "os");
  const id = rest.join("-");
  if (id) abrir(id); else if (!$("#visor").hidden) cerrar();
}

document.querySelectorAll(".switch button").forEach(b => b.addEventListener("click", () => {
  const abierto = !$("#visor").hidden;
  const actual = abierto ? slides[idx].id : null;
  setOferta(b.dataset.o);
  if (abierto) abrir(slides.some(s => s.id === actual) ? actual : "portada"); else setHash(oferta);
}));
$("#presentar").addEventListener("click", () => abrir("portada"));
$("#cerrar").addEventListener("click", cerrar);
$("#ant").addEventListener("click", () => ir(-1));
$("#sig").addEventListener("click", () => ir(1));
document.addEventListener("keydown", e => {
  if ($("#visor").hidden) return;
  if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); ir(1); }
  if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); ir(-1); }
  if (e.key === "Escape") cerrar();
});
let tx = null;
$("#escena").addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, { passive: true });
$("#escena").addEventListener("touchend", e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 60) ir(dx < 0 ? 1 : -1);
});
window.addEventListener("hashchange", leerHash);

leerHash();
</script>
