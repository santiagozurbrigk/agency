<title>Oferta Genesis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,200;9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
  /* Layout: el lenguaje del campus Genesis. Un tablero de una sola pantalla, como el mapa en Miro:
     Equipo (izq., alto completo) · Información + Bonus (centro) · Acompañamiento (der., alto completo).
     Cada bloque abre su detalle, y el detalle se recorre como slides. Look oscuro único, a propósito. */
  :root {
    --negro: #0A0807;
    --vidrio: rgba(255,255,255,.03);
    --borde: rgba(255,255,255,.08);
    --borde-2: rgba(255,255,255,.14);
    --hueso: #F3EEE8;
    --gris: #7E7873;
    --gris-2: #B3ACA6;
    --naranja: #E8823A;
    --naranja-fuerte: #D9661E;
    --verde: #4FD08A;
    --tinta: #170B03;
    --papel: #F7F5F2;
    --papel-tx: #1A1612;
    --f: "DM Sans", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { background: var(--negro); }
  body { background: var(--negro); color: var(--hueso); font-family: var(--f); font-size: 15px; line-height: 1.45; overflow: hidden; }
  body::after { content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(40vw 34vw at 70% 4%, rgba(201,92,24,.34), rgba(201,92,24,0) 70%),
      radial-gradient(46vw 40vw at -6% 104%, rgba(160,68,18,.2), rgba(160,68,18,0) 70%),
      linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px) 0 0 / 48px 48px,
      linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px) 0 0 / 48px 48px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--naranja); outline-offset: 3px; }
  h1, h2, h3 { margin: 0; line-height: 1.05; letter-spacing: -0.03em; font-weight: 300; text-wrap: balance; }
  p { margin: 0; }
  ul { margin: 0; padding: 0; list-style: none; }
  .num { font-variant-numeric: tabular-nums; }
  .eyebrow { font-size: 10.5px; font-weight: 500; letter-spacing: .26em; text-transform: uppercase; color: var(--gris-2); }
  .vidrio { background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.012)); border: 1px solid var(--borde); border-radius: 14px; }

  .app { position: relative; z-index: 1; height: 100%; max-width: 1480px; margin: 0 auto; display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: clamp(6px, 1.4vh, 14px); padding-block: clamp(10px, 1.8vh, 18px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  /* Barra */
  .barra { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 500; letter-spacing: .3em; font-size: 12px; }
  .logo svg { width: 26px; height: 26px; }
  .switch { display: inline-flex; padding: 4px; border-radius: 999px; border: 1px solid var(--borde-2); background: rgba(0,0,0,.35); }
  .switch button { border: 0; background: transparent; padding: 8px 18px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--gris-2); transition: background .2s, color .2s; }
  .switch button[aria-pressed="true"] { background: var(--hueso); color: var(--tinta); }
  .acciones { display: flex; justify-content: flex-end; }
  .btn { border: 1px solid var(--borde-2); background: var(--vidrio); padding: 8px 16px; border-radius: 999px; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
  .btn:hover { border-color: var(--naranja); }
  .btn.prim { background: var(--naranja); border-color: var(--naranja); color: var(--tinta); font-weight: 600; }

  /* Cabeza: título a la izquierda, prueba (panel de Manu) a la derecha */
  .cabeza { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 20px; }
  .cabeza .meta { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { font-size: 11px; font-weight: 500; letter-spacing: .04em; padding: 4px 11px; border: 1px solid var(--borde-2); border-radius: 999px; color: var(--gris-2); background: rgba(255,255,255,.02); }
  .chip.n { color: var(--naranja); border-color: rgba(232,130,58,.45); background: rgba(232,130,58,.08); }
  .cabeza h1 { font-size: clamp(32px, 6vh, 60px); font-weight: 300; letter-spacing: -0.055em; line-height: .92; }
  .cabeza h1 em { font-style: normal; color: var(--naranja); font-weight: 400; }
  .cabeza .tag { color: var(--gris-2); font-weight: 300; font-size: clamp(13px, 1.8vh, 16px); margin-top: clamp(4px, .9vh, 10px); max-width: 62ch; }
  .prueba { display: grid; gap: 8px; justify-items: end; }
  .prueba .stats { display: flex; border: 1px solid var(--borde); border-radius: 14px; background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.01)); }
  .prueba .stat { padding: clamp(8px, 1.3vh, 14px) clamp(14px, 1.6vw, 22px); display: grid; gap: 2px; }
  .prueba .stat + .stat { border-left: 1px solid var(--borde); }
  .prueba .stat b { font-size: clamp(20px, 3.4vh, 32px); font-weight: 300; letter-spacing: -0.04em; line-height: 1; }
  .prueba .stat b em { font-style: normal; color: var(--naranja); }
  .prueba .stat small { font-size: 10.5px; color: var(--gris); letter-spacing: .02em; }

  /* Tablero en bloques */
  .tablero { min-height: 0; display: grid; grid-template-columns: 1fr 1.15fr 1fr; grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas: "eq info ac" "eq res ac" "bon bon bon"; gap: clamp(8px, 1.3vh, 14px); }
  .a-eq { grid-area: eq; } .a-com { grid-area: com; } .a-info { grid-area: info; } .a-res { grid-area: res; } .a-ac { grid-area: ac; } .a-bon { grid-area: bon; }

  .card { position: relative; text-align: left; width: 100%; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: clamp(8px, 1.2vh, 12px);
    padding: clamp(12px, 1.7vh, 18px); border-radius: 18px; border: 1px solid var(--borde);
    background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.012)); transition: border-color .2s, transform .2s, background .2s; overflow: hidden; }
  .card:hover { border-color: rgba(232,130,58,.55); transform: translateY(-2px); background: linear-gradient(180deg, rgba(232,130,58,.075), rgba(255,255,255,.012)); }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }
  .card-h { display: flex; align-items: center; gap: 10px; padding-right: 30px; }
  .card-h .lbl { font-size: 10.5px; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; color: var(--hueso); display: flex; align-items: center; gap: 8px; }
  .card-h .lbl::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--naranja); box-shadow: 0 0 10px var(--naranja); }
  .card-h .mt { margin-left: auto; font-size: 11px; color: var(--gris); white-space: nowrap; }
  .flecha { position: absolute; top: clamp(10px, 1.5vh, 15px); right: clamp(10px, 1.5vh, 15px); width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--borde-2); display: grid; place-items: center; font-size: 12px; color: var(--gris-2); transition: all .2s; z-index: 2; background: rgba(10,8,7,.5); }
  .card:hover .flecha { background: var(--naranja); border-color: var(--naranja); color: var(--tinta); }

  /* Equipo */
  .personas { display: grid; gap: clamp(8px, 1.2vh, 12px); }
  .persona { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
  .avatar { width: clamp(34px, 5.2vh, 44px); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; font-weight: 500; font-size: 15px; color: var(--hueso);
    background: radial-gradient(circle at 30% 25%, #4a3020, #160f0b); box-shadow: 0 0 0 1px rgba(232,130,58,.5), 0 0 0 4px rgba(232,130,58,.08); }
  .persona b { display: block; font-weight: 500; font-size: 14px; }
  .a-eq .persona b { color: var(--naranja); font-size: clamp(13px, 1.9vh, 14.5px); }
  .avatar-foto { width: clamp(38px, 5.6vh, 50px); aspect-ratio: 1; border-radius: 50%; object-fit: cover; display: block; box-shadow: 0 0 0 1px rgba(232,130,58,.55), 0 0 0 4px rgba(232,130,58,.08); }
  .a-eq .personas { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; gap: clamp(10px, 1.6vh, 16px); }
  .a-eq .miembro:last-child { flex: 1 1 0; min-height: 0; grid-template-rows: auto minmax(0, 1fr); }
  .a-eq .miembro:last-child .prueba-img { min-height: 0; }
  .a-eq .miembro:last-child .prueba-img img { height: 100%; max-height: none; object-fit: cover; object-position: left top; border-radius: 10px; background: #000; }
  .miembro { display: grid; gap: clamp(5px, .8vh, 8px); min-height: 0; }
  .prueba-img img { width: 100%; height: auto; max-height: clamp(90px, 24vh, 240px); object-fit: contain; object-position: left center; border-radius: 8px; display: block; }
  .persona small { color: var(--gris); font-size: 12px; }

  /* Comunidad: foto a sangre */
  .card.foto { padding: 0; min-height: clamp(90px, 14vh, 130px); }
  .card.foto img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .card.foto::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,8,7,.55) 0%, rgba(10,8,7,0) 30%, rgba(10,8,7,0) 50%, rgba(10,8,7,.92) 100%); }
  .card.foto .card-h, .card.foto .pie { position: relative; z-index: 1; }
  .card.foto .card-h { padding: clamp(12px, 1.7vh, 18px); padding-right: 46px; }
  .card.foto .pie { margin-top: auto; padding: clamp(12px, 1.7vh, 18px); display: grid; gap: 2px; }
  .card.foto .pie b { font-weight: 400; font-size: clamp(15px, 2.2vh, 19px); letter-spacing: -0.02em; }
  .card.foto .pie small { color: var(--gris-2); font-size: 12px; }

  /* Información */
  .titulo-card { font-size: clamp(16px, 2.4vh, 21px); font-weight: 300; letter-spacing: -0.025em; }
  .titulo-card em { font-style: normal; color: var(--naranja); }
  .tags { display: flex; flex-wrap: wrap; gap: clamp(4px, .6vh, 6px); }
  .tags span { font-size: clamp(10.5px, 1.5vh, 12px); padding: clamp(3px, .45vh, 5px) 10px; border-radius: 999px; border: 1px solid var(--borde); background: rgba(255,255,255,.03); color: var(--gris-2); white-space: nowrap; }
  .tags span.herr { color: var(--naranja); border-color: rgba(232,130,58,.4); background: rgba(232,130,58,.07); }
  .sop-grupos { display: grid; gap: clamp(6px, 1vh, 10px); }
  .sop-grupos .grupo { --chip-h: calc(clamp(10.5px, 1.5vh, 12px) * 1.45 + 2 * clamp(3px, .45vh, 5px) + 2px); display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; align-items: start; }
  .sop-grupos .sub-lbl { line-height: var(--chip-h); white-space: nowrap; }
  .herr-fila .ok { transform: none; }
  .herr-fila { display: flex; gap: 8px; align-items: center; font-size: clamp(11.5px, 1.65vh, 13px); color: var(--gris-2); padding: 8px 12px; border-radius: 10px; background: rgba(232,130,58,.08); border: 1px solid rgba(232,130,58,.3); }
  .herr-fila b { color: var(--naranja); font-weight: 600; }
  .campus-mini { margin-top: auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .campus-mini img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 7px; border: 1px solid var(--borde); display: block; }
  .sub-lbl { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--gris); }

  /* Resultados */
  .res { flex: 1 1 0; min-height: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; }
  .res .dato { display: grid; align-content: center; gap: 2px; padding-right: 4px; }
  .res .dato b { font-size: clamp(26px, 4.6vh, 42px); font-weight: 200; letter-spacing: -0.05em; line-height: 1; }
  .res .dato b em { font-style: normal; color: var(--naranja); }
  .res .dato small { font-size: 11px; color: var(--gris); max-width: 16ch; }
  .total { display: flex; align-items: baseline; gap: 12px; }
  .total b { font-size: clamp(28px, 4.8vh, 44px); font-weight: 200; letter-spacing: -0.05em; line-height: 1; }
  .total b em { font-style: normal; color: var(--naranja); }
  .total small { font-size: clamp(20px, 3.4vh, 32px); font-weight: 300; letter-spacing: -0.03em; color: var(--hueso); line-height: 1.1; }
  .res-zoom { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .res-zoom figcaption b { color: var(--naranja); font-weight: 600; }
  .res-zoom figure { margin: 0; min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 4px; }
  .res-zoom img { width: 100%; height: 100%; min-height: 0; object-fit: contain; object-position: left top; border-radius: 8px; border: 1px solid var(--borde); display: block; }
  .res-zoom figcaption { font-size: 10.5px; color: var(--gris); }
  .fotos { min-height: 0; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
  .fotos img { width: 100%; height: 100%; min-height: 0; object-fit: cover; border-radius: 8px; border: 1px solid var(--borde); display: block; background: #120d0a; }
  .fotos img.arriba { object-position: top left; }

  /* Acompañamiento */
  .acomp { flex: 1 1 0; min-height: 0; display: grid; grid-auto-rows: minmax(0, 1fr); gap: clamp(8px, 1.2vh, 12px); }
  .acomp-item { min-height: 0; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 12px; align-items: stretch; }
  .acomp-item .fotos { height: 100%; }
  .acomp-item .tx { display: grid; align-content: center; gap: 4px; min-width: 0; }
  .acomp-item .tx b { font-weight: 500; font-size: clamp(13.5px, 2vh, 16px); letter-spacing: -0.01em; }
  .acomp-item .tx small { color: var(--gris); font-size: 12px; }
  .acomp-item .chip { justify-self: start; margin-top: 2px; }
  .dwy-nota { font-size: 11.5px; color: var(--gris-2); border-top: 1px solid var(--borde); padding-top: clamp(6px, 1vh, 10px); }
  .dwy-nota em { font-style: normal; color: var(--naranja); }

  /* Bonus + cierre */
  .a-bon { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: clamp(8px, 1.3vh, 14px); }
  .bonus { gap: 4px; }
  .bonus .k { font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--naranja); font-weight: 600; }
  .bonus b { font-weight: 400; font-size: clamp(15px, 2.3vh, 19px); letter-spacing: -0.02em; }
  .bonus b.monto { font-weight: 300; font-size: clamp(20px, 3.4vh, 28px); color: var(--naranja); letter-spacing: -0.04em; }
  .bonus small { color: var(--gris); font-size: 12px; }
  .card.cierre { background: linear-gradient(135deg, rgba(232,130,58,.28), rgba(232,130,58,.06)); border-color: rgba(232,130,58,.45); }
  .card.cierre .k { color: var(--hueso); opacity: .8; }
  .card.cierre .flecha { border-color: rgba(255,255,255,.3); color: var(--hueso); }

  .grande-verde { font-size: clamp(24px, 4.2vh, 38px); font-weight: 300; color: var(--naranja); letter-spacing: -0.04em; line-height: 1; }

  .ok { flex: none; width: 15px; height: 15px; border-radius: 50%; background: rgba(232,130,58,.16); box-shadow: inset 0 0 0 1px rgba(232,130,58,.55); display: inline-grid; place-items: center; transform: translateY(2px); }
  .ok::after { content: ""; width: 6px; height: 3.5px; border-left: 1.6px solid var(--naranja); border-bottom: 1.6px solid var(--naranja); transform: rotate(-45deg) translate(1px,-1px); }
  .pill { background: var(--naranja-fuerte); color: #fff; font-weight: 600; text-align: center; padding: 9px 12px; border-radius: 10px; font-size: 16px; }
  .resultados-top { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .tarjeta .avatar-foto { width: 72px; }
  .prueba-grande { width: 100%; border-radius: 10px; border: 1px solid var(--borde); display: block; }
  .galeria-movil { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .galeria-movil img { width: 100%; border-radius: 10px; border: 1px solid var(--borde); display: block; }

  /* Campus: réplica navegable de la plataforma, dentro de un marco de navegador */
  .navegador { border: 1px solid var(--borde-2); border-radius: 14px; overflow: hidden; background: #070505; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  .nav-barra { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: #141010; border-bottom: 1px solid var(--borde); }
  .nav-barra .dots { display: flex; gap: 6px; }
  .nav-barra .dots i { width: 10px; height: 10px; border-radius: 50%; background: #3a3230; }
  .nav-barra .url { flex: 1; min-width: 0; text-align: center; font-size: 12px; color: var(--gris); background: #0b0808; border-radius: 6px; padding: 4px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .campus-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .campus-tabs button { border: 1px solid var(--borde-2); background: var(--vidrio); border-radius: 999px; padding: 7px 14px; font-size: 13px; color: var(--gris-2); }
  .campus-tabs button[aria-pressed="true"] { background: var(--naranja); border-color: var(--naranja); color: var(--tinta); font-weight: 600; }
  .cp-vp { position: relative; aspect-ratio: 16 / 9; overflow: hidden; background: #070505; }
  .cp { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; padding: 34px 72px 40px; overflow: hidden; font-size: 14px; color: #EDE6DF; display: flex; flex-direction: column; }
  .navegador:fullscreen { display: flex; flex-direction: column; border-radius: 0; border: 0; width: 100vw; height: 100vh; }
  .navegador:fullscreen .cp-vp { flex: 1 1 auto; aspect-ratio: auto; }
  .nav-barra .full { border: 1px solid var(--borde-2); background: transparent; color: var(--gris-2); border-radius: 6px; font-size: 11.5px; padding: 3px 9px; white-space: nowrap; }
  .nav-barra .full:hover { color: var(--naranja); border-color: var(--naranja); }
  .cp::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(42% 55% at 82% 8%, rgba(228,98,20,.55), rgba(228,98,20,0) 70%), radial-gradient(38% 50% at 6% 96%, rgba(228,98,20,.45), rgba(228,98,20,0) 70%); }
  .cp > * { position: relative; }
  .cp-k { font-size: 9.5px; letter-spacing: .3em; text-transform: uppercase; color: var(--gris); }
  .cp-k.n { color: var(--naranja); }
  .cp h4 { margin: 0; font-weight: 300; letter-spacing: -0.035em; font-size: clamp(26px, 3.6vw, 36px); line-height: 1.05; }
  .cp-card { background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.07); border-radius: 12px; padding: 14px; min-width: 0; }
  .cp-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: -12px 0 22px; flex-wrap: wrap; }
  .cp-top .marca { font-size: 10px; letter-spacing: .34em; color: var(--naranja); font-weight: 600; }
  .cp-top nav { display: flex; gap: 4px; flex-wrap: wrap; }
  .cp-top nav button { border: 0; background: transparent; color: var(--gris-2); font-size: 11.5px; padding: 5px 10px; border-radius: 999px; }
  .cp-top nav button.on { background: rgba(232,130,58,.22); color: var(--naranja); border: 1px solid rgba(232,130,58,.4); }
  .cp-av { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: rgba(232,130,58,.25); color: var(--naranja); font-size: 11px; font-weight: 600; }
  /* ingreso */
  .cp-login { flex: 1; display: grid; justify-items: center; align-content: center; gap: 12px; }
  .cp-login .marca { font-size: 11px; letter-spacing: .36em; color: var(--naranja); font-weight: 600; margin-bottom: 8px; }
  .cp-login input { width: min(280px, 100%); background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.12); border-radius: 6px; padding: 9px 11px; color: var(--hueso); font: inherit; font-size: 12.5px; }
  .cp-login .cp-entrar { border: 0; background: transparent; color: var(--naranja); font-size: 20px; margin-top: 6px; }
  .cp-login .sol { color: var(--naranja); font-size: 12px; font-weight: 500; }
  /* inicio */
  .cp-hola { display: grid; justify-items: center; text-align: center; gap: 8px; margin-top: 70px; }
  .cp-hola h4 { font-size: 44px; }
  .cp-tres { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 34px; width: 900px; margin-inline: auto; }
  .cp-tres .cp-card { display: grid; gap: 8px; text-align: left; min-height: 190px; align-content: start; padding: 18px; }
  .cp-tres .cp-card .fila { display: flex; justify-content: space-between; color: var(--naranja); font-size: 11px; }
  .cp-tres .cp-card b { font-weight: 400; font-size: 16px; margin-top: 18px; }

/* ---------- Campus (réplica navegable) ---------- */
const MODULOS = [["Fundamentos",4,4],["Oferta y posicionamiento",6,6],["Adquisición",8,8],["Ventas",7,7],["Operación y escala",9,9],["Suscripción y precios",10,10],["Retención y recompra",9,12],["Logística y stock",0,8]];
const HERRAMIENTAS = [
  ["Landing Pages","Landing page","Agente Landing Page","Plantilla de páginas de ventas optimizada para convertir tráfico en clientes."],
  ["Retención","Retención","Flujo de retención v1","Secuencia de emails y automatizaciones para aumentar la recompra y la vida del cliente."],
  ["Retención","Retención","Flujo de retención v2","Estrategia avanzada de retención por clientes, contenido y triggers de reactivación."],
  ["Email Marketing","Email","Flujo de email de onboarding","Secuencia de bienvenida para educar, activar y generar primeras ventas."],
  ["Automatizaciones","Automatización","Skill: Carrito abandonado","Recuperá ventas perdidas con un flujo inteligente de emails y mensajes."],
  ["Ecommerce","Landing page","Agente Upsell / Cross-sell","Página y flujo para ofrecer productos complementarios y aumentar el ticket promedio."],
  ["Analítica","Analítica","Dashboard de métricas","Visualizá ventas, tráfico y LTV en tiempo real."],
  ["Ecommerce","Ecommerce","Flujo de lanzamiento","Secuencia completa para lanzar un nuevo producto o línea."],
  ["Automatizaciones","Automatización","Skill: Reabastecimiento","Automatizá avisos y campañas para recuperar stock y maximizar ventas."]
];
const FILTROS = ["Todas","Landing Pages","Email Marketing","Automatizaciones","Retención","Ecommerce","Analítica"];
const VISTAS = [["ingreso","Ingreso"],["inicio","Inicio"],["progreso","Tu progreso"],["herramientas","Herramientas"]];
let vistaCampus = "inicio", filtroCampus = "Todas", buscaCampus = "";

function cpTop(on) {
  return `<div class="cp-top"><span class="marca">GENESIS</span><nav>${[["progreso","Tu avance"],["inicio","Módulos"],["herramientas","Baúl de herramientas"]].map(([v,t]) => `<button type="button" data-cp="${v}" class="${on === v ? "on" : ""}">${t}</button>`).join("")}</nav><span class="cp-av">L</span></div>`;
}
function vistaHTML(v) {
  if (v === "ingreso") return `
    <div class="cp-login">
      <span class="marca">GENESIS</span>
      <input type="email" id="cp-email" placeholder="Email" aria-label="Email" autocomplete="off">
      <input type="password" id="cp-pass" placeholder="Contraseña" aria-label="Contraseña" autocomplete="off">
      <button type="button" class="cp-entrar" data-cp="inicio" aria-label="Entrar">→</button>
      <span class="sol">Solicitar acceso</span>
      <span class="cp-k">Solo miembros de Genesis OS</span>
    </div>`;
  if (v === "inicio") return `${cpTop("")}
    <div class="cp-hola">
      <span class="cp-k">Bienvenido de nuevo</span>
      <h4>Hola, Lauty</h4>
      <span style="color:var(--gris-2)">¿Por dónde querés continuar hoy?</span>
    </div>
    <div class="cp-tres">
      <div class="cp-card"><span class="fila"><span>01</span><span>↗</span></span><b>Tu avance</b><small>83% del programa completado</small><span class="bar"><i></i></span><button type="button" data-cp="progreso">Ingresar →</button></div>
      <div class="cp-card"><span class="fila"><span>02</span><span>▤</span></span><b>Módulos</b><small>8 módulos de contenido grabado</small><button type="button" data-cp="progreso">Ingresar →</button></div>
      <div class="cp-card"><span class="fila"><span>03</span><span>▣</span></span><b>Baúl de herramientas</b><small>42 plantillas y recursos</small><button type="button" data-cp="herramientas">Ingresar →</button></div>
    </div>`;
  if (v === "progreso") {
    const r = 46, c = 2 * Math.PI * r;
    return `${cpTop("progreso")}
    <span class="cp-k">01 · Tu avance</span><h4 style="margin-top:6px">Tu progreso</h4>
    <div class="cp-prog">
      <div class="cp-card cp-ring"><svg viewBox="0 0 110 110" aria-label="83% completado"><circle cx="55" cy="55" r="${r}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="4"/><circle cx="55" cy="55" r="${r}" fill="none" stroke="var(--naranja)" stroke-width="4" stroke-linecap="round" stroke-dasharray="${c * .83} ${c}" transform="rotate(-90 55 55)"/><text x="55" y="58" text-anchor="middle" fill="var(--hueso)" font-size="22" font-weight="300" font-family="DM Sans, sans-serif">83%</text><text x="55" y="72" text-anchor="middle" fill="var(--gris)" font-size="6" letter-spacing="1.5" font-family="DM Sans, sans-serif">COMPLETADO</text></svg></div>
      <div style="display:grid;gap:10px;min-width:0">
        <div class="cp-stats num">
          <div class="cp-card"><b>53<small>/64</small></b><div class="cp-k">Lecciones</div></div>
          <div class="cp-card"><b>6<small>/8</small></b><div class="cp-k">Módulos</div></div>
          <div class="cp-card"><b>38 h 40 min</b><div class="cp-k">Tiempo visto</div></div>
        </div>
        <div class="cp-card cp-cont"><div class="cp-k">Continuar · Módulo 7</div><span class="l">▷ Retención y recompra</span></div>
      </div>
    </div>
    <div class="cp-k" style="margin-top:18px">Por módulo</div>
    <div class="cp-mods num">${MODULOS.map((m, i) => `<div class="cp-card cp-mod"><span class="i">0${i+1}</span><span>${m[0]}</span><span class="d">${m[1]}/${m[2]} · ${Math.round(m[1]/m[2]*100)}%</span><span class="b"><i style="width:${m[1]/m[2]*100}%"></i></span></div>`).join("")}</div>`;
  }
  const q = buscaCampus.trim().toLowerCase();
  const lista = HERRAMIENTAS.filter(h => (filtroCampus === "Todas" || h[0] === filtroCampus) && (!q || (h[2] + " " + h[3]).toLowerCase().includes(q)));
  return `${cpTop("herramientas")}
    <span class="cp-k">02 · Baúl de herramientas</span><h4 style="margin-top:6px">Herramientas</h4>
    <p style="color:var(--gris-2);margin-top:6px">Plantillas, recursos y software para aplicar lo que aprendés.</p>
    <div class="cp-filtros">${FILTROS.map(f => `<button type="button" data-filtro="${f}" class="${f === filtroCampus ? "on" : ""}">${f}</button>`).join("")}<input type="search" id="cp-busca" placeholder="Buscar..." aria-label="Buscar herramientas" value="${buscaCampus.replace(/"/g, "&quot;")}"></div>
    <div class="cp-herr" id="cp-herr">${lista.length ? lista.map(h => `<div class="cp-card"><span class="tg">${h[1]}</span><b>${h[2]}</b><p>${h[3]}</p><span class="ft">${h[0]}</span></div>`).join("") : `<p class="cp-vacio">No hay herramientas con ese filtro.</p>`}</div>`;
}
function campusHTML() {
  return `
    <div style="display:grid;gap:12px">
      <div class="campus-tabs" role="group" aria-label="Pantallas del campus">${VISTAS.map(([v,t]) => `<button type="button" data-cpv="${v}" aria-pressed="${v === vistaCampus}">${t}</button>`).join("")}</div>
      <div class="navegador" id="cp-nav">
        <div class="nav-barra"><span class="dots"><i></i><i></i><i></i></span><span class="url" id="cp-url"></span><button type="button" class="full" id="cp-full">⤢ Pantalla completa</button></div>
        <div class="cp-vp" id="cp-vp"><div class="cp" id="cp-pantalla"></div></div>
      </div>
      <p class="pista">Es una réplica navegable del campus: tocá las pestañas, los filtros y los botones de "Ingresar".</p>
    </div>`;
}
function ajustarCampus(cont) {
  const vp = cont.querySelector("#cp-vp"), cp = cont.querySelector("#cp-pantalla");
  if (!vp || !cp) return;
  const w = vp.clientWidth, h = vp.clientHeight;
  if (!w || !h) return;
  const k = Math.min(w / 1280, h / 720);
  cp.style.transform = `translate(${(w - 1280 * k) / 2}px, ${(h - 720 * k) / 2}px) scale(${k})`;
}
function pintarCampus(cont, foco) {
  cont.querySelectorAll("[data-cpv]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.cpv === vistaCampus)));
  cont.querySelector("#cp-url").textContent = `campus.genesis · ${VISTAS.find(x => x[0] === vistaCampus)[1]}`;
  const cp = cont.querySelector("#cp-pantalla");
  cp.innerHTML = vistaHTML(vistaCampus);
  cp.querySelectorAll("[data-cp]").forEach(b => b.addEventListener("click", () => { vistaCampus = b.dataset.cp; pintarCampus(cont); }));
  cp.querySelectorAll("[data-filtro]").forEach(b => b.addEventListener("click", () => { filtroCampus = b.dataset.filtro; pintarCampus(cont); }));
  const bus = cp.querySelector("#cp-busca");
  if (bus) bus.addEventListener("input", () => { buscaCampus = bus.value; pintarCampus(cont, "#cp-busca"); });
  if (foco) { const el = cp.querySelector(foco); if (el) { el.focus(); try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) {} } }
  ajustarCampus(cont);
}
function bindCampus(root) {
  const cont = root.querySelector("#campus");
  if (!cont) return;
  cont.querySelectorAll("[data-cpv]").forEach(b => b.addEventListener("click", () => { vistaCampus = b.dataset.cpv; pintarCampus(cont); }));
  const nav = cont.querySelector("#cp-nav"), full = cont.querySelector("#cp-full");
  full.addEventListener("click", () => {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (nav.requestFullscreen) nav.requestFullscreen().catch(() => {});
    } catch (e) {}
  });
  document.addEventListener("fullscreenchange", () => {
    full.textContent = document.fullscreenElement === nav ? "✕ Salir" : "⤢ Pantalla completa";
    requestAnimationFrame(() => ajustarCampus(cont));
  });
  if (window.ResizeObserver) new ResizeObserver(() => ajustarCampus(cont)).observe(cont.querySelector("#cp-vp"));
  pintarCampus(cont);
}

function abrir(id) {
  const i = slides.findIndex(s => s.id === id);
  idx = i < 0 ? 0 : i;
  $("#visor").hidden = false;
  pintar();
  $("#sig").focus();
}
function cerrar() {
  $("#visor").hidden = true;
  setHash(oferta);
}
function ir(d) {
  const n = idx + d;
  if (n < 0 || n >= slides.length) return;
  idx = n; pintar();
}
function pintar() {
  const s = slides[idx];
  $("#escena").innerHTML = s.html;
  $("#escena").scrollTop = 0;
  $("#que").innerHTML = `<b>${OFERTAS[oferta].nombre}</b> · ${s.nombre}`;
  $("#contador").textContent = `${idx + 1} / ${slides.length}`;
  $("#ant").disabled = idx === 0;
  $("#sig").disabled = idx === slides.length - 1;
  $("#puntos").innerHTML = slides.map((x, i) => `<button type="button" aria-label="${x.nombre}" ${i === idx ? 'aria-current="true"' : ""} data-i="${i}"></button>`).join("");
  $("#puntos").querySelectorAll("button").forEach(b => b.addEventListener("click", () => { idx = +b.dataset.i; pintar(); }));
  bindCampus($("#escena"));
  $("#escena").querySelectorAll("[data-salto]").forEach(b => b.addEventListener("click", () => abrir(b.dataset.salto)));
  setHash(`${oferta}-${s.id}`);
}

/* ---------- Oferta y hash ---------- */
function setOferta(o) {
  oferta = o;
  document.querySelectorAll(".switch button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.o === o)));
  render();
}
function setHash(h) {
  try { if (location.hash !== "#" + h) history.replaceState(null, "", "#" + h); } catch (e) {}
}
function leerHash() {
  const h = (location.hash || "").slice(1);
  if (!h) { setOferta("os"); return; }
  const [o, ...rest] = h.split("-");
  setOferta(OFERTAS[o] ? o : "os");
  const id = rest.join("-");
  if (id) abrir(id); else if (!$("#visor").hidden) cerrar();
}

document.querySelectorAll(".switch button").forEach(b => b.addEventListener("click", () => {
  const abierto = !$("#visor").hidden;
  const actual = abierto ? slides[idx].id : null;
  setOferta(b.dataset.o);
  if (abierto) abrir(slides.some(s => s.id === actual) ? actual : "portada"); else setHash(oferta);
}));
$("#presentar").addEventListener("click", () => abrir("portada"));
$("#cerrar").addEventListener("click", cerrar);
$("#ant").addEventListener("click", () => ir(-1));
$("#sig").addEventListener("click", () => ir(1));
$("#escena").addEventListener("click", e => {
  const im = e.target.closest("img");
  if (!im || e.target.closest(".navegador")) return;
  $("#lightbox-img").src = im.currentSrc || im.src;
  $("#lightbox-img").alt = im.alt;
  $("#lightbox").hidden = false;
});
const cerrarLb = () => { $("#lightbox").hidden = true; };
$("#lightbox").addEventListener("click", cerrarLb);
document.addEventListener("keydown", e => {
  if (!$("#lightbox").hidden) { if (e.key === "Escape") cerrarLb(); return; }
  if ($("#visor").hidden) return;
  if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); ir(1); }
  if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); ir(-1); }
  if (e.key === "Escape") cerrar();
});
let tx = null;
$("#escena").addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, { passive: true });
$("#escena").addEventListener("touchend", e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 60) ir(dx < 0 ? 1 : -1);
});
window.addEventListener("hashchange", leerHash);

leerHash();
</script>
