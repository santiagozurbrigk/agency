<title>Oferta Genesis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,200;9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
  /* Layout: el lenguaje del campus Genesis. Un tablero de una sola pantalla, como el mapa en Miro:
     Equipo (izq., alto completo) · Información + Bonus (centro) · Acompañamiento (der., alto completo).
     Cada bloque abre su detalle, y el detalle se recorre como slides. Look oscuro único, a propósito. */
  :root {
    --negro: #0A0807;
    --vidrio: rgba(255,255,255,.03);
    --borde: rgba(255,255,255,.08);
    --borde-2: rgba(255,255,255,.14);
    --hueso: #F3EEE8;
    --gris: #7E7873;
    --gris-2: #B3ACA6;
    --naranja: #E8823A;
    --naranja-fuerte: #D9661E;
    --verde: #4FD08A;
    --tinta: #170B03;
    --papel: #F7F5F2;
    --papel-tx: #1A1612;
    --f: "DM Sans", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { background: var(--negro); }
  body { background: var(--negro); color: var(--hueso); font-family: var(--f); font-size: 15px; line-height: 1.45; overflow: hidden; }
  body::after { content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(40vw 34vw at 70% 4%, rgba(201,92,24,.34), rgba(201,92,24,0) 70%),
      radial-gradient(46vw 40vw at -6% 104%, rgba(160,68,18,.2), rgba(160,68,18,0) 70%),
      linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px) 0 0 / 48px 48px,
      linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px) 0 0 / 48px 48px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--naranja); outline-offset: 3px; }
  h1, h2, h3 { margin: 0; line-height: 1.05; letter-spacing: -0.03em; font-weight: 300; text-wrap: balance; }
  p { margin: 0; }
  ul { margin: 0; padding: 0; list-style: none; }
  .num { font-variant-numeric: tabular-nums; }
  .eyebrow { font-size: 10.5px; font-weight: 500; letter-spacing: .26em; text-transform: uppercase; color: var(--gris-2); }
  .vidrio { background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.012)); border: 1px solid var(--borde); border-radius: 14px; }

  .app { position: relative; z-index: 1; height: 100%; max-width: 1480px; margin: 0 auto; display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: clamp(6px, 1.4vh, 14px); padding-block: clamp(10px, 1.8vh, 18px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  /* Barra */
  .barra { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 500; letter-spacing: .3em; font-size: 12px; }
  .logo svg { width: 26px; height: 26px; }
  .switch { display: inline-flex; padding: 4px; border-radius: 999px; border: 1px solid var(--borde-2); background: rgba(0,0,0,.35); }
  .switch button { border: 0; background: transparent; padding: 8px 18px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--gris-2); transition: background .2s, color .2s; }
  .switch button[aria-pressed="true"] { background: var(--naranja); color: var(--tinta); }
  .acciones { display: flex; justify-content: flex-end; }
  .btn { border: 1px solid var(--borde-2); background: var(--vidrio); padding: 8px 16px; border-radius: 999px; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
  .btn:hover { border-color: var(--naranja); }
  .btn.prim { background: var(--naranja); border-color: var(--naranja); color: var(--tinta); font-weight: 600; }

  /* Cabeza compacta */
  .cabeza { display: grid; justify-items: center; text-align: center; gap: 2px; }
  .cabeza h1 { font-size: clamp(34px, 7vh, 72px); font-weight: 700; letter-spacing: -0.04em; color: var(--naranja); line-height: .95; }
  .cabeza .dur { font-size: clamp(14px, 2vh, 19px); font-style: italic; color: var(--gris); font-weight: 500; }

  /* Tablero */
  .tablero { min-height: 0; display: grid; grid-template-columns: 1fr 1.3fr 1fr; grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "eq info ac" "eq bonus ac"; gap: clamp(8px, 1.4vh, 14px) clamp(12px, 1.6vw, 22px); }
  .zona { min-height: 0; min-width: 0; display: flex; flex-direction: column; gap: clamp(6px, 1vh, 10px); }
  .z-eq { grid-area: eq; } .z-info { grid-area: info; } .z-ac { grid-area: ac; } .z-bonus { grid-area: bonus; }
  .zona > h2 { text-align: center; font-size: clamp(16px, 2.6vh, 26px); font-weight: 700; letter-spacing: .01em; text-transform: uppercase; }

  .bloque { text-align: left; border: 1px solid var(--borde); border-radius: 14px; background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.012)); padding: clamp(10px, 1.5vh, 16px); display: flex; flex-direction: column; gap: clamp(6px, 1.1vh, 12px); position: relative; transition: border-color .2s, background .2s; min-width: 0; min-height: 0; width: 100%; }
  .bloque:hover { border-color: rgba(232,130,58,.65); background: linear-gradient(180deg, rgba(232,130,58,.07), rgba(255,255,255,.012)); }
  .bloque.crece { flex: 1 1 0; }
  .bloque .ver { position: absolute; top: 8px; right: 10px; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--gris); background: rgba(10,8,7,.7); padding: 2px 7px; border-radius: 999px; z-index: 2; transition: color .2s; }
  .bloque .ver { opacity: 0; transition: opacity .2s, color .2s; }
  .bloque:hover .ver, .bloque:focus-visible .ver { opacity: 1; color: var(--naranja); }
  @media (hover: none) { .bloque .ver { display: none; } }

  .persona { display: grid; grid-template-columns: clamp(34px, 5vh, 46px) 1fr; gap: 10px; align-items: center; }
  .avatar { width: clamp(34px, 5vh, 46px); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; font-weight: 600; background: radial-gradient(circle at 30% 25%, #3a2a20, #15100c); border: 1px solid var(--borde-2); }
  .persona b { display: block; font-weight: 600; font-size: 13.5px; color: var(--naranja); }
  .persona small { color: var(--gris-2); font-size: 12px; }
  .mini-dash { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
  .mini-dash div { background: var(--papel); color: var(--papel-tx); border-radius: 7px; padding: 5px 7px; display: grid; min-width: 0; }
  .mini-dash small { font-size: 9px; color: #6b6560; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini-dash strong { font-size: clamp(12px, 1.9vh, 15px); font-weight: 600; }

  .hueco { flex: 1 1 0; min-height: 40px; border: 1px dashed var(--borde-2); border-radius: 10px; display: grid; place-items: center; text-align: center; padding: 8px; font-size: 12px; color: var(--gris); background: radial-gradient(70% 80% at 30% 80%, rgba(232,130,58,.18), rgba(232,130,58,0) 70%); }

  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(2px, .55vh, 6px) 14px; font-size: clamp(10.5px, 1.55vh, 12.5px); font-weight: 600; }
  .checks li { display: flex; gap: 7px; align-items: baseline; min-width: 0; }
  .ok { flex: none; width: 13px; height: 13px; border-radius: 3px; background: var(--verde); display: inline-grid; place-items: center; transform: translateY(2px); }
  .ok::after { content: ""; width: 6px; height: 3.5px; border-left: 2px solid #0b2a17; border-bottom: 2px solid #0b2a17; transform: rotate(-45deg) translate(1px,-1px); }
  .herr { font-size: clamp(11px, 1.6vh, 13px); font-weight: 600; display: flex; gap: 7px; justify-content: center; }

  .acomp-item { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
  .pill { flex: none; background: var(--naranja-fuerte); color: #fff; font-weight: 700; text-align: center; padding: clamp(5px, .9vh, 9px) 12px; border-radius: 8px; font-size: clamp(13px, 1.9vh, 16px); }
  .pill small { display: block; font-weight: 400; font-size: 11.5px; opacity: .85; }
  .fotos { flex: 1 1 0; min-height: 0; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
  .fotos img { width: 100%; height: 100%; min-height: 0; object-fit: cover; border-radius: 8px; border: 1px solid var(--borde); display: block; background: #120d0a; }
  .fotos img.arriba { object-position: top left; }

  .bonus-grid { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 10px; }
  .bonus-grid .bloque { align-items: center; text-align: center; }
  .bonus-grid h3 { font-size: clamp(15px, 2.3vh, 22px); font-weight: 700; letter-spacing: 0; }
  .b-cuerpo { width: 100%; border-radius: 10px; background: #120d0a; border: 1px solid var(--borde); padding: clamp(6px, 1vh, 10px); display: grid; gap: 4px; justify-items: center; min-height: clamp(58px, 9vh, 92px); align-content: center; }
  .b-cuerpo .t { font-size: 13px; font-weight: 600; }
  .b-cuerpo .s { font-size: 11px; color: var(--gris-2); }
  .grande-verde { font-size: clamp(24px, 4.2vh, 38px); font-weight: 700; color: var(--verde); letter-spacing: -0.02em; line-height: 1; }
  .puentify { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .puentify i { font-style: normal; color: #A98BFF; font-size: 16px; }

  [hidden] { display: none !important; }
  /* Detalle / slides */
  .visor { position: fixed; inset: 0; z-index: 20; background: rgba(10,8,7,.95); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); display: grid; grid-template-rows: auto 1fr auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .visor::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(45vw 40vw at 80% 0%, rgba(201,92,24,.3), rgba(201,92,24,0) 70%); }
  .visor-top, .visor-pie { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .que { font-size: 12px; letter-spacing: .26em; text-transform: uppercase; color: var(--gris-2); }
  .que b { color: var(--naranja); font-weight: 600; }
  .pista { font-size: 12px; color: var(--gris); }
  .escena { position: relative; overflow-y: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .slide { max-width: 1120px; margin: 0 auto; padding-block: 20px 36px; display: grid; gap: 26px; animation: entra .35s ease both; }
  @keyframes entra { from { opacity: .3; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .slide { animation: none; } }
  .slide-head { display: grid; gap: 10px; max-width: 760px; }
  .slide-head .k { font-size: 12px; font-weight: 600; letter-spacing: .28em; text-transform: uppercase; color: var(--naranja); }
  .slide-head h2 { font-size: clamp(34px, 5.4vw, 60px); }
  .slide-head p { font-size: 17px; color: var(--gris-2); font-weight: 300; max-width: 60ch; }
  .tarjetas { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
  .tarjeta { padding: 20px; display: grid; gap: 10px; align-content: start; min-width: 0; }
  .tarjeta h3 { font-size: 21px; font-weight: 400; }
  .tarjeta p { color: var(--gris-2); font-weight: 300; font-size: 15px; }
  .tarjeta .big { font-size: 44px; font-weight: 200; letter-spacing: -0.05em; line-height: 1; }
  .tarjeta .big em { font-style: normal; color: var(--naranja); }
  .tag-n { font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: var(--gris); font-weight: 500; }
  .lista { display: grid; gap: 8px; }
  .lista li { display: flex; gap: 10px; align-items: baseline; font-size: 15px; }
  .sops { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
  .sops div { border: 1px solid var(--borde); border-radius: 12px; padding: 11px 14px; display: flex; gap: 10px; align-items: baseline; font-size: 14px; background: var(--vidrio); min-width: 0; }
  .sops small { color: var(--gris); font-size: 11px; margin-left: auto; }
  .etapas { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .etapa { padding: 15px; display: grid; gap: 6px; align-content: start; min-width: 0; }
  .etapa .n { color: var(--naranja); font-size: 13px; font-weight: 600; }
  .etapa b { font-weight: 500; }
  .etapa p { color: var(--gris-2); font-size: 13px; font-weight: 300; }
  .linea-ant { display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap; }
  .linea-ant .a { font-size: clamp(34px, 5vw, 52px); font-weight: 200; color: var(--gris-2); letter-spacing: -0.05em; line-height: 1; }
  .linea-ant .b { font-size: clamp(56px, 9vw, 96px); font-weight: 200; letter-spacing: -0.06em; line-height: .9; }
  .linea-ant .f { font-size: 26px; color: var(--naranja); font-weight: 200; padding-bottom: 8px; }
  .galeria { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
  .galeria figure { margin: 0; display: grid; gap: 8px; }
  .galeria img { width: 100%; border-radius: 12px; border: 1px solid var(--borde); display: block; }
  .galeria figcaption { font-size: 13px; color: var(--gris-2); }
  .bloque-ac { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 18px; align-items: start; padding: 18px; }
  .bloque-ac .pill { font-size: 18px; }
  .bloque-ac .galeria { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .bloque-ac .galeria img.chat { max-height: 420px; object-fit: cover; object-position: top left; }
  .portada { min-height: 60vh; align-content: center; justify-items: center; text-align: center; }
  .portada h2 { font-size: clamp(60px, 12vw, 140px); font-weight: 700; color: var(--naranja); letter-spacing: -0.045em; }
  .indice { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .indice button { border: 1px solid var(--borde-2); background: var(--vidrio); border-radius: 999px; padding: 8px 14px; font-size: 13px; color: var(--gris-2); }
  .indice button:hover { color: var(--hueso); border-color: var(--naranja); }
  .puntos { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .puntos button { width: 8px; height: 8px; padding: 0; border-radius: 50%; border: 0; background: rgba(255,255,255,.2); }
  .puntos button[aria-current="true"] { background: var(--naranja); width: 22px; border-radius: 4px; }
  .nav { display: flex; gap: 8px; }
  .nav .btn[disabled] { opacity: .35; cursor: default; }

  /* Pantallas chicas o bajas: el tablero pasa a scroll */
  @media (max-width: 960px), (max-height: 560px) {
    body { overflow: auto; }
    html, body { height: auto; }
    .app { height: auto; grid-template-rows: auto auto auto; }
    .tablero { grid-template-columns: 1fr; grid-template-rows: none; grid-template-areas: "eq" "info" "bonus" "ac"; }
    .bloque.crece { flex: none; }
    .hueco { flex: none; min-height: 90px; }
    .acomp-item { flex: none; }
    .fotos { flex: none; height: 160px; }
    .etapas { grid-template-columns: 1fr 1fr; }
    .bloque-ac { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    .barra { grid-template-columns: 1fr auto; }
    .barra .switch { grid-column: 1 / -1; grid-row: 2; justify-self: center; }
    .checks { grid-template-columns: 1fr; }
    .bonus-grid { grid-template-columns: 1fr; }
    .etapas { grid-template-columns: 1fr; }
    .puntos { display: none; }
  }
</style>

<div class="app">
  <header class="barra">
    <div class="logo">
      <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="38" cy="50" r="28" fill="none" stroke="var(--gris-2)" stroke-width="2"/><circle cx="62" cy="50" r="28" fill="none" stroke="var(--gris-2)" stroke-width="2"/><path d="M50 27.2A28 28 0 0 1 50 72.8A28 28 0 0 1 50 27.2Z" fill="var(--naranja)"/></svg>
      GENESIS
    </div>
    <div class="switch" role="group" aria-label="Elegir oferta">
      <button type="button" id="sw-os" data-o="os" aria-pressed="true">Genesis OS</button>
      <button type="button" id="sw-lite" data-o="lite" aria-pressed="false">Genesis Lite</button>
    </div>
    <div class="acciones">
      <button type="button" class="btn prim" id="presentar"><span aria-hidden="true">▶</span> Presentar</button>
    </div>
  </header>
  <section class="cabeza" id="cabeza"></section>
  <main class="tablero" id="tablero"></main>
</div>

<div class="visor" id="visor" hidden role="dialog" aria-modal="true" aria-label="Detalle de la oferta">
  <div class="visor-top">
    <button type="button" class="btn" id="cerrar">← Vista general</button>
    <span class="que" id="que"></span>
  </div>
  <div class="escena" id="escena"></div>
  <div class="visor-pie">
    <span class="pista num" id="contador"></span>
    <div class="puntos" id="puntos"></div>
    <div class="nav">
      <button type="button" class="btn" id="ant" aria-label="Anterior">←</button>
      <button type="button" class="btn prim" id="sig" aria-label="Siguiente">→</button>
    </div>
  </div>
</div>

<script>
const IMG = {
  tienda: { src: "oferta-genesis-img/sesion-1a1-tienda.webp", alt: "Sesión 1 a 1: Manu revisando la tienda de una marca en vivo" },
  miro: { src: "oferta-genesis-img/sesion-1a1-miro.webp", alt: "Sesión 1 a 1: armando el funnel en Miro con Manu" },
  grupal: { src: "oferta-genesis-img/grupal.webp", alt: "Clase grupal en vivo con Manu" },
  chat: { src: "oferta-genesis-img/chat.webp", alt: "Chat 1 a 1 directo con Manu", cls: "arriba" }
};
const SOPS = ["Investigación","Operaciones","Funnels","Retención","Oferta","Blackhat","Ads","Landings","Atención al cliente","Logística","Media buying","Copywriting y guiones","Edición y creativos"];

const OFERTAS = {
  os: {

    dur: "4 meses",
    tag: "Escalá tu ecomm de consumibles a +$100M al mes con modelo de suscripción, sin depender del CPA ni dejar de vender.",
    acomp: [
      { t: "Sesiones 1 a 1 ilimitadas", s: "Con Manu o José, cuando las necesites", fotos: ["tienda","miro"] },
      { t: "Grupales (4 por semana)", s: "Grupos de 6 a 8 personas en promedio", fotos: ["grupal"] },
      { t: "Chat 1 a 1 directo", s: "Con Manu y José", fotos: ["chat"] }
    ],
    dwy: ["Auditoría de tus números + roadmap","Suscripción instalada","Ofertas","Creación de anuncios","Procesos de retención","Proyección de stock"],
    nucleo: ["Software propio","Acceso para 2 personas de tu equipo","Tablero de suscriptores y bajas"],
    bonus: ["contactos","puentify","descuento"],
    cierre: { k: "Cupos limitados", t: "Tomamos 10 marcas", p: "Queremos que el servicio sea lo más personalizado posible y que las 10 marcas que entren terminen siendo casos de éxito. La inversión la vemos en la llamada, con tus números adelante." }
  },
  lite: {
    nombre: "GENESIS LITE",
    dur: "3 meses",
    tag: "Arrancá en ecommerce por el lado correcto: un consumible, un proceso paso a paso y alguien al lado que ya lo hizo.",

      { t: "Chat 1 a 1 directo", s: "Cuando te trabás, no esperás a la próxima clase", fotos: ["chat"] }
    ],
    dwy: null,
    nucleo: ["Software propio","Tablero de suscriptores y bajas"],
    bonus: ["contactos","puentify"],

  }
};

const ETAPAS = [
  ["Buscar el producto","Un consumible: algo que se termina y tu cliente vuelve a comprar."],
  ["Validarlo","Oferta, landing y primeros anuncios antes de poner plata fuerte."],
  ["Lanzarlo","Tu tienda funcionando, con atención, logística y creativos atrás."],
  ["Escalarlo","Que venda todos los meses. Subimos pauta y armamos retención."],
  ["Pasarlo a suscripción","Con la marca vendiendo constante, instalamos la suscripción con vos."]
];
const NOMBRES = { equipo: "Equipo", comunidad: "Comunidad", informacion: "Información", acompanamiento: "Acompañamiento", "bonus-contactos": "Contactos", "bonus-puentify": "Puentify", "bonus-descuento": "Descuento", cierre: "Cierre" };

let oferta = "os";
let idx = 0;
let slides = [];

const $ = s => document.querySelector(s);
const ok = '<span class="ok" aria-hidden="true"></span>';
const li = arr => arr.map(x => `<li>${ok}<span>${x}</span></li>`).join("");
const img = (k, extra = "") => `<img src="${IMG[k].src}" alt="${IMG[k].alt}" class="${IMG[k].cls || ""} ${extra}" loading="lazy">`;

/* ---------- Tablero (vista general) ---------- */
function bloque(id, inner, extra = "") {
  return `<button type="button" class="bloque ${extra}" data-ir="${id}" aria-label="Ver ${NOMBRES[id]}"><span class="ver">Ver →</span>${inner}</button>`;
}

function render() {
  const o = OFERTAS[oferta];
  const lite = oferta === "lite";
  $("#cabeza").innerHTML = `<h1>${o.nombre}</h1><span class="dur">${o.dur}</span>`;

  const bonusHtml = {

    descuento: n => bloque("bonus-descuento", `<h3>Bonus ${n}</h3><div class="b-cuerpo"><span class="grande-verde num">-USD 3.000</span><span class="s">Solo para los 10 cupos</span></div>`)

  $("#tablero").innerHTML = `
    <div class="zona z-eq">
      <h2>Equipo</h2>
      ${bloque("equipo", `

        <div class="mini-dash num"><div><small>Suscripciones activas</small><strong>3943</strong></div><div><small>Ingresos recurrentes</small><strong>275.2M</strong></div><div><small>Cancelaciones</small><strong>7,2%</strong></div></div>
        <div class="persona"><span class="avatar">J</span><div><b>José · Co-founder de Genesis</b><small>En la entrega de cada marca</small></div></div>
      `)}
      ${bloque("comunidad", `
        <span class="eyebrow">Genesis comunidad</span>
        <div class="hueco">Fotos de la comunidad<br>(por cargar)</div>
        <small style="color:var(--gris-2)">Dueños de marca haciendo el mismo camino que vos</small>
      `, "crece")}
    </div>

    <div class="zona z-info">
      <h2>Información</h2>
      ${bloque("informacion", `
        <ul class="checks">${SOPS.map(s => `<li>${ok}<span>+SOPs ${s.toUpperCase()}</span></li>`).join("")}</ul>
        <div class="herr">${ok}<span>+Herramientas (agentes, flujos, skills y dashboards)</span></div>
        <div class="hueco">Capturas del campus<br>(por cargar)</div>
      `, "crece")}
    </div>

    <div class="zona z-bonus">
      <div class="bonus-grid" style="--n:${o.bonus.length}">${o.bonus.map((b, i) => bonusHtml[b](i + 1)).join("")}</div>
    </div>

    <div class="zona z-ac">
      <h2>Acompañamiento</h2>
      ${bloque("acompanamiento", o.acomp.map(a => `
        <div class="acomp-item">
          <div class="pill">${a.t}<small>${a.s}</small></div>
          <div class="fotos">${a.fotos.map(f => img(f)).join("")}</div>
        </div>`).join(""), "crece")}
    </div>
  `;

  document.querySelectorAll("[data-ir]").forEach(b => b.addEventListener("click", () => abrir(b.dataset.ir)));
  slides = armarSlides();
}

/* ---------- Slides ---------- */
function armarSlides() {
  const o = OFERTAS[oferta];
  const S = [];
  const lite = oferta === "lite";

  S.push({ id: "portada", nombre: "Portada", html: `
    <div class="slide portada">
      <span class="eyebrow">Manu Dominguez · José</span>
      <h2>${o.nombre}</h2>
      <span style="font-size:22px;font-style:italic;color:var(--gris)">${o.dur}</span>
      <p style="color:var(--gris-2);font-weight:300;font-size:19px;max-width:56ch">${o.tag}</p>
      <div class="indice">${["equipo","comunidad","informacion","acompanamiento",...o.bonus.map(b=>"bonus-"+b),"cierre"].map(id => `<button type="button" data-salto="${id}">${NOMBRES[id]}</button>`).join("")}</div>
    </div>` });

  S.push({ id: "equipo", nombre: "Equipo", html: `
    <div class="slide">
      <div class="slide-head"><span class="k">Equipo</span><h2>Lo hacés con los que ya lo hicieron</h2><p>Manu escaló su propia marca con el modelo de suscripción. José es su socio y está en la entrega de cada marca que trabajamos.</p></div>
      <div class="tarjetas">
        <div class="tarjeta vidrio" style="grid-column: span 2">
          <span class="tag-n">Manu · Founder de Genesis</span>
          <div class="linea-ant num"><span class="a">60M</span><span class="f">→</span><span class="b">275M</span></div>
          <p>Facturación mensual de su marca, en pesos: de compra única a suscripción.</p>
        </div>
        <div class="tarjeta vidrio"><span class="tag-n">Suscriptores activos</span><span class="big num">3.943</span><p>Que se cobran solos todos los meses.</p></div>
        <div class="tarjeta vidrio"><span class="tag-n">Cancelaciones</span><span class="big num">7,2<em>%</em></span><p>Y un LTV mínimo de 3 pedidos por cliente.</p></div>
        <div class="tarjeta vidrio" style="grid-column: span 2"><span class="tag-n">José · Co-founder de Genesis</span><h3>El que está en el día a día con tu marca</h3><p>${lite ? "Da 2 de las 3 clases grupales por semana y te responde por chat cuando te trabás." : "Llamadas 1 a 1, clases grupales y chat directo. Está en la entrega de cada marca."}</p></div>
      </div>
    </div>` });

  S.push({ id: "comunidad", nombre: "Comunidad", html: `
    <div class="slide">
      <div class="slide-head"><span class="k">Genesis comunidad</span><h2>No hacés este camino solo</h2><p>Entrás a una comunidad de dueños de marca de consumibles que están haciendo lo mismo que vos: comparten números, proveedores y lo que les funciona.</p></div>
      <div class="tarjetas">
        <div class="tarjeta vidrio"><span class="tag-n">Qué encontrás</span><ul class="lista">${li(["Dueños de marca en el mismo camino","Números reales, sin humo","Encuentros presenciales y online"])}</ul></div>
        <div class="tarjeta vidrio"><span class="tag-n">Para qué sirve</span><p>Cuando una duda ya la resolvió otro, no esperás a la próxima clase: la encontrás en la comunidad.</p></div>
      </div>
    </div>` });

  S.push({ id: "informacion", nombre: "Información", html: `
    <div class="slide">
      <div class="slide-head"><span class="k">Información</span><h2>Todos los SOPs, en el campus</h2><p>13 áreas del negocio documentadas paso a paso, más las herramientas que usamos en nuestras marcas. ${lite ? "Sabés qué hacer hoy, qué hacer mañana y en qué orden." : "Lo que usamos nosotros, listo para copiar y pegar en tu marca."}</p></div>
      <div class="sops">${SOPS.map((s,i) => `<div>${ok}<span>SOPs ${s}</span><small class="num">${String(i+1).padStart(2,"0")}</small></div>`).join("")}</div>
      <div class="tarjetas">
        <div class="tarjeta vidrio"><span class="tag-n">+ Herramientas</span><h3>Agentes, flujos, skills y dashboards</h3><p>Más de 30 agentes de IA: creativos, Meta Ads, operaciones, flujos de email y más.</p></div>
        <div class="tarjeta vidrio"><span class="tag-n">Núcleo</span><ul class="lista">${li(o.nucleo)}</ul></div>
      </div>
      ${lite ? `<div class="slide-head" style="margin-top:6px"><span class="k">En qué orden</span><h3 style="font-size:28px">Del producto a la suscripción</h3></div>
      <div class="etapas">${ETAPAS.map((e,i) => `<div class="etapa vidrio"><span class="n num">0${i+1}</span><b>${e[0]}</b><p>${e[1]}</p></div>`).join("")}</div>` : ""}
    </div>` });

  S.push({ id: "acompanamiento", nombre: "Acompañamiento", html: `
    <div class="slide">
      <div class="slide-head"><span class="k">Acompañamiento</span><h2>${lite ? "Lo implementás vos, con nosotros al lado" : "Lo hacemos con vos, durante 4 meses"}</h2><p>${lite ? "No es «lo hacemos por vos». Es «lo hacés vos, con alguien que ya lo hizo mirando lo que hacés»." : "Done with you: tu marca aplica el método con Manu y el equipo al lado en cada paso."}</p></div>
      ${o.acomp.map(a => `
        <div class="vidrio bloque-ac">
          <div style="display:grid;gap:10px"><div class="pill">${a.t}</div><p style="color:var(--gris-2)">${a.s}</p></div>
          <div class="galeria">${a.fotos.map(f => `<figure>${img(f, f === "chat" ? "chat" : "")}<figcaption>${IMG[f].alt}</figcaption></figure>`).join("")}</div>
        </div>`).join("")}
      ${o.dwy ? `<div class="tarjeta vidrio"><span class="tag-n">Done with you · lo hacemos con vos</span><ul class="lista" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">${li(o.dwy)}</ul></div>` : ""}
    </div>` });

  o.bonus.forEach((b, i) => {
    const n = i + 1;
    if (b === "contactos") S.push({ id: "bonus-contactos", nombre: `Bonus ${n}`, html: `
      <div class="slide">
        <div class="slide-head"><span class="k">Bonus ${n}</span><h2>Red de contactos Genesis</h2><p>La agenda que nos llevó años armar: los contactos que necesitás para fabricar, registrar, vender y despachar.</p></div>
        <div class="tarjetas">${CONTACTOS.map(c => `<div class="tarjeta vidrio">${ok}<h3>${c}</h3></div>`).join("")}</div>

    if (b === "puentify") S.push({ id: "bonus-puentify", nombre: `Bonus ${n}`, html: `
      <div class="slide">
        <div class="slide-head"><span class="k">Bonus ${n}</span><h2>Puentify × Genesis ${lite ? "Lite" : "OS"}</h2><p>Tus cobros recurrentes, instalados con el equipo de Puentify.</p></div>
        <div class="tarjetas">${PUENTIFY.map(c => `<div class="tarjeta vidrio">${ok}<h3>${c}</h3></div>`).join("")}</div>
      </div>` });
    if (b === "descuento") S.push({ id: "bonus-descuento", nombre: `Bonus ${n}`, html: `
      <div class="slide">
        <div class="slide-head"><span class="k">Bonus ${n}</span><h2>USD 3.000 de descuento</h2><p>Solo para las marcas que entren en los 10 cupos.</p></div>
        <div class="tarjeta vidrio" style="justify-items:center;text-align:center;padding:48px 22px"><span class="grande-verde num" style="font-size:clamp(64px,12vw,128px)">-USD 3.000</span><p>Se descuenta de la inversión de Genesis OS.</p></div>
      </div>` });
  });

  S.push({ id: "cierre", nombre: "Cierre", html: `
    <div class="slide portada">
      <span class="eyebrow" style="color:var(--naranja)">${o.cierre.k}</span>
      <h2 style="font-size:clamp(40px,7vw,80px);font-weight:300;color:var(--hueso)">${o.cierre.t}</h2>
      <p style="color:var(--gris-2);font-weight:300;font-size:19px;max-width:56ch">${o.cierre.p}</p>
    </div>` });

  return S;
}

function abrir(id) {
  const i = slides.findIndex(s => s.id === id);
  idx = i < 0 ? 0 : i;
  $("#visor").hidden = false;
  pintar();
  $("#sig").focus();
}
function cerrar() {
  $("#visor").hidden = true;
  setHash(oferta);
}
function ir(d) {
  const n = idx + d;
  if (n < 0 || n >= slides.length) return;
  idx = n; pintar();
}
function pintar() {
  const s = slides[idx];
  $("#escena").innerHTML = s.html;
  $("#escena").scrollTop = 0;
  $("#que").innerHTML = `<b>${OFERTAS[oferta].nombre}</b> · ${s.nombre}`;
  $("#contador").textContent = `${idx + 1} / ${slides.length}`;
  $("#ant").disabled = idx === 0;
  $("#sig").disabled = idx === slides.length - 1;
  $("#puntos").innerHTML = slides.map((x, i) => `<button type="button" aria-label="${x.nombre}" ${i === idx ? 'aria-current="true"' : ""} data-i="${i}"></button>`).join("");
  $("#puntos").querySelectorAll("button").forEach(b => b.addEventListener("click", () => { idx = +b.dataset.i; pintar(); }));
  $("#escena").querySelectorAll("[data-salto]").forEach(b => b.addEventListener("click", () => abrir(b.dataset.salto)));
  setHash(`${oferta}-${s.id}`);
}

/* ---------- Oferta y hash ---------- */
function setOferta(o) {
  oferta = o;
  document.querySelectorAll(".switch button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.o === o)));
  render();
}
function setHash(h) {
  try { if (location.hash !== "#" + h) history.replaceState(null, "", "#" + h); } catch (e) {}
}
function leerHash() {
  const h = (location.hash || "").slice(1);
  if (!h) { setOferta("os"); return; }
  const [o, ...rest] = h.split("-");
  setOferta(OFERTAS[o] ? o : "os");
  const id = rest.join("-");
  if (id) abrir(id); else if (!$("#visor").hidden) cerrar();
}

document.querySelectorAll(".switch button").forEach(b => b.addEventListener("click", () => {
  const abierto = !$("#visor").hidden;
  const actual = abierto ? slides[idx].id : null;
  setOferta(b.dataset.o);
  if (abierto) abrir(slides.some(s => s.id === actual) ? actual : "portada"); else setHash(oferta);
}));
$("#presentar").addEventListener("click", () => abrir("portada"));
$("#cerrar").addEventListener("click", cerrar);
$("#ant").addEventListener("click", () => ir(-1));
$("#sig").addEventListener("click", () => ir(1));
document.addEventListener("keydown", e => {
  if ($("#visor").hidden) return;
  if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); ir(1); }
  if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); ir(-1); }
  if (e.key === "Escape") cerrar();
});
let tx = null;
$("#escena").addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, { passive: true });
$("#escena").addEventListener("touchend", e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 60) ir(dx < 0 ? 1 : -1);
});
window.addEventListener("hashchange", leerHash);

leerHash();
</script>
