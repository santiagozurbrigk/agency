<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Agendá tu llamada · Génesis</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B0B0C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/formulario.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <linearGradient id="g-logo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EE641F"/><stop offset="1" stop-color="#BF3F0B"/></linearGradient><symbol id="logo" viewBox="0 0 1024 1024"><rect width="1024" height="1024" rx="211" fill="url(#g-logo)"/><path fill="#fff" d="M512 310.5A249.3 249.3 0 0 0 512 713.5A249.3 249.3 0 0 0 512 310.5Z"/></symbol>
</svg>
<div class="top">
  <div class="fila"><div class="logo"><svg><use href="#logo"/></svg>GÉNESIS</div><span class="paso-n" id="pasoN"></span></div>
  <div class="progreso"><i id="progreso"></i></div>
</div>
<main id="main" aria-live="polite"></main>

<script src="/formulario.js"></script>
<script>
const FACT=["Menos de 10M","Entre 10M y 30M","Entre 30M y 50M","Entre 50M y 100M","Más de 100M"];
const CICLO=["En menos de 30 días","Entre 30 y 60 días","Entre 60 y 90 días","Más de 90 días","No se termina, se compra una vez y listo"];
const INV=["Menos de USD 1.000","Entre USD 1.000 y USD 3.000","Entre USD 3.000 y USD 6.000","Más de USD 6.000"];

Formulario({
  pasos:[
    {clave:"telefono", tipo:"tel", titulo:"Tu WhatsApp, con código de país",
      ayuda:"Por acá te confirmamos la llamada. Te lleva un minuto completar todo.", placeholder:"+54 9 11 2345 6789"},
    {clave:"objetivo", tipo:"opciones", titulo:"¿Qué querés lograr con tu marca en los próximos 6 meses?", otro:true,
      opciones:["Tener un piso de facturación todos los meses","Mejorar mis márgenes por cada venta","Poder pagar más por cada cliente y seguir siendo rentable"]},
    {clave:"freno", tipo:"opciones", titulo:"¿Qué es lo que más te frena hoy para llegar a eso?", otro:true,
      opciones:["El CPA me sube todos los meses","Vendo, pero cada venta me deja poco margen","Dependo de Meta: si me bajan la cuenta, se frena todo","Todavía no logro vender de forma constante"]},
    {clave:"hace_cuanto", tipo:"largo", titulo:"¿Hace cuánto te pasa y qué probaste hasta ahora para resolverlo?",
      ayuda:"Con tus palabras. Así llegamos a la llamada con tu caso claro.", placeholder:"Por ejemplo: desde mitad de año; probamos más creativos y cambiamos de agencia…"},
    {clave:"ciclo", tipo:"opciones", titulo:"¿Cada cuánto se le termina el producto a tu cliente?", opciones:CICLO},
    {clave:"facturacion", tipo:"opciones", titulo:"¿Cuánto está facturando tu marca mensualmente?", opciones:FACT},
    {clave:"inversion", tipo:"opciones", titulo:"Si vemos que encaja con tu marca, ¿con cuánto contás hoy para invertir en resolverlo?", opciones:INV}
  ],
  enviar: async (datos, reiniciar) => {
    const r = await fetch("/api/public/agenda",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(datos)});
    const d = await r.json().catch(()=>({ok:false}));
    if(!d.ok) throw new Error(d.error||"No se pudo enviar. Probá de nuevo.");
    const main=document.getElementById("main");

    if(d.ruta==="rechazado"){
      main.innerHTML=`<div class="pantalla panel">
        <div class="circ"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg></div>
        <h2>Por el momento no podemos ayudarte</h2>
        <p>El trabajo que hacemos necesita una inversión mínima para que los números te cierren.</p>
        <p>Si marcaste una opción que no refleja tu situación real, podés cambiarla.</p>
        <div class="acciones" style="justify-content:center"><button class="btn sec" id="otraVez">Volver a la pregunta</button></div></div>`;
      document.getElementById("otraVez").onclick=()=>reiniciar("inversion");
      return;
    }

    if(d.sinCalendario){
      main.innerHTML=`<div class="pantalla panel">
        <div class="circ"><svg class="ic" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div>
        <h2>Listo, recibimos tus respuestas</h2>
        <p>En unos minutos te escribimos por WhatsApp para coordinar el horario.</p></div>`;
      return;
    }

    main.innerHTML=`<div class="pantalla">
      <div class="kicker">Último paso</div>
      <h2>Elegí el día y el horario de tu llamada</h2>
      <p class="ayuda">Tus datos ya están cargados. Quedás confirmado apenas elegís el horario.</p>
      ${d.reservaMin?`<p class="nota" style="margin:0 2px 14px"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Tu lugar queda reservado <span class="cuenta" id="cuenta"></span> mientras elegís.</p>`:""}
      <div class="calendario"><iframe src="${Formulario.esc(d.link)}" title="Calendario para agendar la llamada" loading="eager"></iframe></div>
    </div>`;
    if(d.reservaMin){
      const fin=Date.now()+d.reservaMin*60000, el=document.getElementById("cuenta");
      const tic=()=>{const s=Math.max(0,Math.round((fin-Date.now())/1000));el.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;if(s>0)setTimeout(tic,1000);else el.parentElement.textContent="Si todavía no elegiste, apurate: el lugar puede liberarse.";};
      tic();
    }
  }
});
</script>
</body>
</html>
