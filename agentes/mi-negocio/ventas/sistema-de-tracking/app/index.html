  h+=`<div class="sec-t fila"><div><h3>Día a día</h3><p>${abierto?"El tramo punteado es hoy, que todavía no cerró.":"Un punto por día."}</p></div><label class="chk"><input type="checkbox" ${ANUN.valores?"checked":""} onchange="anunValores(this.checked)">Mostrar valores</label></div>`;
  if(M){
    const inv={nombre:"Inversión",datos:mc("inversion"),color:BLA,fmt:usd2,punteada:true};
    h+=caja(`Inversión y ${cal?"CPL calificado":"CPL"} por día`,leyendaHtml([[NAR,"Inversión"],[BLA,cal?"CPL calificado":"CPL"]])+doble(x,{nombre:"Inversión",datos:mc("inversion"),color:NAR,fmt:usd2,area:1},{nombre:cal?"CPL calificado":"CPL",datos:mc(cplK),color:BLA,fmt:usd2},{abierto}),{der:"Inversión a la izquierda · CPL a la derecha",cls:"ancha"});
    h+=`<div class="grid-2c">`;
    h+=caja("Conversión de la landing vs inversión por día",leyendaHtml([[NAR,"Conversión"],[BLA,"Inversión",1]])+doble(x,{nombre:"Conversión",datos:mc("convLanding"),color:NAR,fmt:fPct,pct:1,area:1},inv,{abierto}));
    h+=caja("Inversión vs % de opt-ins calificados por día",leyendaHtml([[VER,"% calificados"],[BLA,"Inversión",1]])+doble(x,{nombre:"% calificados",datos:col("pctCalifPauta"),color:VER,fmt:fPct,pct:1,area:1},inv,{abierto}));
    h+=caja("% que toca «Entrar al grupo» vs inversión por día",leyendaHtml([[VER,"Tocan el botón"],[BLA,"Inversión",1]])+doble(x,{nombre:"Tocan el botón",datos:col("pctGrupoPauta"),color:VER,fmt:fPct,pct:1,area:1},inv,{abierto}));
    h+=caja("CTR vs inversión por día",leyendaHtml([[NAR,"CTR"],[BLA,"Inversión",1]])+doble(x,{nombre:"CTR",datos:mc("ctr"),color:NAR,fmt:fPct,pct:1,area:1},inv,{abierto}));
    h+=`</div>`;
  } else {
    h+=`<div class="grid-2c">`;
    h+=caja(cal?"Calificados por día":"Opt-ins por día",leyendaHtml([[NAR,"De pauta"],["var(--tx-3)","Todos",1]])+lineas(x,[{nombre:"De pauta",datos:col(cal?"califPauta":"leadsPauta"),color:NAR},{nombre:"Todos",datos:col(cal?"califTodos":"leadsTotal"),color:"var(--tx-3)",punteada:true}]));
    h+=caja("Conversión de la landing por día",leyendaHtml([[NAR,"Landing → opt-in"],[VER,"Landing → calificado"]])+lineas(x,[{nombre:"A opt-in",datos:col("convLandingPauta"),color:NAR,fmt:fPct},{nombre:"A calificado",datos:col("convCalifPauta"),color:VER,fmt:fPct}],{pct:true}));
    h+=`</div>`;
  }

  // Qué respondieron
  const RS=a.respuestas||{total:0,inversion:[],pais:[]};
  const INV_ORDEN=["Más de 1.000 dólares","De 500 a 1.000 dólares","De 200 a 500 dólares","De 100 a 200 dólares","Menos de 100 dólares","0, todavía no tengo marca"];
  const inv=[...RS.inversion].sort((p,q)=>(INV_ORDEN.indexOf(p.op)+99)%99-(INV_ORDEN.indexOf(q.op)+99)%99);
  const totInv=inv.reduce((t,o)=>t+o.n,0);
  h+=seccion("Qué respondieron en el formulario","La pregunta de calificación y el país del teléfono, sobre los opt-ins de pauta del rango.");
  h+=`<div class="grid-2c">`;
  h+=caja("¿Cuánto invertís por día en Meta?",inv.length?inv.map(o=>{const ok=o.calif>0;const p=pc(o.n,totInv);
    return `<div class="resp"><div class="resp-c"><span>${esc(o.op)}${ok?` <span class="chip-c">califica</span>`:""}</span><span class="num"><b>${fPct(Math.round(p))}</b> ${fNum(o.n)}</span></div><div class="resp-b"><i class="${ok?"ok":""}" style="width:${p}%"></i></div></div>`;}).join(""):`<div class="sin-datos">Sin respuestas en el rango (la pregunta está desde el 14/10)</div>`,{der:`${fNum(totInv)} respuestas`});
  const totP=RS.pais.reduce((t,o)=>t+o.n,0);
  h+=caja("País (según el prefijo del teléfono)",RS.pais.length?RS.pais.slice(0,12).map(o=>{const p=pc(o.n,totP);
    return `<div class="pais"><span class="p-n">${esc(o.op)}</span><span class="p-b"><i style="width:${p}%"></i></span><span class="num"><b>${fPct(Math.round(p))}</b> ${fNum(o.n)}</span><span class="chip-c">${fPct(Math.round(pc(o.calif,o.n)||0))} calif.</span></div>`;}).join(""):`<div class="sin-datos">Sin datos</div>`,{der:fNum(totP)});
  h+=`</div>`;

  // De dónde vienen
  const O=a.origen||[], totO=O.reduce((t,o)=>t+o.n,0);
  const COLORES=["var(--marca-dato)","var(--tx-2)","var(--tx-3)","var(--borde-2)","var(--panel-3)"];
  h+=seccion("De dónde vienen los opt-ins","Todos los opt-ins del rango: de pauta y sin anuncio (bio, historias, directo).");
  h+=caja("",`<div class="orig-t"><b class="num">${fNum(totO)}</b> opt-ins en total</div>
    <div class="apilada">${O.map((o,i)=>`<i style="width:${pc(o.n,totO)}%;background:${COLORES[Math.min(i,4)]}" data-tip="${esc(o.op)}: ${fNum(o.n)}"></i>`).join("")}</div>
    ${leyendaHtml(O.slice(0,6).map((o,i)=>[COLORES[Math.min(i,4)],`${esc(o.op)} ${Math.round(pc(o.n,totO)||0)}%`]))}
    <div class="tabla-scroll"><table class="tabla"><thead><tr><th>Fuente</th><th class="n">Opt-ins</th><th class="n">% del total</th><th class="n">Calificados</th><th class="n">% calif.</th><th class="n">Tocaron el grupo</th><th class="n">% grupo</th></tr></thead><tbody>
    ${O.map((o,i)=>`<tr><td><span class="pto" style="background:${COLORES[Math.min(i,4)]}"></span>${esc(o.op)}</td><td class="n">${fNum(o.n)}</td><td class="n">${fPct(pc(o.n,totO))}</td><td class="n">${fNum(o.calif)}</td><td class="n">${fPct(pc(o.calif,o.n))}</td><td class="n">${fNum(o.grupo)}</td><td class="n">${fPct(pc(o.grupo,o.n))}</td></tr>`).join("")}
    <tr class="total"><td>Total</td><td class="n">${fNum(totO)}</td><td class="n">100%</td><td class="n">${fNum(O.reduce((t,o)=>t+o.calif,0))}</td><td class="n">${fPct(pc(O.reduce((t,o)=>t+o.calif,0),totO))}</td><td class="n">${fNum(O.reduce((t,o)=>t+o.grupo,0))}</td><td class="n">${fPct(pc(O.reduce((t,o)=>t+o.grupo,0),totO))}</td></tr></tbody></table></div>`);

  // Después del registro: lo que hace el equipo (esto no lo tiene un panel de ads)
  h+=seccion("Después del registro","Lo que pasa con los leads cuando los trabaja el equipo.");
  h+=`<div class="akpis k4">
    ${kpi({t:"Tasa de contacto",v:fPct(R.tasaContacto),sub:"Tienen al menos un intento",serie:col("tasaContacto"),abierto,chico:1})}
    ${kpi({t:"Pickup",v:fPct(R.pickup),sub:"Contestaron / contactados",chico:1})}
    ${kpi({t:"Calificación real",v:fPct(R.califReal),sub:"Facturación confirmada por el SDR",serie:col("califReal"),color:VER,abierto,chico:1})}
    ${kpi({t:"Tasa de agenda",v:fPct(R.tasaAgenda),sub:"Calificados que agendaron",serie:col("tasaAgenda"),abierto,chico:1})}</div>`;
  h+=`<div class="grid-2c">`;
  h+=caja("Tasa de contacto y contestaron por día",leyendaHtml([[NAR,"Tasa de contacto"],["var(--tx-3)","Contestaron",1]])+lineas(x,[{nombre:"Contactados",datos:col("tasaContacto"),color:NAR,fmt:fPct},{nombre:"Contestaron",datos:col("pctContestaron"),color:"var(--tx-3)",punteada:true,fmt:fPct}],{pct:true}),{sub:"De los leads registrados ese día. Los días recientes suben a medida que los SDR trabajan."});
  h+=caja("Tasa de agenda por día",leyendaHtml([[NAR,"Tasa de agenda"]])+lineas(x,[{nombre:"Tasa de agenda",datos:col("tasaAgenda"),color:NAR,fmt:fPct}],{pct:true}),{sub:"De los calificados de cada día, cuántos agendaron pre-venta o llamada."});
  h+=`</div>`;
  h+=`<details class="como"><summary>Cómo se calcula cada número</summary><ul>
    <li><b>Opt-in de pauta:</b> llegó con UTMs o fbclid de un anuncio de Meta. Directos, orgánicos y bio cuentan en el total pero no en el CPL.</li>
    <li><b>Calificado:</b> invierte 100 dólares por día o más en Meta (antes del 14/10: facturación de 30M o más). Es el mismo criterio que el evento Lead del píxel.</li>
    <li><b>CPL:</b> inversión / opt-ins de pauta. <b>CPL calificado:</b> inversión / calificados de pauta.</li>
    <li><b>Conversión de la landing:</b> opt-ins de pauta / vistas de la landing que informa Meta (sin Meta: visitas que cuenta la landing).</li>
    <li><b>CTR:</b> clics en el enlace / impresiones. <b>CPM:</b> inversión cada 1.000 impresiones. <b>Frecuencia:</b> dato de Meta.</li>
    <li><b>Días:</b> hora de Argentina según el día de registro del lead. Los números de Meta usan la zona horaria de la cuenta publicitaria.</li></ul></details>`;
  return h;
}

/* ----- Landings ----- */
// Nombre de cada versión del test de la landing.
const VERSION_NOMBRE={"1":"Form abajo del video","2":"Form arriba del video","3":"Sin video","A":"Titular A (test del 14/10)","B":"Titular B (test del 14/10)"};
const nombreVersion=v=>(v.length===1?"Versión "+v:"Landing "+v)+(VERSION_NOMBRE[v]?" · "+VERSION_NOMBRE[v]:"");
function tabLandings(a,M,seg,abierto){
  const AB=a.ab||[], R=a.resumen, D=a.porDia, x=D.map(d=>d.dia);
  const NAR="var(--marca-dato)",VER="var(--ok)",BLA="var(--tx-2)";
  const VCOL=["var(--marca-dato)","var(--tx)","var(--ok)","var(--vio)","var(--azul)"];
  if(ANUN.version!=="final"&&!AB.find(v=>v.version===ANUN.version)) ANUN.version="final";
  const sel=AB.find(v=>v.version===ANUN.version);
  let h=`<div class="fila-ctl">${seg([["final","Resultado final"]].concat(AB.map(v=>[v.version,nombreVersion(v.version)])),ANUN.version,"anunVersion")}
    <span class="nota-a" style="margin:0">${sel?`Solo la versión ${esc(sel.version)}.`:AB.length?`Suma de las ${AB.length} versiones.`:"Todavía no hay versiones con datos."}</span></div>`;
  h+=seccion("Cómo convierte la landing",sel?`Versión ${esc(sel.version)}: de pauta y orgánico.`:"Todas las versiones juntas, de pauta y orgánico.");
  const vis=sel?sel.visitantes:R.visitasTodas, ops=sel?sel.leads:R.leadsTotal, cal=sel?sel.calificados:R.califTodos, gr=sel?sel.grupo:R.tocaronGrupo;
  const serieConv=sel?sel.porDia.map(d=>d.conversion):D.map(d=>pc(d.leadsTotal,d.visitasTodas));
  const [cH,cA]=abierto&&serieConv.length>1?[serieConv[serieConv.length-1],serieConv[serieConv.length-2]]:[null,null];
  const MR=M&&M.resumen;
  h+=`<div class="akpis k3">
    ${!sel&&MR?kpi({t:"Clics → visitas",v:fPct(MR.clicALanding),sub:`${fNum(MR.clics)} clics → ${fNum(MR.lpv)} visitas`,serie:M.porDia.map(d=>d.clicALanding),abierto,tip:"Vistas de la landing / clics en el enlace, según Meta. Si baja, la página está tardando en cargar."}):""}
    ${kpi({t:"Conversión",v:fPct(pc(ops,vis)),sub:`${fNum(vis)} visitas → ${fNum(ops)} opt-ins`,d:delta(cH,cA),serie:serieConv,abierto,tip:"Opt-ins / visitas a la landing (las visitas que cuenta la landing, una por sesión)."})}
    ${kpi({t:"Opt-ins → «Entrar al grupo»",v:fPct(pc(gr,ops)),sub:`${fNum(ops)} opt-ins → ${fNum(gr)} tocaron el botón`,color:VER,tip:"Opt-ins que tocaron el botón del grupo en la página de gracias."})}
    ${kpi({t:"Opt-ins",v:fNum(ops),sub:`${fNum(cal)} calificados (${fPct(pc(cal,ops))})`,serie:sel?sel.porDia.map(d=>d.leads):D.map(d=>d.leadsTotal),abierto})}
  </div>`;
  if(AB.length){
    const T=a.test||{}, mejor=T.ganador;
    h+=seccion("Test de versiones","Cada visitante ve siempre la misma versión. Opt-ins por visitante es la métrica que manda.");
    h+=`<div class="vers">${AB.map(v=>`<div class="ver${v.version===mejor&&v.conversion!=null?" gana":""}"><div class="kt">${esc(nombreVersion(v.version))}${v.version===mejor&&v.conversion!=null?` <span class="chip-c">va ganando</span>`:""}</div>
      <div class="kv num">${fPct(v.conversion)}</div><div class="ks">opt-ins por visitante</div>
      <div class="ver-g"><div><span>Visitas</span><b class="num">${fNum(v.visitantes)}</b></div><div><span>Opt-ins</span><b class="num">${fNum(v.leads)}</b></div><div><span>% calificado</span><b class="num">${fPct(v.pctCalif)}</b></div></div></div>`).join("")}</div>`;
    const conf=T.confianza;
    h+=caja("",`<div class="tabla-scroll"><table class="tabla"><thead><tr><th>Versión</th><th class="n">Visitas</th><th class="n">Opt-ins</th><th class="n">Calificados</th><th class="n">Tocaron el grupo</th><th class="n">Calif. por visitante</th><th class="n">Opt-ins por visitante</th></tr></thead><tbody>
      ${AB.map(v=>`<tr><td><b>${esc(nombreVersion(v.version))}</b></td><td class="n">${fNum(v.visitantes)}</td><td class="n">${fNum(v.leads)}</td><td class="n">${fNum(v.calificados)}<small>${fPct(v.pctCalif)} de los opt-ins</small></td><td class="n">${fNum(v.grupo)}<small>${fPct(v.pctGrupo)}</small></td><td class="n">${fPct(v.califPorVisitante)}</td><td class="n ${v.version===mejor&&v.conversion!=null?"sem-ok":""}"><b>${fPct(v.conversion)}</b></td></tr>`).join("")}</tbody></table></div>
      <div class="conf"><div class="conf-b"><i style="width:${conf||0}%;background:${conf>=95?"var(--ok)":"var(--warn)"}"></i><span style="left:95%"></span></div>
      <div class="conf-t"><span>Confianza del test: <b>${conf==null?"—":fPct(conf)}</b>${T.p!=null?` (p = ${String(T.p).replace(".",",")})`:""}</span><span>Hay ganador desde 95%</span></div>
      ${conf==null?`<p class="nota-a" style="margin:8px 0 0">Para calcularla hacen falta visitas en al menos dos versiones.</p>`:""}</div>`);
    h+=seccion("Día a día",abierto?"El tramo punteado es hoy, que todavía no cerró.":"");
    h+=`<div class="grid-2c">`;
    h+=caja("Conversión por versión por día",leyendaHtml(AB.map((v,i)=>[VCOL[i%5],nombreVersion(v.version)]))+lineas(x,AB.map((v,i)=>({nombre:v.version,datos:v.porDia.map(d=>d.conversion),color:VCOL[i%5],fmt:fPct})),{pct:true}));
    if(M) h+=caja("Clics → visitas por día",leyendaHtml([[NAR,"Visitas (Meta)"],[VER,"% que llega"]])+doble(x,{nombre:"Visitas",datos:M.porDia.map(d=>d.lpv),color:NAR,fmt:fNum,area:1},{nombre:"% que llega",datos:M.porDia.map(d=>d.clicALanding),color:VER,fmt:fPct,pct:1},{abierto}),{der:"si el % baja, la landing está tardando en cargar"});
    h+=`</div>`;
  }
  h+=caja("Próximamente",`<p class="nota-a" style="margin:0">Para ver esto hay que registrar eventos nuevos en la landing y en la página de gracias (etapa 3): hasta dónde scrollean, cuánto ven del video, tiempo en la página, en qué paso se traba el formulario y los errores, celular contra computadora, velocidad de carga y qué tocan en la página de gracias.</p>`,{cls:"muda"});
  return h;
}

/* ----- Anuncios ----- */
function tabAds(a,M,seg,abierto){
  if(!M) return `<div class="vacio"><b>Sin datos de Meta</b>La tabla de anuncios necesita la conexión con Meta Ads.</div>`;
  const MR=M.resumen, MD=M.porDia, R=a.resumen, D=a.porDia, x=D.map(d=>d.dia);
  const NAR="var(--marca-dato)",VER="var(--ok)",BLA="var(--tx-2)";
  const hoyAyer=(arr)=>abierto&&arr.length>1?[arr[arr.length-1],arr[arr.length-2]]:[null,null];
  const [iH,iA]=hoyAyer(MD.map(d=>d.inversion)),[lH,lA]=hoyAyer(D.map(d=>d.leadsPauta)),[cH,cA]=hoyAyer(MD.map(d=>d.cpl));
  let h=seccion("Anuncios","Como el Administrador de anuncios, pero con lo que pasa después del clic: si se registran, si califican, si tocan el grupo, si agendan y si compran.");
  h+=`<div class="akpis k4">
    ${kpi({t:"Gasto",v:usd2(MR.inversion),sub:abierto?`Hoy van ${usd2(iH)} · ayer ${usd2(iA)}`:"",serie:MD.map(d=>d.inversion),abierto})}
    ${kpi({t:"Opt-ins de pauta",v:fNum(R.leadsPauta),sub:abierto?`Hoy van ${fNum(lH)} · ayer ${fNum(lA)}`:"",serie:D.map(d=>d.leadsPauta),abierto})}
    ${kpi({t:"CPL",v:usd2(MR.cpl),d:delta(cH,cA,true),serie:MD.map(d=>d.cpl),abierto})}
    ${kpi({t:"Anuncios activos",v:fNum(MR.activos),sub:[MR.enRevision?`${MR.enRevision} en revisión`:"",MR.rechazados?`${MR.rechazados} rechazado${MR.rechazados===1?"":"s"}`:""].filter(Boolean).join(" · ")||"Con entrega activa en Meta"})}
  </div>`;

  // Filas según el nivel: campañas (con conjuntos y anuncios adentro), conjuntos o anuncios.
  const SUMA=["inversion","impresiones","clics","lpv","leads","calif","agendas","ventas","grupo"];
  const met=(o)=>({...o,cpl:dv(o.inversion,o.leads),cplCalif:dv(o.inversion,o.calif),cpm:o.impresiones?Math.round(o.inversion/o.impresiones*100000)/100:null,
    ctr:pc(o.clics,o.impresiones),clicALanding:pc(o.lpv,o.clics),convLanding:pc(o.leads,o.lpv),pctCalif:pc(o.calif,o.leads),pctGrupo:pc(o.grupo,o.leads)});
  const sumar=(ads,extra)=>{const o={...extra};SUMA.forEach(k=>o[k]=ads.reduce((t,a)=>t+(a[k]||0),0));return met(o);};
  const busca=ANUN.busca.trim().toLowerCase();
  const estOk=(e)=>ANUN.estado==="todos"||(ANUN.estado==="activos"?e==="Activo":e!=="Activo");
  const C=M.campanas||{}, J=M.conjuntos||{};
  const ads=M.anuncios.map(x=>met({...x,nombre:x.anuncio}));
  const conjuntos={}, campanas={};
  for(const x of ads){(conjuntos[x.conjuntoId]||(conjuntos[x.conjuntoId]={id:x.conjuntoId,nombre:x.conjunto,campanaId:x.campanaId,campana:x.campana,ads:[]})).ads.push(x);}
  for(const j of Object.values(conjuntos)){Object.assign(j,sumar(j.ads),{entrega:(J[j.id]||{}).estado||(j.ads.some(x=>x.activo)?"Activo":"Apagado"),presupuesto:(J[j.id]||{}).presupuesto??null});
    (campanas[j.campanaId]||(campanas[j.campanaId]={id:j.campanaId,nombre:j.campana,conjuntos:[]})).conjuntos.push(j);}
  for(const c of Object.values(campanas)){Object.assign(c,sumar(c.conjuntos.flatMap(j=>j.ads)),{entrega:(C[c.id]||{}).estado||(c.conjuntos.some(j=>j.entrega==="Activo")?"Activo":"Apagado")});
    const pc0=(C[c.id]||{}).presupuesto; const pj=c.conjuntos.reduce((t,j)=>t+(j.presupuesto||0),0);
    c.presupuesto=pc0??(pj||null); c.presSub=pc0==null&&pj?"suma de conjuntos":"";}
  const ord=(arr)=>arr.sort((p,q)=>{const k=ANUN.orden,a1=p[k],b1=q[k];if(a1==null&&b1==null)return 0;if(a1==null)return 1;if(b1==null)return -1;
    return typeof a1==="string"?ANUN.dir*-1*String(a1).localeCompare(b1):ANUN.dir*(a1-b1);});
  const coincide=(o)=>!busca||String(o.nombre||"").toLowerCase().includes(busca);
  const nivel=ANUN.nivel;
  let lista;
  if(nivel==="anuncio") lista=ord(ads.filter(x=>estOk(x.entrega)&&coincide(x)).map(x=>({...x,sub:x.conjunto,tipo:"anuncio",key:x.adId})));
  else if(nivel==="conjunto") lista=ord(Object.values(conjuntos).filter(j=>estOk(j.entrega)&&coincide(j)).map(j=>({...j,sub:`${j.campana} · ${j.ads.length} anuncio${j.ads.length===1?"":"s"}`,tipo:"conjunto",key:j.id})));
  else lista=ord(Object.values(campanas).filter(c=>estOk(c.entrega)&&(coincide(c)||c.conjuntos.some(j=>coincide(j)||j.ads.some(coincide)))).map(c=>({...c,sub:`${c.conjuntos.length} conjunto${c.conjuntos.length===1?"":"s"}`,tipo:"campana",key:c.id})));
  const maxInv=Math.max(1,...lista.map(o=>o.inversion||0));
  const cols=COLS_ADS.filter(c=>ANUN.cols.includes(c[0]));
  const sem=(k,v,menos)=>{const ref=k==="pctCalif"?pc(MR.calif,MR.leads):k==="pctGrupo"?pc(R.tocaronGrupoPauta,R.leadsPauta):MR[k];if(v==null||!ref||menos==null)return "";const r=menos?v/ref:ref/v;return r<1?"sem-ok":r>=1.25?"sem-mal":"";};
  const celda=(o,[k,,f,menos])=>{
    if(k==="entrega") return `<td><span class="ent ${o.entrega==="Activo"?"on":o.entrega==="En revisión"?"rev":o.entrega==="Rechazado"?"mal":""}">${esc(o.entrega||"—")}</span></td>`;
    if(k==="presupuesto") return `<td class="n">${o.presupuesto!=null?usd2(o.presupuesto):"—"}${o.presSub?`<small>${o.presSub}</small>`:""}</td>`;
    if(k==="inversion") return `<td class="n">${usd2(o.inversion)}<span class="gbar"><i style="width:${(o.inversion||0)/maxInv*100}%"></i></span></td>`;
    if(k==="frecuencia") return `<td class="n">${o.tipo==="anuncio"||o.nivel===2?fDec(o.frecuencia):"—"}</td>`;
    return `<td class="n ${sem(k,o[k],menos)}">${FMT[f](o[k])}</td>`;};
  const fila=(o,nv,hijos)=>{const cerrado=!ANUN.cerrados.has("x:"+o.key), abre=hijos&&!cerrado;
    return `<tr class="niv-${nv}${ANUN.sel&&ANUN.sel.id===o.key?" sel":""}">
      <td class="nom"><span style="padding-left:${nv*18}px;display:inline-flex;align-items:flex-start;gap:6px">${hijos?`<button class="flecha" onclick="anunToggle('x:${esc(o.key)}',event)" aria-label="${abre?"Cerrar":"Abrir"}">${abre?"▾":"▸"}</button>`:`<span class="flecha"></span>`}
      <span><button class="lnk" onclick="anunSel('${o.tipo}','${esc(o.key)}',event)">${esc(o.nombre||"(sin nombre)")}</button>${o.sub?`<small>${esc(o.sub)}</small>`:""}</span></span></td>${cols.map(c=>celda({...o,nivel:nv},c)).join("")}</tr>`;};
  let filas="";
  for(const o of lista){
    if(nivel!=="campana"){filas+=fila(o,0,false);continue;}
    filas+=fila(o,0,true); if(!ANUN.cerrados.has("x:"+o.key)) continue;
    for(const j of ord([...o.conjuntos]).filter(j=>!busca||coincide(o)||coincide(j)||j.ads.some(coincide))){
      const jo={...j,tipo:"conjunto",key:j.id,sub:`${j.ads.length} anuncio${j.ads.length===1?"":"s"}`};
      filas+=fila(jo,1,true); if(!ANUN.cerrados.has("x:"+j.id)) continue;
      for(const x of ord([...j.ads]).filter(x=>estOk(x.entrega))) filas+=fila({...x,tipo:"anuncio",key:x.adId,sub:""},2,false);
    }
  }
  const tot=met({...MR,grupo:R.tocaronGrupoPauta,leads:MR.leads,calif:MR.calif,agendas:ads.reduce((t,x)=>t+x.agendas,0),ventas:ads.reduce((t,x)=>t+x.ventas,0)});
  const cab=`<tr><th class="ordenable" onclick="anunOrden('nombre')">Nombre${ANUN.orden==="nombre"?(ANUN.dir<0?" ↓":" ↑"):""}</th>${cols.map(([k,t])=>`<th class="n ordenable${ANUN.orden===k?" on":""}" onclick="anunOrden('${k}')">${t}${ANUN.orden===k?(ANUN.dir<0?" ▼":" ▲"):""}</th>`).join("")}</tr>`;
  const totFila=`<tr class="total"><td>Total de la cuenta</td>${cols.map(([k,,f])=>k==="entrega"||k==="presupuesto"?"<td></td>":k==="inversion"?`<td class="n">${usd2(tot.inversion)}</td>`:k==="frecuencia"?`<td class="n">${fDec(MR.frecuencia)}</td>`:`<td class="n">${FMT[f](tot[k])}</td>`).join("")}</tr>`;
  h+=`<div class="ads-ctl">${seg([["campana","Campañas"],["conjunto","Conjuntos"],["anuncio","Anuncios"]],nivel,"anunNivel")}
    <input id="aBusca" class="busca-ads" type="search" placeholder="Buscar por nombre" value="${esc(ANUN.busca)}" oninput="anunBusca(this)">
    ${seg([["todos","Todos"],["activos","Activos"],["apagados","Apagados"]],ANUN.estado,"anunEstado")}
    <div class="cols-w"><button class="btn sm" onclick="anunColsMenu()">Columnas</button>${ANUN.colsMenu?`<div class="cols-m">${COLS_ADS.map(([k,t])=>`<label><input type="checkbox" ${ANUN.cols.includes(k)?"checked":""} onchange="anunCol('${k}',this.checked)">${t}</label>`).join("")}</div>`:""}</div></div>`;
  h+=lista.length?`<div class="tabla-scroll caja sin-p"><table class="tabla tabla-ads"><thead>${cab}</thead><tbody>${filas}${totFila}</tbody></table></div>`:`<div class="sin-datos">Sin ${nivel==="anuncio"?"anuncios":nivel==="conjunto"?"conjuntos":"campañas"} con inversión en este rango${busca?" que coincidan con la búsqueda":""}</div>`;
  h+=`<p class="nota-a">Tocá el nombre para ver sus gráficos por día; la flecha abre lo que tiene adentro. Tocá un encabezado para ordenar. En verde, lo que está mejor que el promedio de la cuenta; en rojo, lo que está 25% peor o más.${M.sinCruzar?` <b>${M.sinCruzar} opt-in${M.sinCruzar===1?"":"s"} de pauta no se ${M.sinCruzar===1?"pudo":"pudieron"} unir a un anuncio</b> (el utm_content no coincide con el nombre del anuncio en Meta).`:""}</p>`;

  // Gráficos de la fila elegida
  if(ANUN.sel){
    const s=ANUN.sel;
    const elegidos=s.tipo==="anuncio"?ads.filter(x=>x.adId===s.id):s.tipo==="conjunto"?ads.filter(x=>x.conjuntoId===s.id):ads.filter(x=>x.campanaId===s.id);
    const nombre=s.tipo==="anuncio"?(elegidos[0]||{}).anuncio:s.tipo==="conjunto"?(elegidos[0]||{}).conjunto:(elegidos[0]||{}).campana;
    const dia=x.map(d=>{const o={inversion:0,impresiones:0,clics:0,lpv:0,leads:0,calif:0};
      for(const e of elegidos){const z=(e.serie||{})[d];if(z){o.inversion+=z[0];o.impresiones+=z[1];o.clics+=z[2];o.lpv+=z[3];}const l=(e.leadsDia||{})[d];if(l){o.leads+=l[0];o.calif+=l[1];}}
      return met(o);});
    const cd=k=>dia.map(o=>o[k]), inv={nombre:"Inversión",datos:cd("inversion"),color:BLA,fmt:usd2,punteada:true};
    h+=`<div id="adDetalle" class="detalle"><div class="det-c"><div><span class="nota-a" style="margin:0">${s.tipo==="anuncio"?"Anuncio":s.tipo==="conjunto"?"Conjunto":"Campaña"}</span><h3>${esc(nombre||"")}</h3></div><button class="icon-btn" onclick="anunSel('${s.tipo}','${esc(s.id)}')" aria-label="Cerrar">${ic("i-x")}</button></div>
      <div class="grid-2c">
      ${caja("CPL vs inversión",leyendaHtml([[NAR,"CPL"],[BLA,"Inversión",1]])+doble(x,{nombre:"CPL",datos:cd("cpl"),color:NAR,fmt:usd2,area:1},inv,{abierto}))}
      ${caja("CPL calificado vs inversión",leyendaHtml([[VER,"CPL calificado"],[BLA,"Inversión",1]])+doble(x,{nombre:"CPL calificado",datos:cd("cplCalif"),color:VER,fmt:usd2,area:1},inv,{abierto}))}
      ${caja("CTR vs inversión",leyendaHtml([[NAR,"CTR"],[BLA,"Inversión",1]])+doble(x,{nombre:"CTR",datos:cd("ctr"),color:NAR,fmt:fPct,pct:1,area:1},inv,{abierto}))}
      ${caja("Conversión de la landing vs inversión",leyendaHtml([[NAR,"Conversión"],[BLA,"Inversión",1]])+doble(x,{nombre:"Conversión",datos:cd("convLanding"),color:NAR,fmt:fPct,pct:1,area:1},inv,{abierto}))}
      </div></div>`;
  }
  return h;
}

// Misma regla que lib/fuente.js del servidor.
function fuenteDe(t){t=t||{};const s=String(t.utm_source||"").toLowerCase(),m=String(t.utm_medium||"").toLowerCase();
  if(s==="instagram"&&m==="bio")return "Instagram · bio";if(s&&s!=="facebook")return s.charAt(0).toUpperCase()+s.slice(1)+(m?" · "+m:"");if(s==="facebook"||t.fbclid||t.ad_id)return "Anuncios de Meta";

// Barras horizontales: una fila por opción, con cantidad y % del total.
// color(x) devuelve "on" (naranja), "ok" (verde) o "" (gris).
function barrasH(items,{color=()=>"",total=false}={}){
  if(!items.length||!items.some(x=>x.n)) return `<div class="sin-datos">Sin datos todavía</div>`;
  const max=Math.max(1,...items.map(x=>x.n)), suma=items.reduce((a,x)=>a+x.n,0);
  const pc=(n)=>suma?Math.round(n/suma*100):0;
  return `<div class="bh">${items.map(x=>`<div class="bh-f" data-tip="${esc(x.op)}: ${x.n} (${pc(x.n)}%)">
    <span class="lab">${esc(x.op)}</span><span class="val">${x.n}${total?`<small>${pc(x.n)}%</small>`:""}</span>
    <span class="pista-b"><i class="${color(x)}" style="width:${x.n/max*100}%"></i></span></div>`).join("")}</div>`;
}

// Lo que cambia cada acción, para mostrarlo al instante (antes de que responda el servidor).
function cambiosOptimistas(l,action,data){
  const f=l.fields;
  if(action==="marcar") return {[data.campo]:data.valor};
  if(action==="etapa") return {etapa:data.etapa};
  if(action==="grupo") return {grupo:data.grupo};
  if(action==="responsable") return {responsable:data.responsable||""};
  if(action==="estado_llamada") return {estado_llamada:String(data.estado_llamada||"").trim().slice(0,60)};
  if(action==="reasignar") return {...(data.dueno?{dueno:data.dueno}:{}),...(data.llamada_con?{llamada_con:data.llamada_con,excede_tope:"No"}:{})};
  if(action==="intento") return {intentos:String((parseInt(f.intentos||"0",10)||0)+1),ultimo_contacto:new Date().toISOString()};
  return null;
}
function aplicarLocal(id,fields,lead){
  const i=DATA?DATA.leads.findIndex(l=>l.id===id):-1;
  if(i>=0){
    const l=DATA.leads[i];
    DATA.leads[i]=lead?{...l,...lead,fields:{...l.fields,...lead.fields},calc:l.calc}:{...l,fields:{...l.fields,...fields}};
    if(fields&&fields.grupo&&DATA.leads[i].calc) DATA.leads[i].calc={...DATA.leads[i].calc,grupo:fields.grupo};
  }
  if(lead) COMPLETO[id]=lead;
  else if(COMPLETO[id]) COMPLETO[id]={...COMPLETO[id],fields:{...COMPLETO[id].fields,...fields}};
}
async function accion(id,action,data,msgOk){
  VERSION_LOCAL++;
  const actual=lead(id);
  const previo=actual?{...actual.fields}:null;
  const previoCompleto=COMPLETO[id]?{...COMPLETO[id].fields}:null;
  const opt=actual?cambiosOptimistas(actual,action,data):null;
  if(opt){ aplicarLocal(id,opt); render(); if(FICHA_ID===id) pintarFicha(); }
  try{
    const d=await api("/api/lead",{method:"POST",body:JSON.stringify({id,action,data})});
    VERSION_LOCAL++;
    if(msgOk)toast(msgOk);
    if(d.lead){ aplicarLocal(id,null,d.lead); EDITANDO=false; render(); if(FICHA_ID===id) pintarFicha(); }
    refrescar();
  }catch(e){
    // Falló: se vuelve a como estaba.
    if(opt&&previo){
      const i=DATA.leads.findIndex(l=>l.id===id);
      if(i>=0) DATA.leads[i]={...DATA.leads[i],fields:previo};
      if(previoCompleto&&COMPLETO[id]) COMPLETO[id]={...COMPLETO[id],fields:previoCompleto};
      render(); if(FICHA_ID===id) pintarFicha();
    }
    toast(e.message,true);
  }
}
function marcar(id,campo,valor){accion(id,"marcar",{campo,valor});}
// Estado de la llamada: opciones fijas o un texto libre con «Otro…». Solo visual.
const ESTADOS_LL=["Ya lo llamé","No contestó","Llamar de nuevo","Mandé mensaje","Esperando respuesta","Agendó llamada","No le interesa"];
const TONO_ESTADO={"Ya lo llamé":"ok","Agendó llamada":"ok","No contestó":"warn","Llamar de nuevo":"warn","Mandé mensaje":"azul","Esperando respuesta":"azul","No le interesa":"mal"};
function selEstado(l){
  const e=l.fields.estado_llamada||"", propio=e&&!ESTADOS_LL.includes(e);
  return `<select class="btn sm sel estado ${e?"e-"+(TONO_ESTADO[e]||"otro"):""}" aria-label="Estado de la llamada" title="Estado de la llamada" onclick="event.stopPropagation()" onchange="event.stopPropagation();elegirEstado('${l.id}',this)">
    <option value="" ${e?"":"selected"}>${e?"Sin estado":"Estado…"}</option>${ESTADOS_LL.map(o=>`<option ${o===e?"selected":""}>${o}</option>`).join("")}${propio?`<option selected>${esc(e)}</option>`:""}<option value="__otro">Otro…</option></select>`;
}
function elegirEstado(id,el){
  let v=el.value;
  if(v==="__otro"){
    v=(prompt("Escribí el estado (máximo 60 caracteres):",(lead(id)||{fields:{}}).fields.estado_llamada||"")||"").trim().slice(0,60);
    if(!v){render();if(FICHA_ID===id)pintarFicha();return;}
  }
  accion(id,"estado_llamada",{estado_llamada:v},v?"Estado: "+v:"Sin estado");
}

// Responsable de la llamada (Jose o Manu): solo para guiarse visualmente.
const RESPONSABLES=["Jose","Manu"];
function selResp(l){
  const r=l.fields.responsable||"";
  return `<select class="btn sm sel rsp ${r?"r-"+r.toLowerCase():""}" aria-label="Responsable" title="Responsable de la llamada" onclick="event.stopPropagation()" onchange="event.stopPropagation();accion('${l.id}','responsable',{responsable:this.value},this.value?'Responsable: '+this.value:'Sin responsable')">
    <option value="" ${r?"":"selected"}>${r?"Sin responsable":"Responsable…"}</option>${RESPONSABLES.map(o=>`<option ${o===r?"selected":""}>${o}</option>`).join("")}</select>`;
}

function pintarFicha(){
  const id=FICHA_ID; const l=lead(id)||COMPLETO[id]; if(!l){cerrarFicha();return;}
  const f=l.fields;
  const paso=pasoDe(f.etapa), esVenta=(f.etapa||"").startsWith("Venta");
  const pasos=PASOS.map((p,i)=>`<div class="paso ${i<paso?"hecho":""} ${i===paso?"actual":""} ${esVenta&&i===4?"fin":""}"><i></i>${p}</div>`).join("");
  const movil=esMovil(); _eraMovil=movil;
  // En escritorio el resumen va fijo a la izquierda; en celular es una pestaña más.
  let tab=FICHA_TAB; if(!movil&&tab==="resumen") tab="dijo";
  const enPost=Boolean(f.post_estado)||(DATA&&DATA.colas.post&&DATA.colas.post.includes(id));
  const tabs=(movil?[["resumen","Resumen"]]:[]).concat(enPost?[["proceso","Proceso"]]:[]).concat([["dijo","Lo que dijo"],["venta","Venta"],["historial","Historial"]]);
  if(tab==="proceso"&&!enPost) tab="dijo";
  const sel=(acc,dataKey,label,ops,msg)=>`<select class="btn sm sel"  aria-label="${label}" onchange="if(this.value)accion('${id}','${acc}',{${dataKey}:this.value},'${msg}')"><option value="">${label}</option>${ops.map(o=>`<option>${o}</option>`).join("")}</select>`;
  $("#ficha").innerHTML=`
  <div class="f-cab">
    <div class="f-top">
      <div class="avatar lg ${claseAvatar(f.dueno)}">${esc(iniciales(l.nombre))}</div>
      <div class="datos"><h3>${esc(l.nombre||"(sin nombre)")}</h3>
        <div class="contacto">${l.telefono?`<button class="copiar" onclick="copiar('${esc(l.telefono)}',event)" title="Copiar">${ic("i-tel")}${esc(l.telefono)}</button>`:""}${l.email?`<button class="copiar" onclick="copiar('${esc(l.email)}',event)" title="Copiar">${esc(l.email)}</button>`:""}</div>
        <div class="f-badges">${badgeEtapa(f.etapa)}${f.post_estado?badgePost(f.post_estado):""}${etiquetas(l)}</div>
      </div>
      <div class="f-acc">
        <button class="btn pri sm" onclick="accion('${id}','intento',{},'Intento anotado')">${ic("i-mas")}1 intento</button>
        ${sel("etapa","etapa","Mover a…",ETAPAS.filter(e=>e!==f.etapa&&!e.startsWith("Venta")),"Etapa actualizada")}
        ${sel("reasignar","llamada_con","Llamada con…",["Manu","Equipo"],"Llamada reasignada")}
        ${sel("grupo","grupo","Grupo…",["1","2","3"],"Grupo actualizado")}
        ${selResp(l)}${selEstado(l)}
        ${ME&&ME.admin?`<button class="btn sm peligro" onclick="eliminarLead('${id}')" title="Borrar este lead de GHL y del sistema">${ic("i-x")}Eliminar</button>`:""}
      </div>
      <button class="icon-btn" onclick="cerrarFicha()" aria-label="Cerrar" style="position:absolute;top:14px;right:14px">${ic("i-x")}</button>
    </div>
    <div class="pasos" aria-label="Recorrido del lead">${pasos}</div>
  </div>
  <div class="f-cuerpo">
    ${movil?"":`<div class="f-izq">${cuerpoFicha(l,"resumen")}</div>`}
    <div class="f-der">
      <div class="tabs" role="tablist">${tabs.map(([k,t])=>`<button role="tab" aria-selected="${tab===k}" class="${tab===k?"on":""}" onclick="tabFicha('${k}')">${t}</button>`).join("")}</div>
      <div class="contenido">${cuerpoFicha(l,tab)}</div>
    </div>
  </div>`;
}

function cuerpoFicha(l,tab){
  const id=l.id, f=l.fields;
  if(tab==="resumen"){
    const sw=(campo,txt)=>`<button class="sw ${f[campo]==="Sí"?"on":""}" role="switch" aria-checked="${f[campo]==="Sí"}" onclick="marcar('${id}','${campo}','${f[campo]==="Sí"?"No":"Sí"}')"><span>${txt}</span><span class="pista"></span></button>`;
    const h=(t,v)=>`<div class="h"><small>${t}</small><b title="${esc(v||"")}">${esc(v||"—")}</b></div>`;
    return `<div class="tarjeta"><div class="hechos">
        ${h("Llamada con",llamadaCon(f.llamada_con))}${h("Grupo",f.grupo?"Grupo "+f.grupo:"")}
        ${f.inversion_meta?h("Meta por día",f.inversion_meta):h("Facturación",f.facturacion)}${h("Intentos",f.intentos||"0")}${h("Último contacto",f.ultimo_contacto?hace(f.ultimo_contacto):"")}
      </div></div>
      <div class="tarjeta"><h4>Seguimiento</h4><div class="switches">
        ${sw("confirmo_clase","Confirmó la clase")}${sw("recurso_enviado","Recurso enviado")}${sw("recurso_visto","Recurso visto")}
        ${sw("asistio","Asistió a la clase")}${sw("senal_compra","Señal de compra")}${sw("agendo","Agendó llamada")}${sw("facturacion_confirmada","Facturación confirmada")}${sw("se_presento","Se presentó")}${(l.tags||[]).includes("aplicacion-19-10")?sw("llamado_apl","Ya lo llamé (aplicación)"):""}
      </div></div>
      <div class="tarjeta"><h4>Notas del equipo</h4>
        <textarea id="nota" placeholder="Lo que tenga que saber el próximo que hable con este lead…" onfocus="EDITANDO=true">${esc(f.notas||"")}</textarea>
        <div style="margin-top:10px;display:flex;justify-content:flex-end"><button class="btn sm" onclick="accion('${id}','campos',{notas:$('#nota').value},'Notas guardadas')">Guardar notas</button></div></div>`;
  }
  if(tab==="dijo"){
    if(EDITANDO==="campos") return editorCampos(l);
    const d=(t,v)=>`<dt>${t}</dt><dd class="${v?"":"vacio-dd"}">${esc(v||"Sin dato")}</dd>`;
    return `<div class="tarjeta"><h4 style="display:flex;align-items:center">Formularios<button class="btn sm fantasma" style="margin-left:auto" onclick="EDITANDO='campos';pintarFicha()">${ic("i-editar")}Editar</button></h4><dl class="dl">
        ${d("Inversión diaria en Meta",f.inversion_meta)}${d("Facturación",f.facturacion)}${d("Ciclo de reposición",f.ciclo)}${d("Inversión disponible",f.inversion)}
        ${d("Objetivo a 6 meses",f.objetivo)}${d("Qué lo frena",f.freno)}${d("Hace cuánto y qué probó",f.hace_cuanto)}${d("Hace cuánto conoce a Manu",f.conoce_manu)}${d("Qué le falta",f.que_falta)}</dl></div>
      ${(()=>{const z=zoomDe(l);if(!z)return "";const sal=salidaZ(z);return `<div class="tarjeta"><h4>En la clase en vivo (Zoom)</h4><dl class="dl">
        ${d("Minutos vistos",z.m+" min"+(ZOOM&&ZOOM.duracion?` de ${ZOOM.duracion}`:""))}${d("En qué momento se fue",sal.t+(z.f?"":` (min ${z.s})`))}${d("Entró",`en el minuto ${z.i}`+(tardeZ(z)?" · llegó tarde":""))}${d("Veces que entró",String(z.v))}${d("País",z.p)}${d("Nombre en Zoom",z.n)}</dl></div>`;})()}
      ${(()=>{const o=origenDe(f);return `<div class="tarjeta"><h4>De dónde vino</h4>${Object.keys(o).length?`<dl class="dl">
        ${d("Fuente",fuenteDe(o))}${d("Anuncio",o.utm_content||(o.ad_id?"ID "+o.ad_id:""))}${d("Conjunto",o.utm_term)}${d("Campaña",o.utm_campaign)}${d("Ubicación",o.utm_medium)}</dl>`:`<p style="color:var(--tx-3);font-size:13.5px">Sin datos de anuncio: entró sin parámetros en el link.</p>`}</div>`;})()}
      <div class="tarjeta"><h4>De las llamadas</h4><dl class="dl">
        ${d("Qué vende",f.que_vende)}${d("Por dónde vende",f.por_donde)}${d("Cuánto le queda",f.cuanto_queda)}${d("Dolor principal",f.dolor)}
        ${d("Por qué ahora",f.por_que_ahora)}${d("Objeción real",f.objecion)}${d("Le faltó de la clase",f.falto_clase)}${d("Le resonó del recurso",f.resono)}</dl></div>`;
  }
  if(tab==="venta") return cuerpoVenta(l);
  if(tab==="proceso") return cuerpoProceso(l);
  const full=COMPLETO[id];
  let hist=[];try{hist=JSON.parse(((full||{}).fields||{}).historial_json||"[]");}catch(e){}
  if(!full) return `<div class="tarjeta"><div class="esq" style="width:70%"></div><div class="esq" style="width:50%;margin-top:10px"></div><div class="esq" style="width:60%;margin-top:10px"></div></div>`;
  if(!hist.length) return `<div class="tarjeta"><div class="vacio" style="padding:30px"><b>Sin movimientos todavía</b>Cada acción sobre el lead queda registrada acá.</div></div>`;
  return `<div class="tarjeta"><div class="timeline">${hist.slice().reverse().map(e=>{
      const t=e.q==="Sistema"?"sis":e.q==="GHL"?"ghl":"per";
      return `<div class="ev ${t}"><div class="q"><b>${esc(e.q)}</b> · ${new Date(e.t).toLocaleString("es-AR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</div><div class="a">${esc(e.a)}</div></div>`;}).join("")}</div></div>`;
}

function editorCampos(l){
  const f=l.fields;
  const inp=(k,t,v)=>`<div><label>${t}</label><input data-k="${k}" value="${esc(v||"")}"></div>`;
  const ta=(k,t,v)=>`<div class="full"><label>${t}</label><textarea data-k="${k}">${esc(v||"")}</textarea></div>`;
  return `<div class="tarjeta" id="editor"><h4>Editar la ficha</h4><div class="form-g">
    ${inp("nombre","Nombre",l.nombre)}${inp("telefono","WhatsApp",l.telefono)}${inp("email","Email",l.email)}
    ${inp("que_vende","Qué vende",f.que_vende)}${inp("por_donde","Por dónde vende",f.por_donde)}${inp("cuanto_queda","Cuánto le queda",f.cuanto_queda)}
    ${inp("dolor","Dolor principal",f.dolor)}${inp("objecion","Objeción real",f.objecion)}
    ${ta("por_que_ahora","Por qué ahora (textual)",f.por_que_ahora)}${ta("falto_clase","Qué le faltó de la clase",f.falto_clase)}${ta("resono","Qué le resonó del recurso",f.resono)}
  </div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px">
    <button class="btn sm" onclick="EDITANDO=false;pintarFicha()">Cancelar</button>
    <button class="btn pri sm" onclick="guardarCampos('${l.id}')">Guardar</button></div></div>`;
}
function guardarCampos(id){
  const data={}; document.querySelectorAll("#editor [data-k]").forEach(el=>data[el.dataset.k]=el.value);
  accion(id,"campos",data,"Ficha guardada");
}

let VENTA_OF="Génesis", VENTA_FO="PIF", VENTA_EDIT=null;
const sumaM=a=>a.reduce((x,y)=>x+y,0);
// Fecha guardada → «AAAA-MM-DD» del día local, para el input de fecha.
const diaInput=f=>f?new Date(f).toLocaleDateString("en-CA"):"";
const hoyInput=()=>new Date().toLocaleDateString("en-CA");
function cuerpoVenta(l){
  const vt=venta(l), id=l.id;
  if(!vt){
    if(VENTA_FO!=="Personalizado"&&!OFERTAS[VENTA_OF][VENTA_FO]) VENTA_FO=Object.keys(OFERTAS[VENTA_OF])[0]||"Personalizado";
    const formas=Object.entries(OFERTAS[VENTA_OF]).concat([["Personalizado","montos a mano"]]);
    return `<div class="tarjeta"><h4>Registrar una venta</h4>
      <div class="opciones">${Object.keys(OFERTAS).map(o=>`<button class="op ${VENTA_OF===o?"on":""}" onclick="VENTA_OF='${o}';pintarFicha()"><b>${o}</b><small>${DESC_OFERTA[o]||""}</small></button>`).join("")}</div>
      <div style="margin-top:14px"><label style="display:block;font-size:12px;font-weight:600;color:var(--tx-2);margin-bottom:6px">Forma de pago</label>
        <div class="seg">${formas.map(([k,p])=>`<button class="${VENTA_FO===k?"on":""}" onclick="VENTA_FO='${k}';pintarFicha()">${k} · ${p}</button>`).join("")}</div></div>
      ${VENTA_FO==="Personalizado"?`<div class="form-g" style="margin-top:14px">
        <div><label for="vTotal">Monto total (USD)</label><input id="vTotal" type="number" min="1" step="0.01" inputmode="decimal" placeholder="5000" onfocus="EDITANDO=true"></div>
        <div><label for="vCuotas">Cuotas</label><input id="vCuotas" type="number" min="1" max="24" step="1" value="1" onfocus="EDITANDO=true"></div></div>
        <p style="color:var(--tx-3);font-size:12.5px;margin-top:6px">Se divide en cuotas iguales. Después podés cambiar el monto de cada una y marcar lo que ya pagó.</p>`:""}
      <div class="form-g" style="margin-top:14px"><div><label for="vFecha">Fecha de cierre</label><input id="vFecha" type="date" value="${hoyInput()}" onfocus="EDITANDO=true"></div>
        <div><label for="vSena">Seña (USD, si señó)</label><input id="vSena" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0" onfocus="EDITANDO=true"></div>
        <div class="full"><label for="vFathom">Grabación de la llamada (Fathom)</label><input id="vFathom" type="url" placeholder="https://fathom.video/…" onfocus="EDITANDO=true"></div></div>
      <p style="color:var(--tx-3);font-size:12.5px;margin-top:6px">La primera cuota vence el día del cierre y cada una de las siguientes, un mes después. Se pueden cambiar después.</p>
      <div style="margin-top:14px"><label for="vNota" style="display:block;font-size:12px;font-weight:600;color:var(--tx-2);margin-bottom:6px">Nota de la venta (opcional)</label>
        <textarea id="vNota" placeholder="Ej.: paga la 2° cuota cuando cobre a fin de mes" onfocus="EDITANDO=true"></textarea></div>
      <div style="display:flex;justify-content:flex-end;margin-top:18px"><button class="btn pri" onclick="registrarVenta('${id}')">Registrar la venta</button></div></div>`;
  }
  const cob=sumaM(vt.pagos.filter(p=>p.pagado).map(p=>p.monto)), tot=sumaM(vt.pagos.map(p=>p.monto));
  const resumen=`<div class="tarjeta">
      <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><h3 style="font-size:20px">${esc(vt.oferta)}</h3><span style="color:var(--tx-2)">${esc(vt.forma)} · vendió ${esc(vt.vendedor)} · cerró el ${new Date(vt.fecha).toLocaleDateString("es-AR")}${vt.sena?` · señó ${usd(vt.sena)}`:""}</span>${vt.fathom?`<a class="btn sm" href="${esc(vt.fathom)}" target="_blank" rel="noopener">Ver la llamada (Fathom)</a>`:""}</div>
      <div style="margin:14px 0 6px" class="barra"><i style="width:${tot?cob/tot*100:0}%"></i></div>
      <div class="num" style="font-size:13px;color:var(--tx-2)">Cobrado ${usd(cob)} de ${usd(tot)} · <b style="color:var(--tx)">Falta pagar ${usd(tot-cob)}</b></div>
      ${vt.nota?`<p style="margin-top:12px;font-size:13.5px;white-space:pre-wrap">${esc(vt.nota)}</p>`:""}</div>`+tarjetaCliente(l,vt);
  if(VENTA_EDIT===id) return resumen+`<div class="tarjeta"><h4>Editar pagos</h4>
      <p style="color:var(--tx-3);font-size:12.5px;margin-bottom:6px">Monto y vencimiento de cada cuota, si ya la pagó y qué día. Si pagó una parte, dejá esa parte como una cuota cobrada y el resto en otra.</p>
      <div class="form-g" style="margin:8px 0 12px"><div><label for="eFecha">Fecha de cierre</label><input id="eFecha" type="date" value="${diaInput(vt.fecha)}" onfocus="EDITANDO=true"></div></div>
      <div class="pagos" id="editPagos">${vt.pagos.map((p,i)=>filaEdicion(p,i)).join("")}</div>
      <div style="margin-top:10px"><button class="btn sm" onclick="agregarCuota()">${ic("i-mas")}Agregar cuota</button></div>
      <div style="margin-top:14px"><label for="eNota" style="display:block;font-size:12px;font-weight:600;color:var(--tx-2);margin-bottom:6px">Nota de la venta</label>
        <textarea id="eNota" onfocus="EDITANDO=true">${esc(vt.nota||"")}</textarea></div>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button class="btn sm fantasma" onclick="cancelarEdicionVenta()">Cancelar</button><button class="btn sm pri" onclick="guardarEdicionVenta('${id}')">Guardar pagos</button></div></div>`;
  return resumen+`<div class="tarjeta"><h4>Pagos</h4><div class="pagos">${vt.pagos.map(p=>`
      <div class="pago ${p.pagado?"cobrado":""}">
        <div class="marca-p">${p.pagado?ic("i-check"):p.n}</div>
        <div class="info"><b class="num">${usd(p.monto)}</b> · pago ${p.n} de ${vt.pagos.length}<small class="${p.pagado?"":claseVence(p)}">${p.pagado?`Cobrado el ${new Date(p.fecha).toLocaleDateString("es-AR")}${p.vence?` · vencía el ${new Date(p.vence).toLocaleDateString("es-AR")}`:""}`:`Pendiente · ${textoVence(p)}`}</small></div>
        ${p.comprobante?`<a class="btn sm" href="${esc(/^https?:/.test(p.comprobante)?p.comprobante:"/api/comprobante?path="+encodeURIComponent(p.comprobante))}" target="_blank">${ic("i-clip")}Ver comprobante</a>`
          :`<label class="btn sm" style="cursor:pointer">${ic("i-clip")}Adjuntar<input type="file" accept="image/*,application/pdf" style="display:none" onchange="subirComprobante('${id}',${p.n},this)"></label>`}
        <button class="btn sm ${p.pagado?"":"pri"}" onclick="accion('${id}','pago',{n:${p.n},pagado:${!p.pagado}},'${p.pagado?"Pago desmarcado":"Pago cobrado"}')">${p.pagado?"Desmarcar":"Marcar cobrado"}</button>
      </div>`).join("")}</div>
      <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="btn sm" onclick="editarVenta('${id}')">Editar pagos y nota</button><button class="btn sm fantasma peligro" onclick="anularVenta('${id}')">Anular venta</button></div></div>`;
}
// Datos del cliente: contacto (va al contacto de GHL) + marca, Instagram, web, documento y país (van en la venta).
let CLI_EDIT=null;
const CAMPOS_CLI=[["marca","Marca / ecommerce"],["instagram","Instagram"],["web","Web / tienda"],["documento","DNI / CUIT"],["pais","País"]];
function tarjetaCliente(l,vt){
  const c=vt.cliente||{}, id=l.id;
  if(CLI_EDIT===id) return `<div class="tarjeta"><h4>Datos del cliente</h4>
    <div class="form-g">
      <div class="full"><label for="cNom">Nombre y apellido</label><input id="cNom" value="${esc(l.nombre||"")}" onfocus="EDITANDO=true"></div>
      <div><label for="cTel">WhatsApp</label><input id="cTel" inputmode="tel" value="${esc(l.telefono||"")}" onfocus="EDITANDO=true"></div>
      <div><label for="cMail">Email</label><input id="cMail" type="email" value="${esc(l.email||"")}" onfocus="EDITANDO=true"></div>
      ${CAMPOS_CLI.map(([k,t])=>`<div><label for="c_${k}">${t}</label><input id="c_${k}" value="${esc(c[k]||"")}" onfocus="EDITANDO=true"></div>`).join("")}
    </div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button class="btn sm fantasma" onclick="CLI_EDIT=null;EDITANDO=false;pintarFicha()">Cancelar</button><button class="btn sm pri" onclick="guardarCliente('${id}')">Guardar datos</button></div></div>`;
  const wa=waLink(l.telefono);
  const filas=[["WhatsApp",wa?`<a href="${wa}" target="_blank" rel="noopener">${esc(l.telefono)}</a>`:esc(l.telefono||"—")],["Email",l.email?`<a href="mailto:${esc(l.email)}">${esc(l.email)}</a>`:"—"]]
    .concat(CAMPOS_CLI.map(([k,t])=>[t,esc(c[k]||"—")]));
  return `<div class="tarjeta"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h4>Datos del cliente</h4><button class="btn sm" onclick="CLI_EDIT='${id}';EDITANDO=true;pintarFicha()">${ic("i-editar")}Editar</button></div>
    <div class="dl">${filas.map(([k,v])=>`<div style="color:var(--tx-3)">${k}</div><div>${v}</div>`).join("")}</div></div>`;
}
async function guardarCliente(id){
  const cliente={}; for(const [k] of CAMPOS_CLI) cliente[k]=$("#c_"+k).value;
  const data={nombre:$("#cNom").value.trim(),telefono:$("#cTel").value.trim(),email:$("#cMail").value.trim(),cliente};
  CLI_EDIT=null;
  await accion(id,"cliente",data,"Datos del cliente guardados");
}
function filaEdicion(p,i){
  return `<div class="pago ${p.pagado?"cobrado":""}" data-fila>
    <div class="marca-p">${i+1}</div>
    <div style="flex:1;min-width:120px"><label style="font-size:11.5px;color:var(--tx-3)">Monto (USD)</label><input data-monto type="number" min="1" step="0.01" inputmode="decimal" value="${p.monto||""}" onfocus="EDITANDO=true"></div>
    <div style="min-width:140px"><label style="font-size:11.5px;color:var(--tx-3)">Vence</label><input data-vence type="date" value="${diaInput(p.vence)}" onfocus="EDITANDO=true"></div>
    <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer"><input data-pagado type="checkbox" style="width:auto" ${p.pagado?"checked":""} onchange="const f=this.closest('[data-fila]');f.classList.toggle('cobrado',this.checked);const d=f.querySelector('[data-fecha]');if(this.checked&&!d.value)d.value=hoyInput();">Pagó</label>
    <div style="min-width:140px"><label style="font-size:11.5px;color:var(--tx-3)">Día que pagó</label><input data-fecha type="date" value="${p.pagado?diaInput(p.fecha):""}" onfocus="EDITANDO=true"></div>
    <button class="icon-btn" title="Quitar cuota" aria-label="Quitar cuota" onclick="quitarCuota(this)">${ic("i-x")}</button>
  </div>`;
}
function leerEdicion(){
  return [...document.querySelectorAll("#editPagos [data-fila]")].map(f=>({
    monto:Number(f.querySelector("[data-monto]").value),
    vence:f.querySelector("[data-vence]").value||null,
    pagado:f.querySelector("[data-pagado]").checked,
    fecha:f.querySelector("[data-fecha]").value||null }));
}
function renumerarCuotas(){ document.querySelectorAll("#editPagos [data-fila] .marca-p").forEach((m,i)=>m.textContent=i+1); }
function agregarCuota(){
  const c=$("#editPagos"), venc=[...c.querySelectorAll("[data-vence]")].map(i=>i.value).filter(Boolean).sort().pop();
  let vence=null; if(venc){const d=new Date(venc+"T12:00:00");d.setMonth(d.getMonth()+1);vence=d.toISOString();}
  c.insertAdjacentHTML("beforeend",filaEdicion({monto:"",pagado:false,fecha:null,vence},c.children.length)); EDITANDO=true;
}
function quitarCuota(b){
  if(document.querySelectorAll("#editPagos [data-fila]").length<=1){toast("La venta tiene que tener al menos una cuota",true);return;}
  b.closest("[data-fila]").remove(); renumerarCuotas(); EDITANDO=true;
}
function editarVenta(id){ VENTA_EDIT=id; EDITANDO=true; pintarFicha(); }
function cancelarEdicionVenta(){ VENTA_EDIT=null; EDITANDO=false; pintarFicha(); }
async function guardarEdicionVenta(id){
  const pagos=leerEdicion();
  if(pagos.some(p=>!(p.monto>0))){toast("Cada cuota necesita un monto mayor a 0",true);return;}
  VENTA_EDIT=null;
  await accion(id,"editar_venta",{pagos,nota:$("#eNota").value,fecha:$("#eFecha").value},"Venta actualizada");
}
function registrarVenta(id){
  const data={oferta:VENTA_OF,forma:VENTA_FO,nota:($("#vNota")||{}).value||"",fecha:($("#vFecha")||{}).value||"",
    sena:($("#vSena")||{}).value||0,fathom:($("#vFathom")||{}).value||""};
  if(VENTA_FO==="Personalizado"){
    const total=Number($("#vTotal").value), n=parseInt($("#vCuotas").value,10);
    if(!(total>0)){toast("Poné el monto total de la venta",true);return;}
    if(!(n>=1&&n<=24)){toast("Las cuotas van de 1 a 24",true);return;}
    // Cuotas iguales; la última absorbe el redondeo para que sumen el total exacto.
    const base=Math.floor(total/n*100)/100;
    data.montos=Array.from({length:n},(_,i)=>i<n-1?base:Math.round((total-base*(n-1))*100)/100);
  }
  accion(id,"venta",data,"Venta registrada");
}
async function anularVenta(id){
  if(await confirmar("Anular la venta","El lead vuelve a «No cerró · seguimiento» y se borran sus pagos registrados.","Anular venta",true)) accion(id,"anular_venta",{},"Venta anulada");
}
function subirComprobante(id,n,input){
  const file=input.files[0];if(!file)return;
  if(file.size>8*1024*1024){toast("El archivo pasa los 8 MB",true);return;}
  toast("Subiendo comprobante…");
  const r=new FileReader();
  r.onload=async()=>{
    try{
      await api("/api/comprobante",{method:"POST",body:JSON.stringify({id,n,filename:file.name,contentType:file.type,dataBase64:r.result.split(",")[1]})});
      toast("Comprobante adjuntado");
      const d=await api("/api/lead?id="+encodeURIComponent(id)); COMPLETO[id]=d.lead;
      const i=DATA.leads.findIndex(l=>l.id===id); if(i>=0) DATA.leads[i]={...DATA.leads[i],...d.lead,calc:DATA.leads[i].calc};
      pintarFicha(); refrescar();
    }catch(e){toast(e.message,true);}
  };
  r.readAsDataURL(file);
}

/* ============================================================
   Atajos de teclado
   ============================================================ */
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ if($("#modal").classList.contains("on")) return; cerrarTodo(); }
  if(e.key==="/" && !/input|textarea|select/i.test(document.activeElement.tagName)){ e.preventDefault(); $("#busca").focus(); }
});

init();
</script>
