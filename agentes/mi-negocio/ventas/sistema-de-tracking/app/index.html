<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Génesis · Ventas</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<script>
  // Tema antes de pintar, para que no parpadee.
  try { var t = localStorage.getItem("trk_tema"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
<style>
/* =====================================================================
   Sistema visual minimalista: casi monocromo, sin sombras ni cajas
   anidadas. El naranja solo marca la acción principal y lo activo; los
   estados se leen por un punto de color, no por píldoras rellenas.
   ===================================================================== */
:root{
  --naranja:#F26A1B; --naranja-2:#D9560C; --naranja-suave:rgba(242,106,27,.10);
  --marca-dato:#D9560C; --dato-2:#D6D3CE;
  --bg:#FFFFFF; --panel:#FFFFFF; --panel-2:#F6F6F5; --panel-3:#EDEDEB;
  --borde:#EEEEEC; --borde-2:#E0E0DD;
  --tx:#111112; --tx-2:#5C5C60; --tx-3:#9A9A9E;
  --ok:#1E8E4E; --ok-suave:rgba(30,142,78,.10);
  --warn:#B07400; --warn-suave:rgba(214,145,0,.10);
  --mal:#C2362B; --mal-suave:rgba(194,54,43,.09);
  --azul:#2F5BD3; --azul-suave:rgba(47,91,211,.09);
  --vio:#7A4FD1; --vio-suave:rgba(122,79,209,.09);
  --gris-suave:rgba(120,120,128,.10);
  --sombra:none;
  --sombra-2:0 24px 64px rgba(17,17,18,.16);
  --radio:10px; --radio-s:8px;
  --tit:"Inter Tight","Helvetica Neue",Arial,sans-serif;
  --txt:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --marca-dato:#E35F12; --dato-2:#3A3A3D;
    --bg:#0B0B0C; --panel:#0B0B0C; --panel-2:#161618; --panel-3:#202023;
    --borde:#1D1D20; --borde-2:#2B2B2F;
    --tx:#EDEDEC; --tx-2:#A3A3A6; --tx-3:#6C6C70;
    --ok:#3FC47A; --ok-suave:rgba(63,196,122,.12);
    --warn:#E8B23A; --warn-suave:rgba(232,178,58,.12);
    --mal:#F0705F; --mal-suave:rgba(240,112,95,.12);
    --azul:#7EA2FF; --azul-suave:rgba(126,162,255,.12);
    --vio:#B39BFF; --vio-suave:rgba(179,155,255,.12);
    --gris-suave:rgba(160,160,168,.12);
    --naranja-suave:rgba(242,106,27,.14);
    --sombra-2:0 24px 64px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --marca-dato:#E35F12; --dato-2:#3A3A3D;
  --bg:#0B0B0C; --panel:#0B0B0C; --panel-2:#161618; --panel-3:#202023;
  --borde:#1D1D20; --borde-2:#2B2B2F;
  --tx:#EDEDEC; --tx-2:#A3A3A6; --tx-3:#6C6C70;
  --ok:#3FC47A; --ok-suave:rgba(63,196,122,.12);
  --warn:#E8B23A; --warn-suave:rgba(232,178,58,.12);
  --mal:#F0705F; --mal-suave:rgba(240,112,95,.12);
  --azul:#7EA2FF; --azul-suave:rgba(126,162,255,.12);
  --vio:#B39BFF; --vio-suave:rgba(179,155,255,.12);
  --gris-suave:rgba(160,160,168,.12);
  --naranja-suave:rgba(242,106,27,.14);
  --sombra-2:0 24px 64px rgba(0,0,0,.7);
}

/* ===================== Base ===================== */
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.5 var(--txt);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--tit);font-weight:600;letter-spacing:-.015em;line-height:1.2}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
input,select,textarea{font:inherit;color:var(--tx);background:transparent;border:1px solid var(--borde-2);border-radius:var(--radio-s);padding:8px 10px;width:100%;transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--tx-3)}
select option{background:var(--bg);color:var(--tx)}
textarea{min-height:84px;resize:vertical}
:focus-visible{outline:2px solid var(--naranja);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg.ic{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* Botones: contorno fino por defecto; relleno solo en el principal */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 12px;border-radius:var(--radio-s);border:1px solid var(--borde-2);background:transparent;font-weight:500;font-size:13px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--panel-2)}
.btn.pri{background:var(--naranja);border-color:var(--naranja);color:#fff}
.btn.pri:hover{background:var(--naranja-2);border-color:var(--naranja-2)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn.fantasma{border-color:transparent}
.btn.peligro{color:var(--mal)}
.btn[disabled]{opacity:.5;pointer-events:none}
.sel{width:auto;max-width:150px;padding:0 24px 0 10px;text-overflow:ellipsis}
.icon-btn{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:8px;color:var(--tx-3)}
.icon-btn:hover{background:var(--panel-2);color:var(--tx)}

/* ===================== Login ===================== */
#login{position:fixed;inset:0;display:none;place-items:center;padding:20px;background:var(--bg);z-index:50}
.login-caja{width:min(360px,100%)}
.login-caja .marca{margin-bottom:36px}
.login-caja h1{font-size:22px;margin-bottom:6px}
.login-caja p{color:var(--tx-2);font-size:14px;margin-bottom:24px}
.campo{margin-bottom:14px}
.campo label{display:block;font-size:12.5px;font-weight:500;color:var(--tx-2);margin-bottom:6px}
.err{color:var(--mal);font-size:13px;margin-top:12px;display:none}

/* Marca */
.marca{display:flex;align-items:center;gap:10px;font-family:var(--tit);font-weight:700;letter-spacing:.14em;font-size:12.5px}
.marca svg{width:26px;height:26px}
.marca small{display:block;font-family:var(--txt);font-weight:400;letter-spacing:0;font-size:11.5px;color:var(--tx-3);margin-top:1px}

/* ===================== Layout ===================== */
#app{display:none;min-height:100%}
.lay{display:grid;grid-template-columns:228px 1fr;min-height:100vh}
aside.side{position:sticky;top:0;height:100vh;background:var(--bg);border-right:1px solid var(--borde);display:flex;flex-direction:column;padding:20px 10px 12px;overflow-y:auto}
.side .marca{padding:0 10px 22px}
.side nav{display:flex;flex-direction:column;gap:1px;flex:1}
.side .grupo{font-size:11.5px;font-weight:500;color:var(--tx-3);padding:16px 10px 6px}
.side .item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;color:var(--tx-2);font-weight:450;text-align:left;width:100%;font-size:13.5px}
.side .item svg{color:var(--tx-3)}
.side .item:hover{background:var(--panel-2);color:var(--tx)}
.side .item.on{background:var(--panel-2);color:var(--tx);font-weight:550}
.side .item.on svg{color:var(--naranja)}
.side .item .n{margin-left:auto;font-size:12px;font-weight:500;min-width:18px;text-align:right;color:var(--tx-3);font-variant-numeric:tabular-nums}
.side .item.on .n{color:var(--tx)}
.side .pie{border-top:1px solid var(--borde);padding:12px 4px 0;margin-top:10px;display:flex;align-items:center;gap:8px}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:11.5px;flex:none;background:var(--panel-2);color:var(--tx-2)}
.avatar.lg{width:44px;height:44px;font-size:15px}
.avatar.b,.avatar.d{background:var(--panel-2);color:var(--tx-2)}
.pie .quien{flex:1;min-width:0;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pie .quien small{display:block;font-weight:400;color:var(--tx-3);font-size:11.5px;overflow:hidden;text-overflow:ellipsis}

main.cont{min-width:0;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:15;background:color-mix(in srgb, var(--bg) 90%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--borde);padding:10px 32px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.hamb{display:none}
.buscador{position:relative;flex:1;min-width:200px;max-width:380px}
.buscador input{padding-left:32px;height:34px;border-color:transparent;background:var(--panel-2)}
.buscador input:focus{border-color:var(--borde-2);background:transparent}
.buscador svg{position:absolute;left:10px;top:9px;color:var(--tx-3);width:16px;height:16px}
.buscador kbd{position:absolute;right:8px;top:8px;font:500 11px var(--txt);color:var(--tx-3);border:1px solid var(--borde-2);border-radius:4px;padding:0 5px}
.kpis{display:flex;gap:22px;flex-wrap:wrap}
.tema-btn{margin-left:auto;height:32px;border:0;color:var(--tx-2);padding:0 8px}
.tema-btn:hover{color:var(--tx)}
.aviso-btn.on{color:var(--naranja)}
.toast.nuevo{background:var(--naranja);color:#fff;cursor:pointer}
.kpi{display:flex;align-items:center;gap:10px;min-width:0}
.kpi .t{font-size:11.5px;color:var(--tx-3);font-weight:500;line-height:1.2}
.kpi .v{font-family:var(--tit);font-weight:600;font-size:14px;line-height:1.25;font-variant-numeric:tabular-nums}
.kpi .v span{color:var(--tx-3);font-weight:500;font-size:12.5px}
.meter{width:44px;height:3px;border-radius:99px;background:var(--panel-3);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--tx-2);transition:width .4s}
.kpi.alerta .v{color:var(--mal)}
.kpi.alerta .meter i{background:var(--mal)}

.pagina{padding:32px 32px 72px;max-width:1200px;width:100%}
.demo{display:flex;gap:8px;align-items:center;color:var(--tx-3);font-size:12.5px;margin-bottom:24px}
.demo svg.ic{width:15px;height:15px;color:var(--warn)}
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.ph h2{font-size:22px}
.ph p{color:var(--tx-3);margin-top:4px;max-width:680px;font-size:13.5px}
.ph .acc{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* Filtros: texto plano, el activo se subraya con un fondo suave */
.filtros{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.seg{display:inline-flex;gap:2px;flex-wrap:wrap}
.seg button{height:28px;padding:0 10px;border-radius:6px;font-size:13px;font-weight:500;color:var(--tx-3)}
.seg button:hover{color:var(--tx)}
.seg button.on{background:var(--panel-2);color:var(--tx)}
.filtros .cuenta{margin-left:auto;color:var(--tx-3);font-size:12.5px}

/* ===================== Lista de leads ===================== */
.lista{border-top:1px solid var(--borde)}
.fila{display:grid;grid-template-columns:minmax(220px,2.2fr) minmax(110px,1fr) minmax(150px,1.3fr) minmax(120px,1.6fr) auto;gap:16px;align-items:center;padding:13px 8px;border-bottom:1px solid var(--borde);cursor:pointer;transition:background .12s}
.fila:hover{background:var(--panel-2)}
.lista.con-reg .fila{grid-template-columns:minmax(200px,2fr) minmax(130px,1.2fr) minmax(100px,1fr) minmax(140px,1.3fr) minmax(110px,1.4fr) auto}
.fila.cab{cursor:default;font-size:12px;font-weight:500;color:var(--tx-3);padding-top:10px;padding-bottom:10px}
.fila.cab:hover{background:none}
.quien-l{display:flex;align-items:center;gap:12px;min-width:0}
.quien-l .nom{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quien-l .sub{color:var(--tx-3);font-size:12.5px;display:flex;align-items:center;gap:6px}
.pos{width:18px;text-align:right;color:var(--tx-3);font-size:12px;flex:none;font-variant-numeric:tabular-nums}
.fact{font-size:13px}
.fact small{display:block;color:var(--tx-3);font-size:12px}
.etiquetas{display:flex;gap:4px 12px;flex-wrap:wrap}
.acciones-f{display:flex;gap:4px;justify-content:flex-end}
@media (hover:hover) and (min-width:901px){.fila .acciones-f .btn{opacity:0;transition:opacity .12s}.fila:hover .acciones-f .btn,.fila:focus-within .acciones-f .btn{opacity:1}}
/* Estado: punto de color + texto, sin relleno */
.badge{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;white-space:nowrap;color:var(--tx)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--tx-3)}
.badge.ok::before{background:var(--ok)} .badge.warn::before{background:var(--warn)} .badge.mal::before{background:var(--mal)}
.badge.azul::before{background:var(--azul)} .badge.vio::before{background:var(--vio)} .badge.nar::before{background:var(--naranja)}
/* Etiquetas secundarias: texto gris con ícono */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:450;color:var(--tx-3);white-space:nowrap}
.chip.ok{color:var(--ok)} .chip.warn{color:var(--warn)} .chip.mal{color:var(--mal)}
.chip.azul,.chip.vio{color:var(--tx-2)}
.chip svg.ic{width:13px;height:13px}
.vacio{padding:64px 24px;text-align:center;color:var(--tx-3);font-size:13.5px}
.vacio .circ{width:44px;height:44px;border-radius:50%;border:1px solid var(--borde-2);display:grid;place-items:center;margin:0 auto 14px;color:var(--tx-3)}
.vacio b{display:block;color:var(--tx);font-family:var(--tit);font-weight:600;font-size:15px;margin-bottom:4px}
.esq{height:12px;border-radius:4px;background:linear-gradient(90deg,var(--panel-2),var(--panel-3),var(--panel-2));background-size:200% 100%;animation:brillo 1.2s infinite}
@keyframes brillo{to{background-position:-200% 0}}
.bloque-tit{display:flex;align-items:center;gap:8px;margin:32px 0 8px;font-size:12.5px;font-weight:500;color:var(--tx-3)}
.bloque-tit .n{color:var(--tx-3)}

/* ===================== Ficha ===================== */
#velo{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#velo.on{opacity:1;pointer-events:auto}
#ficha{position:fixed;left:50%;top:50%;width:min(1100px,calc(100vw - 48px));height:min(860px,calc(100vh - 48px));background:var(--bg);border:1px solid var(--borde-2);border-radius:14px;z-index:31;transform:translate(-50%,-48%);opacity:0;pointer-events:none;transition:transform .2s cubic-bezier(.2,.8,.2,1),opacity .18s;display:flex;flex-direction:column;box-shadow:var(--sombra-2);overflow:hidden}
#ficha.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
.f-cab{position:relative;padding:24px 32px 0;flex:none}
.f-top{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;padding-right:40px}
.f-top .datos{flex:1;min-width:240px}
.f-top h3{font-size:20px;margin-bottom:4px}
.f-top .f-acc{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.f-top .contacto{display:flex;gap:14px;flex-wrap:wrap;color:var(--tx-3);font-size:13px}
.copiar{display:inline-flex;align-items:center;gap:5px;color:var(--tx-3);border-radius:5px;padding:1px 4px;margin:-1px -4px}
.copiar:hover{background:var(--panel-2);color:var(--tx)}
.copiar svg.ic{width:13px;height:13px}
.f-badges{display:flex;gap:6px 14px;flex-wrap:wrap;margin:12px 0 0}
.pasos{display:flex;margin:20px 0 0;gap:4px;padding-bottom:20px;border-bottom:1px solid var(--borde)}
.paso{flex:1;text-align:left;font-size:11.5px;font-weight:500;color:var(--tx-3)}
.paso i{display:block;height:2px;background:var(--panel-3);margin-bottom:8px}
.paso.hecho i,.paso.actual i{background:var(--tx)}
.paso.actual{color:var(--tx)}
.paso.fin i{background:var(--ok)}
.tabs{display:flex;gap:18px;overflow-x:auto;padding:0 18px;border-bottom:1px solid var(--borde);flex:none}
.tabs button{padding:12px 0;font-weight:500;font-size:13.5px;color:var(--tx-3);border-bottom:1.5px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--tx);border-bottom-color:var(--tx)}
.tabs button:hover{color:var(--tx)}
.f-cuerpo{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:0}
.f-izq{overflow-y:auto;min-height:0;padding:24px 32px}
.f-der{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--borde)}
.f-der .contenido{flex:1;overflow-y:auto;padding:24px}
.tarjeta{margin-bottom:32px}
.tarjeta:last-child{margin-bottom:0}
.tarjeta h4{font-size:12px;font-weight:500;color:var(--tx-3);margin-bottom:12px;font-family:var(--txt);letter-spacing:0}
.hechos{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 16px}
.hechos .h{min-width:0}
.hechos .h small{display:block;font-size:12px;color:var(--tx-3)}
.hechos .h b{display:block;font-size:13.5px;font-weight:500;margin-top:2px;line-height:1.35;overflow-wrap:anywhere}
.switches{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--borde);font-size:13.5px;text-align:left;width:100%}
.sw:hover{color:var(--tx)}
.sw .pista{width:28px;height:16px;border-radius:99px;background:var(--panel-3);position:relative;flex:none;transition:background .15s}
.sw .pista::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:transform .15s}
.sw.on .pista{background:var(--tx)}
.sw.on .pista::after{transform:translateX(12px);background:var(--bg)}
.dl{display:grid;grid-template-columns:170px 1fr;gap:10px 16px;font-size:13.5px}
.dl dt{color:var(--tx-3)}
.dl dd{word-break:break-word;white-space:pre-wrap}
.dl dd.vacio-dd{color:var(--tx-3)}
.form-g{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-g .full{grid-column:1/-1}
.form-g label{display:block;font-size:12px;font-weight:500;color:var(--tx-3);margin-bottom:5px}
.opciones{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.op{border:1px solid var(--borde-2);border-radius:10px;padding:12px 14px;text-align:left;width:100%;transition:border-color .15s}
.op b{display:block;font-family:var(--tit);font-weight:600;font-size:14.5px}
.op small{color:var(--tx-3);font-size:12.5px}
.op.on{border-color:var(--tx)}
.pagos{display:flex;flex-direction:column}
.pago{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--borde);flex-wrap:wrap}
.pago .marca-p{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;border:1px solid var(--borde-2);color:var(--tx-3);font-weight:500;font-size:11.5px}
.pago.cobrado .marca-p{border-color:var(--ok);color:var(--ok)}
.pago .info{flex:1;min-width:140px;font-size:13.5px}
.pago .info small{display:block;color:var(--tx-3);font-size:12px}
.barra{height:3px;border-radius:99px;background:var(--panel-3);overflow:hidden}
.barra i{display:block;height:100%;background:var(--ok)}
.timeline{position:relative;padding-left:18px}
.timeline::before{content:"";position:absolute;left:3px;top:6px;bottom:6px;width:1px;background:var(--borde-2)}
.ev{position:relative;padding:0 0 16px}
.ev::before{content:"";position:absolute;left:-18px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--tx-3)}
.ev.sis::before{background:var(--azul)} .ev.ghl::before{background:var(--vio)} .ev.per::before{background:var(--naranja)}
.ev .q{font-size:12px;color:var(--tx-3)}
.ev .q b{color:var(--tx-2);font-weight:500}
.ev .a{font-size:13.5px}

/* ===================== Día de la clase ===================== */
.toggle-pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--borde-2);font-weight:500;font-size:12.5px;color:var(--tx-2);white-space:nowrap}
.toggle-pill:hover{border-color:var(--tx-3);color:var(--tx)}
.toggle-pill.on{background:var(--tx);border-color:var(--tx);color:var(--bg)}
.toggle-pill.on.nar{background:var(--naranja);border-color:var(--naranja);color:#fff}
.toggle-pill svg.ic{width:14px;height:14px}
.fila.clase{grid-template-columns:minmax(220px,2fr) minmax(110px,1fr) auto auto;cursor:default}

/* ===================== Métricas ===================== */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:28px 24px;margin-bottom:40px}
.tile .t{font-size:12px;color:var(--tx-3)}
.tile .v{font-family:var(--tit);font-size:26px;font-weight:600;margin-top:4px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .v span{font-size:14px;color:var(--tx-3);font-weight:500}
.tile .s{font-size:12px;color:var(--tx-3);margin-top:4px}
.tile .meter{width:100%;margin-top:10px}
.grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:0 40px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 40px}
.grid-2b{display:grid;grid-template-columns:1fr 1fr;gap:0 40px}
.pagina .tarjeta{border-top:1px solid var(--borde);padding-top:18px;margin-bottom:40px}
.tarjeta .sub-g{font-size:12px;color:var(--tx-3);margin:-8px 0 16px}
.bh{display:flex;flex-direction:column;gap:10px}
.bh-f{display:grid;grid-template-columns:minmax(0,1fr) 72px;gap:4px 10px;align-items:center;font-size:12.5px}
.bh-f .lab{color:var(--tx-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bh-f .val{text-align:right;font-weight:500;font-variant-numeric:tabular-nums;grid-row:span 2;align-self:end}
.bh-f .val small{color:var(--tx-3);font-weight:400;margin-left:4px}
.bh-f .pista-b{height:6px;background:var(--panel-2);border-radius:2px;overflow:hidden;display:flex}
.bh-f .pista-b i{display:block;height:100%;background:var(--dato-2);transition:width .5s}
.bh-f .pista-b i.on{background:var(--marca-dato)}
.bh-f .pista-b i.ok{background:var(--ok)}
.cols{display:flex;align-items:flex-end;gap:4px;height:160px;padding-top:18px;border-bottom:1px solid var(--borde)}
.cols .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0;position:relative}
.cols .c i{display:block;width:100%;max-width:28px;background:var(--marca-dato);border-radius:2px 2px 0 0;min-height:2px;transition:height .5s}
.cols .c i.cero{background:var(--panel-3)}
.cols .c b{font-size:11px;font-weight:500;color:var(--tx-2);margin-bottom:4px;font-variant-numeric:tabular-nums}
.cols-x{display:flex;gap:4px;margin-top:6px}
.cols-x span{flex:1;text-align:center;font-size:10.5px;color:var(--tx-3);min-width:0;overflow:hidden;white-space:nowrap}
.leyenda{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--tx-3);margin-bottom:14px}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:8px;height:8px;border-radius:50%;display:inline-block}
.sin-datos{font-size:12.5px;color:var(--tx-3);padding:8px 0}
.funnel{display:flex;flex-direction:column;gap:10px}
.fu{display:grid;grid-template-columns:160px 1fr 44px;gap:12px;align-items:center;font-size:13px}
.fu .lab{color:var(--tx-2)}
.fu .pista-b{height:14px;position:relative}
.fu .pista-b i{position:absolute;left:0;top:0;bottom:0;background:var(--marca-dato);border-radius:0 2px 2px 0;min-width:2px;transition:width .5s}
.fu .val{font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
/* Anuncios: filtros y gráficos de línea */
.rango{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.rango input[type=date]{width:auto;height:30px;padding:0 8px;font-size:12.5px}
.rango .sep{color:var(--tx-3);font-size:12.5px}
.nota-a{font-size:12px;color:var(--tx-3);margin:6px 0 28px;max-width:760px;line-height:1.55}
.ln{width:100%;height:auto;display:block;overflow:visible}
.ln text{fill:var(--tx-3);font-size:10px;font-family:var(--txt)}
.ln .g{stroke:var(--borde);stroke-width:1}
.ln .col{fill:transparent}.ln .col:hover{fill:var(--panel-2);fill-opacity:.6}
.grid-2c{display:grid;grid-template-columns:1fr 1fr;gap:0 40px}
@media (max-width:900px){.grid-2c{grid-template-columns:1fr}}
.ads-det details{border-bottom:1px solid var(--borde)}
.ads-det summary{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 4px;cursor:pointer;list-style:none;font-size:13.5px}
.ads-det summary::-webkit-details-marker{display:none}
.ads-det summary::before{content:"›";position:absolute;margin-left:-14px;color:var(--tx-3);transition:transform .15s}
.ads-det details[open] summary::before{transform:rotate(90deg)}
.ads-det summary{position:relative;padding-left:18px}
.ads-det summary:hover{background:var(--panel-2)}
.ads-det .ad-n{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ads-det .ad-m{color:var(--tx-3);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ads-det .ad-c{color:var(--tx-2);font-size:12.5px;white-space:nowrap}
.ads-det .ad-l{padding:0 0 10px 18px}
.ad-lead{display:grid;grid-template-columns:minmax(0,1.4fr) 90px minmax(0,1fr) minmax(0,1.2fr) 100px;gap:10px;align-items:center;width:100%;text-align:left;padding:8px 6px;border-radius:6px;font-size:13px;color:var(--tx-2)}
.ad-lead:hover{background:var(--panel-2)}
.ad-lead .nom{color:var(--tx);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:900px){.ads-det summary{grid-template-columns:1fr}.ad-lead{grid-template-columns:1fr auto}.ad-lead span:nth-child(2),.ad-lead span:nth-child(3),.ad-lead span:nth-child(4){display:none}}
.tip{position:fixed;z-index:70;pointer-events:none;background:var(--tx);color:var(--bg);border-radius:6px;padding:6px 9px;font-size:12px;display:none}
table.tabla{width:100%;border-collapse:collapse;font-size:13.5px}
table.tabla th{text-align:left;font-size:12px;font-weight:500;color:var(--tx-3);padding:8px 10px 8px 0;border-bottom:1px solid var(--borde)}
table.tabla td{padding:11px 10px 11px 0;border-bottom:1px solid var(--borde)}
table.tabla tr:last-child td{border-bottom:0}
table.tabla td.n,table.tabla th.n{text-align:right;font-variant-numeric:tabular-nums}
.tabla-scroll{overflow-x:auto}
table.tabla-ads td,table.tabla-ads th{white-space:nowrap;padding-left:8px}
table.tabla-ads th.ordenable{cursor:pointer;user-select:none}
table.tabla-ads tr.abre{cursor:pointer}
table.tabla-ads tr.niv-0 td{font-weight:600}
table.tabla-ads tr.niv-1 td:first-child{color:var(--tx-2)}
table.tabla-ads .flecha{display:inline-block;width:14px;color:var(--tx-3)}
table.tabla-ads td.sem-ok{color:var(--ok)}
table.tabla-ads td.sem-mal{color:var(--mal)}

/* ===================== Modal y toast ===================== */
#modal{position:fixed;inset:0;display:none;place-items:center;z-index:60;padding:20px;background:rgba(0,0,0,.4)}
#modal.on{display:grid}
.modal-caja{width:min(420px,100%);background:var(--bg);border:1px solid var(--borde-2);border-radius:12px;padding:22px;box-shadow:var(--sombra-2)}
.modal-caja h3{font-size:17px;margin-bottom:8px}
.modal-caja p{color:var(--tx-2);font-size:14px}
.modal-caja .acc{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}
#toasts{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:80;max-width:calc(100vw - 40px)}
.toast{display:flex;align-items:center;gap:10px;background:var(--tx);color:var(--bg);border-radius:8px;padding:10px 14px;font-size:13px;animation:entra .2s ease}
.toast.mal{background:var(--mal);color:#fff}
@keyframes entra{from{opacity:0;transform:translateY(8px)}}

/* ===================== Responsive ===================== */
@media (max-width:1100px){
  .fila{grid-template-columns:minmax(200px,2fr) minmax(100px,1fr) minmax(140px,1.3fr) auto}
  .fila .col-etq{display:none}
  .lista.con-reg .fila{grid-template-columns:minmax(180px,2fr) minmax(120px,1.2fr) minmax(90px,1fr) minmax(130px,1.3fr) auto}
  .grid-2{grid-template-columns:1fr}
  .grid-3{grid-template-columns:1fr 1fr}
}
@media (max-width:900px){
  .grid-3,.grid-2b{grid-template-columns:1fr}
  .tiles{grid-template-columns:1fr 1fr;gap:22px 16px}
  .lay{grid-template-columns:1fr}
  aside.side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:40;transform:translateX(-102%);transition:transform .2s;box-shadow:var(--sombra-2)}
  aside.side.on{transform:none}
  .hamb{display:inline-grid}
  header.top{padding:10px 16px;gap:12px}
  .kpis{width:100%;margin-left:0;order:3;justify-content:space-between;gap:12px}
  .tema-btn span{display:none}
  .meter{display:none}
  .tile .meter{display:block}
  .pagina{padding:22px 16px 80px}
  .fila{grid-template-columns:1fr auto;gap:8px;padding:12px 4px}
  .fila .col-fact,.fila .col-etapa,.fila .col-reg{display:none}
  .lista.con-reg .fila{grid-template-columns:1fr auto}
  .fila.cab{display:none}
  .fila .movil{display:flex}
  #ficha{left:0;top:0;width:100vw;height:100dvh;border-radius:0;border:0;transform:translateY(12px)}
  #ficha.on{transform:none}
  .f-cab{padding:18px 16px 0}
  .pasos{padding-bottom:16px}
  .f-top .f-acc{justify-content:flex-start;width:100%;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .f-top .f-acc>*{flex:none}
  .f-cuerpo{display:flex;flex-direction:column;overflow:hidden}
  .f-izq{display:none}
  .f-der{border:0;flex:1}
  .f-der .contenido{padding:20px 16px}
  .tabs{padding:0 16px}
  .hechos{grid-template-columns:1fr 1fr}
  .switches{grid-template-columns:1fr}
  .dl{grid-template-columns:1fr;gap:2px}
  .dl dd{margin-bottom:10px}
  .form-g{grid-template-columns:1fr}
  .fila.clase{grid-template-columns:1fr auto auto;gap:8px}
  .fila.clase .toggle-pill span{display:none}
  .fu{grid-template-columns:110px 1fr 36px}
}
.movil{display:none;gap:4px 12px;flex-wrap:wrap;margin-top:6px}
@media (max-width:520px){ .opciones{grid-template-columns:1fr} .kpi .t{font-size:10.5px} .buscador kbd{display:none} }
</style>

<script>
/* ============================================================
   Estado
   ============================================================ */
let ME=null, DEMO=false, DATA=null, VISTA="ahora", FICHA_ID=null, FICHA_TAB="resumen", CARGANDO=false, EDITANDO=false;
const COMPLETO={};               // fichas completas (con historial), por id
let FILTRO_DUENO="todos";
try{ FILTRO_DUENO=localStorage.getItem("trk_dueno")||"todos"; VISTA=localStorage.getItem("trk_vista")||"ahora"; }catch(e){}

const $=s=>document.querySelector(s);
const esc=s=>{const d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML};
/* Tamaño del lead: inversión diaria en Meta (opt-in desde el 14-oct) o, en los leads viejos, la facturación. */
const tamano=f=>f.inversion_meta?f.inversion_meta+" por día":(f.facturacion||"");
const ic=(n,cls)=>`<svg class="ic ${cls||""}"><use href="#${n}"/></svg>`;

const SECCIONES=[
  {grupo:"Antes de la clase"},
  {id:"ahora", nombre:"Primer contacto", cola:"primerContacto", icono:"i-tel",
    sub:"Opt-ins sin contactar. Arriba los que califican para Génesis, después por facturación."},

async function api(path,opts){
  const r=await fetch(path,{headers:{"Content-Type":"application/json"},...opts});
  const d=await r.json().catch(()=>({ok:false,error:"Respuesta inválida del servidor"}));
  if(r.status===401&&path!=="/api/login"){mostrarLogin();throw new Error("Sesión vencida");}
  if(!d.ok) throw new Error(d.error||"Algo salió mal");
  return d;
}
/* ---------- Aviso de opt-ins nuevos (sonido + notificación del navegador) ---------- */
let AVISOS=false, CONOCIDOS=null, AUDIO=null, ULT_SONIDO=0;
try{AVISOS=localStorage.getItem("trk_avisos")==="1";}catch(e){}
function pintarAvisos(){
  const b=$("#avisoBtn"); if(!b) return;
  b.classList.toggle("on",AVISOS);
  $("#avisoIc").innerHTML=`<use href="#${AVISOS?"i-campana":"i-campana-off"}"/>`;
  $("#avisoTxt").textContent=AVISOS?"Avisos activos":"Avisos";
}
function ding(){
  try{
    AUDIO=AUDIO||new (window.AudioContext||window.webkitAudioContext)();
    if(AUDIO.state==="suspended") AUDIO.resume();
    const t=AUDIO.currentTime;
    [[880,0],[1318.5,0.13]].forEach(([f,d])=>{
      const o=AUDIO.createOscillator(), g=AUDIO.createGain();
      o.type="sine"; o.frequency.value=f; o.connect(g); g.connect(AUDIO.destination);
      g.gain.setValueAtTime(0.0001,t+d); g.gain.exponentialRampToValueAtTime(0.25,t+d+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+d+0.45);
      o.start(t+d); o.stop(t+d+0.5);
    });
  }catch(e){}
}
async function toggleAvisos(){
  AVISOS=!AVISOS;
  try{localStorage.setItem("trk_avisos",AVISOS?"1":"0");}catch(e){}
  if(AVISOS){
    ding(); // desbloquea el audio con este clic y sirve de prueba
    if("Notification" in window && Notification.permission==="default"){try{await Notification.requestPermission();}catch(e){}}
    const n=("Notification" in window)?Notification.permission:"denied";
    toast(n==="granted"?"Avisos activos: sonido y notificación cuando entra un opt-in":"Avisos activos con sonido. Las notificaciones del navegador están bloqueadas: se pueden habilitar desde el candado de la barra de direcciones.");
  } else toast("Avisos desactivados");
  pintarAvisos();
}
function esOptin(l){return (l.tags||[]).includes("optin-19-10");}
function revisarNuevos(d){
  const optins=(d.leads||[]).filter(esOptin);
  if(CONOCIDOS===null){CONOCIDOS=new Set(optins.map(l=>l.id));return;}
  const nuevos=optins.filter(l=>!CONOCIDOS.has(l.id));
  nuevos.forEach(l=>CONOCIDOS.add(l.id));
  if(!nuevos.length||!AVISOS) return;
  const l=nuevos[0], fte=fuenteDe(origenDe(l.fields));
  const titulo=nuevos.length===1?"Nuevo opt-in":`${nuevos.length} opt-ins nuevos`;
  const cuerpo=nuevos.length===1?`${l.nombre||"Sin nombre"} · ${tamano(l.fields)||"sin facturación"} · ${fte}`:nuevos.slice(0,3).map(x=>x.nombre||"Sin nombre").join(", ")+(nuevos.length>3?"…":"");
  if(Date.now()-ULT_SONIDO>4000){ding();ULT_SONIDO=Date.now();}
  const el=document.createElement("div");el.className="toast nuevo";el.innerHTML=ic("i-campana")+`<span><b>${esc(titulo)}</b> · ${esc(cuerpo)}</span>`;
  el.onclick=()=>{el.remove();if(nuevos.length===1)abrirFicha(l.id);else ir("ahora");};
  $("#toasts").appendChild(el);setTimeout(()=>el.remove(),9000);
  if(document.visibilityState!=="visible"&&"Notification" in window&&Notification.permission==="granted"){
    try{const n=new Notification(titulo,{body:cuerpo,icon:"/favicon.svg",tag:"optin"});n.onclick=()=>{window.focus();n.close();if(nuevos.length===1)abrirFicha(l.id);else ir("ahora");};}catch(e){}
  }
}

function toast(t,mal){
  const el=document.createElement("div");
  el.className="toast"+(mal?" mal":"");
  el.innerHTML=ic(mal?"i-alerta":"i-check")+`<span>${esc(t)}</span>`;
  $("#toasts").appendChild(el);
  setTimeout(()=>{el.style.transition="opacity .25s";el.style.opacity="0";setTimeout(()=>el.remove(),260);},3200);
}
async function eliminarLead(id){

  if(!ok) return;
  try{
    await api("/api/lead",{method:"POST",body:JSON.stringify({id,action:"eliminar"})});
    VERSION_LOCAL++;
    if(DATA){for(const k of Object.keys(DATA.colas||{})) if(Array.isArray(DATA.colas[k])) DATA.colas[k]=DATA.colas[k].filter(x=>x!==id);
      if(Array.isArray(DATA.leads)) DATA.leads=DATA.leads.filter(x=>x.id!==id);}
    delete COMPLETO[id]; cerrarFicha(); render(); pintarNav(); toast("Lead eliminado");

// VERSION_LOCAL sube con cada cambio hecho desde esta pantalla. Si un refresco salió
// antes de un cambio, su respuesta trae datos viejos: se descarta y se vuelve a pedir.
let VERSION_LOCAL=0, OTRO_REFRESCO=false;
async function refrescar(){
  if(CARGANDO){ OTRO_REFRESCO=true; return; }
  CARGANDO=true;
  const v=VERSION_LOCAL;
  let vieja=false;
  try{
    const d=await api("/api/leads");
    if(v!==VERSION_LOCAL){ vieja=true; return; }
    DATA=d;
    revisarNuevos(d);
    pintarKpis(); pintarNav();
    // Métricas y Anuncios traen sus propios datos: se actualizan en el lugar, sin volver arriba.
    if(!EDITANDO) render({silencioso:true});
    if(FICHA_ID && !EDITANDO) pintarFicha();
  }catch(e){ if(e.message!=="Sesión vencida") toast(e.message,true); }
  finally{
    CARGANDO=false;
    if(vieja||OTRO_REFRESCO){ OTRO_REFRESCO=false; setTimeout(refrescar,250); }
  }
}
function pintarKpis(){
  const m=DATA.manu, pct=Math.min(100,(m.total/Math.max(1,m.tope))*100);
  $("#kManuV").innerHTML=`${m.total}<span> / ${m.tope}</span>`;
  $("#kManuM").style.width=pct+"%";
  $("#kManu").classList.toggle("alerta",m.total>=m.tope);
  $("#kManu").title=`Llamadas post-clase de Manu: ${m.citas} agendada${m.citas===1?"":"s"}${m.reservas?` + ${m.reservas} reservando (3 min)`:""}`;
  const g=DATA.contadores;
  $("#kGenV").innerHTML=`${g.genesisVendidos}<span> / ${g.genesisLugares}</span>`;
  $("#kGenM").style.width=Math.min(100,(g.genesisVendidos/Math.max(1,g.genesisLugares))*100)+"%";
  pintarCierre();
}
function pintarCierre(){
  if(!DATA) return;
  const fin=new Date(DATA.settings.cierre)-Date.now();
  if(fin<=0){$("#kCierre").textContent="Cerrado";return;}
  const h=Math.floor(fin/3600000),d=Math.floor(h/24),min=Math.floor((fin%3600000)/60000);
  $("#kCierre").innerHTML=d>0?`${d}<span>d</span> ${h%24}<span>h</span>`:`${h}<span>h</span> ${min}<span>m</span>`;
}

// Hora del registro en hora de Argentina: "hoy 14:32", "ayer 09:10" o "12/10 14:32".
function horaRegistro(iso){
  if(!iso) return "—";
  const d=new Date(iso), ar=t=>new Date(t-3*3600e3).toISOString();
  const dia=ar(d.getTime()).slice(0,10), hh=ar(d.getTime()).slice(11,16);
  if(dia===ar(Date.now()).slice(0,10)) return "hoy "+hh;
  if(dia===ar(Date.now()-864e5).slice(0,10)) return "ayer "+hh;
  const p=dia.split("-");return `${+p[2]}/${+p[1]} ${hh}`;
}
function colRegistro(l){
  const o=origenDe(l.fields), fte=fuenteDe(o);
  const det=fte==="Anuncios de Meta"?(o.utm_content||(o.ad_id?"ID "+o.ad_id:"")):(o.utm_content||"");
  return `<div class="col-reg fact" title="${esc(new Date(l.creado||0).toLocaleString("es-AR",{timeZone:"America/Argentina/Buenos_Aires"}))}">${esc(horaRegistro(l.creado))}<small>${esc(fte)}${det?` · ${esc(det)}`:""}</small></div>`;
}

  return `<div class="lista">${[1,2,3,4,5].map(()=>`<div class="fila" style="cursor:default"><div class="quien-l"><div class="avatar"></div><div style="flex:1"><div class="esq" style="width:60%"></div><div class="esq" style="width:35%;margin-top:6px"></div></div></div><div class="esq col-fact"></div><div class="esq col-etapa"></div><div class="esq col-etq"></div><div></div></div>`).join("")}</div>`;
}
function lista(ids,opts){
  opts=opts||{};
  if(!DATA) return esqueleto();
  const leads=ids.map(lead).filter(Boolean);
  const vis=leads.filter(pasaDueno);
  let h=filtroDueno(leads.length,vis.length);
  if(!vis.length) return h+`<div class="lista"><div class="vacio"><div class="circ">${ic("i-check")}</div><b>${esc(opts.vacio||"Nada pendiente acá")}</b>${esc(opts.vacioSub||"Cuando entren leads a esta etapa van a aparecer acá.")}</div></div>`;
  if(opts.bloques){
    let pos=0;
    for(const b of opts.bloques){
      const sub=vis.filter(b.filtro);
      if(!sub.length) continue;
      h+=`<div class="bloque-tit">${esc(b.titulo)} <span class="n num">${sub.length}</span></div><div class="lista${opts.registro?" con-reg":""}">${opts.registro?CAB_REG:CAB}${sub.map(l=>filaLead(l,++pos,opts.registro)).join("")}</div>`;
    }
    return h;
  }
  return h+`<div class="lista${opts.registro?" con-reg":""}">${opts.registro?CAB_REG:CAB}${vis.map((l,i)=>filaLead(l,opts.numerar?i+1:0,opts.registro)).join("")}</div>`;
}

function render(op){
  const v=$("#vista");
  const silencioso=Boolean(op&&op.silencioso);
  const q=$("#busca").value.trim().toLowerCase();
  if(q&&DATA){
    const digitos=q.replace(/\D/g,"");
    const ids=DATA.leads.filter(l=>(l.nombre||"").toLowerCase().includes(q)||(l.email||"").toLowerCase().includes(q)||(digitos.length>=3&&(l.telefono||"").replace(/\D/g,"").includes(digitos))).map(l=>l.id);
    v.innerHTML=`<div class="ph"><div><h2>Resultados</h2><p>Buscando «${esc(q)}» en todos los leads del lanzamiento.</p></div></div>`+lista(ids,{vacio:"No encontramos a nadie",vacioSub:"Probá con otra parte del nombre, el email o el WhatsApp."});
    return;
  }
  const s=SEC(VISTA);
  if(VISTA!=="met"&&VISTA!=="anun") delete v.dataset.vista;
  switch(VISTA){
    case "ahora": v.innerHTML=encabezado(s)+lista(DATA?DATA.colas.primerContacto:[],{numerar:true,registro:true,vacio:"No hay opt-ins sin contactar",vacioSub:"Cuando alguien se registre en la landing aparece acá."}); break;
    case "seg": v.innerHTML=encabezado(s)+lista(DATA?DATA.colas.seguimiento:[],{registro:true,vacio:"Nadie en seguimiento todavía"}); break;
    case "g1": v.innerHTML=encabezado(s)+lista(DATA?DATA.colas.grupo1:[],{numerar:true,vacio:"Nadie agendó todavía",vacioSub:"Los que agenden con el link 1 de la clase aparecen acá."}); break;
    case "g2": v.innerHTML=encabezado(s)+lista(DATA?DATA.colas.grupo2:[],{bloques:[
        {titulo:"1 · Completaron la agenda y no agendaron",filtro:l=>l.fields.form_agenda==="Sí"},
        {titulo:"2 · Pidieron que los contacten",filtro:l=>l.fields.form_agenda!=="Sí"&&l.fields.form_contacto==="Sí"},
        {titulo:"3 · Asistieron sin completar nada",filtro:l=>l.fields.form_agenda!=="Sí"&&l.fields.form_contacto!=="Sí"}],
        vacio:"El Grupo 2 está vacío",vacioSub:"Se llena con los formularios de la clase y al armar los grupos."}); break;
    case "g3": v.innerHTML=encabezado(s)+lista(DATA?DATA.colas.grupo3:[],{numerar:true,vacio:"Nadie en el Grupo 3",vacioSub:"Se llena al armar los grupos después de la clase."}); break;
    case "llam": v.innerHTML=encabezado(s)+lista(DATA?DATA.colas.llamadas:[],{vacio:"No hay llamadas de venta agendadas"}); break;
    case "clase": renderClase(v,s); break;
    case "ventas": renderVentas(v,s); break;
    case "met": renderMetricas(v,s,silencioso); break;
    case "anun": renderAnuncios(v,s,silencioso); break;
    case "conf": renderConfig(v,s); break;
  }
}
$("#busca").addEventListener("input",()=>render());

/* ---------- Día de la clase ---------- */
function renderClase(v,s){
  if(!DATA){v.innerHTML=encabezado(s)+esqueleto();return;}
  const todos=DATA.leads.filter(l=>!["Próximo ciclo","Venta Génesis","Venta Mentoría"].includes(l.fields.etapa||""));
  const activos=todos.filter(pasaDueno).sort((a,b)=>(a.nombre||"").localeCompare(b.nombre||""));
  const asis=activos.filter(l=>l.fields.asistio==="Sí").length, sen=activos.filter(l=>l.fields.senal_compra==="Sí").length;
  let h=encabezado(s,`<button class="btn pri" onclick="armarGrupos()">${ic("i-g1")}Armar los 3 grupos</button>`);
  h+=`<div class="tiles"><div class="tile"><div class="t">Asistieron</div><div class="v num">${asis}<span> / ${activos.length}</span></div><div class="meter"><i style="width:${activos.length?asis/activos.length*100:0}%;background:var(--ok)"></i></div></div>
     <div class="tile"><div class="t">Señales de compra</div><div class="v num">${sen}</div><div class="s">Se llaman primero al día siguiente</div></div></div>`;
  h+=filtroDueno(todos.length,activos.length);
  h+=`<div class="lista">${activos.map(l=>`<div class="fila clase">
      <div class="quien-l" onclick="abrirFicha('${l.id}')" style="cursor:pointer"><div class="avatar ${claseAvatar(l.fields.dueno)}">${esc(iniciales(l.nombre))}</div><div style="min-width:0"><div class="nom">${esc(l.nombre||"(sin nombre)")}</div><div class="sub">${esc(l.telefono||"")}</div></div></div>
      <div class="col-fact fact">${esc(tamano(l.fields)||"—")}</div>
      <button class="toggle-pill ${l.fields.asistio==="Sí"?"on":""}" onclick="marcar('${l.id}','asistio','${l.fields.asistio==="Sí"?"No":"Sí"}')" aria-pressed="${l.fields.asistio==="Sí"}">${ic("i-check")}<span>${l.fields.asistio==="Sí"?"Asistió":"Asistió"}</span></button>
      <button class="toggle-pill nar ${l.fields.senal_compra==="Sí"?"on":""}" onclick="marcar('${l.id}','senal_compra','${l.fields.senal_compra==="Sí"?"No":"Sí"}')" aria-pressed="${l.fields.senal_compra==="Sí"}">${ic("i-rayo")}<span>Señal de compra</span></button>
    </div>`).join("")||`<div class="vacio"><b>No hay leads activos</b></div>`}</div>`;
  v.innerHTML=h;
}
async function armarGrupos(){
  const ok=await confirmar("Armar los 3 grupos","Se asigna el grupo de cada lead con la asistencia y los formularios cargados hasta ahora. Se puede volver a correr.","Armar los grupos");
  if(!ok) return;
  try{const d=await api("/api/grupos",{method:"POST",body:JSON.stringify({})});
    toast(`Grupos armados · G1: ${d.counts["1"]} · G2: ${d.counts["2"]} · G3: ${d.counts["3"]}`);refrescar();
  }catch(e){toast(e.message,true);}
}

/* ---------- Ventas ---------- */
function renderVentas(v,s){
  if(!DATA){v.innerHTML=encabezado(s)+esqueleto();return;}
  const todas=DATA.colas.ventas.map(lead).filter(Boolean).map(l=>({l,v:venta(l)}));
  const filas=todas.filter(x=>x.v);
  // Etapa de venta sin la venta registrada (quedaron así por moverlos a mano a «Venta …»):
  // no tienen plan de pagos, así que se listan aparte para registrarla.
  const sinRegistrar=todas.filter(x=>!x.v).map(x=>x.l);
  const suma=a=>a.reduce((x,y)=>x+y,0);
  const total=suma(filas.map(x=>suma(x.v.pagos.map(p=>p.monto))));
  const cobrado=suma(filas.map(x=>suma(x.v.pagos.filter(p=>p.pagado).map(p=>p.monto))));
  let h=encabezado(s);
  h+=`<div class="tiles">
    <div class="tile"><div class="t">Vendido</div><div class="v num">${usd(total)}</div><div class="s">${filas.length} venta${filas.length===1?"":"s"}</div></div>
    <div class="tile"><div class="t">Cobrado</div><div class="v num">${usd(cobrado)}</div><div class="meter"><i style="width:${total?cobrado/total*100:0}%;background:var(--ok)"></i></div></div>
    <div class="tile"><div class="t">Por cobrar</div><div class="v num">${usd(total-cobrado)}</div></div></div>`;
  if(sinRegistrar.length) h+=`<div class="tarjeta"><h4>Cerrados sin la venta registrada</h4><p style="color:var(--tx-3);font-size:13.5px;margin-bottom:10px">Están en etapa de venta pero falta cargar la oferta y la forma de pago, así que no suman a lo vendido ni a lo cobrado. Abrilos y registrala en la pestaña Venta.</p>
    ${sinRegistrar.map(l=>`<button class="btn sm" style="margin:0 6px 6px 0" onclick="abrirFicha('${l.id}','venta')">${esc(l.nombre||"(sin nombre)")} · ${esc(l.fields.etapa)}</button>`).join("")}</div>`;
  if(!filas.length){v.innerHTML=h+`<div class="lista"><div class="vacio"><div class="circ">${ic("i-venta")}</div><b>Todavía no hay ventas</b>Se registran desde la ficha de cada lead, en la pestaña Venta.</div></div>`;return;}
  h+=`<div class="lista"><div class="fila cab"><div>Lead</div><div class="col-fact">Oferta</div><div class="col-etapa">Cobro</div><div class="col-etq">Vendió</div><div></div></div>`;
  for(const {l,v:vt} of filas){
    const pag=vt.pagos.filter(p=>p.pagado).length, cob=suma(vt.pagos.filter(p=>p.pagado).map(p=>p.monto)), tot=suma(vt.pagos.map(p=>p.monto));
    const sinComp=vt.pagos.filter(p=>p.pagado&&!p.comprobante).length;
    h+=`<div class="fila" onclick="abrirFicha('${l.id}','venta')">
      <div class="quien-l"><div class="avatar ${claseAvatar(l.fields.dueno)}">${esc(iniciales(l.nombre))}</div><div style="min-width:0"><div class="nom">${esc(l.nombre)}</div><div class="sub">${new Date(vt.fecha).toLocaleDateString("es-AR")}</div>
        <div class="movil"><span class="badge ok">${esc(vt.oferta)} · ${pag}/${vt.pagos.length}</span></div></div></div>
      <div class="col-fact fact">${esc(vt.oferta)}<small>${esc(vt.forma)}</small></div>
      <div class="col-etapa"><div class="barra"><i style="width:${tot?cob/tot*100:0}%"></i></div><div class="num" style="font-size:12px;color:var(--tx-3);margin-top:5px">${pag} de ${vt.pagos.length} pagos · ${usd(cob)} de ${tot.toLocaleString("es-AR")}${tot-cob>0?` · falta ${usd(tot-cob)}`:""}</div></div>
      <div class="col-etq etiquetas"><span class="chip">${esc(vt.vendedor)}</span>${sinComp?`<span class="chip warn">${ic("i-clip")}${sinComp} sin comprobante</span>`:""}</div>
      <div></div></div>`;
  }
  v.innerHTML=h+`</div>`;
}

/* ---------- Métricas ---------- */
// Reemplaza el contenido sin mover el scroll y manteniendo abiertos los detalles desplegados.
function pintarEnLugar(v,html){
  const y=scrollY, abiertos=[...v.querySelectorAll("details[open][data-k]")].map(d=>d.dataset.k);
  v.innerHTML=html;
  abiertos.forEach(k=>{const d=v.querySelector(`details[data-k="${CSS.escape(k)}"]`);if(d)d.open=true;});
  scrollTo(0,y);
}
async function renderMetricas(v,s,silencioso){

// Gráfico de líneas en SVG. series: [{nombre, datos:[n|null], color, punteada, fmt}]
function lineas(x,series,{pct=false,alto=200}={}){
  const W=640,H=alto,pl=38,pr=10,pt=10,pb=24,iw=W-pl-pr,ih=H-pt-pb;
  const vals=series.flatMap(s=>s.datos).filter(v=>v!=null);
  let max=pct?100:Math.max(1,...vals);
  if(!pct){const e=Math.pow(10,Math.floor(Math.log10(max)));max=Math.ceil(max/e)*e;if(max<4)max=4;}
  const X=i=>pl+(x.length<2?iw/2:i*iw/(x.length-1)), Y=v=>pt+ih-(v/max)*ih;
  const fmt=v=>pct?Math.round(v)+"%":(Math.round(v*10)/10).toLocaleString("es-AR");
  let g="";
  for(let k=0;k<=4;k++){const v=max*k/4,y=Y(v);g+=`<line class="g" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+3}" text-anchor="end">${fmt(v)}</text>`;}
  const salto=Math.max(1,Math.ceil(x.length/8));
  x.forEach((d,i)=>{if(i%salto===0||i===x.length-1)g+=`<text x="${X(i)}" y="${H-6}" text-anchor="middle">${fDia(d)}</text>`;});
  for(const s of series){
    let tramo=[],path="";
    const cerrar=()=>{if(tramo.length>1)path+=`<polyline points="${tramo.join(" ")}" fill="none" stroke="${s.color}" stroke-width="2" ${s.punteada?'stroke-dasharray="4 4"':""} stroke-linejoin="round" stroke-linecap="round"/>`;tramo=[];};
    s.datos.forEach((v,i)=>{if(v==null){cerrar();return;}tramo.push(`${X(i)},${Y(v)}`);});cerrar();
    s.datos.forEach((v,i)=>{if(v!=null)path+=`<circle cx="${X(i)}" cy="${Y(v)}" r="${x.length>40?1.6:2.6}" fill="${s.color}"/>`;});
    g+=path;
  }
  const ancho=x.length<2?iw:iw/(x.length-1);
  x.forEach((d,i)=>{const tip=fDia(d)+" · "+series.map(s=>`${s.nombre}: ${s.datos[i]==null?"—":(s.fmt||fmt)(s.datos[i])}`).join(" · ");
    g+=`<rect class="col" data-tip="${esc(tip)}" x="${X(i)-ancho/2}" y="${pt}" width="${ancho}" height="${ih}"/>`;});
  return `<svg class="ln" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

function rangoAnun(){

}

    return `<td class="n ${c?"sem-"+c:""}">${f?f(v):(v==null?"—":v)}</td>`;}).join("");
  const fila=(r,nivel,clave,hijos)=>{const cerrado=ANUN.cerrados.has(clave);

function fuenteDe(t){t=t||{};const s=String(t.utm_source||"").toLowerCase(),m=String(t.utm_medium||"").toLowerCase();
  if(s==="instagram"&&m==="bio")return "Instagram · bio";if(s&&s!=="facebook")return s.charAt(0).toUpperCase()+s.slice(1)+(m?" · "+m:"");if(s==="facebook"||t.fbclid||t.ad_id)return "Anuncios de Meta";
  if(s)return s.charAt(0).toUpperCase()+s.slice(1)+(m?" · "+m:"");return "Directo / sin UTM";}

// Barras horizontales: una fila por opción, con cantidad y % del total.
// color(x) devuelve "on" (naranja), "ok" (verde) o "" (gris).
function barrasH(items,{color=()=>"",total=false}={}){
  if(!items.length||!items.some(x=>x.n)) return `<div class="sin-datos">Sin datos todavía</div>`;
  const max=Math.max(1,...items.map(x=>x.n)), suma=items.reduce((a,x)=>a+x.n,0);
  const pc=(n)=>suma?Math.round(n/suma*100):0;
  return `<div class="bh">${items.map(x=>`<div class="bh-f" data-tip="${esc(x.op)}: ${x.n} (${pc(x.n)}%)">
    <span class="lab">${esc(x.op)}</span><span class="val">${x.n}${total?`<small>${pc(x.n)}%</small>`:""}</span>
    <span class="pista-b"><i class="${color(x)}" style="width:${x.n/max*100}%"></i></span></div>`).join("")}</div>`;
}

function abrirFicha(id,tab){
  if(FICHA_ID!==id){FICHA_TAB=tab||"resumen";EDITANDO=false;VENTA_EDIT=null;} else if(tab) FICHA_TAB=tab;
  FICHA_ID=id; pintarFicha();
  $("#velo").classList.add("on"); $("#ficha").classList.add("on"); document.body.style.overflow="hidden";
  api("/api/lead?id="+encodeURIComponent(id)).then(d=>{COMPLETO[id]=d.lead;if(FICHA_ID===id&&!EDITANDO)pintarFicha();}).catch(()=>{});
}
function cerrarFicha(){FICHA_ID=null;EDITANDO=false;VENTA_EDIT=null;$("#velo").classList.remove("on");$("#ficha").classList.remove("on");document.body.style.overflow="";}
const esMovil=()=>matchMedia("(max-width:900px)").matches;
// Si se cruza el corte celular/escritorio con la ficha abierta, se rearma.
let _eraMovil=null;
addEventListener("resize",()=>{const m=esMovil();if(_eraMovil!==null&&m!==_eraMovil&&FICHA_ID&&!EDITANDO)pintarFicha();_eraMovil=m;});

function tabFicha(t){FICHA_TAB=t;EDITANDO=false;pintarFicha();}

// Lo que cambia cada acción, para mostrarlo al instante (antes de que responda el servidor).
function cambiosOptimistas(l,action,data){
  const f=l.fields;
  if(action==="marcar") return {[data.campo]:data.valor};
  if(action==="etapa") return {etapa:data.etapa};
  if(action==="grupo") return {grupo:data.grupo};
  if(action==="reasignar") return {...(data.dueno?{dueno:data.dueno}:{}),...(data.llamada_con?{llamada_con:data.llamada_con,excede_tope:"No"}:{})};
  if(action==="intento") return {intentos:String((parseInt(f.intentos||"0",10)||0)+1),ultimo_contacto:new Date().toISOString()};
  return null;
}
function aplicarLocal(id,fields,lead){
  const i=DATA?DATA.leads.findIndex(l=>l.id===id):-1;
  if(i>=0){
    const l=DATA.leads[i];
    DATA.leads[i]=lead?{...l,...lead,fields:{...l.fields,...lead.fields},calc:l.calc}:{...l,fields:{...l.fields,...fields}};
    if(fields&&fields.grupo&&DATA.leads[i].calc) DATA.leads[i].calc={...DATA.leads[i].calc,grupo:fields.grupo};
  }
  if(lead) COMPLETO[id]=lead;
  else if(COMPLETO[id]) COMPLETO[id]={...COMPLETO[id],fields:{...COMPLETO[id].fields,...fields}};
}
async function accion(id,action,data,msgOk){
  VERSION_LOCAL++;
  const actual=lead(id);
  const previo=actual?{...actual.fields}:null;
  const previoCompleto=COMPLETO[id]?{...COMPLETO[id].fields}:null;
  const opt=actual?cambiosOptimistas(actual,action,data):null;
  if(opt){ aplicarLocal(id,opt); render(); if(FICHA_ID===id) pintarFicha(); }
  try{
    const d=await api("/api/lead",{method:"POST",body:JSON.stringify({id,action,data})});
    VERSION_LOCAL++;
    if(msgOk)toast(msgOk);
    if(d.lead){ aplicarLocal(id,null,d.lead); EDITANDO=false; render(); if(FICHA_ID===id) pintarFicha(); }
    refrescar();
  }catch(e){
    // Falló: se vuelve a como estaba.
    if(opt&&previo){
      const i=DATA.leads.findIndex(l=>l.id===id);
      if(i>=0) DATA.leads[i]={...DATA.leads[i],fields:previo};
      if(previoCompleto&&COMPLETO[id]) COMPLETO[id]={...COMPLETO[id],fields:previoCompleto};
      render(); if(FICHA_ID===id) pintarFicha();
    }
    toast(e.message,true);
  }
}
function marcar(id,campo,valor){accion(id,"marcar",{campo,valor});}

  $("#ficha").innerHTML=`

    <div class="f-top">

      <div class="datos"><h3>${esc(l.nombre||"(sin nombre)")}</h3>
        <div class="contacto">${l.telefono?`<button class="copiar" onclick="copiar('${esc(l.telefono)}',event)" title="Copiar">${ic("i-tel")}${esc(l.telefono)}</button>`:""}${l.email?`<button class="copiar" onclick="copiar('${esc(l.email)}',event)" title="Copiar">${esc(l.email)}</button>`:""}</div>
        <div class="f-badges">${badgeEtapa(f.etapa)}${etiquetas(l)}</div>
      </div>
      <div class="f-acc">
        <button class="btn pri sm" onclick="accion('${id}','intento',{},'Intento anotado')">${ic("i-mas")}1 intento</button>
        ${sel("etapa","etapa","Mover a…",ETAPAS.filter(e=>e!==f.etapa&&!e.startsWith("Venta")),"Etapa actualizada")}
        ${sel("reasignar","llamada_con","Llamada con…",["Manu","Equipo"],"Llamada reasignada")}
        ${sel("grupo","grupo","Grupo…",["1","2","3"],"Grupo actualizado")}
        ${ME&&ME.admin?`<button class="btn sm peligro" onclick="eliminarLead('${id}')" title="Borrar este lead de GHL y del sistema">${ic("i-x")}Eliminar</button>`:""}
      </div>
      <button class="icon-btn" onclick="cerrarFicha()" aria-label="Cerrar" style="position:absolute;top:14px;right:14px">${ic("i-x")}</button>
    </div>
    <div class="pasos" aria-label="Recorrido del lead">${pasos}</div>
  </div>
  <div class="f-cuerpo">
    ${movil?"":`<div class="f-izq">${cuerpoFicha(l,"resumen")}</div>`}
    <div class="f-der">
      <div class="tabs" role="tablist">${tabs.map(([k,t])=>`<button role="tab" aria-selected="${tab===k}" class="${tab===k?"on":""}" onclick="tabFicha('${k}')">${t}</button>`).join("")}</div>
      <div class="contenido">${cuerpoFicha(l,tab)}</div>
    </div>
  </div>`;
}

function cuerpoFicha(l,tab){
  const id=l.id, f=l.fields;
  if(tab==="resumen"){
    const sw=(campo,txt)=>`<button class="sw ${f[campo]==="Sí"?"on":""}" role="switch" aria-checked="${f[campo]==="Sí"}" onclick="marcar('${id}','${campo}','${f[campo]==="Sí"?"No":"Sí"}')"><span>${txt}</span><span class="pista"></span></button>`;
    const h=(t,v)=>`<div class="h"><small>${t}</small><b title="${esc(v||"")}">${esc(v||"—")}</b></div>`;
    return `<div class="tarjeta"><div class="hechos">
        ${h("Llamada con",llamadaCon(f.llamada_con))}${h("Grupo",f.grupo?"Grupo "+f.grupo:"")}
        ${f.inversion_meta?h("Meta por día",f.inversion_meta):h("Facturación",f.facturacion)}${h("Intentos",f.intentos||"0")}${h("Último contacto",f.ultimo_contacto?hace(f.ultimo_contacto):"")}
      </div></div>
      <div class="tarjeta"><h4>Seguimiento</h4><div class="switches">
        ${sw("confirmo_clase","Confirmó la clase")}${sw("recurso_enviado","Recurso enviado")}${sw("recurso_visto","Recurso visto")}
        ${sw("asistio","Asistió a la clase")}${sw("senal_compra","Señal de compra")}${sw("agendo","Agendó llamada")}${sw("facturacion_confirmada","Facturación confirmada")}${sw("se_presento","Se presentó")}
      </div></div>
      <div class="tarjeta"><h4>Notas del equipo</h4>
        <textarea id="nota" placeholder="Lo que tenga que saber el próximo que hable con este lead…" onfocus="EDITANDO=true">${esc(f.notas||"")}</textarea>
        <div style="margin-top:10px;display:flex;justify-content:flex-end"><button class="btn sm" onclick="accion('${id}','campos',{notas:$('#nota').value},'Notas guardadas')">Guardar notas</button></div></div>`;
  }
  if(tab==="dijo"){
    if(EDITANDO==="campos") return editorCampos(l);
    const d=(t,v)=>`<dt>${t}</dt><dd class="${v?"":"vacio-dd"}">${esc(v||"Sin dato")}</dd>`;
    return `<div class="tarjeta"><h4 style="display:flex;align-items:center">Formularios<button class="btn sm fantasma" style="margin-left:auto" onclick="EDITANDO='campos';pintarFicha()">${ic("i-editar")}Editar</button></h4><dl class="dl">
        ${d("Inversión diaria en Meta",f.inversion_meta)}${d("Facturación",f.facturacion)}${d("Ciclo de reposición",f.ciclo)}${d("Inversión disponible",f.inversion)}
        ${d("Objetivo a 6 meses",f.objetivo)}${d("Qué lo frena",f.freno)}${d("Hace cuánto y qué probó",f.hace_cuanto)}${d("Qué le falta",f.que_falta)}</dl></div>
      ${(()=>{const o=origenDe(f);return `<div class="tarjeta"><h4>De dónde vino</h4>${Object.keys(o).length?`<dl class="dl">
        ${d("Fuente",fuenteDe(o))}${d("Anuncio",o.utm_content||(o.ad_id?"ID "+o.ad_id:""))}${d("Conjunto",o.utm_term)}${d("Campaña",o.utm_campaign)}${d("Ubicación",o.utm_medium)}</dl>`:`<p style="color:var(--tx-3);font-size:13.5px">Sin datos de anuncio: entró sin parámetros en el link.</p>`}</div>`;})()}
      <div class="tarjeta"><h4>De las llamadas</h4><dl class="dl">
        ${d("Qué vende",f.que_vende)}${d("Por dónde vende",f.por_donde)}${d("Cuánto le queda",f.cuanto_queda)}${d("Dolor principal",f.dolor)}
        ${d("Por qué ahora",f.por_que_ahora)}${d("Objeción real",f.objecion)}${d("Le faltó de la clase",f.falto_clase)}${d("Le resonó del recurso",f.resono)}</dl></div>`;
  }
  if(tab==="venta") return cuerpoVenta(l);
  const full=COMPLETO[id];
  let hist=[];try{hist=JSON.parse(((full||{}).fields||{}).historial_json||"[]");}catch(e){}
  if(!full) return `<div class="tarjeta"><div class="esq" style="width:70%"></div><div class="esq" style="width:50%;margin-top:10px"></div><div class="esq" style="width:60%;margin-top:10px"></div></div>`;
  if(!hist.length) return `<div class="tarjeta"><div class="vacio" style="padding:30px"><b>Sin movimientos todavía</b>Cada acción sobre el lead queda registrada acá.</div></div>`;
  return `<div class="tarjeta"><div class="timeline">${hist.slice().reverse().map(e=>{
      const t=e.q==="Sistema"?"sis":e.q==="GHL"?"ghl":"per";
      return `<div class="ev ${t}"><div class="q"><b>${esc(e.q)}</b> · ${new Date(e.t).toLocaleString("es-AR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</div><div class="a">${esc(e.a)}</div></div>`;}).join("")}</div></div>`;
}

const hoyInput=()=>new Date().toLocaleDateString("en-CA");

        <div class="info"><b class="num">${usd(p.monto)}</b> · pago ${p.n} de ${vt.pagos.length}<small>${p.pagado?`Cobrado el ${new Date(p.fecha).toLocaleDateString("es-AR")}`:"Pendiente"}</small></div>
        ${p.comprobante?`<a class="btn sm" href="${esc(/^https?:/.test(p.comprobante)?p.comprobante:"/api/comprobante?path="+encodeURIComponent(p.comprobante))}" target="_blank">${ic("i-clip")}Ver comprobante</a>`
          :`<label class="btn sm" style="cursor:pointer">${ic("i-clip")}Adjuntar<input type="file" accept="image/*,application/pdf" style="display:none" onchange="subirComprobante('${id}',${p.n},this)"></label>`}
        <button class="btn sm ${p.pagado?"":"pri"}" onclick="accion('${id}','pago',{n:${p.n},pagado:${!p.pagado}},'${p.pagado?"Pago desmarcado":"Pago cobrado"}')">${p.pagado?"Desmarcar":"Marcar cobrado"}</button>
      </div>`).join("")}</div>
      <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="btn sm" onclick="editarVenta('${id}')">Editar pagos y nota</button><button class="btn sm fantasma peligro" onclick="anularVenta('${id}')">Anular venta</button></div></div>`;
}
function filaEdicion(p,i){
  return `<div class="pago ${p.pagado?"cobrado":""}" data-fila>
    <div class="marca-p">${i+1}</div>
    <div style="flex:1;min-width:120px"><label style="font-size:11.5px;color:var(--tx-3)">Monto (USD)</label><input data-monto type="number" min="1" step="0.01" inputmode="decimal" value="${p.monto||""}" onfocus="EDITANDO=true"></div>
    <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer"><input data-pagado type="checkbox" style="width:auto" ${p.pagado?"checked":""} onchange="const f=this.closest('[data-fila]');f.classList.toggle('cobrado',this.checked);const d=f.querySelector('[data-fecha]');if(this.checked&&!d.value)d.value=hoyInput();">Pagó</label>
    <div style="min-width:140px"><label style="font-size:11.5px;color:var(--tx-3)">Día que pagó</label><input data-fecha type="date" value="${p.pagado?diaInput(p.fecha):""}" onfocus="EDITANDO=true"></div>
    <button class="icon-btn" title="Quitar cuota" aria-label="Quitar cuota" onclick="quitarCuota(this)">${ic("i-x")}</button>
  </div>`;
}
function leerEdicion(){
  return [...document.querySelectorAll("#editPagos [data-fila]")].map(f=>({
    monto:Number(f.querySelector("[data-monto]").value),
    pagado:f.querySelector("[data-pagado]").checked,
    fecha:f.querySelector("[data-fecha]").value||null }));
}
function renumerarCuotas(){ document.querySelectorAll("#editPagos [data-fila] .marca-p").forEach((m,i)=>m.textContent=i+1); }
function agregarCuota(){
  const c=$("#editPagos"); c.insertAdjacentHTML("beforeend",filaEdicion({monto:"",pagado:false,fecha:null},c.children.length)); EDITANDO=true;
}
function quitarCuota(b){
  if(document.querySelectorAll("#editPagos [data-fila]").length<=1){toast("La venta tiene que tener al menos una cuota",true);return;}
  b.closest("[data-fila]").remove(); renumerarCuotas(); EDITANDO=true;
}
function editarVenta(id){ VENTA_EDIT=id; EDITANDO=true; pintarFicha(); }
function cancelarEdicionVenta(){ VENTA_EDIT=null; EDITANDO=false; pintarFicha(); }
async function guardarEdicionVenta(id){
  const pagos=leerEdicion();
  if(pagos.some(p=>!(p.monto>0))){toast("Cada cuota necesita un monto mayor a 0",true);return;}
  VENTA_EDIT=null;
  await accion(id,"editar_venta",{pagos,nota:$("#eNota").value},"Venta actualizada");
}
function registrarVenta(id){
  const data={oferta:VENTA_OF,forma:VENTA_FO,nota:($("#vNota")||{}).value||""};
  if(VENTA_FO==="Personalizado"){
    const total=Number($("#vTotal").value), n=parseInt($("#vCuotas").value,10);
    if(!(total>0)){toast("Poné el monto total de la venta",true);return;}
    if(!(n>=1&&n<=24)){toast("Las cuotas van de 1 a 24",true);return;}
    // Cuotas iguales; la última absorbe el redondeo para que sumen el total exacto.
    const base=Math.floor(total/n*100)/100;
    data.montos=Array.from({length:n},(_,i)=>i<n-1?base:Math.round((total-base*(n-1))*100)/100);
  }
  accion(id,"venta",data,"Venta registrada");
}
async function anularVenta(id){
  if(await confirmar("Anular la venta","El lead vuelve a «No cerró · seguimiento» y se borran sus pagos registrados.","Anular venta",true)) accion(id,"anular_venta",{},"Venta anulada");
}
function subirComprobante(id,n,input){
  const file=input.files[0];if(!file)return;
  if(file.size>8*1024*1024){toast("El archivo pasa los 8 MB",true);return;}
  toast("Subiendo comprobante…");
  const r=new FileReader();
  r.onload=async()=>{
    try{
      await api("/api/comprobante",{method:"POST",body:JSON.stringify({id,n,filename:file.name,contentType:file.type,dataBase64:r.result.split(",")[1]})});
      toast("Comprobante adjuntado");
      const d=await api("/api/lead?id="+encodeURIComponent(id)); COMPLETO[id]=d.lead;
      const i=DATA.leads.findIndex(l=>l.id===id); if(i>=0) DATA.leads[i]={...DATA.leads[i],...d.lead,calc:DATA.leads[i].calc};
      pintarFicha(); refrescar();
    }catch(e){toast(e.message,true);}
  };
  r.readAsDataURL(file);
}

/* ============================================================
   Atajos de teclado
   ============================================================ */
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ if($("#modal").classList.contains("on")) return; cerrarTodo(); }
  if(e.key==="/" && !/input|textarea|select/i.test(document.activeElement.tagName)){ e.preventDefault(); $("#busca").focus(); }
});

init();
</script>
</body>
</html>
