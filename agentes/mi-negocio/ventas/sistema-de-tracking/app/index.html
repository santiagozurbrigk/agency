<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Génesis · Ventas</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<script>
  // Tema antes de pintar, para que no parpadee.
  try { var t = localStorage.getItem("trk_tema"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
<style>
/* =====================================================================
   Sistema visual minimalista: casi monocromo, sin sombras ni cajas
   anidadas. El naranja solo marca la acción principal y lo activo; los
   estados se leen por un punto de color, no por píldoras rellenas.
   ===================================================================== */
:root{
  color-scheme:light;
  --naranja:#F26A1B; --naranja-2:#D9560C; --naranja-suave:rgba(242,106,27,.10);
  --marca-dato:#D9560C; --dato-2:#D6D3CE;
  --bg:#FFFFFF; --panel:#FFFFFF; --panel-2:#F6F6F5; --panel-3:#EDEDEB;
  --borde:#EEEEEC; --borde-2:#E0E0DD;
  --tx:#111112; --tx-2:#5C5C60; --tx-3:#9A9A9E;
  --ok:#1E8E4E; --ok-suave:rgba(30,142,78,.10);
  --warn:#B07400; --warn-suave:rgba(214,145,0,.10);
  --mal:#C2362B; --mal-suave:rgba(194,54,43,.09);
  --azul:#2F5BD3; --azul-suave:rgba(47,91,211,.09);
  --vio:#7A4FD1; --vio-suave:rgba(122,79,209,.09);
  --gris-suave:rgba(120,120,128,.10);
  --sombra:none;
  --sombra-2:0 24px 64px rgba(17,17,18,.16);
  --radio:10px; --radio-s:8px;
  --tit:"Inter Tight","Helvetica Neue",Arial,sans-serif;
  --txt:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --marca-dato:#E35F12; --dato-2:#3A3A3D;
    --bg:#0B0B0C; --panel:#0B0B0C; --panel-2:#161618; --panel-3:#202023;
    --borde:#1D1D20; --borde-2:#2B2B2F;
    --tx:#EDEDEC; --tx-2:#A3A3A6; --tx-3:#6C6C70;
    --ok:#3FC47A; --ok-suave:rgba(63,196,122,.12);
    --warn:#E8B23A; --warn-suave:rgba(232,178,58,.12);
    --mal:#F0705F; --mal-suave:rgba(240,112,95,.12);
    --azul:#7EA2FF; --azul-suave:rgba(126,162,255,.12);
    --vio:#B39BFF; --vio-suave:rgba(179,155,255,.12);
    --gris-suave:rgba(160,160,168,.12);
    --naranja-suave:rgba(242,106,27,.14);
    --sombra-2:0 24px 64px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --marca-dato:#E35F12; --dato-2:#3A3A3D;
  --bg:#0B0B0C; --panel:#0B0B0C; --panel-2:#161618; --panel-3:#202023;
  --borde:#1D1D20; --borde-2:#2B2B2F;
  --tx:#EDEDEC; --tx-2:#A3A3A6; --tx-3:#6C6C70;
  --ok:#3FC47A; --ok-suave:rgba(63,196,122,.12);
  --warn:#E8B23A; --warn-suave:rgba(232,178,58,.12);
  --mal:#F0705F; --mal-suave:rgba(240,112,95,.12);
  --azul:#7EA2FF; --azul-suave:rgba(126,162,255,.12);
  --vio:#B39BFF; --vio-suave:rgba(179,155,255,.12);
  --gris-suave:rgba(160,160,168,.12);
  --naranja-suave:rgba(242,106,27,.14);
  --sombra-2:0 24px 64px rgba(0,0,0,.7);
}

/* ===================== Base ===================== */
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.5 var(--txt);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--tit);font-weight:600;letter-spacing:-.015em;line-height:1.2}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
input,select,textarea{font:inherit;color:var(--tx);background:transparent;border:1px solid var(--borde-2);border-radius:var(--radio-s);padding:8px 10px;width:100%;transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--tx-3)}
select option{background:var(--bg);color:var(--tx)}
textarea{min-height:84px;resize:vertical}
:focus-visible{outline:2px solid var(--naranja);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg.ic{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* Botones: contorno fino por defecto; relleno solo en el principal */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 12px;border-radius:var(--radio-s);border:1px solid var(--borde-2);background:transparent;font-weight:500;font-size:13px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--panel-2)}
.btn.pri{background:var(--naranja);border-color:var(--naranja);color:#fff}
.btn.pri:hover{background:var(--naranja-2);border-color:var(--naranja-2)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn.fantasma{border-color:transparent}
.btn.peligro{color:var(--mal)}
.btn[disabled]{opacity:.5;pointer-events:none}
.sel{width:auto;max-width:150px;padding:0 24px 0 10px;text-overflow:ellipsis}
.icon-btn{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:8px;color:var(--tx-3)}
.icon-btn:hover{background:var(--panel-2);color:var(--tx)}

/* ===================== Login ===================== */
#login{position:fixed;inset:0;display:none;place-items:center;padding:20px;background:var(--bg);z-index:50}
.login-caja{width:min(360px,100%)}
.login-caja .marca{margin-bottom:36px}
.login-caja h1{font-size:22px;margin-bottom:6px}
.login-caja p{color:var(--tx-2);font-size:14px;margin-bottom:24px}
.campo{margin-bottom:14px}
.campo label{display:block;font-size:12.5px;font-weight:500;color:var(--tx-2);margin-bottom:6px}
.err{color:var(--mal);font-size:13px;margin-top:12px;display:none}

/* Marca */
.marca{display:flex;align-items:center;gap:10px;font-family:var(--tit);font-weight:700;letter-spacing:.14em;font-size:12.5px}
.marca svg{width:26px;height:26px}
.marca small{display:block;font-family:var(--txt);font-weight:400;letter-spacing:0;font-size:11.5px;color:var(--tx-3);margin-top:1px}

/* ===================== Layout ===================== */
#app{display:none;min-height:100%}
.lay{display:grid;grid-template-columns:228px 1fr;min-height:100vh}
aside.side{position:sticky;top:0;height:100vh;background:var(--bg);border-right:1px solid var(--borde);display:flex;flex-direction:column;padding:20px 10px 12px;overflow-y:auto}
/* Barras de scroll finas y del color del tema (la del sistema queda blanca en modo oscuro en Windows) */
*{scrollbar-width:thin;scrollbar-color:var(--borde-2) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--borde-2);border-radius:99px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--tx-3);background-clip:padding-box}
::-webkit-scrollbar-corner{background:transparent}
/* Menú lateral: la barra aparece solo al pasar el mouse */
aside.side{scrollbar-color:transparent transparent}
aside.side:hover{scrollbar-color:var(--borde-2) transparent}
aside.side::-webkit-scrollbar-thumb{background:transparent;background-clip:padding-box}
aside.side:hover::-webkit-scrollbar-thumb{background:var(--borde-2);background-clip:padding-box}
.side .marca{padding:0 10px 14px}
.side nav{display:flex;flex-direction:column;gap:1px;flex:1}
.side .grupo{font-size:11.5px;font-weight:500;color:var(--tx-3);padding:12px 10px 4px}
.side .item{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:7px;color:var(--tx-2);font-weight:450;text-align:left;width:100%;font-size:13.5px}
.side .item svg{color:var(--tx-3)}
.side .item:hover{background:var(--panel-2);color:var(--tx)}
.side .item.on{background:var(--panel-2);color:var(--tx);font-weight:550}
.side .item.on svg{color:var(--naranja)}
.side .item .n{margin-left:auto;font-size:12px;font-weight:500;min-width:18px;text-align:right;color:var(--tx-3);font-variant-numeric:tabular-nums}
.side .item.on .n{color:var(--tx)}
.side .pie{border-top:1px solid var(--borde);padding:12px 4px 0;margin-top:10px;display:flex;align-items:center;gap:8px}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:11.5px;flex:none;background:var(--panel-2);color:var(--tx-2)}
.avatar.lg{width:44px;height:44px;font-size:15px}
.avatar.b,.avatar.d{background:var(--panel-2);color:var(--tx-2)}
.pie .quien{flex:1;min-width:0;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pie .quien small{display:block;font-weight:400;color:var(--tx-3);font-size:11.5px;overflow:hidden;text-overflow:ellipsis}

main.cont{min-width:0;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:15;background:color-mix(in srgb, var(--bg) 90%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--borde);padding:10px 32px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.hamb{display:none}
.buscador{position:relative;flex:1;min-width:200px;max-width:380px}
.buscador input{padding-left:32px;height:34px;border-color:transparent;background:var(--panel-2)}
.buscador input:focus{border-color:var(--borde-2);background:transparent}
.buscador svg{position:absolute;left:10px;top:9px;color:var(--tx-3);width:16px;height:16px}
.buscador kbd{position:absolute;right:8px;top:8px;font:500 11px var(--txt);color:var(--tx-3);border:1px solid var(--borde-2);border-radius:4px;padding:0 5px}
.kpis{display:flex;gap:22px;flex-wrap:wrap}
.tema-btn{margin-left:auto;height:32px;border:0;color:var(--tx-2);padding:0 8px}
.tema-btn:hover{color:var(--tx)}
.aviso-btn.on{color:var(--naranja)}
.toast.nuevo{background:var(--naranja);color:#fff;cursor:pointer}
.kpi{display:flex;align-items:center;gap:10px;min-width:0}
.kpi .t{font-size:11.5px;color:var(--tx-3);font-weight:500;line-height:1.2}
.kpi .v{font-family:var(--tit);font-weight:600;font-size:14px;line-height:1.25;font-variant-numeric:tabular-nums}
.kpi .v span{color:var(--tx-3);font-weight:500;font-size:12.5px}
.meter{width:44px;height:3px;border-radius:99px;background:var(--panel-3);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--tx-2);transition:width .4s}
.kpi.alerta .v{color:var(--mal)}
.kpi.alerta .meter i{background:var(--mal)}

.pagina{padding:32px 32px 72px;max-width:1200px;width:100%}
.demo{display:flex;gap:8px;align-items:center;color:var(--tx-3);font-size:12.5px;margin-bottom:24px}
.demo svg.ic{width:15px;height:15px;color:var(--warn)}
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.ph h2{font-size:22px}
.ph p{color:var(--tx-3);margin-top:4px;max-width:680px;font-size:13.5px}
.ph .acc{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* Filtros: texto plano, el activo se subraya con un fondo suave */
.filtros{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.seg{display:inline-flex;gap:2px;flex-wrap:wrap}
.seg button{height:28px;padding:0 10px;border-radius:6px;font-size:13px;font-weight:500;color:var(--tx-3)}
.seg button:hover{color:var(--tx)}
.seg button.on{background:var(--panel-2);color:var(--tx)}
.filtros .cuenta{margin-left:auto;color:var(--tx-3);font-size:12.5px}

/* ===================== Lista de leads ===================== */
.lista{border-top:1px solid var(--borde)}
.fila{display:grid;grid-template-columns:minmax(220px,2.2fr) minmax(110px,1fr) minmax(150px,1.3fr) minmax(120px,1.6fr) auto;gap:16px;align-items:center;padding:13px 8px;border-bottom:1px solid var(--borde);cursor:pointer;transition:background .12s}
.fila:hover{background:var(--panel-2)}
.lista.con-reg .fila{grid-template-columns:minmax(200px,2fr) minmax(130px,1.2fr) minmax(100px,1fr) minmax(140px,1.3fr) minmax(110px,1.4fr) auto}
.fila.cab{cursor:default;font-size:12px;font-weight:500;color:var(--tx-3);padding-top:10px;padding-bottom:10px}
.fila.cab:hover{background:none}
.quien-l{display:flex;align-items:center;gap:12px;min-width:0}
.quien-l .nom{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quien-l .sub{color:var(--tx-3);font-size:12.5px;display:flex;align-items:center;gap:6px}
.pos{width:18px;text-align:right;color:var(--tx-3);font-size:12px;flex:none;font-variant-numeric:tabular-nums}
.fact{font-size:13px}
.fact small{display:block;color:var(--tx-3);font-size:12px}
.etiquetas{display:flex;gap:4px 12px;flex-wrap:wrap}
.btn.wa{color:#1e9e57;border-color:rgba(30,158,87,.35);text-decoration:none} @media (max-width:520px){.btn.wa .wa-t{display:none}} .btn.wa:hover{background:rgba(30,158,87,.08)} .btn.wa svg{width:14px;height:14px}
.acciones-f{display:flex;gap:4px;justify-content:flex-end}
@media (hover:hover) and (min-width:901px){.fila .acciones-f .btn:not(.wa):not(.rsp):not(.estado){opacity:0;transition:opacity .12s}.fila:hover .acciones-f .btn,.fila:focus-within .acciones-f .btn{opacity:1}}
/* Estado: punto de color + texto, sin relleno */
.badge{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;white-space:nowrap;color:var(--tx)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--tx-3)}
.badge.ok::before{background:var(--ok)} .badge.warn::before{background:var(--warn)} .badge.mal::before{background:var(--mal)}
.badge.azul::before{background:var(--azul)} .badge.vio::before{background:var(--vio)} .badge.nar::before{background:var(--naranja)}
/* Etiquetas secundarias: texto gris con ícono */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:450;color:var(--tx-3);white-space:nowrap}
.chip.ok{color:var(--ok)} .chip.warn{color:var(--warn)} .chip.mal{color:var(--mal)}
.chip.azul,.chip.vio{color:var(--tx-2)}
.chip svg.ic{width:13px;height:13px}
.chip.rsp{font-weight:600} .chip.rsp.r-jose{color:var(--azul)} .chip.rsp.r-manu{color:var(--naranja)}
select.sel.rsp{max-width:132px} select.sel.rsp.r-jose{color:var(--azul);border-color:var(--azul)} select.sel.rsp.r-manu{color:var(--naranja);border-color:var(--naranja)}
.col-etapa .badge{white-space:normal}
/* Asistentes de Zoom */
.lista.con-reg .fila.zf{grid-template-columns:minmax(200px,2fr) minmax(130px,1.1fr) minmax(120px,1fr) minmax(170px,1.4fr) minmax(100px,.9fr) auto}
.zbar{height:5px;border-radius:99px;background:var(--panel-2);margin-top:6px;overflow:hidden;max-width:140px}.zbar i{display:block;height:100%;background:var(--naranja)}
.fila.zs{grid-template-columns:minmax(160px,1.4fr) minmax(200px,1.6fr) 90px minmax(170px,1.3fr) minmax(100px,1fr)}
.zver-f{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.zver-f .t{display:block;font-size:12px;color:var(--tx-3)} .zver-f b{display:block;font-family:var(--tit);font-size:22px;font-weight:600;margin:2px 0}
.zver-f small{font-size:12.5px;color:var(--tx-3)} .zver-f small.ok{color:var(--ok)} .zver-f small.mal,.t-mal{color:var(--mal)}
.zver-n{font-size:13px;color:var(--tx-3);margin:10px 0 0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.zhitos{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}.zhitos label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--tx-3)}
.zhitos input{height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--borde-2);background:var(--bg);color:var(--tx);font:inherit;font-size:14px;width:150px}
.ztabla{width:100%;border-collapse:collapse;font-size:13.5px}.ztabla th{text-align:left;font-weight:500;color:var(--tx-3);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--borde)}
.ztabla td{padding:10px;border-bottom:1px solid var(--borde)}
.zpasos{margin:6px 0 0 18px;padding:0;font-size:14px;line-height:1.8}
@media (max-width:900px){.zver-f{grid-template-columns:1fr 1fr}.fila.zs{grid-template-columns:1fr 1fr}.fila.zs.cab{display:none}.lista.con-reg .fila.zf{grid-template-columns:1fr}}
select.sel.estado{max-width:150px} select.sel.estado.e-ok{color:var(--ok);border-color:var(--ok)} select.sel.estado.e-warn{color:var(--warn);border-color:var(--warn)}
select.sel.estado.e-azul{color:var(--azul);border-color:var(--azul)} select.sel.estado.e-mal{color:var(--mal);border-color:var(--mal)} select.sel.estado.e-otro{color:var(--tx);border-color:var(--tx-3)}
/* Filas con responsable y estado: los controles van en una segunda línea, a lo ancho */
.fila.con-resp .acciones-f{grid-column:1/-1;justify-content:flex-start;flex-wrap:wrap;padding-left:74px;margin-top:-4px}
@media (max-width:900px){.fila.con-resp,.lista.con-reg .fila.con-resp{grid-template-columns:1fr}.fila.con-resp .acciones-f{padding-left:44px;margin-top:0}}
select.sel.rsp,select.sel.estado{vertical-align:middle}
.toggle-pill.llam.on{background:var(--ok);border-color:var(--ok);color:#fff}
.toggle-pill.llam svg{width:14px;height:14px}
@media (max-width:520px){.toggle-pill.llam span{display:none}}
.apl-on{color:var(--ok);font-weight:500} .apl-on small{font-weight:400}
.apl-resp span,.apl-resp small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.apl-resp{min-width:0}
.vacio{padding:64px 24px;text-align:center;color:var(--tx-3);font-size:13.5px}
.vacio .circ{width:44px;height:44px;border-radius:50%;border:1px solid var(--borde-2);display:grid;place-items:center;margin:0 auto 14px;color:var(--tx-3)}
.vacio b{display:block;color:var(--tx);font-family:var(--tit);font-weight:600;font-size:15px;margin-bottom:4px}
.esq{height:12px;border-radius:4px;background:linear-gradient(90deg,var(--panel-2),var(--panel-3),var(--panel-2));background-size:200% 100%;animation:brillo 1.2s infinite}
@keyframes brillo{to{background-position:-200% 0}}
.bloque-tit{display:flex;align-items:center;gap:8px;margin:32px 0 8px;font-size:12.5px;font-weight:500;color:var(--tx-3)}
.bloque-tit .n{color:var(--tx-3)}

/* ===================== Ficha ===================== */
#velo{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#velo.on{opacity:1;pointer-events:auto}
#ficha{position:fixed;left:50%;top:50%;width:min(1100px,calc(100vw - 48px));height:min(860px,calc(100vh - 48px));background:var(--bg);border:1px solid var(--borde-2);border-radius:14px;z-index:31;transform:translate(-50%,-48%);opacity:0;pointer-events:none;transition:transform .2s cubic-bezier(.2,.8,.2,1),opacity .18s;display:flex;flex-direction:column;box-shadow:var(--sombra-2);overflow:hidden}
#ficha.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
.f-cab{position:relative;padding:24px 32px 0;flex:none}
.f-top{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;padding-right:40px}
.f-top .datos{flex:1;min-width:240px}
.f-top h3{font-size:20px;margin-bottom:4px}
.f-top .f-acc{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.f-top .contacto{display:flex;gap:14px;flex-wrap:wrap;color:var(--tx-3);font-size:13px}
.copiar{display:inline-flex;align-items:center;gap:5px;color:var(--tx-3);border-radius:5px;padding:1px 4px;margin:-1px -4px}
.copiar:hover{background:var(--panel-2);color:var(--tx)}

/* ===================== Modal y toast ===================== */
#modal{position:fixed;inset:0;display:none;place-items:center;z-index:60;padding:20px;background:rgba(0,0,0,.4)}
#modal.on{display:grid}
.modal-caja{width:min(420px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--bg);border:1px solid var(--borde-2);border-radius:12px;padding:22px;box-shadow:var(--sombra-2)}
.modal-caja h3{font-size:17px;margin-bottom:8px}
.modal-caja p{color:var(--tx-2);font-size:14px}
.modal-caja .acc{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}
.modal-caja.ancha{width:min(620px,100%)}
.fila.cli{grid-template-columns:minmax(200px,1.8fr) minmax(170px,1.3fr) minmax(110px,.9fr) minmax(150px,1.2fr) minmax(150px,1.3fr)}
.cal{border:1px solid var(--borde);border-radius:10px;overflow:auto;background:var(--bg)}
.cal-g{display:grid;grid-template-columns:52px repeat(7,minmax(118px,1fr));min-width:880px;position:relative}
.cal-d{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--borde);border-left:1px solid var(--borde);padding:8px 10px;font-size:12px;color:var(--tx-3)}
.cal-d b{display:block;font-size:17px;color:var(--tx);font-weight:600}
.cal-d.hoy b{color:var(--naranja)}
.cal-h{font-size:11px;color:var(--tx-3);text-align:right;padding:0 8px;transform:translateY(-7px)}
.cal-col{position:relative;border-left:1px solid var(--borde)}
.cal-col .linea{position:absolute;left:0;right:0;border-top:1px solid var(--borde)}
.cal-col.hoy{background:var(--panel-2)}
.cal-ev{position:absolute;left:4px;right:4px;border-radius:6px;padding:4px 7px;font-size:12px;line-height:1.3;overflow:hidden;cursor:pointer;border-left:3px solid var(--naranja);background:color-mix(in srgb,var(--naranja) 14%,var(--bg));color:var(--tx)}
.cal-ev.eq{border-left-color:var(--azul);background:color-mix(in srgb,var(--azul) 14%,var(--bg))}
.cal-ev.pre{border-left-style:dashed}
.cal-ev.ns{opacity:.55;text-decoration:line-through}
.cal-ev b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-ev small{color:var(--tx-2);font-size:11px}
.cal-ev:hover{filter:brightness(.97)}
.cal-ahora{position:absolute;left:0;right:0;border-top:2px solid var(--mal);z-index:1}
.cal-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.cal-nav .rango{font-weight:600;font-size:15px;margin:0 6px}
.cal-ley{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--tx-3);margin-left:auto}
.cal-ley i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.agenda-d{font-size:12.5px;font-weight:600;color:var(--tx-3);padding:14px 4px 6px;border-bottom:1px solid var(--borde)}
.agenda-d.hoy{color:var(--naranja)}
.agenda-e{display:flex;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--borde);cursor:pointer}
.agenda-e .hr{font-variant-numeric:tabular-nums;font-weight:600;width:48px;flex:none}
.agenda-e .barra-c{width:3px;align-self:stretch;border-radius:2px;background:var(--naranja);flex:none}
.agenda-e .barra-c.eq{background:var(--azul)}
.fila.post{grid-template-columns:minmax(210px,1.8fr) 70px minmax(150px,1fr) minmax(200px,1.6fr) minmax(120px,.9fr)}
@media (max-width:900px){.fila.post{grid-template-columns:1fr}.fila.post .col-post-x{display:none}}
.fase{border:1px solid var(--borde);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.fase.actual{border-color:var(--naranja);box-shadow:0 0 0 1px var(--naranja) inset}
.fase.hecha{opacity:.72}
.fase h5{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:10px}
.fase h5 .n{font-size:11px;color:var(--tx-3);font-variant-numeric:tabular-nums}
.fase h5 .quien{margin-left:auto;font-size:11px;font-weight:500;color:var(--tx-3)}
.fase .pista-txt{font-size:12.5px;color:var(--tx-3);margin:6px 0 10px}
.fase .fila-acc{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}

.vence-mal{color:var(--mal)!important} .vence-warn{color:var(--warn)!important}

#toasts{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:80;max-width:calc(100vw - 40px)}
.toast{display:flex;align-items:center;gap:10px;background:var(--tx);color:var(--bg);border-radius:8px;padding:10px 14px;font-size:13px;animation:entra .2s ease}
.toast.mal{background:var(--mal);color:#fff}
@keyframes entra{from{opacity:0;transform:translateY(8px)}}

/* ===================== Responsive ===================== */

  .fila{grid-template-columns:minmax(200px,2fr) minmax(100px,1fr) minmax(140px,1.3fr) auto}

}

  .f-cab{padding:18px 16px 0}

  .f-top .f-acc{justify-content:flex-start;width:100%;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .f-top .f-acc>*{flex:none}
  .f-cuerpo{display:flex;flex-direction:column;overflow:hidden}
  .f-izq{display:none}
  .f-der{border:0;flex:1}
  .f-der .contenido{padding:20px 16px}
  .tabs{padding:0 16px}
  .hechos{grid-template-columns:1fr 1fr}
  .switches{grid-template-columns:1fr}
  .dl{grid-template-columns:1fr;gap:2px}
  .dl dd{margin-bottom:10px}
  .form-g{grid-template-columns:1fr}
  .fila.clase{grid-template-columns:1fr auto auto;gap:8px}
  .fila.clase .toggle-pill span{display:none}
  .fu{grid-template-columns:110px 1fr 36px}
}
.movil{display:none;gap:4px 12px;flex-wrap:wrap;margin-top:6px}
@media (max-width:520px){ .opciones{grid-template-columns:1fr} .kpi .t{font-size:10.5px} .buscador kbd{display:none} }

<script>
/* ============================================================
   Estado
   ============================================================ */
let ME=null, DEMO=false, DATA=null, VISTA="ahora", FICHA_ID=null, FICHA_TAB="resumen", CARGANDO=false, EDITANDO=false;
const COMPLETO={};               // fichas completas (con historial), por id
let FILTRO_DUENO="todos";
try{ FILTRO_DUENO=localStorage.getItem("trk_dueno")||"todos"; VISTA=localStorage.getItem("trk_vista")||"ahora"; }catch(e){}
// /clientes abre directo la vista de clientes (el link se puede compartir).
if(location.pathname.replace(/\/+$/,"")==="/clientes") VISTA="clientes";

const $=s=>document.querySelector(s);
const esc=s=>{const d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML};
/* Tamaño del lead: inversión diaria en Meta (opt-in desde el 14-oct) o, en los leads viejos, la facturación. */
const tamano=f=>f.inversion_meta?f.inversion_meta+" por día":(f.facturacion||"");
const ic=(n,cls)=>`<svg class="ic ${cls||""}"><use href="#${n}"/></svg>`;

const SECCIONES=[
  {grupo:"Antes de la clase"},
  {id:"ahora", nombre:"Primer contacto", cola:"primerContacto", icono:"i-tel",
    sub:"Opt-ins sin contactar. Arriba los que califican para Génesis, después por facturación."},
  {id:"seg", nombre:"Seguimiento", cola:"seguimiento", icono:"i-seg",
    sub:"En cadencia, ruta a la clase y confirmados, hasta el lunes."},
  {grupo:"Clase"},
  {id:"clase", nombre:"Día de la clase", icono:"i-vivo",
    sub:"Marcá asistencia y señales de compra. Al terminar, armá los 3 grupos."},
  {id:"zoom", nombre:"Asistentes de la clase", corto:"Asistentes (Zoom)", icono:"i-asis",
    sub:"El informe de asistentes de Zoom cruzado con los opt-ins: quién vio cuánto y en qué momento se fue, para llamar sabiendo con quién hablás."},
  {id:"apl", nombre:"Aplicaciones", cola:"aplicaciones", icono:"i-clip",
    sub:"Los que completaron applygenesis.com/aplication, la más reciente arriba. Tocá una para ver todas las respuestas."},
  {grupo:"Después de la clase"},
  {id:"g1", nombre:"Grupo 1 · Agendó", cola:"grupo1", icono:"i-g1",
    sub:"Agendaron en la clase. Ordenados por facturación; la llamada ya tiene asignado Manu o el equipo."},
  {id:"g2", nombre:"Grupo 2 · Para llamar", corto:"Grupo 2 · Llamar", cola:"grupo2", icono:"i-g2",
    sub:"En orden de prioridad: completaron la agenda sin agendar, pidieron contacto (por facturación) y asistieron sin completar nada."},
  {id:"g3", nombre:"Grupo 3 · No asistió", cola:"grupo3", icono:"i-g3",
    sub:"Se anotaron y no aparecieron. Volver a meterlos con la repetición o el recurso."},

let AVISOS=false, CONOCIDOS=null, AUDIO=null, ULT_SONIDO=0;
try{AVISOS=localStorage.getItem("trk_avisos")==="1";}catch(e){}
function pintarAvisos(){

function ding(){
  try{
    AUDIO=AUDIO||new (window.AudioContext||window.webkitAudioContext)();
    if(AUDIO.state==="suspended") AUDIO.resume();
    const t=AUDIO.currentTime;
    [[880,0],[1318.5,0.13]].forEach(([f,d])=>{
      const o=AUDIO.createOscillator(), g=AUDIO.createGain();
      o.type="sine"; o.frequency.value=f; o.connect(g); g.connect(AUDIO.destination);
      g.gain.setValueAtTime(0.0001,t+d); g.gain.exponentialRampToValueAtTime(0.25,t+d+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+d+0.45);
      o.start(t+d); o.stop(t+d+0.5);
    });
  }catch(e){}
}
async function toggleAvisos(){
  AVISOS=!AVISOS;
  try{localStorage.setItem("trk_avisos",AVISOS?"1":"0");}catch(e){}
  if(AVISOS){

    if("Notification" in window && Notification.permission==="default"){try{await Notification.requestPermission();}catch(e){}}
    const n=("Notification" in window)?Notification.permission:"denied";
    toast(n==="granted"?"Avisos activos: sonido y notificación cuando entra un opt-in":"Avisos activos con sonido. Las notificaciones del navegador están bloqueadas: se pueden habilitar desde el candado de la barra de direcciones.");
  } else toast("Avisos desactivados");

}
function esOptin(l){return (l.tags||[]).includes("optin-19-10");}
function revisarNuevos(d){
  const optins=(d.leads||[]).filter(esOptin);
  if(CONOCIDOS===null){CONOCIDOS=new Set(optins.map(l=>l.id));return;}
  const nuevos=optins.filter(l=>!CONOCIDOS.has(l.id));
  nuevos.forEach(l=>CONOCIDOS.add(l.id));
  if(!nuevos.length||!AVISOS) return;
  const l=nuevos[0], fte=fuenteDe(origenDe(l.fields));
  const titulo=nuevos.length===1?"Nuevo opt-in":`${nuevos.length} opt-ins nuevos`;
  const cuerpo=nuevos.length===1?`${l.nombre||"Sin nombre"} · ${tamano(l.fields)||"sin facturación"} · ${fte}`:nuevos.slice(0,3).map(x=>x.nombre||"Sin nombre").join(", ")+(nuevos.length>3?"…":"");
  if(Date.now()-ULT_SONIDO>4000){ding();ULT_SONIDO=Date.now();}
  const el=document.createElement("div");el.className="toast nuevo";el.innerHTML=ic("i-campana")+`<span><b>${esc(titulo)}</b> · ${esc(cuerpo)}</span>`;
  el.onclick=()=>{el.remove();if(nuevos.length===1)abrirFicha(l.id);else ir("ahora");};
  $("#toasts").appendChild(el);setTimeout(()=>el.remove(),9000);
  if(document.visibilityState!=="visible"&&"Notification" in window&&Notification.permission==="granted"){
    try{const n=new Notification(titulo,{body:cuerpo,icon:"/favicon.svg",tag:"optin"});n.onclick=()=>{window.focus();n.close();if(nuevos.length===1)abrirFicha(l.id);else ir("ahora");};}catch(e){}
  }
}

// VERSION_LOCAL sube con cada cambio hecho desde esta pantalla. Si un refresco salió
// antes de un cambio, su respuesta trae datos viejos: se descarta y se vuelve a pedir.
let VERSION_LOCAL=0, OTRO_REFRESCO=false;
async function refrescar(){
  if(CARGANDO){ OTRO_REFRESCO=true; return; }
  CARGANDO=true;
  const v=VERSION_LOCAL;
  let vieja=false;
  try{
    const d=await api("/api/leads");
    if(v!==VERSION_LOCAL){ vieja=true; return; }
    DATA=d;
    revisarNuevos(d);
    pintarKpis(); pintarNav();
    // Métricas y Anuncios traen sus propios datos: se actualizan en el lugar, sin volver arriba.
    if(!EDITANDO) render({silencioso:true});
    if(FICHA_ID && !EDITANDO) pintarFicha();
  }catch(e){ if(e.message!=="Sesión vencida") toast(e.message,true); }
  finally{
    CARGANDO=false;
    if(vieja||OTRO_REFRESCO){ OTRO_REFRESCO=false; setTimeout(refrescar,250); }
  }
}

  if(salvo!=="intentos"&&FSEG.intentos!=="todos"&&(FSEG.intentos==="3+"?n<3:n!==+FSEG.intentos)) return false;
  if(salvo!=="frio"&&FSEG.frio&&!frio(l)) return false;

// Hora del registro en hora de Argentina: "hoy 14:32", "ayer 09:10" o "12/10 14:32".
function horaRegistro(iso){
  if(!iso) return "—";
  const d=new Date(iso), ar=t=>new Date(t-3*3600e3).toISOString();
  const dia=ar(d.getTime()).slice(0,10), hh=ar(d.getTime()).slice(11,16);
  if(dia===ar(Date.now()).slice(0,10)) return "hoy "+hh;
  if(dia===ar(Date.now()-864e5).slice(0,10)) return "ayer "+hh;
  const p=dia.split("-");return `${+p[2]}/${+p[1]} ${hh}`;
}

function lista(ids,opts){

let ZOOM=null, ZOOM_CARGANDO=false, ZTAB="primero";

const INV_ORDEN=["Más de 1.000 dólares","De 500 a 1.000 dólares","De 200 a 500 dólares","De 100 a 200 dólares","Menos de 100 dólares","0, todavía no tengo marca"];
const FACT_ORDEN_C=["Más de 100M","Entre 50M y 100M","Entre 30M y 50M","Entre 10M y 30M","Menos de 10M"];
const tramoDe=f=>f.inversion_meta||f.facturacion||"Sin dato";
function rangoTramo(f){const i=INV_ORDEN.indexOf(f.inversion_meta);if(i>=0)return i;const j=FACT_ORDEN_C.indexOf(f.facturacion);return j>=0?[0,1,3,4,5][j]:99;}
function zoomDe(l){try{return l.fields.zoom_json?JSON.parse(l.fields.zoom_json):null;}catch(e){return null;}}
function cargarZoom(){if(ZOOM_CARGANDO)return;ZOOM_CARGANDO=true;api("/api/zoom").then(d=>{ZOOM=d.zoom||{};}).catch(()=>{ZOOM={};}).finally(()=>{ZOOM_CARGANDO=false;if(VISTA==="zoom")render();});}
function hitosZ(){return (ZOOM&&ZOOM.hitos)||{};}
// Minuto (desde el inicio real de la sesión) en que se abrió la puerta: por defecto, la hora de la clase.
function aperturaMin(){
  if(!ZOOM||!ZOOM.inicio)return null;
  const hh=hitosZ().apertura||((DATA&&DATA.settings&&DATA.settings.clase)||"").slice(11,16)||"19:00";
  const dia=new Date(ZOOM.inicio-3*3600e3).toISOString().slice(0,10);
  return Math.round((new Date(`${dia}T${hh}:00-03:00`).getTime()-ZOOM.inicio)/60000);
}
function salidaZ(z){
  const h=hitosZ();
  if(z.f) return {t:"Se quedó hasta el final",k:"ok"};
  if(h.precio!=null&&z.s>=h.precio) return {t:"Se fue después del precio",k:"warn"};
  if(h.oferta!=null&&z.s>=h.oferta) return {t:"Se fue durante la oferta",k:"azul"};
  if(h.oferta!=null) return {t:"Se fue antes de la oferta",k:""};
  return {t:`Se fue en el minuto ${z.s}`,k:""};
}

async function importarZoom(input){

  else if(ZTAB==="sinid") h+=`<p class="zver-n">Entraron a Zoom pero no se pudieron cruzar con ningún opt-in: se registraron con otro mail, o el nombre es incompleto o se repite. No se adivina: mejor sin identificar que un teléfono equivocado.</p>`+(sinId.length?`<div class="lista"><div class="fila cab zs"><div>Nombre en Zoom</div><div>Mail</div><div>Minutos</div><div>En qué momento se fue</div><div>Veces · país</div></div>${sinId.slice().sort((a,b)=>b.m-a.m).map(x=>{const sal=salidaZ({f:x.f,s:x.s});return `<div class="fila zs" style="cursor:default"><div class="nom">${esc(x.n||"(sin nombre)")}</div><div class="fact">${x.e?`<button class="copiar" onclick="copiar('${esc(x.e)}',event)">${esc(x.e)}${ic("i-copiar")}</button>`:"—"}</div><div class="fact num">${x.m} min</div><div><span class="chip ${sal.k}">${esc(sal.t)}</span></div><div class="fact">${x.v} ${x.v===1?"vez":"veces"}<small>${esc(x.p||"")}</small></div></div>`;}).join("")}</div>`:vacio("Todos identificados"));
  else {
    // Resumen por tramo de calificación
    const tramos=new Map();
    const base=DATA.leads.filter(l=>esOptin(l)||zoomDe(l));
    for(const l of base){const t=tramoDe(l.fields);if(!tramos.has(t))tramos.set(t,{t,r:rangoTramo(l.fields),reg:0,asis:[]});const o=tramos.get(t);if(esOptin(l))o.reg++;if(zoomDe(l))o.asis.push(zoomDe(l));}
    const filas=[...tramos.values()].sort((a,b)=>a.r-b.r).map(o=>{
      const n=o.asis.length, prom=n?Math.round(o.asis.reduce((s,z)=>s+z.m,0)/n):0, mas60=o.asis.filter(z=>z.m>=60).length;
      const cnt={};o.asis.forEach(z=>{const k=salidaZ(z).t;cnt[k]=(cnt[k]||0)+1;});
      const moda=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
      return `<tr><td>${esc(o.t)}</td><td class="num">${o.reg}</td><td class="num">${n}</td><td class="num">${o.reg?Math.round(n/o.reg*100)+"%":"—"}</td><td class="num">${n?prom+" min":"—"}</td><td class="num">${mas60}</td><td>${moda?esc(moda[0])+` <small style="color:var(--tx-3)">(${moda[1]})</small>`:"—"}</td></tr>`;}).join("");
    // Minuto en que se fue más gente (excluye el final)
    const porMin={};asis.map(zoomDe).filter(z=>!z.f).forEach(z=>{const b=Math.floor(z.s/5)*5;porMin[b]=(porMin[b]||0)+1;});
    const pico=Object.entries(porMin).sort((a,b)=>b[1]-a[1])[0];
    h+=`<div class="tarjeta" style="overflow-x:auto"><table class="ztabla"><thead><tr><th>Tramo</th><th>Registrados</th><th>Asistieron</th><th>% asistencia</th><th>Minutos promedio</th><th>60 min o más</th><th>La mayoría…</th></tr></thead><tbody>${filas}</tbody></table>
      ${pico?`<p class="zver-n" style="margin-top:12px">La mayor cantidad de gente se fue entre el minuto <b>${pico[0]}</b> y el <b>${+pico[0]+5}</b> (${pico[1]} personas). ${asis.filter(l=>zoomDe(l).f).length} se quedaron hasta el final.</p>`:""}</div>`;
  }
  v.innerHTML=h;
}

const INV_APL=["Menos de USD 1.000","Entre USD 1.000 y USD 3.000","Entre USD 3.000 y USD 6.000","Más de USD 6.000"];
const FACT_ALTA=new Set(["Entre 30M y 50M","Entre 50M y 100M","Más de 100M"]);
// Filtro por la respuesta a «¿con cuánto contás hoy para invertir?»: "todas" o el índice de la opción.

    <div class="col-fact fact${FACT_ALTA.has(f.facturacion)?" apl-on":""}">${esc(f.facturacion||"—")}<small>${esc(f.ciclo||"")}</small></div>

  </div>`;

  h+=`<div class="lista"><div class="fila cab"><div>Lead</div><div class="col-fact">Oferta</div><div class="col-etapa">Cobro</div><div class="col-etq">Vendió</div><div></div></div>`;
  for(const {l,v:vt} of filas){
    const pag=vt.pagos.filter(p=>p.pagado).length, cob=suma(vt.pagos.filter(p=>p.pagado).map(p=>p.monto)), tot=suma(vt.pagos.map(p=>p.monto));
    const sinComp=vt.pagos.filter(p=>p.pagado&&!p.comprobante).length;

      <div class="col-etq etiquetas"><span class="chip">${esc(vt.vendedor)}</span>${sinComp?`<span class="chip warn">${ic("i-clip")}${sinComp} sin comprobante</span>`:""}</div>
      <div></div></div>`;

  v.innerHTML=h+`</div>`;
}

/* ---------- Llamadas · calendario ---------- */
// Semana de lunes a domingo con las citas de los 3 calendarios de GHL (horario real).
// En el celular se muestra como agenda: día por día, en orden.
let LLVISTA="lista", CAL_SEM=0, CAL={clave:null,citas:null,cargando:false,error:null,t:0};
try{LLVISTA=localStorage.getItem("trk_llvista")||"lista";}catch(e){}
const CAL_H0=8, CAL_H1=23, CAL_PX=56; // de 8 a 23 hs, 56 px por hora
function botonesLlam(){
  return `<div class="seg"><button class="${LLVISTA==="lista"?"on":""}" onclick="setLlvista('lista')">Lista</button><button class="${LLVISTA==="cal"?"on":""}" onclick="setLlvista('cal')">Calendario</button></div>`;
}
function setLlvista(v){LLVISTA=v;try{localStorage.setItem("trk_llvista",v);}catch(e){}render();}
// Lunes 00:00 (hora local) de la semana actual + n semanas.
function lunes(n){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)+7*n);return d;}
function moverSemana(n){CAL_SEM=n===0?0:CAL_SEM+n;render();}
function cargarCitas(desde,hasta,silencioso){
  const clave=desde+"|"+hasta;
  if(CAL.cargando) return;
  if(CAL.clave!==clave){CAL.citas=null;CAL.error=null;CAL.t=0;}
  CAL.clave=clave; CAL.cargando=true;
  api(`/api/calendario?desde=${desde}&hasta=${hasta}`).then(d=>{if(CAL.clave===clave){CAL.citas=d.citas;CAL.error=null;CAL.t=Date.now();}})
    .catch(e=>{if(CAL.clave===clave&&!CAL.citas)CAL.error=e.message;})
    .finally(()=>{CAL.cargando=false;if(VISTA==="llam"&&LLVISTA==="cal"&&!EDITANDO)render({silencioso:true});});
}
const hhmm=d=>d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit",hour12:false});
function renderCalendario(v,s,op){
  const ini=lunes(CAL_SEM), fin=new Date(ini); fin.setDate(fin.getDate()+7);
  const clave=ini.getTime()+"|"+fin.getTime();
  // Se vuelven a pedir al cambiar de semana o si tienen más de 30 s.
  if(CAL.clave!==clave||!CAL.citas||Date.now()-CAL.t>30000) cargarCitas(ini.getTime(),fin.getTime());
  const dias=Array.from({length:7},(_,i)=>{const d=new Date(ini);d.setDate(d.getDate()+i);return d;});
  const hoy=new Date().toDateString();
  const fmt=d=>d.toLocaleDateString("es-AR",{day:"numeric",month:"short"});
  let h=encabezado(s,botonesLlam());
  h+=`<div class="cal-nav"><button class="btn sm" onclick="moverSemana(-1)" aria-label="Semana anterior">‹</button><button class="btn sm" onclick="moverSemana(0)">Hoy</button><button class="btn sm" onclick="moverSemana(1)" aria-label="Semana siguiente">›</button>
    <span class="rango">${fmt(dias[0])} – ${fmt(dias[6])}</span>${CAL.cargando&&CAL.citas?`<span style="font-size:12px;color:var(--tx-3)">actualizando…</span>`:""}
    <span class="cal-ley"><span><i style="background:var(--naranja)"></i>Manu</span><span><i style="background:var(--azul)"></i>Jose / equipo</span><span><i style="border:1.5px dashed var(--tx-3)"></i>Pre-venta</span></span></div>`;
  if(CAL.error){v.innerHTML=h+`<div class="tarjeta"><b>No pudimos traer las citas</b><p style="color:var(--tx-3);font-size:13.5px">${esc(CAL.error)}</p></div>`;return;}
  if(!CAL.citas){v.innerHTML=h+esqueleto();return;}
  // El color sale del responsable de la ficha (Jose o Manu); sin responsable, del calendario donde agendó.
  const quienDe=c=>{const l=c.leadId&&lead(c.leadId);return (l&&l.fields.responsable)||c.con;};
  const citas=CAL.citas.map(c=>({...c,quien:quienDe(c),d:new Date(c.inicio),f:c.fin?new Date(c.fin):new Date(new Date(c.inicio).getTime()+45*60000)}));
  const del=d=>citas.filter(c=>c.d.toDateString()===d.toDateString());
  const titulo=c=>`${c.nombre} · ${hhmm(c.d)}–${hhmm(c.f)} · ${c.tipo} con ${c.quien}${c.noShow?" · no se presentó":""}`;
  const abrir=c=>c.leadId?`onclick="abrirFicha('${c.leadId}','resumen')"`:"";
  if(matchMedia("(max-width:900px)").matches){
    let a="";
    for(const d of dias){
      const cs=del(d); if(!cs.length&&d.toDateString()!==hoy) continue;
      a+=`<div class="agenda-d ${d.toDateString()===hoy?"hoy":""}">${d.toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"})}</div>`;
      a+=cs.length?cs.map(c=>`<div class="agenda-e" ${abrir(c)}><span class="barra-c ${c.quien==="Manu"?"":"eq"}"></span><span class="hr">${hhmm(c.d)}</span><div style="min-width:0;flex:1"><b style="font-weight:500">${esc(c.nombre)}</b><div style="font-size:12.5px;color:var(--tx-3)">${hhmm(c.d)}–${hhmm(c.f)} · ${esc(c.tipo)} con ${esc(c.quien)}${c.noShow?" · no se presentó":""}</div></div>${waLink(c.telefono)?`<a class="btn sm wa" href="${waLink(c.telefono)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${ic("i-wa")}</a>`:""}</div>`).join("")
        :`<div class="agenda-e" style="cursor:default;color:var(--tx-3)">Sin llamadas</div>`;
    }
    v.innerHTML=h+(citas.length?a:`<div class="vacio"><div class="circ">${ic("i-llam")}</div><b>No hay llamadas esta semana</b>Pasá a la semana siguiente o volvé a la lista.</div>`);
    return;
  }
  // Rango de horas: 8 a 23, ampliado si hay citas fuera.
  let h0=CAL_H0,h1=CAL_H1;
  for(const c of citas){h0=Math.min(h0,c.d.getHours());h1=Math.max(h1,Math.ceil(c.f.getHours()+c.f.getMinutes()/60));}
  const alto=(h1-h0)*CAL_PX, y=d=>((d.getHours()+d.getMinutes()/60)-h0)*CAL_PX;
  let g=`<div class="cal-g"><div class="cal-d" style="border-left:0"></div>${dias.map(d=>`<div class="cal-d ${d.toDateString()===hoy?"hoy":""}">${d.toLocaleDateString("es-AR",{weekday:"short"})}<b>${d.getDate()}</b></div>`).join("")}`;
  g+=`<div style="position:relative;height:${alto}px">${Array.from({length:h1-h0},(_,i)=>`<div class="cal-h" style="position:absolute;top:${i*CAL_PX}px;right:0">${i?String(h0+i).padStart(2,"0")+":00":""}</div>`).join("")}</div>`;
  for(const d of dias){
    const esHoy=d.toDateString()===hoy;
    g+=`<div class="cal-col ${esHoy?"hoy":""}" style="height:${alto}px">${Array.from({length:h1-h0},(_,i)=>`<div class="linea" style="top:${i*CAL_PX}px"></div>`).join("")}`;
    if(esHoy){const n=new Date();if(n.getHours()>=h0&&n.getHours()<h1)g+=`<div class="cal-ahora" style="top:${y(n)}px"></div>`;}
    // Citas superpuestas: se reparten el ancho de la columna.
    const cs=del(d); const carril=[]; 
    for(const c of cs){let k=0;while(carril[k]&&carril[k]>c.d)k++;carril[k]=c.f;c.k=k;}
    for(const c of cs){
      const n=Math.max(1,...cs.filter(o=>o.d<c.f&&o.f>c.d).map(o=>o.k+1));
      const top=y(c.d), hgt=Math.max(24,y(c.f)-top-2);
      g+=`<div class="cal-ev ${c.quien==="Manu"?"":"eq"} ${c.tipo==="Pre-venta"?"pre":""} ${c.noShow?"ns":""}" style="top:${top}px;height:${hgt}px;left:calc(${c.k/n*100}% + 4px);right:auto;width:calc(${100/n}% - 8px)" title="${esc(titulo(c))}" ${abrir(c)}>
        <b>${esc(c.nombre)}</b><small>${hhmm(c.d)}–${hhmm(c.f)} · ${esc(c.quien)}${c.tipo==="Pre-venta"?" · pre-venta":""}</small></div>`;
    }
    g+=`</div>`;
  }
  g+=`</div>`;
  const previo=$("#calScroll"), scrollPrevio=previo?previo.scrollTop:null;
  v.innerHTML=h+`<div class="cal" id="calScroll" style="max-height:calc(100vh - 260px)">${g}</div>`+(citas.length?"":`<p style="color:var(--tx-3);font-size:13px;margin-top:10px">No hay llamadas agendadas esta semana.</p>`);
  // Al abrir una semana: scroll a la primera cita (o a las 9). En los refrescos se queda donde estaba.
  const sc=$("#calScroll");
  if(CAL.scrollClave!==clave||scrollPrevio==null){CAL.scrollClave=clave;const pri=citas.length?Math.min(...citas.map(c=>y(c.d))):y(new Date(2000,0,1,9));sc.scrollTop=Math.max(0,pri-CAL_PX/2);}
  else sc.scrollTop=scrollPrevio;
}

const ESTADOS_POST=["Nuevo lead","No atendió","Agendado","No se cerró","Cliente · falta onboarding","Cliente"];
const TONO_POST={"Nuevo lead":"","No atendió":"warn","Agendado":"nar","No se cerró":"mal","Cliente · falta onboarding":"azul","Cliente":"ok"};
const OFERTAS_POST=["Génesis","OS Fast","Subscriptions"];
const TILDES_POST={
  recursos:[["vsl","R1 · VSL de su oferta"],["testimonio","R2 · Testimonio de su oferta"],["doc","R3 · Documento a medida"]],
  handoff:[["manu","Audio de Manu presentando al closer"],["closer","Audio del closer: confirma día y hora"]],

  onboarding:[["bienvenida","Mensaje de bienvenida en el grupo"],["discord","Link al Discord"],["skool","Acceso al campus viejo en Skool"],["canal","Canal 1 a 1 en Discord"]]};
let FPOST={estado:"todos",sdr:"todos"};
try{FPOST=Object.assign(FPOST,JSON.parse(localStorage.getItem("trk_fpost")||"{}"));}catch(e){}
function setFpost(k,v){FPOST[k]=v;try{localStorage.setItem("trk_fpost",JSON.stringify(FPOST));}catch(e){}render();}
function badgePost(e){return `<span class="badge ${TONO_POST[e]||""}">${esc(e)}</span>`;}
function procesoDe(l){
  let p={};try{p=JSON.parse(l.fields.post_json||"{}")||{};}catch(e){}
  p.llamadas=p.llamadas||[];p.seguimientos=p.seguimientos||[];
  for(const k of ["recursos","handoff","recordatorios","onboarding","cierre"]) p[k]=p[k]||{};
  return p;
}
const sdrDe=(l)=>l.fields.sdr||"";
function agendaComo(l){
  const n=String(l.nombre||"").trim().split(/\s+/)[0]||"Lead";
  const r=String(l.fields.inversion||l.fields.facturacion||"").replace(/^Entre\s+/i,"").replace(/USD\s*/gi,"").replace(/\s+y\s+/i," a ").replace(/\./g,"").trim();
  return r?`${n} / ${r}`:n;
}
function grupoComo(l,callAt){
  const n=String(l.nombre||"").trim().split(/\s+/)[0]||"Lead";
  if(!callAt) return n;
  const d=new Date(callAt); if(isNaN(d)) return n;
  const h=d.toLocaleTimeString("es-AR",{timeZone:"America/Argentina/Buenos_Aires",hour:"numeric",minute:"2-digit",hour12:false}).replace(/:00$/,"");
  const dm=d.toLocaleDateString("es-AR",{timeZone:"America/Argentina/Buenos_Aires",day:"numeric",month:"numeric"});
  return `${n} / ${h}hs / ${dm}`;
}
const fechaCorta=iso=>iso?new Date(iso).toLocaleString("es-AR",{timeZone:"America/Argentina/Buenos_Aires",weekday:"short",day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit"}):"";
const todosHechos=(o,lista)=>lista.every(([k])=>o[k]);
// Fase en la que está (1 a 7) y lo próximo que hay que hacer.
function proximoPost(l){
  const e=l.fields.post_estado||"Nuevo lead", p=procesoDe(l);
  const sinResp=p.llamadas.filter(x=>!x.atendio).length, atendio=p.llamadas.some(x=>x.atendio);
  if(e==="Cliente") return {fase:8,txt:"Onboarding terminado"};
  if(e==="Cliente · falta onboarding") return {fase:7,txt:"Onboarding: "+(TILDES_POST.onboarding.find(([k])=>!p.onboarding[k])||[0,"pasar a Cliente"])[1]};
  if(e==="No se cerró") return {fase:6,txt:"No se cerró"+(p.cierre.razon?": "+p.cierre.razon:"")};
  if(e==="Agendado"){
    if(!p.confirmo) return {fase:3,txt:"Setteo: que confirme día y hora"};
    if(!p.grupo||!todosHechos(p.recursos,TILDES_POST.recursos)) return {fase:3,txt:"Grupo y recursos"};
    if(!todosHechos(p.handoff,TILDES_POST.handoff)) return {fase:4,txt:"Handoff al closer"};
    if(p.call_at&&new Date(p.call_at)>new Date()) return {fase:5,txt:"Call "+fechaCorta(p.call_at)};
    return {fase:6,txt:"Cierre: ¿se cerró?"};
  }
  if(e==="No atendió") return {fase:1,txt:`Seguimiento #${p.seguimientos.length+1}`};
  if(atendio) return {fase:2,txt:"Calificar y agendar con el closer"};
  return {fase:1,txt:sinResp?`Llamar de nuevo (${sinResp} de 3 sin respuesta)`:"Primera llamada"};
}

      <div><span class="chip">${esc(sdrDe(l)||"—")}</span></div>
      <div>${badgePost(est(l))}</div>
      <div class="fact">${pr.fase<=7?`<small style="display:inline">Fase ${pr.fase} · </small>`:""}${esc(pr.txt)}</div>
      <div class="col-post-x fact"><small>${l.fields.aplico_at?hace(l.fields.aplico_at):"—"}</small></div>

  // 07 · Onboarding
  h+=fase(7,"Onboarding","Mati / Santi (cuenta de Manu)",
    `<div class="pista-txt">El campus nuevo y el plan de la mentoría arrancan el 1/11. Mientras tanto, acceso al campus viejo en Skool.</div>`+
    TILDES_POST.onboarding.map(([k,t])=>swPost(id,"onboarding",k,!!p.onboarding[k],t,e!=="Cliente · falta onboarding"&&e!=="Cliente")).join("")+
    (e==="Cliente · falta onboarding"?`<div class="fila-acc"><button class="btn sm pri" onclick="postAcc('${id}','estado',{estado:'Cliente'},'Pasó a Cliente')">${ic("i-check")}Onboarding terminado: pasar a Cliente</button></div>`:""));
  return h;
}

/* ---------- Clientes ---------- */
// Cada cliente es un lead con la venta registrada. Las cuotas tienen vencimiento:
// la primera el día del cierre y las siguientes, un mes después cada una (se editan en la ficha).
let FCLI="todos";
const DIA_MS=86400000;
function diasHasta(iso){ if(!iso) return null; const d=new Date(diaInput(iso)+"T12:00:00"), h=new Date(hoyInput()+"T12:00:00"); return Math.round((d-h)/DIA_MS); }
function proximoPago(vt){ return (vt.pagos||[]).filter(p=>!p.pagado).sort((a,b)=>String(a.vence||"9").localeCompare(String(b.vence||"9")))[0]||null; }
function estadoCliente(vt){
  const pend=(vt.pagos||[]).filter(p=>!p.pagado);
  if(!pend.length) return "pago";
  const prox=proximoPago(vt), d=diasHasta(prox&&prox.vence);
  if(d!=null&&d<0) return "vencido";
  if(d!=null&&d<=7) return "pronto";
  return "al-dia";
}
function textoVence(p){
  if(!p.vence) return "Sin vencimiento";
  const d=diasHasta(p.vence), f=new Date(p.vence).toLocaleDateString("es-AR");
  if(d<0) return `Venció el ${f} · hace ${-d} día${d===-1?"":"s"}`;
  if(d===0) return `Vence hoy (${f})`;
  return `Vence el ${f} · en ${d} día${d===1?"":"s"}`;
}
const claseVence=p=>{const d=diasHasta(p.vence);return d==null?"":d<0?"vence-mal":d<=7?"vence-warn":"";};
function setFcli(f){FCLI=f;render();}
function clientes(){
  if(!DATA) return [];
  return DATA.colas.ventas.map(lead).filter(Boolean).map(l=>({l,v:venta(l)})).filter(x=>x.v)
    .sort((a,b)=>String(b.v.fecha).localeCompare(String(a.v.fecha)));
}
function renderClientes(v,s){
  const acc=`<button class="btn sm" onclick="exportarClientes()">Exportar CSV</button><button class="btn sm pri" onclick="altaCliente()">${ic("i-mas")}Agregar cliente</button>`;
  if(!DATA){v.innerHTML=encabezado(s,acc)+esqueleto();return;}
  const todos=clientes();
  const pend=x=>x.v.pagos.filter(p=>!p.pagado);
  const vencidas=todos.flatMap(x=>pend(x).filter(p=>(diasHasta(p.vence)??1)<0));
  const total=sumaM(todos.map(x=>sumaM(x.v.pagos.map(p=>p.monto))));
  const cobrado=sumaM(todos.map(x=>sumaM(x.v.pagos.filter(p=>p.pagado).map(p=>p.monto))));
  let h=encabezado(s,acc);
  h+=`<div class="tiles">
    <div class="tile"><div class="t">Clientes</div><div class="v num">${todos.length}</div><div class="s">${todos.filter(x=>x.v.oferta==="Génesis").length} Génesis · ${todos.filter(x=>x.v.oferta==="Mentoría").length} Mentoría</div></div>
    <div class="tile"><div class="t">Cobrado</div><div class="v num">${usd(cobrado)}</div><div class="meter"><i style="width:${total?cobrado/total*100:0}%;background:var(--ok)"></i></div></div>
    <div class="tile"><div class="t">Por cobrar</div><div class="v num">${usd(total-cobrado)}</div></div>
    <div class="tile"><div class="t">Cuotas vencidas</div><div class="v num ${vencidas.length?"vence-mal":""}">${vencidas.length}</div><div class="s">${usd(sumaM(vencidas.map(p=>p.monto)))}</div></div></div>`;
  const FILTROS=[["todos","Todos",todos.length],["vencido","Con cuota vencida"],["pronto","Vence en 7 días"],["al-dia","Al día"],["pago","Pagaron todo"]];
  h+=`<div class="filtros"><div class="seg">${FILTROS.map(([k,t])=>{const n=k==="todos"?todos.length:todos.filter(x=>estadoCliente(x.v)===k).length;return `<button class="${FCLI===k?"on":""}" onclick="setFcli('${k}')">${t} <span class="num" style="color:var(--tx-3)">${n}</span></button>`;}).join("")}</div></div>`;
  const vis=FCLI==="todos"?todos:todos.filter(x=>estadoCliente(x.v)===FCLI);
  if(!vis.length){v.innerHTML=h+`<div class="lista"><div class="vacio"><div class="circ">${ic("i-check")}</div><b>${todos.length?"Ningún cliente con este filtro":"Todavía no hay clientes"}</b>${todos.length?"Probá con otro filtro.":"Registrá la venta desde la ficha del lead (pestaña Venta) o cargalo con «Agregar cliente»."}</div></div>`;return;}
  h+=`<div class="lista"><div class="fila cab cli"><div>Cliente</div><div class="col-cto">Contacto</div><div>Oferta · cierre</div><div>Próximo pago</div><div>Cobro</div></div>`;
  for(const {l,v:vt} of vis){
    const c=vt.cliente||{}, prox=proximoPago(vt);
    const cob=sumaM(vt.pagos.filter(p=>p.pagado).map(p=>p.monto)), tot=sumaM(vt.pagos.map(p=>p.monto));
    const pag=vt.pagos.filter(p=>p.pagado).length, sinComp=vt.pagos.filter(p=>p.pagado&&!p.comprobante).length;
    const wa=waLink(l.telefono);
    h+=`<div class="fila cli" onclick="abrirFicha('${l.id}','venta')">
      <div class="quien-l"><div class="avatar">${esc(iniciales(l.nombre))}</div><div style="min-width:0"><div class="nom">${esc(l.nombre||"(sin nombre)")}</div><div class="sub">${esc(c.marca||"Sin marca cargada")}${c.instagram?` · ${esc(c.instagram)}`:""}</div></div></div>
      <div class="col-cto fact" onclick="event.stopPropagation()">${wa?`<a href="${wa}" target="_blank" rel="noopener" style="color:inherit">${esc(l.telefono)}</a>`:esc(l.telefono||"Sin WhatsApp")}<small>${esc(l.email||"Sin email")}</small></div>
      <div class="fact">${esc(vt.oferta)} · ${esc(vt.forma)}<small>Cerró el ${new Date(vt.fecha).toLocaleDateString("es-AR")} · ${esc(vt.vendedor)}</small></div>
      <div class="fact">${prox?`<b class="num">${usd(prox.monto)}</b> · cuota ${prox.n}<small class="${claseVence(prox)}">${textoVence(prox)}</small>`:`<span class="badge ok">Pagó todo</span>`}</div>
      <div><div class="barra"><i style="width:${tot?cob/tot*100:0}%"></i></div><div class="num" style="font-size:12px;color:var(--tx-3);margin-top:5px">${pag} de ${vt.pagos.length} cuotas · ${usd(cob)} de ${usd(tot)}${sinComp?` · <span class="vence-warn">${sinComp} sin comprobante</span>`:""}</div></div>
    </div>`;
  }
  v.innerHTML=h+`</div>`;
}
function exportarClientes(){
  const filas=[["Cliente","Marca","WhatsApp","Email","Instagram","Web","Documento","País","Oferta","Forma","Vendió","Cierre","Cuota","Monto USD","Vence","Pagado","Día de pago","Comprobante"]];
  const dia=f=>f?diaInput(f):"";
  for(const {l,v:vt} of clientes()){
    const c=vt.cliente||{};
    for(const p of vt.pagos) filas.push([l.nombre,c.marca,l.telefono,l.email,c.instagram,c.web,c.documento,c.pais,vt.oferta,vt.forma,vt.vendedor,dia(vt.fecha),`${p.n} de ${vt.pagos.length}`,p.monto,dia(p.vence),p.pagado?"Sí":"No",dia(p.fecha),p.comprobante?"Sí":"No"]);
  }
  const csv="﻿"+filas.map(f=>f.map(x=>`"${String(x??"").replace(/"/g,'""')}"`).join(";")).join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download=`clientes-genesis-${hoyInput()}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

let ALTA={oferta:"Génesis",forma:"PIF"};
function altaCliente(){

  $("#modalCaja").classList.add("ancha");
  $("#modalCaja").innerHTML=`<h3>Agregar cliente</h3><p>Para los que cerraron por fuera de las colas. Si el WhatsApp o el email ya están cargados, la venta se suma a ese contacto.</p>
    <div class="form-g" style="margin-top:14px">
      <div class="full"><label for="aNom">Nombre y apellido</label><input id="aNom" value="${esc(prev.aNom)}"></div>
      <div><label for="aTel">WhatsApp (con código de país)</label><input id="aTel" inputmode="tel" placeholder="+54 9 11 2345 6789" value="${esc(prev.aTel)}"></div>
      <div><label for="aMail">Email</label><input id="aMail" type="email" value="${esc(prev.aMail)}"></div>
      <div><label for="aMarca">Marca / ecommerce</label><input id="aMarca" value="${esc(prev.aMarca)}"></div>
      <div><label for="aIg">Instagram</label><input id="aIg" placeholder="@marca" value="${esc(prev.aIg)}"></div>
      <div><label for="aFecha">Fecha de cierre</label><input id="aFecha" type="date" value="${esc(prev.aFecha)}"></div>
      <div><label for="aVend">Vendió</label><input id="aVend" value="${esc(prev.aVend)}"></div>
    </div>
    <div style="margin-top:14px"><div class="seg">${Object.keys(OFERTAS).map(o=>`<button class="${ALTA.oferta===o?"on":""}" onclick="ALTA.oferta='${o}';altaCliente()">${o}</button>`).join("")}</div></div>
    <div style="margin-top:10px"><div class="seg" style="flex-wrap:wrap">${formas.map(([k,pr])=>`<button class="${ALTA.forma===k?"on":""}" onclick="ALTA.forma='${k}';altaCliente()">${k} · ${pr}</button>`).join("")}</div></div>
    ${ALTA.forma==="Personalizado"?`<div class="form-g" style="margin-top:14px"><div><label for="aTotal">Monto total (USD)</label><input id="aTotal" type="number" min="1" step="0.01" value="${esc(prev.aTotal)}"></div><div><label for="aCuotas">Cuotas</label><input id="aCuotas" type="number" min="1" max="24" step="1" value="${esc(prev.aCuotas)}"></div></div>`:""}
    <div style="margin-top:14px"><label for="aNota" style="display:block;font-size:12px;font-weight:500;color:var(--tx-3);margin-bottom:5px">Nota (opcional)</label><textarea id="aNota">${esc(prev.aNota)}</textarea></div>
    <p style="font-size:12.5px;margin-top:8px">La primera cuota vence el día del cierre y cada una de las siguientes, un mes después. Los vencimientos, los pagos y los comprobantes se cargan en la ficha.</p>
    <div class="acc"><button class="btn" onclick="cerrarAlta()">Cancelar</button><button class="btn pri" id="aOk" onclick="guardarAlta()">Agregar cliente</button></div>`;
  $("#modal").classList.add("on");
  if(!prev.aNom) setTimeout(()=>$("#aNom").focus(),30);
}
function cerrarAlta(){$("#modal").classList.remove("on");$("#modalCaja").classList.remove("ancha");}
async function guardarAlta(){
  const data={nombre:$("#aNom").value.trim(),telefono:$("#aTel").value.trim(),email:$("#aMail").value.trim(),
    fecha:$("#aFecha").value,vendedor:$("#aVend").value.trim(),nota:$("#aNota").value,
    oferta:ALTA.oferta,forma:ALTA.forma,cliente:{marca:$("#aMarca").value,instagram:$("#aIg").value}};
  if(!data.nombre){toast("Falta el nombre",true);return;}
  if(!data.telefono&&!data.email){toast("Poné el WhatsApp o el email",true);return;}
  if(ALTA.forma==="Personalizado"){
    const total=Number($("#aTotal").value), n=parseInt($("#aCuotas").value,10);
    if(!(total>0)){toast("Poné el monto total",true);return;}
    if(!(n>=1&&n<=24)){toast("Las cuotas van de 1 a 24",true);return;}
    const base=Math.floor(total/n*100)/100;
    data.montos=Array.from({length:n},(_,i)=>i<n-1?base:Math.round((total-base*(n-1))*100)/100);
  }
  $("#aOk").disabled=true;
  try{
    const d=await api("/api/clientes",{method:"POST",body:JSON.stringify(data)});
    cerrarAlta(); toast(d.existia?"Venta cargada en el contacto que ya existía":"Cliente agregado");
    VERSION_LOCAL++;
    if(DATA){const i=DATA.leads.findIndex(l=>l.id===d.lead.id);const nuevo={...d.lead,calc:i>=0?DATA.leads[i].calc:{}};
      if(i>=0)DATA.leads[i]=nuevo;else DATA.leads.push(nuevo);
      if(!DATA.colas.ventas.includes(d.lead.id))DATA.colas.ventas.push(d.lead.id);}
    COMPLETO[d.lead.id]=d.lead; render(); pintarNav(); abrirFicha(d.lead.id,"venta"); refrescar();
  }catch(e){ $("#aOk").disabled=false; toast(e.message,true); }
}

// Reemplaza el contenido sin mover el scroll y manteniendo abiertos los detalles desplegados.
function pintarEnLugar(v,html){
  const y=scrollY, abiertos=[...v.querySelectorAll("details[open][data-k]")].map(d=>d.dataset.k);
  v.innerHTML=html;
  abiertos.forEach(k=>{const d=v.querySelector(`details[data-k="${CSS.escape(k)}"]`);if(d)d.open=true;});
  scrollTo(0,y);
}

  const detalleAds=ads.length?`<div class="ads-det">${(m.porAnuncio||[]).map(a=>`<details data-k="${esc(a.anuncio)}">

      <div class="ad-l">${(a.lista||[]).map(x=>`<button class="ad-lead" onclick="abrirFicha('${x.id}')">

    </details>`).join("")}</div>`:`<div class="sin-datos">Todavía no entró ningún lead desde un anuncio de Meta</div>`;
  h+=tarjeta("Qué anuncio trajo a cada lead","Tocá un anuncio para ver sus leads; tocá un lead para abrir su ficha. Solo anuncios de Meta (lo orgánico está en «Por fuente»).",detalleAds);

// Gráfico de líneas en SVG. series: [{nombre, datos:[n|null], color, punteada, fmt}]
function lineas(x,series,{pct=false,alto=200}={}){
  const W=640,H=alto,pl=38,pr=10,pt=10,pb=24,iw=W-pl-pr,ih=H-pt-pb;
  const vals=series.flatMap(s=>s.datos).filter(v=>v!=null);
  let max=pct?100:Math.max(1,...vals);
  if(!pct){const e=Math.pow(10,Math.floor(Math.log10(max)));max=Math.ceil(max/e)*e;if(max<4)max=4;}
  const X=i=>pl+(x.length<2?iw/2:i*iw/(x.length-1)), Y=v=>pt+ih-(v/max)*ih;
  const fmt=v=>pct?Math.round(v)+"%":(Math.round(v*10)/10).toLocaleString("es-AR");
  let g="";
  for(let k=0;k<=4;k++){const v=max*k/4,y=Y(v);g+=`<line class="g" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+3}" text-anchor="end">${fmt(v)}</text>`;}
  const salto=Math.max(1,Math.ceil(x.length/8));
  x.forEach((d,i)=>{if(i%salto===0||i===x.length-1)g+=`<text x="${X(i)}" y="${H-6}" text-anchor="middle">${fDia(d)}</text>`;});
  for(const s of series){
    let tramo=[],path="";
    const cerrar=()=>{if(tramo.length>1)path+=`<polyline points="${tramo.join(" ")}" fill="none" stroke="${s.color}" stroke-width="2" ${s.punteada?'stroke-dasharray="4 4"':""} stroke-linejoin="round" stroke-linecap="round"/>`;tramo=[];};
    s.datos.forEach((v,i)=>{if(v==null){cerrar();return;}tramo.push(`${X(i)},${Y(v)}`);});cerrar();
    s.datos.forEach((v,i)=>{if(v!=null)path+=`<circle cx="${X(i)}" cy="${Y(v)}" r="${x.length>40?1.6:2.6}" fill="${s.color}"/>`;});
    g+=path;
  }
  const ancho=x.length<2?iw:iw/(x.length-1);
  x.forEach((d,i)=>{const tip=fDia(d)+" · "+series.map(s=>`${s.nombre}: ${s.datos[i]==null?"—":(s.fmt||fmt)(s.datos[i])}`).join(" · ");
    g+=`<rect class="col" data-tip="${esc(tip)}" x="${X(i)-ancho/2}" y="${pt}" width="${ancho}" height="${ih}"/>`;});
  return `<svg class="ln" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

function rangoAnun(){
  const hoy=diaAR(), r=ANUN.rango;
  if(r==="hoy") return {desde:hoy,hasta:hoy};

  if(r==="rango"&&ANUN.desde&&ANUN.hasta) return {desde:ANUN.desde,hasta:ANUN.hasta};

}

// Mini gráfico de tendencia. El último tramo va punteado si el día todavía no cerró.
function spark(datos,{color="var(--marca-dato)",abierto=false,w=120,h=38}={}){
  const pts=datos.map((v,i)=>[i,v]).filter(p=>p[1]!=null);
  if(pts.length<2) return "";
  const vals=pts.map(p=>p[1]), mn=Math.min(...vals), mx=Math.max(...vals), r=mx-mn||1;
  const X=i=>2+i*(w-8)/(datos.length-1), Y=v=>h-4-(v-mn)/r*(h-10);
  const P=pts.map(([i,v])=>`${X(i)},${Y(v)}`);
  const corte=abierto?P.length-1:P.length;
  const firme=P.slice(0,corte), ult=pts[pts.length-1];
  let g=`<polygon points="${X(pts[0][0])},${h} ${firme.join(" ")} ${X(pts[corte-1][0])},${h}" fill="${color}" fill-opacity=".14"/>`;
  g+=`<polyline points="${firme.join(" ")}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round"/>`;
  if(abierto) g+=`<polyline points="${P[P.length-2]} ${P[P.length-1]}" fill="none" stroke="${color}" stroke-width="1.8" stroke-dasharray="2 3"/>`;
  g+=`<circle cx="${X(ult[0])}" cy="${Y(ult[1])}" r="3" fill="var(--bg)" stroke="${color}" stroke-width="1.6"/>`;
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true">${g}</svg>`;
}
// Flecha de hoy contra ayer: verde si mejora, rojo si empeora.
function delta(hoy,ayer,menosMejor){
  if(hoy==null||ayer==null||!ayer) return "";
  const c=Math.round((hoy-ayer)/Math.abs(ayer)*100);
  if(!c) return `<span class="delta">Igual que ayer</span>`;
  const mejora=menosMejor?c<0:c>0;
  return `<span class="delta ${mejora?"up":"down"}">${c>0?"↑":"↓"} ${c>0?"+":""}${c}% vs ayer</span>`;
}
function kpi({t,v,sub="",d="",serie=null,color,abierto,tip,chico}){
  return `<div class="akpi${chico?" chico":""}"><div class="kt">${t}${tip?` <span class="i" data-tip="${esc(tip)}">i</span>`:""}</div>
    <div class="kv num">${v}</div>${sub?`<div class="ks">${sub}</div>`:""}${d?`<div class="kd">${d}</div>`:""}
    ${serie?`<div class="kg">${spark(serie,{color,abierto})}</div>`:""}</div>`;
}
// Gráfico de doble eje: izq (área o línea) a la izquierda, der (línea) a la derecha.
// El día de hoy, si está en el rango, va punteado porque todavía no cerró.
function doble(x,izq,der,{abierto=false,alto=220}={}){
  const W=680,H=alto,pl=50,pr=der?50:12,pt=14,pb=24,iw=W-pl-pr,ih=H-pt-pb;
  const escala=(s)=>{const vs=s.datos.filter(v=>v!=null);let mx=s.pct?Math.min(100,Math.max(1,...vs)*1.15):Math.max(1e-9,...vs);
    if(!s.pct){const e=Math.pow(10,Math.floor(Math.log10(mx||1)));mx=Math.ceil(mx/e)*e||1;}else mx=Math.ceil(mx/10)*10||10;return mx;};
  const series=[izq,der].filter(Boolean), mx=series.map(escala);
  const X=i=>pl+(x.length<2?iw/2:i*iw/(x.length-1)), Y=(v,k)=>pt+ih-(v/mx[k])*ih;
  const eti=(v,s)=>s.pct?Math.round(v)+"%":(s.fmt===usd2?"$":"")+(v>=1000?Math.round(v).toLocaleString("es-AR"):(Math.round(v*10)/10).toLocaleString("es-AR"));
  let g="";
  for(let k=0;k<=4;k++){const y=pt+ih-ih*k/4;g+=`<line class="g" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+3}" text-anchor="end">${eti(mx[0]*k/4,izq)}</text>`;
    if(der) g+=`<text x="${W-pr+6}" y="${y+3}" text-anchor="start">${eti(mx[1]*k/4,der)}</text>`;}
  const salto=Math.max(1,Math.ceil(x.length/8));
  x.forEach((d,i)=>{if(i%salto===0||i===x.length-1)g+=`<text x="${X(i)}" y="${H-6}" text-anchor="middle">${fDia(d)}</text>`;});
  series.forEach((s,k)=>{
    const pts=s.datos.map((v,i)=>v==null?null:[X(i),Y(v,k)]);
    const n=pts.length, corte=abierto&&n>1?n-1:n;
    const firmes=pts.slice(0,corte).filter(Boolean);
    if(s.area&&firmes.length>1) g+=`<polygon points="${firmes[0][0]},${pt+ih} ${firmes.map(p=>p.join(",")).join(" ")} ${firmes[firmes.length-1][0]},${pt+ih}" fill="${s.color}" fill-opacity=".14"/>`;
    // Tramos continuos (los días sin dato cortan la línea).
    let tramo=[];const cerrar=()=>{if(tramo.length>1)g+=`<polyline points="${tramo.join(" ")}" fill="none" stroke="${s.color}" stroke-width="2" ${s.punteada?'stroke-dasharray="4 4"':""} stroke-linejoin="round"/>`;tramo=[];};
    pts.slice(0,corte).forEach(p=>{if(!p){cerrar();return;}tramo.push(p.join(","));});cerrar();
    if(abierto&&n>1&&pts[n-1]&&pts[n-2]) g+=`<polyline points="${pts[n-2].join(",")} ${pts[n-1].join(",")}" fill="none" stroke="${s.color}" stroke-width="2" stroke-dasharray="2 4"/>`;
    pts.forEach((p,i)=>{if(!p)return;const ult=abierto&&i===n-1;
      g+=`<circle cx="${p[0]}" cy="${p[1]}" r="${x.length>40?1.6:3}" fill="${ult?"var(--bg)":s.color}" stroke="${s.color}" stroke-width="1.5"/>`;
      if(ANUN.valores&&s.datos[i]!=null) g+=`<text class="val" x="${p[0]}" y="${p[1]-8}" text-anchor="middle">${(s.fmt||String)(s.datos[i])}</text>`;});
  });
  const ancho=x.length<2?iw:iw/(x.length-1);
  x.forEach((d,i)=>{const tip=fDia(d)+(abierto&&i===x.length-1?" (en curso)":"")+" · "+series.map(s=>`${s.nombre}: ${s.datos[i]==null?"—":(s.fmt||String)(s.datos[i])}`).join(" · ");
    g+=`<rect class="col" data-tip="${esc(tip)}" x="${X(i)-ancho/2}" y="${pt}" width="${ancho}" height="${ih}"/>`;});
  return `<svg class="ln" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
const leyendaHtml=(items)=>`<div class="leyenda">${items.map(([c,t,p])=>`<span><i style="background:${c}${p?";opacity:.55":""}"></i>${t}</span>`).join("")}</div>`;
const caja=(tit,cuerpo,{sub="",der="",cls=""}={})=>`<div class="caja ${cls}"><div class="caja-c"><h5>${tit}</h5>${der?`<span class="caja-d">${der}</span>`:""}</div>${cuerpo}${sub?`<p class="nota-a" style="margin:10px 0 0">${sub}</p>`:""}</div>`;

async function renderAnuncios(v,s,silencioso,deCache){
  const yaPintado=silencioso&&v.dataset.vista==="anun";
  ANUN.v=v; ANUN.s=s;
  const seg=(op,actual,fn)=>`<div class="seg">${op.map(([k,t])=>`<button class="${actual===k?"on":""}" onclick="${fn}('${k}')">${t}</button>`).join("")}</div>`;
  const tabs=`<div class="subtabs">${[["funnel","Funnel y ads"],["landings","Landings"],["ads","Anuncios"]].map(([k,t])=>`<button class="${ANUN.tab===k?"on":""}" onclick="anunTab('${k}')">${t}</button>`).join("")}</div>`;
  const filtros=`<div class="rango">${seg([["todo","Todo el lanzamiento"],["hoy","Hoy"],["ayer","Ayer"],["7d","Últimos 7 días"]],ANUN.rango,"anunRango")}
    <input type="date" id="aDesde" value="${ANUN.desde}" onchange="anunFechas()" aria-label="Desde"><span class="sep">a</span><input type="date" id="aHasta" value="${ANUN.hasta}" onchange="anunFechas()" aria-label="Hasta">
    <span class="rango-der">${ANUN.at?`<span class="vivo"><i></i>Actualizado ${ANUN.at}</span>`:""}${seg([["real","Opt-ins reales"],["calif","Solo calificados"]],ANUN.modo,"anunModo")}</span></div>`;
  if(!yaPintado) v.innerHTML=encabezado(s)+tabs+filtros+`<div class="akpis">${[1,2,3,4,5].map(()=>`<div class="akpi"><div class="esq" style="width:50%"></div><div class="esq" style="height:24px;margin-top:10px;width:40%"></div></div>`).join("")}</div>`;
  const r=rangoAnun();
  let a;try{
    if(deCache&&ANUN.ultimo) a=ANUN.ultimo;
    else{a=await api("/api/anuncios"+(r.desde?`?desde=${r.desde}&hasta=${r.hasta}`:""));ANUN.ultimo=a;ANUN.at=new Date().toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});}
  }catch(e){if(yaPintado)return;v.innerHTML=encabezado(s)+tabs+filtros+`<div class="vacio"><b>No se pudieron cargar los datos</b>${esc(e.message)}</div>`;return;}
  if(VISTA!=="anun") return;
  const filtros2=filtros.replace(/<span class="rango-der">[\s\S]*<\/span><\/div>$/,`<span class="rango-der"><span class="vivo"><i></i>Actualizado ${ANUN.at||""}</span>${seg([["real","Opt-ins reales"],["calif","Solo calificados"]],ANUN.modo,"anunModo")}</span></div>`);
  const enCurso=a.hasta===a.hoy;
  let h=encabezado(s)+tabs+filtros2+`<p class="nota-a">${fDia(a.desde)} al ${fDia(a.hasta)}, en hora de Argentina, según el día en que se registró cada lead.${enCurso?" Hoy todavía está en curso.":""}${!a.inicio&&ANUN.rango==="todo"?` <b>«Todo el lanzamiento» arranca en el primer lead: poné el inicio del lanzamiento en Configuración para no mezclar lanzamientos anteriores.</b>`:""}</p>`;
  const M=a.meta&&!a.meta.error&&a.meta.resumen?a.meta:null;
  if(a.meta&&a.meta.error) h+=`<div class="aviso-err"><b>No se pudieron traer los datos de Meta.</b> ${esc(a.meta.error)}</div>`;
  else if(!a.meta) h+=`<div class="aviso-err">Falta conectar Meta Ads: cargá META_ACCESS_TOKEN y META_AD_ACCOUNT_ID en Vercel.</div>`;
  if(ANUN.tab==="landings") h+=tabLandings(a,M,seg,enCurso);
  else if(ANUN.tab==="ads") h+=tabAds(a,M,seg,enCurso);
  else h+=tabFunnel(a,M,enCurso);
  pintarEnLugar(v,h); v.dataset.vista="anun";
  activarTips(v);
}

/* ----- Funnel y ads ----- */
function tabFunnel(a,M,abierto){
  const R=a.resumen, D=a.porDia, x=D.map(d=>d.dia), col=k=>D.map(d=>d[k]), cal=ANUN.modo==="calif";
  const MD=M?M.porDia:[], mc=k=>MD.map(d=>d[k]), MR=M&&M.resumen;
  const hoyAyer=(arr)=>abierto&&arr.length>1?[arr[arr.length-1],arr[arr.length-2]]:[null,null];
  const NAR="var(--marca-dato)",VER="var(--ok)",BLA="var(--tx-2)";
  let h=seccion("Cómo viene la pauta","Totales del rango. La flecha compara hoy con ayer: verde mejora, rojo empeora.");
  const [invH,invA]=hoyAyer(mc("inversion")), leadsSerie=col(cal?"califPauta":"leadsPauta"), [lH,lA]=hoyAyer(leadsSerie);
  const cplK=cal?"cplCalif":"cpl", [cH,cA]=hoyAyer(mc(cplK));
  const convSerie=M?mc("convLanding"):col(cal?"convCalifPauta":"convLandingPauta"), [vH,vA]=hoyAyer(convSerie);
  const grSerie=col("tocaronGrupo"), [gH,gA]=hoyAyer(grSerie);
  const conv=M?(cal?pc(MR.calif,MR.lpv):MR.convLanding):(cal?R.convCalifPauta:R.convLandingPauta);
  h+=`<div class="akpis k5">
    ${M?kpi({t:"Inversión en ads",v:usd2(MR.inversion),sub:abierto?`Hoy van ${usd2(invH)} · ayer ${usd2(invA)}`:"",serie:mc("inversion"),abierto,tip:"Gasto en Meta en el rango."}):""}
    ${kpi({t:cal?"Calificados":"Opt-ins",v:fNum(cal?R.califTodos:R.leadsTotal),sub:`${fNum(cal?R.califPauta:R.leadsPauta)} pauta · ${fNum(cal?R.califTodos-R.califPauta:R.leadsSinAnuncio)} sin anuncio${abierto?`<br>Hoy van ${fNum(lH)} · ayer ${fNum(lA)}`:""}`,serie:leadsSerie,abierto,tip:cal?"Invierten 100 dólares por día o más en Meta.":"Todos los registros del opt-in. Los de pauta llegaron con UTMs o fbclid de un anuncio."})}
    ${M?kpi({t:cal?"CPL calificado":"CPL",v:usd2(MR[cplK]),d:delta(cH,cA,true),serie:mc(cplK),abierto,tip:cal?"Inversión / calificados de pauta.":"Inversión / opt-ins de pauta. Directos y orgánicos no entran."}):""}
    ${kpi({t:"Conversión de la landing",v:fPct(conv),d:delta(vH,vA),serie:convSerie,abierto,tip:M?"Opt-ins de pauta / vistas de la landing que informa Meta.":"Opt-ins de pauta / visitas a la landing desde anuncios."})}
    ${kpi({t:"Tocaron «Entrar al grupo»",v:fNum(R.tocaronGrupo),sub:`${fPct(R.pctGrupoTodos)} de los opt-ins${abierto?` · hoy ${fNum(gH)} · ayer ${fNum(gA)}`:""}`,serie:grSerie,color:VER,abierto,tip:"Personas distintas que tocaron el botón verde de la página de gracias."})}
  </div>`;
  if(M){const [mH,mA]=hoyAyer(mc("cpm")),[tH,tA]=hoyAyer(mc("ctr")),pcs=col("pctCalifPauta"),[pH,pA]=hoyAyer(pcs);
    h+=`<div class="akpis k4">
      ${kpi({t:"CPM",v:usd2(MR.cpm),d:delta(mH,mA,true),serie:mc("cpm"),abierto,chico:1,tip:"Inversión por cada 1.000 impresiones."})}
      ${kpi({t:"CTR",v:fPct(MR.ctr),d:delta(tH,tA),serie:mc("ctr"),abierto,chico:1,tip:"Clics en el enlace / impresiones."})}
      ${kpi({t:"Frecuencia",v:fDec(MR.frecuencia),sub:`${fNum(MR.alcance)} personas alcanzadas`,chico:1,tip:"Veces que cada persona vio un anuncio en el rango."})}
      ${kpi({t:"% de calificados",v:fPct(R.pctCalifPauta),d:delta(pH,pA),serie:pcs,abierto,chico:1,tip:"Calificados / opt-ins de pauta."})}
    </div>`;}

  // Embudo
  const pasos=[];
  if(M){pasos.push(["Clics en el link",MR.clics,"m"],["Entraron a la landing",MR.lpv,"m"]);}
  else pasos.push(["Visitas a la landing",R.visitasPauta,"m"]);
  pasos.push(["Opt-ins",R.leadsPauta,"m"],["Calificados",R.califPauta,"o"],["Tocaron «Entrar al grupo»",R.tocaronGrupoPauta,"o"]);
  const mxE=Math.max(1,...pasos.map(p=>p[1]||0));
  h+=seccion("Cómo baja el tráfico","Del clic en el anuncio al botón del grupo, solo pauta. El % de cada barra es cuántos siguen del paso anterior.");
  h+=caja("",`${M?`<div class="emb-stats"><span>Impresiones <b>${fNum(MR.impresiones)}</b></span><span>Alcance <b>${fNum(MR.alcance)}</b> frec. ${fDec(MR.frecuencia)}</span><span>CTR al link <b>${fPct(MR.ctr)}</b></span></div>`:""}
    <div class="embudo">${pasos.map((p,i)=>{const prev=i?pasos[i-1][1]:null,ret=i&&prev?Math.round(p[1]/prev*100):null;
      return `<div class="eb"><div class="eb-v num">${fNum(p[1])}${ret!=null?` <span>${ret}%</span>`:""}</div><div class="eb-bar"><i class="${p[2]}" style="height:${(p[1]||0)/mxE*100}%"></i></div><div class="eb-t">${p[0]}</div></div>`;}).join("")}</div>`,
    {sub:"Los pasos del formulario, la página de gracias y el grupo de WhatsApp se suman cuando registremos esos eventos."});
