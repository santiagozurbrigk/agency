<title>Mapa de ventas Génesis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: tablero infinito estilo pizarra (fondo punteado) con un marco por fase; barra de fases arriba, zoom abajo a la derecha, panel de ejemplo a la derecha. Un solo look claro, a propósito. */
:root {
  color-scheme: light;
  --board: var(--soft);
  --dot: #d8d3c8;
  --frame: #ffffff;
  --ink: #1b1c1e;
  --muted: #6c6b66;
  --line: #e2ded4;
  --edge: #2a2b2d;
  --sdr: #c2410c;
  --closer: #4f46e5;
  --form: #475569;
  --dec-bg: var(--surface)3ea;
  --dec-line: #f2b48c;
  --dec-ico: #ea580c;
  --no-bg: #fdf1f0;
  --no-line: #efb4ad;
  --no-ink: #b42318;
  --note-bg: #fbf5e2;
  --note-line: #d9a72b;
  --note-ink: #8a6100;
  --yes: #15803d;
  --bubble: #dcf8c6;
  --bubble-ink: #14280c;
  --p1: #3b5bdb; --p2: #e8590c; --p3: #b08900; --p4: #d6336c; --p5: #7048e8; --p6: #2b8a3e;
  --surface: #ffffff;
  --soft: var(--soft);
  --on-ink: #ffffff;
  --on-accent: #ffffff;
  --edge-strong: #1b1c1e;
  --yes-bg: var(--yes-bg);
  --no-text: var(--no-text);
  --note-text: var(--note-text);
  --note-border: var(--note-border);
  --sh1: var(--sh1);
  --sh2: var(--sh2);
  --veil: var(--veil);
  --vw-bg: var(--vw-bg);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
  --board: #121417; --dot: #2b2f35; --frame: #1b1e23; --ink: #ecebe7; --muted: #9d9b95; --line: #30343a; --edge: #bdbab3;
  --sdr: #fb8a4c; --closer: #9496fb; --form: #a3b1c2;
  --dec-bg: #352318; --dec-line: #7c4a26; --dec-ico: #fb923c;
  --no-bg: #34191a; --no-line: #74322d; --no-ink: #f87171;
  --note-bg: #2f2711; --note-line: #d9a72b; --note-ink: #f0c75e;
  --yes: #4ade80; --bubble: #1e3a28; --bubble-ink: #dcf7d0;
  --p1: #7392ff; --p2: #ff8f4a; --p3: #e3b52b; --p4: #f06595; --p5: #9b7cfa; --p6: #5bd174;
  --surface: #1b1e23; --soft: #24282e; --on-ink: #121417; --on-accent: #ffffff; --edge-strong: #ecebe7;
  --yes-bg: #173322; --no-text: #f1c9c4; --note-text: #f1e2b8; --note-border: #4a3d17;
  --sh1: rgba(0,0,0,.35); --sh2: rgba(0,0,0,.55); --veil: rgba(27,30,35,.93); --vw-bg: rgba(236,235,231,.08);
  color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --board: #121417; --dot: #2b2f35; --frame: #1b1e23; --ink: #ecebe7; --muted: #9d9b95; --line: #30343a; --edge: #bdbab3;
  --sdr: #fb8a4c; --closer: #9496fb; --form: #a3b1c2;
  --dec-bg: #352318; --dec-line: #7c4a26; --dec-ico: #fb923c;
  --no-bg: #34191a; --no-line: #74322d; --no-ink: #f87171;
  --note-bg: #2f2711; --note-line: #d9a72b; --note-ink: #f0c75e;
  --yes: #4ade80; --bubble: #1e3a28; --bubble-ink: #dcf7d0;
  --p1: #7392ff; --p2: #ff8f4a; --p3: #e3b52b; --p4: #f06595; --p5: #9b7cfa; --p6: #5bd174;
  --surface: #1b1e23; --soft: #24282e; --on-ink: #121417; --on-accent: #ffffff; --edge-strong: #ecebe7;
  --yes-bg: #173322; --no-text: #f1c9c4; --note-text: #f1e2b8; --note-border: #4a3d17;
  --sh1: rgba(0,0,0,.35); --sh2: rgba(0,0,0,.55); --veil: rgba(27,30,35,.93); --vw-bg: rgba(236,235,231,.08);
  color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--board); color: var(--ink); font-family: var(--font-body); overflow: hidden; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }

#viewport { position: fixed; inset: 0; overflow: hidden; cursor: grab; touch-action: none;
  background-color: var(--board);
  background-image: radial-gradient(var(--dot) 1.2px, transparent 1.3px);
  background-size: 22px 22px; }
#viewport.dragging { cursor: grabbing; }
#viewport, .topbar, .zoom, .hint { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.panel { -webkit-user-select: text; user-select: text; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; z-index: 1; }

/* Barra superior */
.topbar { position: fixed; left: 16px; right: 16px; top: calc(14px + env(safe-area-inset-top, 0px)); display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; pointer-events: none; z-index: 5; }
.brand, .tabs { pointer-events: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 2px 10px var(--sh1); }
.brand { display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 10px; }
.brand .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--sdr); color: var(--on-accent); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 15px; }
.brand b { display: block; font-size: 14px; font-weight: 700; }
.brand small { display: block; font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
.tabs { display: flex; align-items: center; gap: 2px; padding: 4px; overflow-x: auto; max-width: 100%; scrollbar-width: none; }
.tab { border: 0; background: transparent; border-radius: 8px; padding: 7px 10px; font-size: 13px; font-weight: 500; white-space: nowrap; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.tab i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.tab:hover { background: var(--soft); }
.tab[aria-current="true"] { background: var(--soft); font-weight: 700; }
.tab.mapa { color: var(--sdr); font-weight: 700; }
.tab:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }

/* Controles */
.zoom { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; z-index: 5; }
.zoom button { width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 18px; cursor: pointer; box-shadow: 0 2px 8px var(--sh1); }
.zoom button:focus-visible { outline: 2px solid var(--ink); }
.zoom .pct { font-family: var(--font-mono); font-size: 10.5px; text-align: center; color: var(--muted); }
.hint { position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; z-index: 5; max-width: calc(100% - 100px); }

/* Marcos */
.frame { position: absolute; background: var(--frame); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 4px 24px var(--sh1); }
.frame::before { content: ""; position: absolute; left: -1px; right: -1px; top: -1px; height: 5px; border-radius: 16px 16px 0 0; background: var(--fc); }
.fhead { position: absolute; left: 28px; top: 26px; right: 28px; display: flex; align-items: center; gap: 16px; cursor: zoom-in; }
.fchip { font-family: var(--font-mono); font-size: 13px; letter-spacing: .14em; color: var(--fc); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; background: var(--surface); white-space: nowrap; }
.ftitle { font-family: var(--font-display); font-weight: 800; font-size: 30px; letter-spacing: -.01em; }
.fmeta { font-size: 14px; color: var(--muted); margin-left: auto; }
.fsep { position: absolute; left: 0; right: 0; top: 96px; border-top: 1px solid var(--line); }
.board-title { position: absolute; left: 0; top: 0; }
.board-title h1 { font-family: var(--font-display); font-weight: 800; font-size: 56px; margin: 0; letter-spacing: -.02em; }
.board-title p { margin: 8px 0 0; font-size: 18px; color: var(--muted); max-width: 900px; line-height: 1.45; }
.personas { display: flex; gap: 16px; margin-top: 22px; }
.persona { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; width: 470px; font-size: 15px; line-height: 1.45; }
.persona .pt { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
.persona b { display: block; font-family: var(--font-display); font-size: 22px; margin: 2px 0 4px; }
.persona p { margin: 0; color: var(--muted); }

/* Nodos */
.n { position: absolute; width: 200px; border-radius: 10px; font-size: 12.5px; line-height: 1.42; text-align: left; }
.n.step, .n.dec { cursor: pointer; }
.n:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.n.step { background: var(--surface); border: 1px solid var(--line); padding: 12px 14px 12px; box-shadow: 0 1px 3px var(--sh1); }
.n.step:hover, .n.dec:hover { box-shadow: 0 0 0 2px var(--ink); }
.n.active { box-shadow: 0 0 0 2.5px var(--ink) !important; }
.badge { display: inline-block; font-family: var(--font-mono); font-size: 9.5px; font-weight: 700; letter-spacing: .08em; border: 1px solid currentColor; border-radius: 999px; padding: 1px 6px; margin-right: 6px; vertical-align: 1px; text-transform: uppercase; }
.k-sdr { color: var(--sdr); } .k-closer { color: var(--closer); } .k-form { color: var(--form); }
.n .tt { font-weight: 700; font-size: 13.5px; color: var(--ink); }
.n .dd { color: var(--muted); margin-top: 5px; }
.n .ver { display: inline-block; margin-top: 9px; font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; color: var(--muted); }
.n.start { background: var(--ink); color: var(--on-ink); border-radius: 10px; padding: 14px 16px; font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; text-align: center; box-shadow: 0 2px 8px var(--sh2); }
.n.dec { background: var(--dec-bg); border: 1px solid var(--dec-line); padding: 11px 14px 11px 34px; font-weight: 700; font-size: 13px; }
.n.dec::before { content: ""; position: absolute; left: 13px; top: 15px; width: 10px; height: 10px; background: var(--dec-ico); transform: rotate(45deg); border-radius: 2px; }
.n.dec .dd { font-weight: 400; }
.n.no { background: var(--no-bg); border: 1px solid var(--no-line); border-left: 3px solid var(--no-ink); padding: 11px 13px; color: var(--no-text); font-size: 12px; }
.n.no .act { margin-top: 8px; font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--no-ink); }
.n.note { background: var(--note-bg); border: 1px solid var(--note-border); border-left: 3px solid var(--note-line); padding: 11px 13px; color: var(--note-text); font-size: 12px; }
.n.note .lab, .n.mile .lab, .n.yesbox .lab { font-family: var(--font-mono); font-size: 9.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--note-ink); margin-bottom: 4px; }
.n.mile { background: var(--surface); border: 1.5px solid var(--ink); padding: 14px 16px; text-align: center; border-radius: 12px; }
.n.mile .lab { color: var(--sdr); }
.n.mile .tt { font-family: var(--font-display); font-size: 19px; font-weight: 800; line-height: 1.15; }
.n.mile .dd { margin-top: 6px; }
.n.jump { background: var(--surface); border: 1.5px dashed var(--fc2, var(--ink)); padding: 12px 14px; cursor: pointer; }
.n.jump .lab { font-family: var(--font-mono); font-size: 9.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--fc2, var(--ink)); }
.n.jump:hover { box-shadow: 0 0 0 2px var(--fc2, var(--ink)); }
.n.route { background: var(--surface); border: 1px solid var(--line); padding: 11px 13px; }
.n.route .lab { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--sdr); margin-bottom: 3px; }
.elab { font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: .06em; }

/* Panel */
.panel { position: fixed; right: 16px; top: calc(78px + env(safe-area-inset-top, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: 410px; max-width: calc(100% - 32px); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 12px 40px var(--sh2); z-index: 6; display: flex; flex-direction: column; }
.panel[hidden] { display: none !important; }
.ph { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 4px; position: relative; }
.ph .close { position: absolute; right: 12px; top: 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 12.5px; }
.ph .fase { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; }
.ph h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 22px; line-height: 1.15; padding-right: 64px; text-wrap: balance; }
.pb { padding: 14px 18px 22px; overflow-y: auto; display: grid; gap: 16px; align-content: start; font-size: 14.5px; line-height: 1.5; }
.pb h3 { margin: 0 0 8px; font-family: var(--font-mono); font-weight: 500; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.pb p { margin: 0; }
.ex { display: grid; gap: 8px; margin-bottom: 12px; }
.exh { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.copy { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 3px 10px; cursor: pointer; font-size: 12px; }
.copy:focus-visible, .ph .close:focus-visible { outline: 2px solid var(--ink); }
.bubble { background: var(--bubble); color: var(--bubble-ink); border-radius: 12px 12px 12px 4px; padding: 10px 12px; display: grid; gap: 8px; }
.call { border-left: 3px solid var(--sdr); padding: 2px 0 2px 12px; display: grid; gap: 8px; }
.call.closer { border-left-color: var(--closer); }
.call .w { font-weight: 700; }
.call .w.l { color: var(--muted); }
.notebox { background: var(--soft); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; }
.rule { border: 1px dashed var(--note-line); background: var(--note-bg); border-radius: 10px; padding: 10px 12px; }
.br { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; margin-bottom: 6px; }
.pill { font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--yes-bg); color: var(--yes); }
.pill.no { background: var(--no-bg); color: var(--no-ink); }

body.panel-open .zoom { right: 442px; }

/* Botón de tema */
.themebtn { pointer-events: auto; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 0 14px; font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 2px 10px var(--sh1); min-height: 44px; }
.themebtn:hover { border-color: var(--ink); }
.themebtn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.themebtn .ico { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--ink); background: linear-gradient(90deg, var(--ink) 50%, transparent 50%); }
/* Mejoras de uso */
.n.step, .n.dec, .n.jump { transition: box-shadow .15s ease, transform .15s ease; }
@media (prefers-reduced-motion: no-preference) { .n.step:hover, .n.dec:hover, .n.jump:hover { transform: translateY(-2px); } }
.legend { pointer-events: auto; margin-left: auto; display: flex; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; font-size: 12px; color: var(--muted); box-shadow: 0 2px 10px var(--sh1); }
.legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legend i.dia { transform: rotate(45deg); border-radius: 2px; width: 9px; height: 9px; }
.bigname { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 36px; background: var(--veil); border-radius: 16px; z-index: 3; pointer-events: none; text-align: center; padding: 80px; }
.bigname b { font-family: var(--font-mono); font-size: 96px; letter-spacing: .14em; color: var(--fc); }
.bigname span { font-family: var(--font-display); font-weight: 800; font-size: 150px; line-height: 1.02; letter-spacing: -.02em; color: var(--ink); text-wrap: balance; }
#world.far .bigname { display: flex; }
#world.far .fhead { visibility: hidden; }
.minimap { position: fixed; left: 16px; bottom: calc(62px + env(safe-area-inset-bottom, 0px)); width: 236px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 2px 10px var(--sh1); z-index: 5; padding: 8px 10px 10px; touch-action: none; }
.minimap .ml { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; display: flex; justify-content: space-between; }
.minimap .mm { position: relative; width: 216px; overflow: hidden; cursor: pointer; border-radius: 6px; background: var(--board); }
.minimap .mf { position: absolute; border-radius: 2px; opacity: .8; }
.minimap .vw { position: absolute; border: 2px solid var(--ink); border-radius: 3px; background: var(--vw-bg); pointer-events: none; }
.pnav { border-top: 1px solid var(--line); padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pnav button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-size: 13px; font-weight: 600; }
.pnav button:hover:not(:disabled) { border-color: var(--ink); }
.pnav button:disabled { opacity: .35; cursor: default; }
.pnav button:focus-visible { outline: 2px solid var(--ink); }
.pnav span { font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-align: center; }
.kindrow { display: flex; gap: 8px; align-items: center; }
.extabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.extab { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px; font-size: 12.5px; cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.extab[aria-selected="true"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.extab:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
@media (max-width: 1660px) { .legend { display: none; } }
.legend { min-height: 44px; }
@media (max-width: 720px) {
  .minimap { display: none; }
  body.panel-open .zoom { right: 16px; bottom: calc(70% + 12px); }
  .brand small { display: none; }
  .hint { display: none; }
  .panel { left: 0; right: 0; bottom: 0; top: auto; width: auto; max-width: none; max-height: 70%; border-radius: 16px 16px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .zoom { bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
}
</style>

<div id="viewport" aria-label="Tablero del proceso de ventas. Arrastrá para moverte, usá la rueda o los botones para hacer zoom.">
  <div id="world">
    <svg id="edges"></svg>
  </div>
</div>

<div class="topbar">
  <div class="brand"><span class="logo">G</span><span><b>Mapa de ventas</b><small>Génesis · clase 19/10</small></span></div>
  <nav class="tabs" id="tabs" aria-label="Fases"></nav>
  <button type="button" class="themebtn" id="themebtn" aria-label="Cambiar a modo oscuro"><span class="ico"></span><span id="themelab">Modo oscuro</span></button>
  <div class="legend" aria-label="Referencias"><span><i style="background:var(--sdr)"></i>SDR</span><span><i style="background:var(--closer)"></i>Closer</span><span><i style="background:var(--form)"></i>Formulario</span><span><i class="dia" style="background:var(--dec-ico)"></i>Decisión</span><span><i style="background:var(--note-line)"></i>Nota</span></div>
</div>
<div class="minimap" id="minimap" aria-label="Minimapa"><div class="ml"><span>Vista general</span><span id="mmf"></span></div><div class="mm" id="mm"></div></div>

<div class="zoom">
  <button type="button" id="zin" aria-label="Acercar">+</button>
  <button type="button" id="zout" aria-label="Alejar">−</button>
  <button type="button" id="zfit" aria-label="Ver todo el mapa">⤢</button>

 { id: "f2", tab: "02 Pre-venta", chip: "FASE 02", title: "Califica en la llamada: ruta pre-venta", meta: "SDR + Manu · en la misma llamada · ej. Martín", color: "var(--p2)", rows: [140, 600],

      ex: [{ type: "call", head: "Llamada con Lucía", lines: [["SDR", "Las marcas que salen de ahí dejan de pensar en la venta y empiezan a pensar en el cliente: cuánto les deja en el tiempo, no en la primera compra. Hay un orden para hacerlo, y Manu lo muestra paso a paso el lunes."]] }] },
    { id: "nedus", t: "note", r: 0, c: 2, below: true, from: "edus", lab: "Límite", text: "Si se lleva el cómo entero, no va a la clase: ya tiene lo que fue a buscar." },
    { id: "sop", t: "step", k: "sdr", r: 0, c: 3, n: "3", title: "Le mandás el SOP que le sirve", d: "El de la Skool de Manu que ataca su problema puntual, el mismo día.",
      ex: [{ type: "wa", head: "WhatsApp a Lucía", lines: ["Te paso lo que te prometí: [SOP de la Skool sobre recompra]. Es justo para lo de que tus clientas no vuelven. Arrancá por la secuencia post-compra y después contame cómo te fue."] }] },
    { id: "nsop", t: "note", r: 0, c: 3, below: true, from: "sop", lab: "Doble función", text: "Cumple la promesa y te deja el pretexto del seguimiento: «¿pudiste aplicar lo del SOP?»." },
    { id: "int", t: "step", k: "sdr", r: 0, c: 4, n: "4", title: "Subís el interés por la clase", d: "Conectás su problema con lo que se va a mostrar: «esto que te pasa es justo lo que vamos a ver».",
      ex: [{ type: "call", head: "Llamada con Lucía", lines: [["SDR", "Esto que te pasa con las clientas que no vuelven es justo lo que Manu va a mostrar el lunes 19 a las 19: por qué cada venta te cuesta lo mismo que la anterior y cómo salir de eso. La clase es privada, así que entrás porque estás anotada."]] }] },
    { id: "nint", t: "note", r: 0, c: 4, below: true, from: "int", lab: "Personalizado o no sirve", text: "Invitar en genérico no mueve a nadie. Tiene que escuchar su propio problema en el temario." },
    { id: "confa", t: "step", k: "sdr", r: 0, c: 5, n: "5", title: "Confirmás la asistencia", d: "Día, hora y un ok explícito. El ok es lo que sube la asistencia.",
      ex: [{ type: "wa", head: "WhatsApp a Lucía", lines: ["¿Te cuento como confirmada para el lunes 19 a las 19? Tirame un ok."] }] },
    { id: "dconf", t: "dec", r: 1, c: 0, title: "¿Confirmó?",
      branches: [["Sí", "Recordatorios hasta el día."], ["No", "Sigue la cadencia hasta el evento, con el SOP como excusa."]],
      ex: [{ type: "wa", head: "Cadencia con el SOP como excusa", lines: ["Lucía, ¿pudiste aplicar lo del SOP? Contame qué te pasó, y de paso te confirmo para el lunes a las 19."] }] },
    { id: "dconfno", t: "no", r: 1, c: 0, below: true, from: "dconf", text: "Sigue en la cadencia hasta el evento: llamada, texto y audio turnándose, con el SOP como excusa.", act: "↺ Seguir la cadencia" },
    { id: "rec", t: "step", k: "sdr", r: 1, c: 1, n: "6", title: "Recordatorios hasta el día", d: "Día anterior y día de la clase, pidiendo un ok cada vez.",
      ex: [{ type: "wa", head: "Domingo 18", lines: ["Mañana a las 19 es la clase. Lo de las clientas que no vuelven lo ves ahí. ¿Seguís firme? Tirame un ok."] }] },
    { id: "m3", t: "mile", r: 1, c: 2, lab: "Milestone", title: "Confirmada para la clase", text: "Sigue en la Fase 04." },
    { id: "nm3", t: "note", r: 1, c: 2, below: true, from: "m3", lab: "Se puede recalentar", text: "Si aplica el SOP y vuelve con resultados o preguntas, le mandás el formulario y agenda. No esperes a la clase por respetar el mapa." }
   ],

 { id: "f4", tab: "04 Día de la clase", chip: "FASE 04", title: "Arranca la clase en vivo", meta: "SDR · lunes 19/10", color: "var(--p4)", rows: [140, 600],
   nodes: [
    { id: "s4", t: "start", r: 0, c: 0, title: "Arranca el vivo" },
    { id: "recf", t: "step", k: "sdr", r: 0, c: 1, n: "1", title: "Recordatorio final y link", d: "Dos horas antes y al abrir la sala. El último empujón trae a la mitad de los que aparecen.",
      ex: [{ type: "wa", head: "17:00", lines: ["Martín, hoy a las 19 es la clase en vivo con Manu. Te voy a pasar el link por acá cuando abra la sala. Tirame un ok así sé que lo tenés."] }, { type: "wa", head: "19:00", lines: ["Arrancó. Entrá acá: [LINK CLASE]"] }] },
    { id: "nrecf", t: "note", r: 0, c: 1, below: true, from: "recf", lab: "Quiénes están en la lista", text: "Los que confirmaste, los que nunca te atendieron y los que se anotaron sin hablar con nadie. Los tres reciben el recordatorio." },
    { id: "chat", t: "step", k: "sdr", r: 0, c: 2, n: "2", title: "Moderás el chat", d: "Contestás dudas y sostenés la conversación. Acá no se vende ni se da precio.",
      ex: [{ type: "note", head: "Respuestas en el chat", lines: ["«¿Cuánto sale?» → Depende de cada marca. Eso lo ves en una llamada con tus números; al final Manu te dice cómo agendar.", "«¿Queda grabada?» → Sí, los anotados reciben la repetición. Pero en vivo podés preguntar.", "«¿Sirve para mi rubro?» → Contame qué vendés y te digo."] }] },
    { id: "sen", t: "step", k: "sdr", r: 0, c: 3, n: "3", title: "Marcás señales de compra", d: "El que pregunta precio, formas de pago o cuándo empieza queda marcado como prioridad del día siguiente.",
      ex: [{ type: "note", head: "Ejemplo en el chat", lines: ["Escribe: «¿Y esto cuándo arranca? ¿Se puede pagar en cuotas?»", "→ Etiqueta en GHL: señal de compra. Es el primero que se llama si no agenda."] }] },
    { id: "nsen", t: "note", r: 0, c: 3, below: true, from: "sen", lab: "Vale oro", text: "Esa lista es por quién empezás a llamar al día siguiente. Sin ella, llamás por orden alfabético." },
    { id: "cta", t: "step", k: "form", r: 0, c: 4, n: "4", title: "El llamado a la acción: agendar", d: "El link de la clase lleva al mismo formulario con Calendly de la ruta pre-venta.",
      ex: [{ type: "wa", head: "En el chat de la clase", lines: ["Para agendar tu llamada con el equipo: [link del formulario]. Completás las preguntas y al final elegís el horario."] }] },
    { id: "ncta", t: "note", r: 0, c: 4, below: true, from: "cta", lab: "Por qué el mismo", text: "Mismo formulario = un solo ruteo de piezas para todas las puertas. Dos formularios, dos sistemas." },
    { id: "part", t: "step", k: "sdr", r: 1, c: 0, n: "5", title: "Partís la lista en tres grupos", d: "El mismo día, no al siguiente. La ventana cierra el jueves 22 a las 23:59.",
      ex: [{ type: "note", head: "Con nuestros dos leads", lines: ["Grupo 1 · asistió y agendó → Lucía agendó al final de la clase", "Grupo 2 · asistió y no agendó → los que preguntaron y no agendaron", "Grupo 3 · no asistió → se anotaron y no aparecieron"] }] },
    { id: "g1c", t: "route", r: 1, c: 1, lab: "Grupo 1", title: "Asistió y agendó", text: "El más caliente. Ya está adentro: solo hay que sostenerlo hasta la llamada." },
    { id: "g2c", t: "route", r: 1, c: 2, lab: "Grupo 2", title: "Asistió y no agendó", text: "Vio todo y no dio el paso. Hay una objeción concreta y hay que ir a buscarla." },
    { id: "g3c", t: "route", r: 1, c: 3, lab: "Grupo 3", title: "No asistió", text: "Se anotó y no apareció. Hay que volver a meterlo con la repetición antes de pedirle nada." },
    { id: "m4", t: "mile", r: 1, c: 4, lab: "Milestone", title: "Los tres grupos armados", text: "Sigue en la Fase 05, cada grupo con su entrada." }
   ],
   edges: [["s4","recf","h"],["recf","nrecf","n"],["recf","chat","h"],["chat","sen","h"],["sen","nsen","n"],["sen","cta","h"],["cta","ncta","n"],["cta","part","w"],["part","g1c","h"],["g1c","g2c","h"],["g2c","g3c","h"],["g3c","m4","h"]] },

 { id: "f5", tab: "05 Los 3 grupos", chip: "FASE 05", title: "Después de la clase: los tres grupos", meta: "SDR · del 19/10 a la noche al 22/10", color: "var(--p5)", rows: [140, 600, 1060],
   nodes: [
    { id: "s51", t: "start", r: 0, c: 0, title: "Grupo 1 · Asistió y agendó" },
    { id: "g1a", t: "step", k: "sdr", r: 0, c: 1, n: "1", title: "Grupo + traspaso al closer", d: "Esa misma noche, con el lead y el closer adentro.",
      ex: [{ type: "wa", head: "Grupo «[Marca de Lucía] · Equipo Manu Dominguez»", lines: ["Lucía, te presento a [closer], que es con quien hablás el miércoles a las 16.", "[closer]: Lucía tiene [marca], productos de limpieza ecológica, y vienen facturando unos 14 millones. Lo que más le pesa es que sus clientas compran una vez y no vuelven. Ya le mandé el SOP de recompra."] }] },
    { id: "ng1a", t: "note", r: 0, c: 1, below: true, from: "g1a", lab: "Ojo", text: "Este grupo ya dijo que sí. Lo único que puede pasarle hasta la llamada es enfriarse, y se enfría en silencio." },
    { id: "g1b", t: "step", k: "sdr", r: 0, c: 2, n: "2", title: "Llamada de bienvenida", d: "Confirmás la llamada, sacás lo que le faltó de la clase y le anticipás qué le vas a mandar.",
      ex: [{ type: "call", head: "Bienvenida a Lucía (5 minutos)", lines: [["SDR", "Lucía, ¿cómo estás? Te llamo porque vi que agendaste con [closer] para el miércoles a las 16. Antes de eso: ¿qué fue lo que más te sirvió de la clase? ¿Y qué te quedó dando vueltas?"], ["SDR", "Perfecto. Te voy a mandar un par de cosas por el grupo antes de la llamada, así llegás con todo el panorama."]] }] },
    { id: "g1c2", t: "step", k: "sdr", r: 0, c: 3, n: "3", title: "Las tres piezas", d: "El paquete que ruteó el formulario: testimonio por situación, video por objetivo, recurso por problema.",
      ex: [{ type: "note", head: "Ver el núcleo", lines: ["Los textos de las tres piezas están en la Fase 06, El núcleo."] }] },
    { id: "m51", t: "mile", r: 0, c: 4, lab: "Milestone", title: "Sostenido hasta la llamada", text: "Entra al núcleo." },

    { id: "s52", t: "start", r: 1, c: 0, title: "Grupo 2 · Asistió y no agendó" },
    { id: "g2a", t: "step", k: "sdr", r: 1, c: 1, n: "1", title: "Los llamás el mismo día", d: "Empezás por los que marcaste con señales de compra en el chat.",
      ex: [{ type: "call", head: "Llamada a un lead del Grupo 2", lines: [["SDR", "Te vi en la clase de ayer, y vi que preguntaste por las cuotas. ¿Qué te pareció?"]] }] },
    { id: "ng2a", t: "note", r: 1, c: 1, below: true, from: "g2a", lab: "Acá está la plata", text: "Vieron todo, entendieron la oferta y no dieron el paso. Están más cerca que cualquier lead nuevo." },
    { id: "g2b", t: "step", k: "sdr", r: 1, c: 2, n: "2", title: "Buscás la objeción real", d: "«¿Qué te faltó para dar el paso?» y te callás.",
      ex: [{ type: "call", head: "Llamada a un lead del Grupo 2", lines: [["Lead", "Muy bueno. Lo tengo que pensar."], ["SDR", "¿Qué es puntualmente lo que tenés que pensar?"], ["Lead", "No sé si con mi rubro funciona."]] }] },
    { id: "ng2b", t: "note", r: 1, c: 2, below: true, from: "g2b", lab: "La primera nunca es la real", text: "La primera es «lo tengo que pensar». La verdadera aparece cuando preguntás qué le faltó." },
    { id: "g2c2", t: "step", k: "sdr", r: 1, c: 3, n: "3", title: "La rompés", d: "Con la pieza que corresponde a esa objeción, no con el paquete genérico.",
      ex: [{ type: "wa", head: "Después de la llamada", lines: ["Te paso el caso de una marca igual a la tuya: [testimonio]. Y si querés verlo con tus números, acá elegís horario: [link del formulario]."] }] },
    { id: "g2d", t: "dec", r: 1, c: 4, title: "¿La objeción es de miedo o de fit?",
      branches: [["Miedo", "Hay fit: agendás con el formulario y sigue como el Grupo 1."], ["Sin fit", "No lo agendás: le mandás el recurso que le sirve y queda para el próximo ciclo."]],
      rule: "El que no califica para Génesis sí tiene fit: se agenda igual y el closer le presenta la Mentoría. Sin fit real es el que no tiene un consumible propio o no tiene intención de invertir." },
    { id: "g2dno", t: "no", r: 1, c: 4, below: true, from: "g2d", text: "Si no hay fit real, no lo agendes: le mandás el recurso que le sirve y queda para el próximo ciclo.", act: "↺ Próximo ciclo" },
    { id: "g2e", t: "step", k: "sdr", r: 1, c: 5, n: "4", title: "Agendás", d: "Formulario con el Calendly adentro, y de ahí sigue exactamente como el Grupo 1.",
      ex: [{ type: "wa", head: "WhatsApp", lines: ["Dale, lo vemos con tus números. Acá elegís el horario con [closer]: [link del formulario]."] }] },

    { id: "s53", t: "start", r: 2, c: 0, title: "Grupo 3 · No asistió" },
    { id: "g3a", t: "step", k: "sdr", r: 2, c: 1, n: "1", title: "Los llamás", d: "El objetivo no es agendar: es volver a meterlo en el proceso.",
      ex: [{ type: "call", head: "Llamada a un lead del Grupo 3", lines: [["SDR", "Soy [tu nombre], del equipo de Manu. Te llamo porque te anotaste a la clase de ayer y no te vi. ¿Qué pasó? ¿Y cómo venís con la marca?"]] }] },
    { id: "ng3a", t: "note", r: 2, c: 1, below: true, from: "g3a", lab: "Excepción", text: "Si en la llamada aparece temperatura, agendás directo. No lo mandes a ver la repetición por respetar el orden." },
    { id: "g3b", t: "step", k: "sdr", r: 2, c: 2, n: "2", title: "Repetición o el recurso que le sirve", d: "Uno solo, elegido por lo que te contó. Nunca los dos links en el mismo mensaje.",
      ex: [{ type: "wa", head: "Después de la llamada", lines: ["Te paso la repetición: [LINK REPLAY]. Si vas con poco tiempo, arrancá en [minuto], que es donde Manu habla de los CPA."] }] },
    { id: "g3d", t: "dec", r: 2, c: 3, title: "¿Lo vio?",
      branches: [["Sí", "Agendás con el mismo formulario y sigue como el Grupo 1."], ["No", "Seguís la cadencia con el recurso como excusa. Si no lo abre en la ventana, próximo ciclo."]],
      ex: [{ type: "wa", head: "Si lo vio", lines: ["¿Qué te pareció? Si querés verlo con tus números, acá elegís horario: [link del formulario]."] }] },
    { id: "g3dno", t: "no", r: 2, c: 3, below: true, from: "g3d", text: "Seguís la cadencia con el recurso como excusa. Si no lo abre antes del 22/10, queda para el próximo ciclo.", act: "↺ Próximo ciclo" },
    { id: "g3e", t: "step", k: "sdr", r: 2, c: 4, n: "3", title: "Agendás", d: "Mismo formulario, y sigue como el Grupo 1.",
      ex: [{ type: "wa", head: "WhatsApp", lines: ["Buenísimo. Acá elegís el horario con [closer]: [link del formulario]. Ojo que hasta el jueves 22 a las 23:59 tenemos lugar."] }] }
   ],
   edges: [["s51","g1a","h"],["g1a","ng1a","n"],["g1a","g1b","h"],["g1b","g1c2","h"],["g1c2","m51","h"],

 { id: "f6", tab: "06 El núcleo", chip: "NÚCLEO", title: "Las tres piezas y la llamada de venta", meta: "SDR + closer · hasta el 22/10 23:59", color: "var(--p6)", rows: [140, 600],
   nodes: [
    { id: "s6", t: "start", r: 0, c: 0, title: "Entran las 4 puertas" },
    { id: "ns6", t: "note", r: 0, c: 0, below: true, from: "s6", lab: "Las 4 puertas", text: "Pre-venta · asistió y agendó · asistió y no agendó · no asistió. Todas reciben lo mismo, ruteado por sus respuestas." },
    { id: "vid", t: "step", k: "sdr", r: 0, c: 1, n: "1", title: "Video de la oferta o roadmap", d: "Primero entiende a dónde va y cómo se llega. Elegido por el objetivo que declaró.",
      ex: [{ type: "wa", head: "Por el grupo, a Martín", lines: ["Para que llegues a la llamada con el panorama completo: este video es el camino para poder pagar más por cliente y escalar, paso a paso. [link]"] }] },
    { id: "recu", t: "step", k: "sdr", r: 0, c: 2, n: "2", title: "Recurso sobre su problema", d: "Después ve que su cuello de botella puntual tiene salida. Elegido por el problema que declaró.",
      ex: [{ type: "wa", head: "Por el grupo, a Martín", lines: ["Me dijiste que lo que más te frena es que el CPA sube todos los meses. Esto es puntualmente para eso: [SOP de la Skool]"] }] },
    { id: "test", t: "step", k: "sdr", r: 0, c: 3, n: "3", title: "Testimonio de su misma situación", d: "Y al final ve a alguien igual a él que ya lo logró. Elegido por su situación.",
      ex: [{ type: "wa", head: "Por el grupo, a Martín", lines: ["Y esto te lo quería mostrar: [caso] estaba igual que vos, con una marca de limpieza y el CPA por las nubes. Mirá cómo le fue. [testimonio]"] }] },
    { id: "ntest", t: "note", r: 0, c: 3, below: true, from: "test", lab: "Por qué cierra el testimonio", text: "Mata la última objeción, la que nadie dice: «a mí esto no me va a funcionar». Por eso va último." },
    { id: "cons", t: "dec", r: 0, c: 4, title: "¿Consumió las piezas?",
      branches: [["Sí", "Recordatorios de la llamada."], ["No", "No la des por perdida: preguntá qué le resonó."]],
      ex: [{ type: "wa", head: "WhatsApp", lines: ["¿Llegaste a ver lo que te mandé? ¿Qué fue lo que más te resonó?"] }] },
    { id: "consno", t: "no", r: 0, c: 4, below: true, from: "cons", text: "No la des por perdida: preguntá qué le resonó de la que sí abrió. Si no vio nada, el closer entra sabiéndolo y arranca más abajo.", act: "↺ Avisar al closer" },
    { id: "recl", t: "step", k: "sdr", r: 0, c: 5, n: "4", title: "Recordatorios de la llamada", d: "Día anterior y dos horas antes, pidiendo un ok cada vez. El ok sostiene la asistencia.",
      ex: [{ type: "wa", head: "El día anterior", lines: ["Mañana a las 11 hablás con [closer]. ¿Seguís firme? Tirame un ok."] }, { type: "wa", head: "Si no se presenta", lines: ["Martín, [closer] te estaba esperando. ¿Pasó algo? Elegí otro horario acá: [link del formulario]."] }] },
    { id: "lv", t: "step", k: "closer", r: 1, c: 0, n: "5", title: "La llamada de venta", d: "Las 7 fases, de conexión a presentación. Génesis si califica; Mentoría si no.",
      ex: [{ type: "closer", head: "Con Martín (califica)", lines: [["Closer", "Génesis es una consultoría de 4 meses, 1 a 1 y hecha por nosotros, para que pases tu marca de pagar cada cliente de nuevo a una base de suscriptores que cobra sola todos los meses, sin frenar lo que hoy vendés."], ["Closer", "La inversión es de USD 5.000, para que puedas pagar por cada cliente más que esas siete marcas. ¿Alguna duda de cómo funciona?"]] }, { type: "closer", head: "Con Lucía (no califica)", lines: [["Closer", "Lucía, te hablo con total sinceridad. Génesis hoy no es para vos: lo armamos para marcas de consumibles químicos que ya facturan más de 30 millones por mes. Si hoy te vendiera Génesis, te estaría cobrando por instalar una suscripción sobre una base que todavía no tenés, y la cuenta no te cerraría. Primero necesitás que la marca venda todos los meses de forma constante. Para eso tenemos otro programa. ¿Te lo muestro?"]] }],
      rule: "Después del precio, silencio. Las cuotas aparecen solo si sale la objeción de plata. El precio no se baja nunca." },
    { id: "nlv", t: "note", r: 1, c: 0, below: true, from: "lv", lab: "Qué se ofrece", text: "Califica (químico + más de 30M): Génesis. No califica: Mentoría, explicándole de su lado por qué Génesis hoy no le sirve." },
    { id: "cls1", t: "route", r: 1, c: 1, lab: "Clase", title: "Las 7 fases de la llamada", text: "Conexión → situación → problema → solución → compromiso → consecuencia → presentación." },
    { id: "cls2", t: "route", r: 1, c: 2, lab: "Clase", title: "Proceso B2B", text: "El dueño de marca compra con criterio de negocio: de igual a igual, con números." },
    { id: "cls3", t: "route", r: 1, c: 3, lab: "Clase", title: "Presentación y objeciones", text: "Los 3 pilares atados a sus problemas. La matriz de objeciones, con el 22/10 como fecha de cierre real." },
    { id: "cer", t: "dec", r: 1, c: 4, title: "¿Cerró?",
      branches: [["Sí", "El closer manda el link de pago y, con el pago, onboarding."], ["No", "Seguimiento del closer sobre la objeción viva, dentro de la ventana."]],
      ex: [{ type: "note", head: "Cómo terminan nuestros dos leads", lines: ["Martín → Génesis, 3 cuotas de USD 2.000", "Lucía → Mentoría, 2 cuotas de USD 1.100"] }] },
    { id: "cerno", t: "no", r: 1, c: 4, below: true, from: "cer", text: "Seguimiento post-llamada sobre la objeción que quedó viva, hasta el 22/10 23:59. Si se cae, vuelve a la lista del próximo ciclo con lo que ya sabés de él.", act: "↺ Seguimiento" },
    { id: "venta", t: "mile", r: 1, c: 5, lab: "Milestone", title: "Venta", text: "Génesis USD 5.000 (2 × 2.850 o 3 × 2.000) · Mentoría USD 2.000 (2 × 1.100). Pasa a onboarding." },

  let h = `<div class="kindrow">${kind}</div>`;
  if (n.d) h += `<section><h3>Qué se hace</h3><p>${esc(n.d)}</p></section>`;
  if (n.branches) h += `<section><h3>Salidas</h3>${n.branches.map(([a, b], i) => `<div class="br"><span class="pill${i === 1 ? " no" : ""}">${esc(a)}</span><span>${esc(b)}</span></div>`).join("")}</section>`;
  if (n.ex) {
    const tabsH = n.ex.length > 1 ? `<div class="extabs" role="tablist">${n.ex.map((ex, i) => `<button type="button" class="extab" role="tab" data-t="${i}" aria-selected="${i === 0}" title="${esc(ex.head)}">${esc(ex.head)}</button>`).join("")}</div>` : "";
    h += `<section><h3>Ejemplo con nuestro caso${n.ex.length > 1 ? ` · ${n.ex.length} variantes` : ""}</h3>${tabsH}<div id="exslot">${exHtml(n.ex[0], 0)}</div></section>`;
  }
  if (n.rule) h += `<section><h3>La regla</h3><div class="rule">${esc(n.rule)}</div></section>`;
  const body = document.getElementById("pbody"); body.innerHTML = h; body.scrollTop = 0;
  wireCopy(body, n);
  body.querySelectorAll(".extab").forEach(t => t.addEventListener("click", () => {
    body.querySelectorAll(".extab").forEach(x => x.setAttribute("aria-selected", x === t ? "true" : "false"));
    const slot = document.getElementById("exslot"); slot.innerHTML = exHtml(n.ex[+t.dataset.t], +t.dataset.t); wireCopy(slot, n);
  }));
  const q = seqOf(n.frame), i = q.indexOf(id);
  document.getElementById("ppos").textContent = `${i + 1} de ${q.length} en esta fase`;
  document.getElementById("pprev").disabled = i <= 0;
  document.getElementById("pnext").disabled = i >= q.length - 1;
  panel.hidden = false;
  document.body.classList.add("panel-open");
  reveal(id);
}
document.getElementById("pprev").onclick = () => stepBy(-1);
document.getElementById("pnext").onclick = () => stepBy(1);

/* ---------- Minimapa ---------- */
const mmEl = document.getElementById("mm"); let mmSc = 1;
function drawMini() {
  mmSc = 216 / WW; const H = world.offsetHeight * mmSc;
  mmEl.style.height = Math.max(40, H) + "px";
  mmEl.innerHTML = FRAMES.map(f => `<div class="mf" style="left:${f.x * mmSc}px;top:${f.y * mmSc}px;width:${FW * mmSc}px;height:${f.h * mmSc}px;background:${f.color}"></div>`).join("") + `<div class="vw" id="mmv"></div>`;
  updMini();
}
function updMini() {
  const v = document.getElementById("mmv"); if (!v) return;
  v.style.left = (-cam.x / cam.s) * mmSc + "px"; v.style.top = (-cam.y / cam.s) * mmSc + "px";
  v.style.width = (innerWidth / cam.s) * mmSc + "px"; v.style.height = (innerHeight / cam.s) * mmSc + "px";
  const cur = tabs.querySelector('.tab[aria-current="true"]'); document.getElementById("mmf").textContent = cur ? cur.textContent : "";
}
let mmDown = false;
const mmMove = e => { const r = mmEl.getBoundingClientRect(); const wx = (e.clientX - r.left) / mmSc, wy = (e.clientY - r.top) / mmSc; cam.x = innerWidth / 2 - wx * cam.s; cam.y = innerHeight / 2 - wy * cam.s; apply(); };
mmEl.addEventListener("pointerdown", e => { mmDown = true; try { mmEl.setPointerCapture(e.pointerId); } catch (_) {} mmMove(e); });
mmEl.addEventListener("pointermove", e => { if (mmDown) mmMove(e); });
mmEl.addEventListener("pointerup", () => { mmDown = false; });

function closePanel() { panel.hidden = true; document.body.classList.remove("panel-open"); if (active) { byId[active].el.classList.remove("active"); active = null; } }
document.getElementById("pclose").onclick = closePanel;
panel.addEventListener("pointerdown", e => e.stopPropagation());
panel.addEventListener("wheel", e => e.stopPropagation(), { passive: true });

/* ---------- Tema ---------- */
const themeBtn = document.getElementById("themebtn");
const isDark = () => { const t = document.documentElement.getAttribute("data-theme"); return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; };
function syncThemeBtn() { const d = isDark(); document.getElementById("themelab").textContent = d ? "Modo claro" : "Modo oscuro"; themeBtn.setAttribute("aria-label", d ? "Cambiar a modo claro" : "Cambiar a modo oscuro"); }
try { const saved = localStorage.getItem("mapa-ventas-tema"); if (saved === "dark" || saved === "light") document.documentElement.setAttribute("data-theme", saved); } catch (_) {}
themeBtn.addEventListener("click", () => { const next = isDark() ? "light" : "dark"; document.documentElement.setAttribute("data-theme", next); try { localStorage.setItem("mapa-ventas-tema", next); } catch (_) {} syncThemeBtn(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncThemeBtn);
syncThemeBtn();

/* ---------- Arranque ---------- */
function boot() {
  layout();
  // abre en la Fase 01, con el mensaje inicial a la vista
  const f = FRAMES[0];
  if (innerWidth > 720) document.body.classList.add("panel-open");
  const t = innerWidth <= 720 ? { s: 0.55, x: 16 - 20 * 0.55, y: 130 - (f.y + 10) * 0.55 } : fitRect(f.x, f.y, FW, f.h, 24);
  Object.assign(cam, t); apply();
  if (innerWidth > 720) openPanel("msg");
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(boot); else boot();
addEventListener("resize", () => { layout(); apply(); });
</script>
