<title>Mapa de ventas Génesis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: tablero infinito estilo pizarra (fondo punteado) con un marco por fase; barra de fases arriba, zoom abajo a la derecha, panel de ejemplo a la derecha. Un solo look claro, a propósito. */
:root {
  color-scheme: light;
  --board: #f6f4ef;
  --dot: #d8d3c8;
  --frame: #ffffff;
  --ink: #1b1c1e;
  --muted: #6c6b66;
  --line: #e2ded4;
  --edge: #2a2b2d;
  --sdr: #c2410c;
  --closer: #4f46e5;
  --form: #475569;
  --dec-bg: #fff3ea;
  --dec-line: #f2b48c;
  --dec-ico: #ea580c;
  --no-bg: #fdf1f0;
  --no-line: #efb4ad;
  --no-ink: #b42318;
  --note-bg: #fbf5e2;
  --note-line: #d9a72b;
  --note-ink: #8a6100;
  --yes: #15803d;
  --bubble: #dcf8c6;
  --bubble-ink: #14280c;
  --p1: #3b5bdb; --p2: #e8590c; --p3: #b08900; --p4: #d6336c; --p5: #7048e8; --p6: #2b8a3e;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", "SFMono-Regular", Menlo, monospace;
}
html, body { height: 100%; }
body { background: var(--board); color: var(--ink); font-family: var(--font-body); overflow: hidden; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }

#viewport { position: fixed; inset: 0; overflow: hidden; cursor: grab; touch-action: none;
  background-color: var(--board);
  background-image: radial-gradient(var(--dot) 1.2px, transparent 1.3px);
  background-size: 22px 22px; }
#viewport.dragging { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; z-index: 1; }

/* Barra superior */
.topbar { position: fixed; left: 16px; right: 16px; top: calc(14px + env(safe-area-inset-top, 0px)); display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; pointer-events: none; z-index: 5; }
.brand, .tabs { pointer-events: auto; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 2px 10px rgba(30,25,15,.06); }
.brand { display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 10px; }
.brand .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--sdr); color: #fff; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 15px; }
.brand b { display: block; font-size: 14px; font-weight: 700; }
.brand small { display: block; font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
.tabs { display: flex; align-items: center; gap: 2px; padding: 4px; overflow-x: auto; max-width: 100%; scrollbar-width: none; }
.tab { border: 0; background: transparent; border-radius: 8px; padding: 7px 10px; font-size: 13px; font-weight: 500; white-space: nowrap; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.tab i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.tab:hover { background: #f3f1ec; }
.tab[aria-current="true"] { background: #f3f1ec; font-weight: 700; }
.tab.mapa { color: var(--sdr); font-weight: 700; }
.tab:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }

/* Controles */
.zoom { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; z-index: 5; }
.zoom button { width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--line); background: #fff; font-size: 18px; cursor: pointer; box-shadow: 0 2px 8px rgba(30,25,15,.06); }
.zoom button:focus-visible { outline: 2px solid var(--ink); }
.zoom .pct { font-family: var(--font-mono); font-size: 10.5px; text-align: center; color: var(--muted); }
.hint { position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; z-index: 5; max-width: calc(100% - 100px); }

/* Marcos */
.frame { position: absolute; background: var(--frame); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 4px 24px rgba(30,25,15,.06); }
.frame::before { content: ""; position: absolute; left: -1px; right: -1px; top: -1px; height: 5px; border-radius: 16px 16px 0 0; background: var(--fc); }
.fhead { position: absolute; left: 28px; top: 26px; right: 28px; display: flex; align-items: center; gap: 16px; cursor: zoom-in; }
.fchip { font-family: var(--font-mono); font-size: 13px; letter-spacing: .14em; color: var(--fc); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; background: #fff; white-space: nowrap; }
.ftitle { font-family: var(--font-display); font-weight: 800; font-size: 30px; letter-spacing: -.01em; }
.fmeta { font-size: 14px; color: var(--muted); margin-left: auto; }
.fsep { position: absolute; left: 0; right: 0; top: 96px; border-top: 1px solid var(--line); }
.board-title { position: absolute; left: 0; top: 0; }
.board-title h1 { font-family: var(--font-display); font-weight: 800; font-size: 56px; margin: 0; letter-spacing: -.02em; }
.board-title p { margin: 8px 0 0; font-size: 18px; color: var(--muted); max-width: 900px; line-height: 1.45; }
.personas { display: flex; gap: 16px; margin-top: 22px; }
.persona { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; width: 470px; font-size: 15px; line-height: 1.45; }
.persona .pt { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
.persona b { display: block; font-family: var(--font-display); font-size: 22px; margin: 2px 0 4px; }
.persona p { margin: 0; color: var(--muted); }

/* Nodos */
.n { position: absolute; width: 200px; border-radius: 10px; font-size: 12.5px; line-height: 1.42; text-align: left; }
.n.step, .n.dec { cursor: pointer; }
.n:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.n.step { background: #fff; border: 1px solid var(--line); padding: 12px 14px 12px; box-shadow: 0 1px 3px rgba(30,25,15,.05); }
.n.step:hover, .n.dec:hover { box-shadow: 0 0 0 2px var(--ink); }
.n.active { box-shadow: 0 0 0 2.5px var(--ink) !important; }
.badge { display: inline-block; font-family: var(--font-mono); font-size: 9.5px; font-weight: 700; letter-spacing: .08em; border: 1px solid currentColor; border-radius: 999px; padding: 1px 6px; margin-right: 6px; vertical-align: 1px; text-transform: uppercase; }
.k-sdr { color: var(--sdr); } .k-closer { color: var(--closer); } .k-form { color: var(--form); }
.n .tt { font-weight: 700; font-size: 13.5px; color: var(--ink); }
.n .dd { color: var(--muted); margin-top: 5px; }
.n .ver { display: inline-block; margin-top: 9px; font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; color: var(--muted); }
.n.start { background: var(--ink); color: #fff; border-radius: 10px; padding: 14px 16px; font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
.n.dec { background: var(--dec-bg); border: 1px solid var(--dec-line); padding: 11px 14px 11px 34px; font-weight: 700; font-size: 13px; }
.n.dec::before { content: ""; position: absolute; left: 13px; top: 15px; width: 10px; height: 10px; background: var(--dec-ico); transform: rotate(45deg); border-radius: 2px; }
.n.dec .dd { font-weight: 400; }
.n.no { background: var(--no-bg); border: 1px solid var(--no-line); border-left: 3px solid var(--no-ink); padding: 11px 13px; color: #5b3a36; font-size: 12px; }
.n.no .act { margin-top: 8px; font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--no-ink); }
.n.note { background: var(--note-bg); border: 1px solid #efe1b4; border-left: 3px solid var(--note-line); padding: 11px 13px; color: #4a3d1a; font-size: 12px; }
.n.note .lab, .n.mile .lab, .n.yesbox .lab { font-family: var(--font-mono); font-size: 9.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--note-ink); margin-bottom: 4px; }
.n.mile { background: #fff; border: 1.5px solid var(--ink); padding: 14px 16px; text-align: center; border-radius: 12px; }
.n.mile .lab { color: var(--sdr); }
.n.mile .tt { font-family: var(--font-display); font-size: 19px; font-weight: 800; line-height: 1.15; }
.n.mile .dd { margin-top: 6px; }
.n.jump { background: #fff; border: 1.5px dashed var(--fc2, var(--ink)); padding: 12px 14px; cursor: pointer; }
.n.jump .lab { font-family: var(--font-mono); font-size: 9.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--fc2, var(--ink)); }
.n.jump:hover { box-shadow: 0 0 0 2px var(--fc2, var(--ink)); }
.n.route { background: #fff; border: 1px solid var(--line); padding: 11px 13px; }
.n.route .lab { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--sdr); margin-bottom: 3px; }
.elab { font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: .06em; }

/* Panel */
.panel { position: fixed; right: 16px; top: calc(78px + env(safe-area-inset-top, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: 410px; max-width: calc(100% - 32px); background: #fff; border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 12px 40px rgba(30,25,15,.16); z-index: 6; display: flex; flex-direction: column; }
.panel[hidden] { display: none !important; }
.ph { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 4px; position: relative; }
.ph .close { position: absolute; right: 12px; top: 12px; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 12.5px; }
.ph .fase { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; }
.ph h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 22px; line-height: 1.15; padding-right: 64px; text-wrap: balance; }
.pb { padding: 14px 18px 22px; overflow-y: auto; display: grid; gap: 16px; align-content: start; font-size: 14.5px; line-height: 1.5; }
.pb h3 { margin: 0 0 8px; font-family: var(--font-mono); font-weight: 500; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.pb p { margin: 0; }
.ex { display: grid; gap: 8px; margin-bottom: 12px; }
.exh { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.copy { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 3px 10px; cursor: pointer; font-size: 12px; }
.copy:focus-visible, .ph .close:focus-visible { outline: 2px solid var(--ink); }
.bubble { background: var(--bubble); color: var(--bubble-ink); border-radius: 12px 12px 12px 4px; padding: 10px 12px; display: grid; gap: 8px; }
.call { border-left: 3px solid var(--sdr); padding: 2px 0 2px 12px; display: grid; gap: 8px; }
.call.closer { border-left-color: var(--closer); }
.call .w { font-weight: 700; }
.call .w.l { color: var(--muted); }
.notebox { background: #f6f4ef; border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; }
.rule { border: 1px dashed var(--note-line); background: var(--note-bg); border-radius: 10px; padding: 10px 12px; }
.br { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; margin-bottom: 6px; }
.pill { font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #e6f4ea; color: var(--yes); }
.pill.no { background: var(--no-bg); color: var(--no-ink); }

body.panel-open .zoom { right: 442px; }
@media (max-width: 720px) {
  body.panel-open .zoom { right: 16px; bottom: calc(70% + 12px); }
  .brand small { display: none; }
  .hint { display: none; }
  .panel { left: 0; right: 0; bottom: 0; top: auto; width: auto; max-width: none; max-height: 70%; border-radius: 16px 16px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .zoom { bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
}
</style>

<div id="viewport" aria-label="Tablero del proceso de ventas. Arrastrá para moverte, usá la rueda o los botones para hacer zoom.">
  <div id="world">
    <svg id="edges"></svg>
  </div>
</div>

<div class="topbar">
  <div class="brand"><span class="logo">G</span><span><b>Mapa de ventas</b><small>Génesis · clase 19/10</small></span></div>
  <nav class="tabs" id="tabs" aria-label="Fases"></nav>
</div>

<div class="zoom">
  <button type="button" id="zin" aria-label="Acercar">+</button>
  <button type="button" id="zout" aria-label="Alejar">−</button>
  <button type="button" id="zfit" aria-label="Ver todo el mapa">⤢</button>
  <div class="pct" id="pct">100%</div>
</div>
<div class="hint">Rueda = zoom · arrastrá para moverte · clic en un paso = ejemplo · clic en una fase = acercar</div>

<aside class="panel" id="panel" hidden aria-live="polite">
  <div class="ph"><button class="close" type="button" id="pclose">Cerrar</button><span class="fase" id="pfase"></span><h2 id="ptitle"></h2></div>
  <div class="pb" id="pbody"></div>
</aside>

<script>
/* ---------- Datos ---------- */
const COLS = [40, 285, 530, 775, 1020, 1265, 1510];
const FW = 1760;
const B = 200; // desplazamiento de las cajas de abajo (no / nota)

const FRAMES = [
 { id: "f1", tab: "01 Primer contacto", chip: "FASE 01", title: "Del opt-in a la calificación", meta: "SDR · apenas entra el opt-in", color: "var(--p1)", rows: [140, 600],
   nodes: [
    { id: "s1", t: "start", r: 0, c: 0, title: "Entra el opt-in" },
    { id: "optin", t: "step", k: "form", r: 0, c: 1, n: "1", title: "Lo que captura el formulario", d: "Nombre · email · teléfono · facturación · si vende un producto consumible.",
      ex: [{ type: "note", head: "Lo que ve el SDR en GHL", lines: ["Nombre: Martín", "Email: martin@[marca].com", "Teléfono: +54 9 11 [número]", "Facturación: entre 30 y 60 millones por mes", "¿Vende un producto consumible?: Sí, productos de limpieza"] }, { type: "note", head: "Lo que puso Lucía", lines: ["Facturación: menos de 30 millones por mes", "¿Vende un producto consumible?: Sí, limpieza ecológica"] }],
      rule: "Las respuestas del formulario son lo primero que lee el SDR. Lo que el lead ya contestó no se le vuelve a preguntar: se confirma." },
    { id: "nopt", t: "note", r: 0, c: 1, below: true, from: "optin", lab: "Regla", text: "Facturación y consumible ya te dicen si probablemente califica. Igual lo confirmás hablando: el formulario no alcanza." },
    { id: "msg", t: "step", k: "sdr", r: 0, c: 2, n: "2", title: "Mensaje inicial", d: "Te presentás, nombrás la clase y el recurso que ya recibió, usás lo que puso y le proponés llamarlo.",
      ex: [{ type: "wa", head: "WhatsApp a Martín, apenas se anota", lines: ["Hola Martín, ¿cómo va? Soy [tu nombre], del equipo de Manu Dominguez. Vi que te anotaste a la clase en vivo del lunes 19 y que ya te llegó [recurso del opt-in].", "Me quedé con lo que pusiste: que venden productos de limpieza y facturan entre 30 y 60 millones por mes. Te quiero armar un recurso puntual para tu marca, pero antes necesito entender cómo vienen.", "¿Te llamo 10 minutos? ¿O preferís contarme por acá?"] }],
      rule: "Doble salida a propósito: el que no quiere hablar igual entra al proceso por chat." },
    { id: "nmsg", t: "note", r: 0, c: 2, below: true, from: "msg", lab: "Doble salida", text: "«¿Te llamo? ¿O preferís contarme por acá?». El que no quiere hablar igual entra al proceso." },
    { id: "d5", t: "dec", r: 0, c: 3, title: "¿Contestó en 5 minutos?",
      branches: [["Sí", "Seguís por las ramas del chat."], ["No", "Lo llamás dos veces seguidas."]],
      ex: [{ type: "wa", head: "Si no atiende las dos llamadas", lines: ["Te acabo de llamar por lo del recurso para tu marca. ¿Te queda mejor hoy a la tarde o mañana a la mañana?"] }] },
    { id: "d5no", t: "no", r: 0, c: 3, below: true, from: "d5", text: "Llamás igual, dos veces seguidas. La primera la ve como número raro; la segunda, como algo que pasa.", act: "↺ Llamar" },
    { id: "ramas", t: "step", k: "sdr", r: 0, c: 4, n: "3", title: "Ramas del chat", d: "Pide info por escrito · no puede ahora · pregunta el precio · está arrancando. Todas terminan en un horario.",
      ex: [{ type: "wa", head: "Pide la info por escrito", lines: ["Te la puedo mandar, pero sin saber cómo vienen te mandaría algo genérico, y eso ya lo tenés. Si te queda más cómodo, mandame un audio contándome cómo vienen y con eso arranco."] }, { type: "wa", head: "Pregunta el precio", lines: ["Depende de tu caso, por eso no te tiro un número al aire. Primero veo cómo vienen y, si tiene sentido, lo ves con tus números en una llamada. ¿Te llamo hoy a las 18 o mañana a las 11?"] }, { type: "wa", head: "No puede ahora", lines: ["Dale, sin drama. ¿Te queda mejor hoy a las 18 o mañana a las 11?"] }],
      rule: "La línea que más rinde: «mandame audio si querés». El audio da diez veces más información que el texto." },
    { id: "nramas", t: "note", r: 0, c: 4, below: true, from: "ramas", lab: "La línea que más rinde", text: "«Mandame audio si querés». Te da diez veces más información que el texto y escuchás el tono." },
    { id: "aten", t: "dec", r: 0, c: 5, title: "¿Atendió?",
      branches: [["Sí", "Apertura de la llamada."], ["No", "Cadencia hasta la clase: llamada, texto y audio, turnándose."]],
      ex: [{ type: "wa", head: "Audio del día 2 de la cadencia (30 s)", lines: ["Hola Martín, soy [tu nombre], del equipo de Manu. Vi que pusiste que venden productos de limpieza. Lo que Manu va a mostrar el lunes es justo para marcas como la tuya. Te quiero armar algo puntual, pero necesito diez minutos para entender cómo vienen. Decime qué horario te queda y te llamo."] }] },
    { id: "atenno", t: "no", r: 0, c: 5, below: true, from: "aten", text: "«Te llamé para armarte el recurso pero todavía no conozco lo que estás haciendo». Llamada, texto y audio hasta la clase.", act: "↺ Seguir la cadencia" },
    { id: "aper", t: "step", k: "sdr", r: 1, c: 0, n: "4", title: "Apertura", d: "«¿Pudiste ver el mensaje que te envié?». Si no te ubica, te volvés a presentar.",
      ex: [{ type: "call", head: "Llamada con Martín", lines: [["SDR", "Buenas Martín, ¿cómo vas? ¿Pudiste ver el mensaje que te envié?"], ["Martín", "Sí, vi algo, pero no me acuerdo bien."], ["SDR", "Soy [tu nombre], del equipo de Manu Dominguez. Te anotaste a la clase en vivo del lunes 19, la de cómo pasar tu marca al modelo de suscripción. ¿Te acordás?"]] }] },
    { id: "razones", t: "step", k: "sdr", r: 1, c: 1, n: "5", title: "Las dos razones", d: "Conocer su marca para mandarle un recurso a medida, y ver si califica para los lugares que quedan.",
      ex: [{ type: "call", head: "Llamada con Martín", lines: [["SDR", "Te cuento por qué te llamo, son dos cosas. Una: quiero conocer un poco tu marca para mandarte un recurso armado para tu caso, no algo genérico. Y dos: Manu toma pocas marcas para trabajar con él, y quiero ver si la tuya podría calificar para alguno de los lugares que quedan. ¿Todo check hasta acá?"]] }],

    { id: "sit", t: "step", k: "sdr", r: 1, c: 2, n: "6", title: "Situación", d: "Qué vende y por dónde, cuánto factura y cuánto le queda, equipo, objetivo y qué lo frena.",

 { id: "f3", tab: "03 Ruta a la clase", chip: "FASE 03", title: "No califica todavía: ruta a la clase", meta: "SDR · en la misma llamada · ej. Lucía", color: "var(--p3)", rows: [140, 600],

    { id: "edup", t: "step", k: "sdr", r: 0, c: 1, n: "1", title: "Educás sobre el problema", d: "En la misma llamada. Le mostrás que lo que cree que le pasa no es lo que le pasa.",

    { id: "nsop", t: "note", r: 0, c: 3, below: true, from: "sop", lab: "Doble función", text: "Cumple la promesa y te deja el pretexto del seguimiento: «¿pudiste aplicar lo del SOP?»." },

function layout() {
  // alto de cada marco según su contenido, y posición vertical encadenada
  FRAMES.forEach(f => {
    let maxB = 0;
    f.nodes.forEach(n => { const e = byId[n.id].el; maxB = Math.max(maxB, e.offsetTop + e.offsetHeight); });
    f.h = maxB + 56; f.el.style.height = f.h + "px";
  });
  // dos columnas: 01-02, 03-04, 05-06
  let yy = TOP;
  for (let i = 0; i < FRAMES.length; i += 2) {
    const row = FRAMES.slice(i, i + 2);
    row.forEach((f, j) => { f.x = j * (FW + GAP); f.y = yy; f.el.style.left = f.x + "px"; f.el.style.top = yy + "px"; });
    yy += Math.max(...row.map(f => f.h)) + GAP;
  }
  WW = FW * 2 + GAP;
  world.style.width = WW + "px"; world.style.height = yy + "px";
  drawEdges();
}
function box(id) { const n = byId[id]; const e = n.el; const x = n.frame.x + e.offsetLeft, yv = n.frame.y + e.offsetTop; return { x, y: yv, w: e.offsetWidth, h: e.offsetHeight, f: n.frame }; }
function drawEdges() {
  const ns = "http://www.w3.org/2000/svg";
  svg.innerHTML = "";
  svg.setAttribute("width", WW); svg.setAttribute("height", world.offsetHeight);
  const defs = document.createElementNS(ns, "defs");
  defs.innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2a2b2d"/></marker>`;
  svg.appendChild(defs);
  const path = (d, dashed) => { const p = document.createElementNS(ns, "path"); p.setAttribute("d", d); p.setAttribute("fill", "none"); p.setAttribute("stroke", "#2a2b2d"); p.setAttribute("stroke-width", dashed ? "1.6" : "1.8"); if (dashed) p.setAttribute("stroke-dasharray", "5 5"); p.setAttribute("marker-end", "url(#ah)"); svg.appendChild(p); };
  const label = (x, yv, t, color) => { const tx = document.createElementNS(ns, "text"); tx.setAttribute("x", x); tx.setAttribute("y", yv); tx.setAttribute("class", "elab"); tx.setAttribute("fill", color); tx.setAttribute("font-family", "JetBrains Mono, monospace"); tx.setAttribute("font-size", "11"); tx.setAttribute("font-weight", "700"); tx.textContent = t; svg.appendChild(tx); };
  FRAMES.forEach(f => f.edges.forEach(([a, b, type, lab]) => {
    const A = box(a), Bx = box(b);
    const isNo = lab && /NO|SIN FIT/.test(lab);
    const col = isNo ? "#b42318" : "#15803d";
    if (type === "h") {
      const ay = A.y + Math.min(A.h / 2, 26), by = Bx.y + Math.min(Bx.h / 2, 26);
      const x1 = A.x + A.w, x2 = Bx.x - 2, mx = (x1 + x2) / 2;
      path(`M${x1} ${ay}H${mx}V${by}H${x2}`);
      if (lab) label(x1 + 6, ay - 8, lab, col);
    } else if (type === "d" || type === "n") {
      const cx = A.x + A.w / 2;
      path(`M${cx} ${A.y + A.h}V${Bx.y - 2}`, type === "n");
      if (lab) label(cx + 8, A.y + A.h + 22, lab, col);
    } else if (type === "w") {
      const ay = A.y + Math.min(A.h / 2, 26);
      const rx = A.f.x + FW - 26;
      const rowTop = Bx.y - 40;
      const cx = Bx.x + Bx.w / 2;
      path(`M${A.x + A.w} ${ay}H${rx}V${rowTop}H${cx}V${Bx.y - 2}`);
      if (lab) label(A.x + A.w + 8, ay - 8, lab, col);
    }
  }));
}

/* ---------- Cámara ---------- */
const vp = document.getElementById("viewport");
const cam = { x: 40, y: 100, s: 0.5 };
const MIN = 0.12, MAX = 2.2;
function apply() {
  world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.s})`;
  const g = 22 * cam.s;
  vp.style.backgroundSize = `${g}px ${g}px`;
  vp.style.backgroundPosition = `${cam.x}px ${cam.y}px`;
  document.getElementById("pct").textContent = Math.round(cam.s * 100) + "%";
  markTab();
}
function zoomAt(f, px, py) {
  const ns = Math.min(MAX, Math.max(MIN, cam.s * f));
  const k = ns / cam.s;
  cam.x = px - (px - cam.x) * k; cam.y = py - (py - cam.y) * k; cam.s = ns; apply();
}
let anim = null;
function flyTo(t) {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (anim) cancelAnimationFrame(anim);
  if (reduce) { Object.assign(cam, t); apply(); return; }
  const s0 = { ...cam }, t0 = performance.now(), D = 420;
  const step = now => { const p = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - p, 3);
    cam.x = s0.x + (t.x - s0.x) * e; cam.y = s0.y + (t.y - s0.y) * e; cam.s = s0.s + (t.s - s0.s) * e; apply();
    if (p < 1) anim = requestAnimationFrame(step); };
  anim = requestAnimationFrame(step);
}
function fitRect(x, yv, w, h, pad) {
  const top = 84, W = innerWidth - (document.body.classList.contains("panel-open") && innerWidth > 720 ? 442 : 0), H = innerHeight - top - 20;
  const s = Math.min(MAX, Math.max(MIN, Math.min((W - pad * 2) / w, (H - pad) / h)));
  return { s, x: (W - w * s) / 2 - x * s, y: top + (H - h * s) / 2 - yv * s };
}
function fitAll() { flyTo(fitRect(0, 0, WW, world.offsetHeight, 40)); }
function goFrame(id) { const f = FRAMES.find(x => x.id === id); flyTo(fitRect(f.x, f.y, FW, f.h, 24)); }

// arrastre + pinza
const pts = new Map(); let drag = null, pinch = null;
vp.addEventListener("pointerdown", e => {
  if (e.button !== undefined && e.button > 0) return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size === 1) drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, moved: false, target: e.target };
  if (pts.size === 2) { const [p, q] = [...pts.values()]; pinch = { d: Math.hypot(p.x - q.x, p.y - q.y), s: cam.s }; drag = null; }
});
vp.addEventListener("pointermove", e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pts.size === 2) {
    const [p, q] = [...pts.values()]; const d = Math.hypot(p.x - q.x, p.y - q.y);
    zoomAt((pinch.s * d / pinch.d) / cam.s, (p.x + q.x) / 2, (p.y + q.y) / 2); return;
  }
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) > 4) { drag.moved = true; vp.classList.add("dragging"); try { vp.setPointerCapture(e.pointerId); } catch (_) {} }
  if (drag.moved) { cam.x = drag.cx + dx; cam.y = drag.cy + dy; apply(); }
});
function endPtr(e) {
  if (!pts.has(e.pointerId)) return;
  pts.delete(e.pointerId);
  if (pts.size < 2) pinch = null;
  if (drag && !drag.moved && e.type === "pointerup") click(drag.target);
  if (pts.size === 0) { drag = null; vp.classList.remove("dragging"); }
}
vp.addEventListener("pointerup", endPtr);
vp.addEventListener("pointercancel", endPtr);
vp.addEventListener("wheel", e => { e.preventDefault(); zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0016)), e.clientX, e.clientY); }, { passive: false });

function click(t) {
  const n = t.closest && t.closest(".n");
  if (n) {
    const id = n.id.slice(2), d = byId[id];
    if (d.t === "jump") { goFrame(d.go); return; }
    if (d.ex || d.branches || d.rule) { openPanel(id); return; }
  }
  const fh = t.closest && t.closest(".fhead");
  if (fh) goFrame(fh.dataset.frame);
}
// teclado en los nodos
world.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("n")) { e.preventDefault(); click(e.target); } });
world.addEventListener("focusin", e => {
  const n = e.target.closest(".n"); if (!n) return;
  const r = n.getBoundingClientRect();
  if (r.left < 0 || r.top < 80 || r.right > innerWidth || r.bottom > innerHeight) { const b = box(n.id.slice(2)); flyTo({ s: Math.max(cam.s, 0.8), x: innerWidth / 2 - (b.x + b.w / 2) * Math.max(cam.s, 0.8), y: innerHeight / 2 - (b.y + b.h / 2) * Math.max(cam.s, 0.8) }); }
});
addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input,textarea")) return;
  if (e.key === "+" || e.key === "=") zoomAt(1.2, innerWidth / 2, innerHeight / 2);
  else if (e.key === "-") zoomAt(1 / 1.2, innerWidth / 2, innerHeight / 2);
  else if (e.key === "Escape") closePanel();
});
document.getElementById("zin").onclick = () => zoomAt(1.25, innerWidth / 2, innerHeight / 2);
document.getElementById("zout").onclick = () => zoomAt(0.8, innerWidth / 2, innerHeight / 2);
document.getElementById("zfit").onclick = fitAll;

/* ---------- Pestañas ---------- */
const tabs = document.getElementById("tabs");
const tm = document.createElement("button"); tm.type = "button"; tm.className = "tab mapa"; tm.textContent = "Mapa"; tm.onclick = fitAll; tabs.appendChild(tm);
FRAMES.forEach(f => { const b = document.createElement("button"); b.type = "button"; b.className = "tab"; b.dataset.f = f.id; b.innerHTML = `<i style="background:${f.color}"></i>${esc(f.tab)}`; b.onclick = () => goFrame(f.id); tabs.appendChild(b); });
function markTab() {
  if (cam.s < 0.3) { tabs.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-current", b.classList.contains("mapa") ? "true" : "false")); return; }
  const cx = (innerWidth / 2 - cam.x) / cam.s, cy = (innerHeight / 2 - cam.y) / cam.s;
  let cur = FRAMES[0].id, best = Infinity;
  FRAMES.forEach(f => { if (f.h == null) return; const dx = Math.max(f.x - cx, 0, cx - f.x - FW), dy = Math.max(f.y - cy, 0, cy - f.y - f.h), d = dx * dx + dy * dy; if (d < best) { best = d; cur = f.id; } });
  tabs.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-current", b.dataset.f === cur ? "true" : "false"));
}

/* ---------- Panel ---------- */
const panel = document.getElementById("panel");
let active = null;
function exHtml(ex, i) {
  let inner;
  if (ex.type === "wa") inner = `<div class="bubble">${ex.lines.map(x => `<p>${esc(x)}</p>`).join("")}</div>`;
  else if (ex.type === "call" || ex.type === "closer") inner = `<div class="call${ex.type === "closer" ? " closer" : ""}">${ex.lines.map(([w, s]) => `<p><span class="w${w === "SDR" || w === "Closer" ? "" : " l"}">${esc(w)}:</span> ${esc(s)}</p>`).join("")}</div>`;
  else inner = `<div class="notebox">${ex.lines.map(x => `<p>${esc(x)}</p>`).join("")}</div>`;
  const lab = { wa: "WhatsApp", call: "Llamada", closer: "Llamada de venta", note: "Ejemplo" }[ex.type];
  const cp = ex.type === "note" ? "" : `<button class="copy" type="button" data-i="${i}">Copiar</button>`;
  return `<div class="ex"><div class="exh"><span>${lab} · ${esc(ex.head)}</span>${cp}</div>${inner}</div>`;
}
function openPanel(id) {
  const n = byId[id];
  if (active) byId[active].el.classList.remove("active");
  active = id; n.el.classList.add("active");
  document.getElementById("pfase").textContent = `${n.frame.chip} · ${n.frame.title}`;
  document.getElementById("pfase").style.color = n.frame.color;
  document.getElementById("ptitle").textContent = n.t === "dec" ? n.title : `${n.n} · ${n.title}`;
  let h = "";
  if (n.d) h += `<section><h3>Qué se hace</h3><p>${esc(n.d)}</p></section>`;
  if (n.branches) h += `<section><h3>Salidas</h3>${n.branches.map(([a, b], i) => `<div class="br"><span class="pill${i === 1 ? " no" : ""}">${esc(a)}</span><span>${esc(b)}</span></div>`).join("")}</section>`;
  if (n.ex) h += `<section><h3>Ejemplo con nuestro caso</h3>${n.ex.map(exHtml).join("")}</section>`;
  if (n.rule) h += `<section><h3>La regla</h3><div class="rule">${esc(n.rule)}</div></section>`;
  const body = document.getElementById("pbody"); body.innerHTML = h; body.scrollTop = 0;
  body.querySelectorAll(".copy").forEach(b => b.addEventListener("click", () => {
    const ex = n.ex[+b.dataset.i];
    const text = ex.lines.map(x => Array.isArray(x) ? `${x[0]}: ${x[1]}` : x).join("\n\n");
    const done = ok => { b.textContent = ok ? "Copiado" : "Seleccioná y copiá"; setTimeout(() => b.textContent = "Copiar", 1600); };
    const sel = () => { const el = b.closest(".ex").querySelector(".bubble,.call"); const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
    try { navigator.clipboard.writeText(text).then(() => done(true), () => { sel(); done(false); }); } catch (_) { sel(); done(false); }
  }));
  panel.hidden = false;
  document.body.classList.add("panel-open");
}
function closePanel() { panel.hidden = true; document.body.classList.remove("panel-open"); if (active) { byId[active].el.classList.remove("active"); active = null; } }
document.getElementById("pclose").onclick = closePanel;
panel.addEventListener("pointerdown", e => e.stopPropagation());
panel.addEventListener("wheel", e => e.stopPropagation(), { passive: true });

/* ---------- Arranque ---------- */
function boot() {
  layout();
  // abre en la Fase 01, con el mensaje inicial a la vista
  const f = FRAMES[0];
  if (innerWidth > 720) document.body.classList.add("panel-open");
  const t = innerWidth <= 720 ? { s: 0.55, x: 16 - 20 * 0.55, y: 130 - (f.y + 10) * 0.55 } : fitRect(f.x, f.y, FW, f.h, 24);
  Object.assign(cam, t); apply();
  if (innerWidth > 720) openPanel("msg");
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(boot); else boot();
addEventListener("resize", () => { layout(); apply(); });
</script>
