function layout() {
  // alto de cada marco según su contenido, y posición vertical encadenada
  FRAMES.forEach(f => {
    let maxB = 0;
    f.nodes.forEach(n => { const e = byId[n.id].el; maxB = Math.max(maxB, e.offsetTop + e.offsetHeight); });
    f.h = maxB + 56; f.el.style.height = f.h + "px";
  });
  // f1 a la izquierda; f2 arriba y f3 abajo; f4 y f5 siguen abajo; f6 a la derecha, al medio
  const F = id => FRAMES.find(x => x.id === id);
  const gaps = [560, 340, 340, 560];
  const colX = [0]; gaps.forEach((g, i) => colX.push(colX[i] + FW + g));
  const yTop = TOP, yBot = TOP + F("f2").h + GY;
  const midY = h => (yTop + yBot + F("f3").h) / 2 - h / 2;
  const place = (id, c, yv) => { const f = F(id); f.x = colX[c]; f.y = yv; f.el.style.left = f.x + "px"; f.el.style.top = yv + "px"; };
  place("f1", 0, midY(F("f1").h));
  place("f2", 1, yTop);
  place("f3", 1, yBot);
  place("f4", 2, yBot);
  place("f5", 3, yBot);
  place("f6", 4, midY(F("f6").h));
  WW = colX[4] + FW;
  const bottom = Math.max(...FRAMES.map(f => f.y + f.h));
  world.style.width = WW + "px"; world.style.height = (bottom + 80) + "px";
  drawEdges();
  if (typeof drawMini === "function") drawMini();
}
function box(id) { const n = byId[id]; const e = n.el; const x = n.frame.x + e.offsetLeft, yv = n.frame.y + e.offsetTop; return { x, y: yv, w: e.offsetWidth, h: e.offsetHeight, f: n.frame }; }
function drawEdges() {
  const ns = "http://www.w3.org/2000/svg";
  svg.innerHTML = "";
  svg.setAttribute("width", WW); svg.setAttribute("height", world.offsetHeight);
  const defs = document.createElementNS(ns, "defs");
  defs.innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--edge)"/></marker>`;
  svg.appendChild(defs);
  const path = (d, dashed) => { const p = document.createElementNS(ns, "path"); p.setAttribute("d", d); p.setAttribute("fill", "none"); p.style.stroke = "var(--edge)"; p.setAttribute("stroke-width", dashed ? "1.6" : "1.8"); if (dashed) p.setAttribute("stroke-dasharray", "5 5"); p.setAttribute("marker-end", "url(#ah)"); svg.appendChild(p); };
  const label = (x, yv, t, color) => { const tx = document.createElementNS(ns, "text"); tx.setAttribute("x", x); tx.setAttribute("y", yv); tx.setAttribute("class", "elab"); tx.style.fill = color; tx.setAttribute("font-family", "JetBrains Mono, monospace"); tx.setAttribute("font-size", "11"); tx.setAttribute("font-weight", "700"); tx.textContent = t; svg.appendChild(tx); };
  FRAMES.forEach(f => f.edges.forEach(([a, b, type, lab]) => {
    const A = box(a), Bx = box(b);
    const isNo = lab && /NO|SIN FIT/.test(lab);
    const col = isNo ? "var(--no-ink)" : "var(--yes)";
    if (type === "h") {
      const ay = A.y + Math.min(A.h / 2, 26), by = Bx.y + Math.min(Bx.h / 2, 26);
      const x1 = A.x + A.w, x2 = Bx.x - 2, mx = (x1 + x2) / 2;
      path(`M${x1} ${ay}H${mx}V${by}H${x2}`);
      if (lab) label(x1 + 6, ay - 8, lab, col);
    } else if (type === "d" || type === "n") {
      const cx = A.x + A.w / 2;
      path(`M${cx} ${A.y + A.h}V${Bx.y - 2}`, type === "n");
      if (lab) label(cx + 8, A.y + A.h + 22, lab, col);
    } else if (type === "w") {
      const ay = A.y + Math.min(A.h / 2, 26);
      const rx = A.f.x + FW - 26;
      const rowTop = Bx.y - 40;
      const cx = Bx.x + Bx.w / 2;
      path(`M${A.x + A.w} ${ay}H${rx}V${rowTop}H${cx}V${Bx.y - 2}`);
      if (lab) label(A.x + A.w + 8, ay - 8, lab, col);
    }
  }));
  // flechas entre fases
  const big = document.createElementNS(ns, "marker");
  big.setAttribute("id", "ahb"); big.setAttribute("viewBox", "0 0 10 10"); big.setAttribute("refX", "8"); big.setAttribute("refY", "5");
  big.setAttribute("markerWidth", "5"); big.setAttribute("markerHeight", "5"); big.setAttribute("orient", "auto-start-reverse");
  big.innerHTML = `<path d="M0 0L10 5L0 10z" style="fill:var(--edge-strong)"/>`; defs.appendChild(big);
  const bigPath = (d, color) => { const p = document.createElementNS(ns, "path"); p.setAttribute("d", d); p.setAttribute("fill", "none"); p.style.stroke = color || "var(--edge-strong)"; p.setAttribute("stroke-width", "5"); p.setAttribute("stroke-linejoin", "round"); p.setAttribute("stroke-linecap", "round"); p.setAttribute("marker-end", "url(#ahb)"); svg.appendChild(p); };
  const bigLabel = (x, yv, t, color) => { const tx = document.createElementNS(ns, "text"); tx.setAttribute("x", x); tx.setAttribute("y", yv); tx.setAttribute("text-anchor", "middle"); tx.style.fill = color || "var(--edge-strong)"; tx.setAttribute("font-family", "JetBrains Mono, monospace"); tx.setAttribute("font-size", "24"); tx.setAttribute("font-weight", "700"); tx.setAttribute("letter-spacing", "1.5"); tx.style.stroke = "var(--board)"; tx.setAttribute("stroke-width", "10"); tx.setAttribute("paint-order", "stroke"); tx.textContent = t.toUpperCase(); svg.appendChild(tx); };
  const F = id => FRAMES.find(x => x.id === id);
  const H = f => f.y + 48;                       // altura del título de cada marco
  const out = f => f.x + FW + 24, inn = f => f.x - 24;
  const elbow = (a, b, ya, yb, t, color, mxo) => {     // sale de a, dobla en el hueco, entra en b
    const x1 = out(a), x2 = inn(b), mx = mxo != null ? mxo : (x1 + x2) / 2;
    bigPath(`M${x1} ${ya}H${mx}V${yb}H${x2}`, color);
    if (t) bigLabel((mx + x2) / 2, yb - 22, t, color);
  };
  const f1 = F("f1"), f2 = F("f2"), f3 = F("f3"), f4 = F("f4"), f5 = F("f5"), f6 = F("f6");
  const y1 = f1.y + f1.h / 2;
  elbow(f1, f2, y1 - 40, H(f2), "Califica", "var(--yes)");
  elbow(f1, f3, y1 + 40, H(f3), "Todavía no", "var(--no-ink)");
  elbow(f3, f4, H(f3), H(f4), "Confirmado");
  elbow(f4, f5, H(f4), H(f5), "Grupos armados");
  const g6 = (out(f5) + inn(f6)) / 2;
  elbow(f2, f6, H(f2), f6.y + f6.h / 2 - 40, "Agenda en la llamada", null, g6 - 70);
  elbow(f5, f6, H(f5), f6.y + f6.h / 2 + 40, "Agendó", null, g6 + 70);
}

/* ---------- Cámara ---------- */
const vp = document.getElementById("viewport");
const cam = { x: 40, y: 100, s: 0.5 };
const MIN = 0.04, MAX = 2.2;
function apply() {
  world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.s})`;
  let g = 22 * cam.s; while (g < 12) g *= 2;
  vp.style.backgroundSize = `${g}px ${g}px`;
  vp.style.backgroundPosition = `${cam.x}px ${cam.y}px`;
  document.getElementById("pct").textContent = Math.round(cam.s * 100) + "%";
  world.classList.toggle("far", cam.s < 0.26);
  markTab();
  if (typeof updMini === "function") updMini();
}
function zoomAt(f, px, py) {
  const ns = Math.min(MAX, Math.max(MIN, cam.s * f));
  const k = ns / cam.s;
  cam.x = px - (px - cam.x) * k; cam.y = py - (py - cam.y) * k; cam.s = ns; apply();
}
let anim = null;
function flyTo(t) {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (anim) cancelAnimationFrame(anim);
  if (reduce) { Object.assign(cam, t); apply(); return; }
  const s0 = { ...cam }, t0 = performance.now(), D = 420;
  const step = now => { const p = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - p, 3);
    cam.x = s0.x + (t.x - s0.x) * e; cam.y = s0.y + (t.y - s0.y) * e; cam.s = s0.s + (t.s - s0.s) * e; apply();
    if (p < 1) anim = requestAnimationFrame(step); };
  anim = requestAnimationFrame(step);
}
function fitRect(x, yv, w, h, pad) {
  const top = 84, W = innerWidth - (document.body.classList.contains("panel-open") ? panelW() : 0), H = innerHeight - top - 20;
  const s = Math.min(MAX, Math.max(MIN, Math.min((W - pad * 2) / w, (H - pad) / h)));
  return { s, x: (W - w * s) / 2 - x * s, y: top + (H - h * s) / 2 - yv * s };
}
function fitAll() { closePanel(); flyTo(fitRect(0, 0, WW, world.offsetHeight, 40)); }
function goFrame(id) { const f = FRAMES.find(x => x.id === id); flyTo(fitRect(f.x, f.y, FW, f.h, 24)); }

// arrastre + pinza
const pts = new Map(); let drag = null, pinch = null;
vp.addEventListener("pointerdown", e => {
  if (e.button !== undefined && e.button > 0) return;
  if (e.pointerType === "mouse") e.preventDefault();
  const sel = getSelection(); if (sel && sel.rangeCount) sel.removeAllRanges();
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size === 1) drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, moved: false, target: e.target };
  if (pts.size === 2) { const [p, q] = [...pts.values()]; pinch = { d: Math.hypot(p.x - q.x, p.y - q.y), s: cam.s }; drag = null; }
});
vp.addEventListener("pointermove", e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pts.size === 2) {
    const [p, q] = [...pts.values()]; const d = Math.hypot(p.x - q.x, p.y - q.y);
    zoomAt((pinch.s * d / pinch.d) / cam.s, (p.x + q.x) / 2, (p.y + q.y) / 2); return;
  }
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) > 4) { drag.moved = true; vp.classList.add("dragging"); try { vp.setPointerCapture(e.pointerId); } catch (_) {} }
  if (drag.moved) { cam.x = drag.cx + dx; cam.y = drag.cy + dy; apply(); }
});
function endPtr(e) {
  if (!pts.has(e.pointerId)) return;
  pts.delete(e.pointerId);
  if (pts.size < 2) pinch = null;
  if (drag && !drag.moved && e.type === "pointerup") click(drag.target);
  if (pts.size === 0) { drag = null; vp.classList.remove("dragging"); }
}
vp.addEventListener("pointerup", endPtr);
vp.addEventListener("dragstart", e => e.preventDefault());
vp.addEventListener("selectstart", e => e.preventDefault());
vp.addEventListener("pointercancel", endPtr);
vp.addEventListener("dblclick", e => { if (e.target.closest && e.target.closest(".n,.fhead")) return; zoomAt(1.8, e.clientX, e.clientY); });
vp.addEventListener("wheel", e => { e.preventDefault(); zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0016)), e.clientX, e.clientY); }, { passive: false });

function click(t) {
  const n = t.closest && t.closest(".n");
  if (n) {
    const id = n.id.slice(2), d = byId[id];
    if (d.t === "jump") { goFrame(d.go); return; }
    if (d.ex || d.branches || d.rule || d.doc) { openPanel(id); return; }
  }
  const fh = t.closest && t.closest(".fhead");
  if (fh) goFrame(fh.dataset.frame);
}
// teclado en los nodos
world.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("n")) { e.preventDefault(); click(e.target); } });
world.addEventListener("focusin", e => {
  const n = e.target.closest(".n"); if (!n) return;
  const r = n.getBoundingClientRect();
  if (r.left < 0 || r.top < 80 || r.right > innerWidth || r.bottom > innerHeight) { const b = box(n.id.slice(2)); flyTo({ s: Math.max(cam.s, 0.8), x: innerWidth / 2 - (b.x + b.w / 2) * Math.max(cam.s, 0.8), y: innerHeight / 2 - (b.y + b.h / 2) * Math.max(cam.s, 0.8) }); }
});
addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input,textarea")) return;
  if (e.key === "+" || e.key === "=") zoomAt(1.2, innerWidth / 2, innerHeight / 2);
  else if (e.key === "-") zoomAt(1 / 1.2, innerWidth / 2, innerHeight / 2);
  else if (e.key === "Escape") closePanel();
  else if (active && (e.key === "ArrowRight" || e.key === "ArrowLeft")) { e.preventDefault(); stepBy(e.key === "ArrowRight" ? 1 : -1); }
});
document.getElementById("zin").onclick = () => zoomAt(1.25, innerWidth / 2, innerHeight / 2);
document.getElementById("zout").onclick = () => zoomAt(0.8, innerWidth / 2, innerHeight / 2);
document.getElementById("zfit").onclick = fitAll;

/* ---------- Pestañas ---------- */
const tabs = document.getElementById("tabs");
const tm = document.createElement("button"); tm.type = "button"; tm.className = "tab mapa"; tm.textContent = "Mapa"; tm.onclick = fitAll; tabs.appendChild(tm);
FRAMES.forEach(f => { const b = document.createElement("button"); b.type = "button"; b.className = "tab"; b.dataset.f = f.id; b.innerHTML = `<i style="background:${f.color}"></i>${esc(f.tab)}`; b.onclick = () => goFrame(f.id); tabs.appendChild(b); });
function markTab() {
  if (cam.s < 0.3) { tabs.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-current", b.classList.contains("mapa") ? "true" : "false")); return; }
  const cx = (innerWidth / 2 - cam.x) / cam.s, cy = (innerHeight / 2 - cam.y) / cam.s;
  let cur = FRAMES[0].id, best = Infinity;
  FRAMES.forEach(f => { if (f.h == null) return; const dx = Math.max(f.x - cx, 0, cx - f.x - FW), dy = Math.max(f.y - cy, 0, cy - f.y - f.h), d = dx * dx + dy * dy; if (d < best) { best = d; cur = f.id; } });
  tabs.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-current", b.dataset.f === cur ? "true" : "false"));
}

/* ---------- Panel ---------- */
const panel = document.getElementById("panel");
let active = null;
function exHtml(ex, i) {
  let inner;
  if (ex.type === "wa") inner = `<div class="bubble">${ex.lines.map(x => `<p>${esc(x)}</p>`).join("")}</div>`;
  else if (ex.type === "call" || ex.type === "closer") inner = `<div class="call${ex.type === "closer" ? " closer" : ""}">${ex.lines.map(([w, s]) => `<p><span class="w${["SDR", "Closer", "Manu"].includes(w) ? "" : " l"}">${esc(w)}:</span> ${esc(s)}</p>`).join("")}</div>`;
  else inner = `<div class="notebox">${ex.lines.map(x => `<p>${esc(x)}</p>`).join("")}</div>`;
  const lab = { wa: "WhatsApp", call: "Llamada", closer: "Llamada de venta", note: "Ejemplo" }[ex.type];
  const cp = ex.type === "note" ? "" : `<button class="copy" type="button" data-i="${i}">Copiar</button>`;
  return `<div class="ex"><div class="exh"><span>${lab} · ${esc(ex.head)}</span>${cp}</div>${inner}</div>`;
}
const viewable = n => ((n.t === "step" || n.t === "dec") && (n.ex || n.branches || n.rule)) || !!n.doc;
function seqOf(f) { return f.nodes.filter(viewable).map(n => n.id); }
function stepBy(d) { const n = byId[active]; const q = seqOf(n.frame); const i = q.indexOf(active) + d; if (i >= 0 && i < q.length) openPanel(q[i], true); }
function reveal(id) {
  if (innerWidth <= 720) return;
  const b = box(id), availW = innerWidth - panelW();
  const sx = b.x * cam.s + cam.x, sy = b.y * cam.s + cam.y, sw = b.w * cam.s, sh = b.h * cam.s;
  if (sx < 16 || sx + sw > availW - 16 || sy < 90 || sy + sh > innerHeight - 20) {
    const sc = Math.max(cam.s, 0.6);
    flyTo({ s: sc, x: availW / 2 - (b.x + b.w / 2) * sc, y: innerHeight / 2 - (b.y + b.h / 2) * sc });
  }
}
function wireCopy(body, n) {
  body.querySelectorAll(".copy[data-i]").forEach(b => b.addEventListener("click", () => {
    const ex = n.ex[+b.dataset.i];
    const text = ex.lines.map(x => Array.isArray(x) ? `${x[0]}: ${x[1]}` : x).join("\n\n");
    const done = ok => { b.textContent = ok ? "Copiado" : "Seleccioná y copiá"; setTimeout(() => b.textContent = "Copiar", 1600); };
    const sel = () => { const el = b.closest(".ex").querySelector(".bubble,.call"); const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
    try { navigator.clipboard.writeText(text).then(() => done(true), () => { sel(); done(false); }); } catch (_) { sel(); done(false); }
  }));
}
function panelW() { return innerWidth <= 720 ? 0 : (document.body.classList.contains("panel-wide") ? 682 : 442); }
function docBlock(x) {
  if (x.p) return `<p>${esc(x.p)}</p>`;
  if (x.h4) return `<h4>${esc(x.h4)}</h4>`;
  if (x.kv) return `<p class="kv"><b>${esc(x.kv[0])}:</b> ${esc(x.kv[1])}</p>`;
  if (x.ul) return `<ul>${x.ul.map(i => `<li>${esc(i)}</li>`).join("")}</ul>`;
  if (x.ol) return `<ol>${x.ol.map(i => `<li>${esc(i)}</li>`).join("")}</ol>`;
  if (x.rule) return `<div class="rule">${esc(x.rule)}</div>`;
  if (x.say) return `<div class="call closer">${x.say.map(([w, t]) => `<p><span class="w${w === "Lead" ? " l" : ""}">${esc(w)}:</span> ${esc(t)}</p>`).join("")}</div>`;
  if (x.t) return `<div class="dtab"><table><thead><tr>${x.t.h.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${x.t.r.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  return "";
}
function docHtml(d) {
  return `<p class="dsub">${esc(d.sub)}</p><div class="dtools"><span>${d.secs.length} secciones · «Closer» es Manu o el closer</span><button type="button" class="copy" id="dall">Abrir todo</button></div>` +
    d.secs.map(s => `<details class="dsec"${s.open ? " open" : ""}><summary>${esc(s.h)}</summary><div class="db">${s.b.map(docBlock).join("")}</div></details>`).join("");
}
function openPanel(id, fromNav) {
  const n = byId[id];
  document.body.classList.toggle("panel-wide", !!n.doc && innerWidth > 720);
  if (active) byId[active].el.classList.remove("active");
  active = id; n.el.classList.add("active");
  document.getElementById("pfase").textContent = `${n.frame.chip} · ${n.frame.title}`;
  document.getElementById("pfase").style.color = n.frame.color;
  document.getElementById("ptitle").textContent = n.t === "dec" || n.doc ? n.title : `${n.n} · ${n.title}`;
  const kind = n.t === "dec" ? `<span class="pill no" style="background:var(--dec-bg);color:var(--dec-ico)">Decisión</span>` : `<span class="badge k-${n.k}">${KIND[n.k]}</span>`;
  let h = `<div class="kindrow">${kind}</div>`;
  if (n.d) h += `<section><h3>Qué se hace</h3><p>${esc(n.d)}</p></section>`;
  if (n.branches) h += `<section><h3>Salidas</h3>${n.branches.map(([a, b], i) => `<div class="br"><span class="pill${i === 1 ? " no" : ""}">${esc(a)}</span><span>${esc(b)}</span></div>`).join("")}</section>`;
  if (n.ex) {
    const tabsH = n.ex.length > 1 ? `<div class="extabs" role="tablist">${n.ex.map((ex, i) => `<button type="button" class="extab" role="tab" data-t="${i}" aria-selected="${i === 0}" title="${esc(ex.head)}">${esc(ex.head)}</button>`).join("")}</div>` : "";
    h += `<section><h3>Ejemplo con nuestro caso${n.ex.length > 1 ? ` · ${n.ex.length} variantes` : ""}</h3>${tabsH}<div id="exslot">${exHtml(n.ex[0], 0)}</div></section>`;
  }
  if (n.rule) h += `<section><h3>La regla</h3><div class="rule">${esc(n.rule)}</div></section>`;
  if (n.doc) h = `<div class="kindrow"><span class="badge k-closer">${esc(n.lab)}</span></div>` + docHtml(n.doc);
  const body = document.getElementById("pbody"); body.innerHTML = h; body.scrollTop = 0;
  const dall = document.getElementById("dall");
  if (dall) dall.onclick = () => { const ds = body.querySelectorAll(".dsec"), allOpen = [...ds].every(x => x.open); ds.forEach(x => x.open = !allOpen); dall.textContent = allOpen ? "Abrir todo" : "Cerrar todo"; };
  wireCopy(body, n);
  body.querySelectorAll(".extab").forEach(t => t.addEventListener("click", () => {
    body.querySelectorAll(".extab").forEach(x => x.setAttribute("aria-selected", x === t ? "true" : "false"));
    const slot = document.getElementById("exslot"); slot.innerHTML = exHtml(n.ex[+t.dataset.t], +t.dataset.t); wireCopy(slot, n);
  }));
  const q = seqOf(n.frame), i = q.indexOf(id);
  document.getElementById("ppos").textContent = `${i + 1} de ${q.length} en esta fase`;
  document.getElementById("pprev").disabled = i <= 0;
  document.getElementById("pnext").disabled = i >= q.length - 1;
  panel.hidden = false;
  document.body.classList.add("panel-open");
  reveal(id);
}
document.getElementById("pprev").onclick = () => stepBy(-1);
document.getElementById("pnext").onclick = () => stepBy(1);

/* ---------- Minimapa ---------- */
const mmEl = document.getElementById("mm"); let mmSc = 1;
function drawMini() {
  mmSc = 216 / WW; const H = world.offsetHeight * mmSc;
  mmEl.style.height = Math.max(40, H) + "px";
  mmEl.innerHTML = FRAMES.map(f => `<div class="mf" style="left:${f.x * mmSc}px;top:${f.y * mmSc}px;width:${FW * mmSc}px;height:${f.h * mmSc}px;background:${f.color}"></div>`).join("") + `<div class="vw" id="mmv"></div>`;
  updMini();
}
function updMini() {
  const v = document.getElementById("mmv"); if (!v) return;
  v.style.left = (-cam.x / cam.s) * mmSc + "px"; v.style.top = (-cam.y / cam.s) * mmSc + "px";
  v.style.width = (innerWidth / cam.s) * mmSc + "px"; v.style.height = (innerHeight / cam.s) * mmSc + "px";
  const cur = tabs.querySelector('.tab[aria-current="true"]'); document.getElementById("mmf").textContent = cur ? cur.textContent : "";
}
let mmDown = false;
const mmMove = e => { const r = mmEl.getBoundingClientRect(); const wx = (e.clientX - r.left) / mmSc, wy = (e.clientY - r.top) / mmSc; cam.x = innerWidth / 2 - wx * cam.s; cam.y = innerHeight / 2 - wy * cam.s; apply(); };
mmEl.addEventListener("pointerdown", e => { mmDown = true; try { mmEl.setPointerCapture(e.pointerId); } catch (_) {} mmMove(e); });
mmEl.addEventListener("pointermove", e => { if (mmDown) mmMove(e); });
mmEl.addEventListener("pointerup", () => { mmDown = false; });

function closePanel() { panel.hidden = true; document.body.classList.remove("panel-open", "panel-wide"); if (active) { byId[active].el.classList.remove("active"); active = null; } }
document.getElementById("pclose").onclick = closePanel;
panel.addEventListener("pointerdown", e => e.stopPropagation());
panel.addEventListener("wheel", e => e.stopPropagation(), { passive: true });

/* ---------- Tema ---------- */
const themeBtn = document.getElementById("themebtn");
const isDark = () => { const t = document.documentElement.getAttribute("data-theme"); return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; };
function syncThemeBtn() { const d = isDark(); document.getElementById("themelab").textContent = d ? "Modo claro" : "Modo oscuro"; themeBtn.setAttribute("aria-label", d ? "Cambiar a modo claro" : "Cambiar a modo oscuro"); }
try { const saved = localStorage.getItem("mapa-ventas-tema"); if (saved === "dark" || saved === "light") document.documentElement.setAttribute("data-theme", saved); } catch (_) {}
themeBtn.addEventListener("click", () => { const next = isDark() ? "light" : "dark"; document.documentElement.setAttribute("data-theme", next); try { localStorage.setItem("mapa-ventas-tema", next); } catch (_) {} syncThemeBtn(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncThemeBtn);
syncThemeBtn();

/* ---------- Arranque ---------- */
function boot() {
  layout();
  // abre en la Fase 01, con el mensaje inicial a la vista
  const f = FRAMES[0];
  if (innerWidth > 720) document.body.classList.add("panel-open");
  const t = innerWidth <= 720 ? { s: 0.55, x: 16 - 20 * 0.55, y: 130 - (f.y + 10) * 0.55 } : fitRect(f.x, f.y, FW, f.h, 24);
  Object.assign(cam, t); apply();
  if (innerWidth > 720) openPanel("msg");
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(boot); else boot();
addEventListener("resize", () => { layout(); apply(); });
</script>
