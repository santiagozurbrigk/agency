<title>Mapa de ventas Génesis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: tablero infinito estilo pizarra (fondo punteado) con un marco por fase; barra de fases arriba, zoom abajo a la derecha, panel de ejemplo a la derecha. Un solo look claro, a propósito. */
:root {
  color-scheme: light;
  --board: var(--soft);
  --dot: #d8d3c8;
  --frame: #ffffff;
  --ink: #1b1c1e;
  --muted: #6c6b66;
  --line: #e2ded4;
  --edge: #2a2b2d;
  --sdr: #c2410c;
  --closer: #4f46e5;
  --form: #475569;
  --team: #0f766e;
  --dec-bg: #fff3ea;
  --dec-line: #f2b48c;
  --dec-ico: #ea580c;
  --no-bg: #fdf1f0;
  --no-line: #efb4ad;
  --no-ink: #b42318;
  --note-bg: #fbf5e2;
  --note-line: #d9a72b;
  --note-ink: #8a6100;
  --yes: #15803d;
  --bubble: #dcf8c6;
  --bubble-ink: #14280c;
  --p1: #3b5bdb; --p2: #e8590c; --p3: #b08900; --p4: #d6336c; --p5: #7048e8; --p6: #2b8a3e;
  --surface: #ffffff;
  --soft: #f2f0eb;
  --on-ink: #ffffff;
  --on-accent: #ffffff;
  --edge-strong: #1b1c1e;
  --yes-bg: #e3f4e8;
  --no-text: #7a1f17;
  --note-text: #5c4a12;
  --note-border: #ecd9a6;
  --sh1: rgba(27,28,30,.08);
  --sh2: rgba(27,28,30,.16);
  --veil: rgba(255,255,255,.92);
  --vw-bg: rgba(27,28,30,.06);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
  --board: #121417; --dot: #2b2f35; --frame: #1b1e23; --ink: #ecebe7; --muted: #9d9b95; --line: #30343a; --edge: #bdbab3;
  --sdr: #fb8a4c; --closer: #9496fb; --form: #a3b1c2; --team: #2dd4bf;
  --dec-bg: #352318; --dec-line: #7c4a26; --dec-ico: #fb923c;
  --no-bg: #34191a; --no-line: #74322d; --no-ink: #f87171;
  --note-bg: #2f2711; --note-line: #d9a72b; --note-ink: #f0c75e;
  --yes: #4ade80; --bubble: #1e3a28; --bubble-ink: #dcf7d0;
  --p1: #7392ff; --p2: #ff8f4a; --p3: #e3b52b; --p4: #f06595; --p5: #9b7cfa; --p6: #5bd174;
  --surface: #1b1e23; --soft: #24282e; --on-ink: #121417; --on-accent: #ffffff; --edge-strong: #ecebe7;
  --yes-bg: #173322; --no-text: #f1c9c4; --note-text: #f1e2b8; --note-border: #4a3d17;
  --sh1: rgba(0,0,0,.35); --sh2: rgba(0,0,0,.55); --veil: rgba(27,30,35,.93); --vw-bg: rgba(236,235,231,.08);
  color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --board: #121417; --dot: #2b2f35; --frame: #1b1e23; --ink: #ecebe7; --muted: #9d9b95; --line: #30343a; --edge: #bdbab3;
  --sdr: #fb8a4c; --closer: #9496fb; --form: #a3b1c2; --team: #2dd4bf;
  --dec-bg: #352318; --dec-line: #7c4a26; --dec-ico: #fb923c;
  --no-bg: #34191a; --no-line: #74322d; --no-ink: #f87171;
  --note-bg: #2f2711; --note-line: #d9a72b; --note-ink: #f0c75e;
  --yes: #4ade80; --bubble: #1e3a28; --bubble-ink: #dcf7d0;
  --p1: #7392ff; --p2: #ff8f4a; --p3: #e3b52b; --p4: #f06595; --p5: #9b7cfa; --p6: #5bd174;
  --surface: #1b1e23; --soft: #24282e; --on-ink: #121417; --on-accent: #ffffff; --edge-strong: #ecebe7;
  --yes-bg: #173322; --no-text: #f1c9c4; --note-text: #f1e2b8; --note-border: #4a3d17;
  --sh1: rgba(0,0,0,.35); --sh2: rgba(0,0,0,.55); --veil: rgba(27,30,35,.93); --vw-bg: rgba(236,235,231,.08);
  color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--board); color: var(--ink); font-family: var(--font-body); overflow: hidden; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }

#viewport { position: fixed; inset: 0; overflow: hidden; cursor: grab; touch-action: none;
  background-color: var(--board);
  background-image: radial-gradient(var(--dot) 1.2px, transparent 1.3px);
  background-size: 22px 22px; }
#viewport.dragging { cursor: grabbing; }
#viewport, .topbar, .zoom, .hint { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.panel { -webkit-user-select: text; user-select: text; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; z-index: 1; }

/* Barra superior */
.topbar { position: fixed; left: 16px; right: 16px; top: calc(14px + env(safe-area-inset-top, 0px)); display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; pointer-events: none; z-index: 5; }
.brand, .tabs { pointer-events: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 2px 10px var(--sh1); }
.brand { display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 10px; }
.brand .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--sdr); color: var(--on-accent); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 15px; }
.brand b { display: block; font-size: 14px; font-weight: 700; }
.brand small { display: block; font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
.tabs { display: flex; align-items: center; gap: 2px; padding: 4px; overflow-x: auto; max-width: 100%; scrollbar-width: none; }
.tab { border: 0; background: transparent; border-radius: 8px; padding: 7px 10px; font-size: 13px; font-weight: 500; white-space: nowrap; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.tab i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.tab:hover { background: var(--soft); }
.tab[aria-current="true"] { background: var(--soft); font-weight: 700; }
.tab.mapa { color: var(--sdr); font-weight: 700; }
.tab:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }

/* Controles */
.zoom { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; z-index: 5; }
.zoom button { width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 18px; cursor: pointer; box-shadow: 0 2px 8px var(--sh1); }
.zoom button:focus-visible { outline: 2px solid var(--ink); }
.zoom .pct { font-family: var(--font-mono); font-size: 10.5px; text-align: center; color: var(--muted); }
.hint { position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; z-index: 5; max-width: calc(100% - 100px); }

/* Marcos */
.frame { position: absolute; background: var(--frame); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 4px 24px var(--sh1); }
.frame::before { content: ""; position: absolute; left: -1px; right: -1px; top: -1px; height: 5px; border-radius: 16px 16px 0 0; background: var(--fc); }
.fhead { position: absolute; left: 28px; top: 26px; right: 28px; display: flex; align-items: center; gap: 16px; cursor: zoom-in; }
.fchip { font-family: var(--font-mono); font-size: 13px; letter-spacing: .14em; color: var(--fc); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; background: var(--surface); white-space: nowrap; }
.ftitle { font-family: var(--font-display); font-weight: 800; font-size: 30px; letter-spacing: -.01em; }
.fmeta { font-size: 14px; color: var(--muted); margin-left: auto; }
.fsep { position: absolute; left: 0; right: 0; top: 96px; border-top: 1px solid var(--line); }
.board-title { position: absolute; left: 0; top: 0; }
.board-title h1 { font-family: var(--font-display); font-weight: 800; font-size: 56px; margin: 0; letter-spacing: -.02em; }
.board-title p { margin: 8px 0 0; font-size: 18px; color: var(--muted); max-width: 900px; line-height: 1.45; }
.personas { display: flex; gap: 16px; margin-top: 22px; }
.persona { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; width: 470px; font-size: 15px; line-height: 1.45; }
.persona .pt { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
.persona b { display: block; font-family: var(--font-display); font-size: 22px; margin: 2px 0 4px; }
.persona p { margin: 0; color: var(--muted); }

/* Nodos */
.n { position: absolute; width: 200px; border-radius: 10px; font-size: 12.5px; line-height: 1.42; text-align: left; }
.n.step, .n.dec { cursor: pointer; }
.n:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.n.step { background: var(--surface); border: 1px solid var(--line); padding: 12px 14px 12px; box-shadow: 0 1px 3px var(--sh1); }
.n.step:hover, .n.dec:hover { box-shadow: 0 0 0 2px var(--ink); }
.n.active { box-shadow: 0 0 0 2.5px var(--ink) !important; }
.badge { display: inline-block; font-family: var(--font-mono); font-size: 9.5px; font-weight: 700; letter-spacing: .08em; border: 1px solid currentColor; border-radius: 999px; padding: 1px 6px; margin-right: 6px; vertical-align: 1px; text-transform: uppercase; }
.k-sdr { color: var(--sdr); } .k-closer { color: var(--closer); } .k-form { color: var(--form); } .k-team { color: var(--team); }
.n .tt { font-weight: 700; font-size: 13.5px; color: var(--ink); }
.n .dd { color: var(--muted); margin-top: 5px; }
.n .ver { display: inline-block; margin-top: 9px; font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; color: var(--muted); }
.n.start { background: var(--ink); color: var(--on-ink); border-radius: 10px; padding: 14px 16px; font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; text-align: center; box-shadow: 0 2px 8px var(--sh2); }
.n.dec { background: var(--dec-bg); border: 1px solid var(--dec-line); padding: 11px 14px 11px 34px; font-weight: 700; font-size: 13px; }
.n.dec::before { content: ""; position: absolute; left: 13px; top: 15px; width: 10px; height: 10px; background: var(--dec-ico); transform: rotate(45deg); border-radius: 2px; }
.n.dec .dd { font-weight: 400; }
.n.no { background: var(--no-bg); border: 1px solid var(--no-line); border-left: 3px solid var(--no-ink); padding: 11px 13px; color: var(--no-text); font-size: 12px; }
.n.no .act { margin-top: 8px; font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--no-ink); }
.n.note { background: var(--note-bg); border: 1px solid var(--note-border); border-left: 3px solid var(--note-line); padding: 11px 13px; color: var(--note-text); font-size: 12px; }
.n.note .lab, .n.mile .lab, .n.yesbox .lab { font-family: var(--font-mono); font-size: 9.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--note-ink); margin-bottom: 4px; }
.n.mile { background: var(--surface); border: 1.5px solid var(--ink); padding: 14px 16px; text-align: center; border-radius: 12px; }
.n.mile .lab { color: var(--sdr); }
.n.mile .tt { font-family: var(--font-display); font-size: 19px; font-weight: 800; line-height: 1.15; }
.n.mile .dd { margin-top: 6px; }
.n.jump { background: var(--surface); border: 1.5px dashed var(--fc2, var(--ink)); padding: 12px 14px; cursor: pointer; }
.n.jump .lab { font-family: var(--font-mono); font-size: 9.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--fc2, var(--ink)); }
.n.jump:hover { box-shadow: 0 0 0 2px var(--fc2, var(--ink)); }
.n.route { background: var(--surface); border: 1px solid var(--line); padding: 11px 13px; }
.n.route .lab { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--sdr); margin-bottom: 3px; }
.elab { font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: .06em; }

/* Panel */
.panel { position: fixed; right: 16px; top: calc(78px + env(safe-area-inset-top, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: 410px; max-width: calc(100% - 32px); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 12px 40px var(--sh2); z-index: 6; display: flex; flex-direction: column; }
.panel[hidden] { display: none !important; }
.ph { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 4px; position: relative; }
.ph .close { position: absolute; right: 12px; top: 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 12.5px; }
.ph .fase { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; }
.ph h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 22px; line-height: 1.15; padding-right: 64px; text-wrap: balance; }
.pb { padding: 14px 18px 22px; overflow-y: auto; display: grid; gap: 16px; align-content: start; font-size: 14.5px; line-height: 1.5; }
.pb h3 { margin: 0 0 8px; font-family: var(--font-mono); font-weight: 500; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.pb p { margin: 0; }
.ex { display: grid; gap: 8px; margin-bottom: 12px; }
.exh { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.copy { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 3px 10px; cursor: pointer; font-size: 12px; }
.copy:focus-visible, .ph .close:focus-visible { outline: 2px solid var(--ink); }
.bubble { background: var(--bubble); color: var(--bubble-ink); border-radius: 12px 12px 12px 4px; padding: 10px 12px; display: grid; gap: 8px; }
.call { border-left: 3px solid var(--sdr); padding: 2px 0 2px 12px; display: grid; gap: 8px; }
.call.closer { border-left-color: var(--closer); }
.call .w { font-weight: 700; }
.call .w.l { color: var(--muted); }
.notebox { background: var(--soft); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; }
.rule { border: 1px dashed var(--note-line); background: var(--note-bg); border-radius: 10px; padding: 10px 12px; }
.br { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; margin-bottom: 6px; }
.pill { font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--yes-bg); color: var(--yes); }
.pill.no { background: var(--no-bg); color: var(--no-ink); }

body.panel-open .zoom { right: 442px; }
body.panel-wide .panel { width: 650px; }
body.panel-open.panel-wide .zoom { right: 682px; }
.n.route.doc { cursor: pointer; box-shadow: 0 1px 3px var(--sh1); border-color: var(--closer); }
.n.route.doc .lab { color: var(--closer); }
.n.route.doc:hover { box-shadow: 0 0 0 2px var(--ink); }
.n.route.doc:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.dsub { color: var(--muted); }
.dtools { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.dsec { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.dsec > summary { list-style: none; cursor: pointer; padding: 12px 14px; font-weight: 700; font-size: 15px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.dsec > summary::-webkit-details-marker { display: none; }
.dsec > summary::after { content: "+"; font-family: var(--font-mono); color: var(--muted); font-size: 16px; }
.dsec[open] > summary::after { content: "–"; }
.dsec > summary:focus-visible { outline: 2px solid var(--ink); border-radius: 12px; }
.dsec[open] > summary { border-bottom: 1px solid var(--line); }
.db { padding: 12px 14px 14px; display: grid; gap: 10px; }
.db h4 { margin: 6px 0 0; font-family: var(--font-mono); font-weight: 500; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.db ul, .db ol { margin: 0; padding-left: 20px; display: grid; gap: 5px; }
.db .kv b { font-weight: 700; }
.dtab { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
.dtab table { width: 100%; border-collapse: collapse; font-size: 13px; line-height: 1.4; }
.dtab th, .dtab td { text-align: left; vertical-align: top; padding: 7px 10px; border-bottom: 1px solid var(--line); }
.dtab tr:last-child td { border-bottom: 0; }
.dtab th { font-weight: 600; color: var(--muted); background: var(--soft); }

/* Botón de tema */
.themebtn { pointer-events: auto; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 0 14px; font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 2px 10px var(--sh1); min-height: 44px; }
.themebtn:hover { border-color: var(--ink); }
.themebtn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.trackbtn .lshort { display: none; }
.trackbtn { text-decoration: none; border-color: var(--p6); }
.trackbtn .tdot { width: 9px; height: 9px; border-radius: 50%; background: var(--p6); box-shadow: 0 0 0 3px var(--yes-bg); }
.board-title a { color: var(--p6); font-weight: 700; }
.themebtn .ico { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--ink); background: linear-gradient(90deg, var(--ink) 50%, transparent 50%); }
/* Mejoras de uso */
.n.step, .n.dec, .n.jump { transition: box-shadow .15s ease, transform .15s ease; }
@media (prefers-reduced-motion: no-preference) { .n.step:hover, .n.dec:hover, .n.jump:hover { transform: translateY(-2px); } }
.legend { pointer-events: auto; margin-left: auto; display: flex; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; font-size: 12px; color: var(--muted); box-shadow: 0 2px 10px var(--sh1); }
.legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legend i.dia { transform: rotate(45deg); border-radius: 2px; width: 9px; height: 9px; }
.bigname { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 36px; background: var(--veil); border-radius: 16px; z-index: 3; pointer-events: none; text-align: center; padding: 80px; }
.bigname b { font-family: var(--font-mono); font-size: 96px; letter-spacing: .14em; color: var(--fc); }
.bigname span { font-family: var(--font-display); font-weight: 800; font-size: 150px; line-height: 1.02; letter-spacing: -.02em; color: var(--ink); text-wrap: balance; }
#world.far .bigname { display: flex; }
#world.far .fhead { visibility: hidden; }
.minimap { position: fixed; left: 16px; bottom: calc(62px + env(safe-area-inset-bottom, 0px)); width: 236px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 2px 10px var(--sh1); z-index: 5; padding: 8px 10px 10px; touch-action: none; }
.minimap .ml { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; display: flex; justify-content: space-between; }
.minimap .mm { position: relative; width: 216px; overflow: hidden; cursor: pointer; border-radius: 6px; background: var(--board); }
.minimap .mf { position: absolute; border-radius: 2px; opacity: .8; }
.minimap .vw { position: absolute; border: 2px solid var(--ink); border-radius: 3px; background: var(--vw-bg); pointer-events: none; }
.pnav { border-top: 1px solid var(--line); padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pnav button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-size: 13px; font-weight: 600; }
.pnav button:hover:not(:disabled) { border-color: var(--ink); }
.pnav button:disabled { opacity: .35; cursor: default; }
.pnav button:focus-visible { outline: 2px solid var(--ink); }
.pnav span { font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-align: center; }
.kindrow { display: flex; gap: 8px; align-items: center; }

<script>
/* ---------- Datos ---------- */
const COLS = [40, 285, 530, 775, 1020, 1265, 1510];
const FW = 1760;
const B = 220; // desplazamiento de las cajas de abajo (no / nota)

/* ---------- Documentos de la llamada (tarjetas "Guion y manual") ---------- */
const DOCS = {
 fases: {
  sub: "La llamada dura cerca de una hora y la toma Manu o el closer. Cada fase construye sobre la anterior: si salteás una, el lead te responde a medias.",
  secs: [
   { h: "La lógica de la llamada", open: true, b: [
     { p: "Partimos la llamada en fases para que el proceso lo manejes vos, no el lead. Subís la intensidad de las preguntas de a poco: cuando llegás al problema y a la solución, ya está cómodo y te da la respuesta verdadera." },
     { h4: "El motor: el gap" },
     { p: "El gap es la distancia entre dónde está la marca hoy y dónde el dueño quiere que esté. Toda la llamada sirve para agrandarlo con datos y hacerlo vívido: cuanto más grande y claro, más urgencia." },
     { t: { h: ["Hoy", "Donde quiere estar"], r: [
       ["Factura más de 30 millones, pero en breakeven", "Una base que cobra sola todos los meses"],
       ["Cada venta le cuesta lo mismo que la anterior", "La 2ª, 3ª y 4ª compra entran con el margen entero"],
       ["Puede pagar por cliente lo que le deja un pedido", "Puede pagar 2,5 veces más que su competencia"],
       ["El 1 del mes arranca en cero", "El mes arranca con los suscriptores ya cobrados"],
       ["Si Meta le baja la cuenta, se corta todo", "Si Meta le baja la cuenta, la base se sigue cobrando"]] } },
     { rule: "La venta se hace en el descubrimiento, no en la presentación. Si el gap está bien armado, el pitch es mostrarle el puente. Si no, el pitch es un folleto y el precio parece caro." },
     { h4: "Por qué este orden" },
     { ul: [
       "Conexión antes que todo: sin contexto ni confianza, las preguntas sobre el problema suenan invasivas.",
       "Situación antes que Problema: primero entendés cómo funciona la marca y sus números; recién después te cuenta qué cambiaría.",
       "Solución después de Problema, sin agrandar el dolor: si el problema fuera tan grave, ya lo habría resuelto. Lo que lo mueve es ver el futuro resuelto.",
       "Compromiso antes de Consecuencia: primero dice en voz alta que está dispuesto a hacer algo, y llega al precio coherente con eso.",
       "Consecuencia justo antes del pitch: crea la urgencia. Llegás a la presentación con el contraste entre los dos futuros bien fresco."] },
     { h4: "Cuánto dura cada parte" },
     { t: { h: ["Fase", "Tiempo"], r: [["1 · Conexión (con la sentada de base)", "5 min"], ["2 · Situación", "10 min"], ["3 · Problema", "10 min"], ["4 · Solución", "10 min"], ["5 · Compromiso", "2 min"], ["6 · Consecuencia", "5 min"], ["7 · Presentación", "10 min máximo"], ["Cierre y objeciones", "Lo que haga falta"]] } },
     { p: "El pitch nunca ocupa más del 15% de la llamada. Si te encontrás presentando 25 minutos, el descubrimiento quedó corto." },
     { h4: "El error en cada fase es el viejo modelo" },
     { p: "Marcar la agenda, demostrar autoridad, avisar que “al final vas a tener que tomar una decisión”, clavarte en el problema al minuto 2 o decir “obviamente no te está funcionando, por algo estás acá”. Este lead ya compró mentorías y vio llamadas de venta: si le hacés el guion viejo, se cierra." }
   ] },
   { h: "Fase 1 · Conexión (5 min)", b: [
     { kv: ["Objetivo", "Que esté relajado y saber qué vino a buscar, en una frase. Cuanto menos piense en vos como vendedor, mejores respuestas te da."] },
     { h4: "Qué cubrís" },
     { ul: ["Por qué agendó y qué vio en la clase que le hizo pensar que esto le sirve.", "El objetivo general de la marca, en una frase. Sin cavar.", "La sentada de base: cómo va a ser la llamada y que, si encajan, al final se decide. Dicho como un acuerdo entre pares, no como una advertencia."] },
     { h4: "Cómo suena" },
     { say: [["Closer", "¿Todo bien, Martín? Por lo que veo agendaste para ver si te podemos ayudar a pasar tu marca a suscripción. Tengo lo que llenaste en el formulario, pero quiero que me lo cuentes vos: ¿por qué agendaste?"], ["Closer", "¿Qué fue lo que viste en la clase del lunes que te hizo pensar que esto te podía servir?"], ["Lead", "La cuenta del techo. Nunca lo había pensado así."], ["Closer", "¿Y hoy cuál es el objetivo con la marca?"], ["Lead", "Quiero dejar de depender tanto de la pauta."]] },
     { h4: "La sentada de base (cuando ya tenés el objetivo)" },
     { say: [["Closer", "Perfecto. Te cuento cómo trabajamos: pasamos marcas de consumibles al modelo de suscripción y lo hacemos nosotros, con vos. La idea de esta llamada es ver qué están haciendo hoy, cómo les está yendo, dónde se está trabando, y en base a eso ver qué roadmap tendría sentido para tu marca. Si al final sentimos que encajamos, vemos de arrancar. ¿Te parece?"]] },
     { kv: ["El error", "Clavarte en el problema al toque (“¿hace cuánto que la pauta no te rinde?”): todavía no te ganaste esa pregunta. Y abrir con el currículum de Manu: ya lo vio en la clase."] },
     { kv: ["Pasás a Situación cuando", "Tenés el objetivo en una frase, responde tranquilo y todavía no cavaste en ningún problema."] }
   ] },
   { h: "Fase 2 · Situación (10 min)", b: [
     { kv: ["Objetivo", "El mapa de cómo funciona la marca hoy, con números. Todavía no atacás nada."] },
     { h4: "Qué cubrís" },
     { ul: ["Facturación mensual, tamaño del equipo, qué vende y en qué plataforma.", "Cómo consigue clientes (casi siempre Meta Ads) y cuánto pauta.", "Sus números: CPA, margen de contribución por pedido, ticket promedio, cada cuánto se termina el producto, cuántos vuelven a comprar.", "Hace cuánto lo hace así y por qué eligió ese camino."] },
     { h4: "Cómo suena" },
     { say: [["Closer", "Para ubicarme: ¿cuánto están facturando por mes? ¿Cuántos son en el equipo? ¿Qué venden y por dónde?"], ["Closer", "¿Tenés los números bajados? CPA, margen por pedido, ticket promedio, cada cuánto se termina el producto, cuántos te vuelven a comprar."], ["Closer", "¿Hace cuánto lo vienen haciendo así? ¿Fue criterio propio o lo aprendieron de alguien?"]] },
     { ul: ["Si no tiene los números: “¿Y cómo deciden cuánto pautar? ¿Cómo saben si un mes fue bueno?”. Ahí aparece solo el primer problema: maneja a ciegas.", "Si los tiene: anotalos todos. Margen por pedido y ciclo de reposición son los dos que no te podés ir sin tener: los usás en el Simulador."] },
     { h4: "La jugada clave: permiso para quejarse" },
     { say: [["Closer", "¿Te gusta cómo lo vienen manejando?"], ["Lead", "Sí, la verdad que vendemos bien."], ["Closer", "Buenísimo, ¿qué es lo que más te gusta?"], ["Lead", "Que tenemos los creativos aceitados, sacamos uno nuevo por semana."], ["Closer", "Suena que funciona. Si pudieras cambiar algo, de cómo lo hacen o de los resultados, ¿qué sería?"], ["Lead", "Que cada venta nos deje algo. Hoy vendemos mucho y no queda nada."]] },
     { p: "No lo socaves: si le destruís su forma de manejar la marca demasiado temprano, al final no va a tener confianza para decidir. Lo querés en el punto justo: confía en su criterio, pero sabe que solo no llega." },
     { kv: ["El error", "“Obviamente no te está funcionando, por algo estás acá.” Lo pone a la defensiva y la charla pasa de colaborativa a pelea."] },
     { kv: ["Pasás a Problema cuando", "Tenés sus números, empezó a decir qué cambiaría y sigue colaborando."] },
     { rule: "Acá ves si califica: consumible químico y más de 30 millones por mes. Si no, la llamada sigue igual con otro objetivo (ver la última sección)." }
   ] },
   { h: "Fase 3 · Problema (10 min)", b: [
     { kv: ["Objetivo", "Cuatro datos, de forma neutral y sin atacar: el problema, hace cuánto, el impacto y la causa. Que él desarme su propio proceso."] },
     { h4: "Qué cubrís, en este orden" },
     { ol: ["El problema, aclarado: “Cuando decís que no queda nada, ¿a qué te referís puntualmente?”.", "Hace cuánto: querés un plazo. “Desde mitad de año, cuando entraron 7 marcas a pautar lo mismo.”", "El impacto, en la marca y en él: “No podemos pagar más pauta” · “El 1 del mes arranco en cero, no duermo”.", "La causa: él la dice como la ve (“la competencia”, “Meta”). Vos sabés que la raíz es que su unidad de venta es la compra, no el cliente. No se lo corrijas acá: eso es el pitch."] },
     { h4: "Cómo suena" },
     { say: [["Closer", "Cuando decís que no queda nada, ¿a qué te referís puntualmente?"], ["Closer", "¿Hace cuánto te pasa?"], ["Closer", "¿Y de dónde creés que viene?"], ["Closer", "Eso de los últimos seis meses, ¿qué impacto tuvo en la marca? ¿Y a vos, en lo personal, cómo te está pegando?"]] },
     { h4: "La pregunta de la fase" },
     { say: [["Closer", "Para entender bien la lógica: ¿por qué querés resolverlo ahora con suscripción, en vez de hacer más de lo mismo? Más creativos, más pauta, sumar productos."], ["Lead", "Porque ya lo hicimos, y cada creativo nuevo me cuesta más que el anterior."]] },
     { p: "Lo dice él, no vos. Eso vale más que cualquier argumento tuyo." },
     { p: "Frases que vas a escuchar, anotalas textuales para el pitch: “los CPAs nos empezaron a reventar”, “salieron 7 a pautar un producto muy parecido”, “7 lucas de ganancia, sobreviviendo”, “ayer íbamos 600 lucas abajo y apagamos”, “si paso a responsable inscripto no me cierra”." },
     { kv: ["El error", "Atacar el proceso directo (“clarísimo que tu modelo no da más”): defensa y pelea."] },
     { kv: ["Pasás a Solución cuando", "Tenés los 4 datos concretos y él mismo justificó por qué su forma actual no alcanza."] }
   ] },
   { h: "Fase 4 · Solución (10 min)", b: [
     { kv: ["Objetivo", "Que vea vivo el futuro con el problema resuelto. La venta no se hace agrandando el problema: la hace la visión del futuro."] },
     { h4: "Los 3 elementos" },
     { ol: ["Criterio ideal: qué tendría que tener la solución para que le funcione. Vas a escuchar “que no me rompa lo que ya vende”, “que lo hagan con nosotros, no un curso”, “que sea alguien que lo haya hecho”. Son los pilares que vas a resaltar.", "Tangible: qué va a poder hacer que hoy no puede. “Pagar más pauta sin miedo”, “contratar”, “tomarme una semana sin mirar el administrador de anuncios”.", "Emocional: qué se siente. Acá está la venta."] },
     { h4: "Cómo suena" },
     { say: [["Closer", "Si tu equipo y el nuestro se sentaran a armar esto 1 a 1, ¿qué tendría que tener para que te funcione de verdad?"], ["Closer", "Si mañana tenés tu base de suscriptores cobrando todos los meses, ¿qué vas a poder hacer que hoy no podés?"], ["Closer", "Imaginate que es día 1 del mes. Abrís el panel y ya tenés cobrados 800 suscriptores antes de prender un anuncio. ¿Qué se siente? ¿A quién se lo contás primero?"]] },
     { p: "Preguntalo en presente (“qué se siente”), no en condicional. El presente lo mete en la escena." },
     { h4: "La cuenta con sus números" },
     { p: "Hacés la cuenta del techo en el Simulador con los datos de la fase 2. Si su margen por pedido es 30.000, hoy puede pagar 30.000 por cliente; con 3 compras, el techo es 90.000 y se opera en 75.000. Que vea su número, no el de Manu. Techo y punto operativo, siempre juntos." },
     { h4: "El cierre de la fase" },
     { say: [["Closer", "Con lo que tenés hoy, el equipo y cómo lo vienen haciendo, ¿qué tan cerca estás de llegar a eso?"], ["Lead", "Lejos."]] },
     { p: "Ahí ves el gap. Si te dice que está cerca, no es lead para Génesis o hay que subir el objetivo." },
     { kv: ["El error", "Saltear lo emocional y quedarte solo en números. Compra con la cabeza, pero decide con lo que siente al imaginarse el mes arrancando cobrado."] },
     { kv: ["Pasás a Compromiso cuando", "Tenés criterio, tangible y emocional, vio su cuenta del techo y le pegó la distancia entre hoy y ese futuro."] }
   ] },
   { h: "Fase 5 · Compromiso (2 min)", b: [
     { kv: ["Objetivo", "Que diga con sus palabras que está dispuesto a hacer algo. Es corta, pero no se saltea."] },
     { h4: "Cómo suena" },
     { say: [["Closer", "¿Sentís que es momento de hacer un cambio, entonces? ¿Por qué ahora y no en 6 meses?"]] },
     { h4: "El empujón para atrás (en tono liviano, casi jugando)" },
     { say: [["Closer", "Mirá, no tenés que hacerlo, eh. La marca factura 45 millones, está funcionando. ¿Por qué no lo dejás para más adelante?"], ["Lead", "Porque si sigo así, en 6 meses estoy peor. Ya me quedé quieto todo el año."]] },
     { p: "Cuando lo empujás suave para atrás, se empuja solo para adelante. Una vez que lo dijo en voz alta, queda coherente con eso y llega al precio comprometido, no como alguien que “está viendo”." },
     { kv: ["El error", "Saltearla porque “ya se ve que quiere”. Si no lo dijo él, no cuenta."] },
     { kv: ["Pasás a Consecuencia cuando", "Dijo que está dispuesto y te dio su “por qué ahora”."] }
   ] },
   { h: "Fase 6 · Consecuencia (5 min)", b: [
     { kv: ["Objetivo", "Que vea el costo de no hacer nada con el mismo detalle con el que vio el éxito. Acá nace la urgencia."] },
     { h4: "Cómo suena" },
     { say: [["Closer", "Esa es una cara de la moneda. ¿Y si no cambia nada? Si en 6 meses seguís igual: el CPA sigue subiendo, cada venta te deja lo mismo y el 1 de cada mes arrancás en cero. ¿Qué pasa con la marca?"], ["Closer", "¿Y si un día Meta te baja la cuenta y no tenés base? ¿Qué pasa ese mes? ¿Y el siguiente?"], ["Closer", "¿Y con vos? ¿Seguís pudiendo bancarte otros 6 meses así?"], ["Closer", "Al final, ¿de quién es la responsabilidad de cambiarlo? ¿Y sentís que el momento es ahora?"]] },
     { p: "No le aceptes el “ya lo voy a resolver”. La gente que no mira el fracaso vuelve en 6 o 12 meses más atrás que antes. Que lo explore en detalle: es incómodo, y de eso se trata." },
     { kv: ["El error", "Quedarte en lo abstracto (“y bueno, vas a seguir igual”). El fracaso tiene que ser tan concreto como el éxito: el mes, el número, la cuenta bloqueada."] },
     { kv: ["Pasás a Presentación cuando", "Exploró el fracaso sin esquivarlo, hay urgencia real y se siente la tensión entre los dos futuros."] }
   ] },
   { h: "Fase 7 · Presentación (10 min máximo)", b: [
     { kv: ["Objetivo", "Mostrar el puente. Corto: no más del 15% de la llamada."] },
     { h4: "La transición: cerrás el gap con sus palabras y pedís permiso" },
     { say: [["Closer", "Mirá Martín, por todo lo que me contaste, esto te sirve. Me dijiste que querés dejar de depender de la pauta, pero hoy cada venta te deja lo mismo y el 1 del mes arrancás en cero, y eso te tiene sin dormir. Dejame mostrarte cómo lo resolveríamos y cómo se vería tu roadmap. ¿Dale?"]] },
     { h4: "Después del pitch, la secuencia de cierre" },
     { ol: ["Buscás el sí: “¿Sentís que esto es lo que estabas buscando para tu marca?”.", "Pedís el por qué: “¿Por qué?”. Que se lo venda él.", "Que reafirme lo puntual: “¿Hay algo que sientas que es la llave para vos?”.", "Pedís la venta con el próximo paso concreto: pago, onboarding y auditoría de sus números."] },
     { p: "El pitch completo, paso a paso, está en el documento “Presentación y objeciones”." },
     { kv: ["La llamada cerró cuando", "Pasaste los 3 pilares, cada uno atado a un problema suyo con su “¿tiene sentido?”; conseguiste el sí, el por qué y la llave; y pediste la venta con el próximo paso."] }
   ] },
   { h: "Las 7 fases en una línea", b: [
     { ol: ["Conexión: sacá el foco de vos y encontrá el objetivo general. No caves.", "Situación: cómo funciona la marca, con números. Permiso para quejarse sin socavarlo.", "Problema: cuál, hace cuánto, qué impacto, qué lo causa, y “¿por qué no más de lo mismo?”.", "Solución: el futuro resuelto (criterio, tangible, emocional) y su cuenta del techo. Cerrá con “¿qué tan cerca estás?”.", "Compromiso: que diga que está dispuesto. Empujón para atrás.", "Consecuencia: el fracaso con el mismo detalle que el éxito.", "Presentación: pitch corto, 3 pilares atados a sus problemas, y sí → por qué → llave → pedir la venta."] }
   ] },
   { h: "Si no califica: misma llamada, otro objetivo", b: [
     { p: "Lo ves en la fase 2, con sus números: factura menos de 30 millones por mes o no vende un consumible químico (tienen que darse las dos para calificar). La llamada no se corta ni se acelera: hacés las 7 fases igual, pero el destino es la Mentoría." },
     { t: { h: ["Fase", "Lead de Génesis", "Lead de Mentoría"], r: [
       ["Problema", "El CPA, el margen, la dependencia de Meta", "No logra vender de forma constante, no sabe cómo escalar"],
       ["Solución", "La base que cobra sola y la cuenta del techo", "La marca vendiendo todos los meses con pauta. Sin cuenta del techo"],
       ["Consecuencia", "Seguir en breakeven, arrancar cada mes en cero", "Seguir sin despegar, quemar plata en pauta sin sistema"],
       ["Presentación", "Génesis, USD 5.000", "Mentoría, USD 2.000"]] } },
     { p: "La transición y el pitch de la Mentoría están en el documento “Presentación y objeciones”." }
   ] }
  ] },

 b2b: {
  sub: "El lead de Génesis es un dueño de marca que ya factura. Las 7 fases son las mismas; lo que cambia es el tono: de igual a igual, lógico y técnico.",
  secs: [
   { h: "Lo que cambia con un dueño de empresa", open: true, b: [
     { ul: ["De igual a igual: le hablás como dueño a dueño. Nada de explicar lo obvio ni tono de coach. Sabe de pauta, márgenes y proveedores más que la mayoría.", "Lógico y directo: compra con la cabeza, aunque la emoción esté abajo. Vas al grano: números, dónde se traba, cuánto le cuesta.", "Técnico: quiere entender el cómo por dentro. Si pregunta cómo se cobra la recurrencia, cómo se convierte la base o cómo se arma la variante de suscripción, contestás con detalle. Acá el detalle técnico convence y construye autoridad."] },
     { rule: "El error que más ventas mata: tratarlo como principiante. Emocional, básico, sobreexplicando (“la suscripción es cuando el cliente paga todos los meses…”). Le subís la guardia y perdés el deal." },
     { h4: "La emoción, desde su mundo" },
     { p: "En la fase 4 la parte emocional no se saltea, pero se hace desde su mundo: el mes que arranca cobrado, la cuenta de Meta que deja de ser un riesgo, poder contratar, dormir tranquilo. Nada de “cerrá los ojos e imaginá tu vida soñada”." }
   ] },
   { h: "La sentada de base", b: [
     { p: "Va al final de la Conexión, cuando ya tenés el objetivo. Enmarca toda la llamada como un roadmap." },
     { say: [["Closer", "Te cuento cómo trabajamos: pasamos marcas de consumibles al modelo de suscripción y lo hacemos nosotros, con vos. La idea de esta llamada es ver qué están haciendo hoy, cómo les está yendo, dónde se está trabando, y en base a eso ver qué roadmap tendría sentido para tu marca. Si al final sentimos que encajamos, vemos de arrancar. ¿Te parece?"]] },
     { p: "No es “al final vas a tener que tomar una decisión” (eso es el viejo modelo): es un acuerdo entre dos dueños sobre cómo usar la hora." }
   ] },
   { h: "Las métricas: cómo ramificar la Situación", b: [
     { p: "En la fase 2 preguntás si tiene los números bajados a tierra." },

    { id: "nedup", t: "note", r: 0, c: 1, below: true, from: "edup", lab: "No cortes y vuelvas a llamar", text: "El lead tibio se enfría en el momento en que colgás. Todo esto pasa en la primera llamada." },
    { id: "edus", t: "step", k: "sdr", r: 0, c: 2, n: "2", title: "Educás sobre la solución", d: "Que existe una salida y que tiene un orden. El qué y el por qué, nunca el cómo completo.",
      ex: [{ type: "call", head: "Si el dolor es el CPA", lines: [["SDR", "Las marcas que salen de ahí dejan de pelear por bajar el CPA y pasan a poder pagar más por cada clienta, porque cada una les compra más de una vez. Hay un orden para hacerlo, y Manu lo muestra paso a paso el lunes."]] },
           { type: "call", head: "Si el dolor es la dependencia de Meta", lines: [["SDR", "Las marcas que salen de ahí arman una base que les compra todos los meses, y la pauta pasa a sumar clientas nuevas en vez de sostener todo. Hay un orden para hacerlo, y Manu lo muestra paso a paso el lunes."]] },
           { type: "call", head: "Si el dolor son los márgenes", lines: [["SDR", "Las marcas que salen de ahí pagan la primera venta, pero la segunda, la tercera y la cuarta les entran con el margen entero. Hay un orden para hacerlo, y Manu lo muestra paso a paso el lunes."]] }] },
    { id: "nedus", t: "note", r: 0, c: 2, below: true, from: "edus", lab: "Límite", text: "Si se lleva el cómo entero, no va a la clase: ya tiene lo que fue a buscar. La IA te ayuda a entender su caso; no se lo resuelve." },
    { id: "sop", t: "step", k: "sdr", r: 0, c: 3, n: "3", title: "Le mandás el recurso hecho con la IA", d: "El mismo día. Lo armás con la IA de la Skool de Manu, con lo que te contó en la llamada.",
      ex: [{ type: "note", head: "Lo que le cargás a la IA para Lucía", lines: ["Marca: limpieza ecológica · Instagram y tienda propia", "Facturación: entre 10M y 30M · ciclo de reposición: entre 30 y 60 días", "Dolor: [el que salió en la llamada], con sus palabras", "Pedido: un recurso sobre ese dolor que le muestre el problema con claridad y le dé ganas de ver la clase, sin resolverlo"] },
           { type: "wa", head: "WhatsApp a Lucía · si el dolor es el CPA", lines: ["Te paso lo que te prometí: te armé este recurso para tu marca [recurso]. Es justo para lo del CPA. Arrancá por la parte de cuánto podés pagar por cada clienta y después contame cómo te fue."] },
           { type: "wa", head: "WhatsApp a Lucía · si depende de Meta", lines: ["Te paso lo que te prometí: te armé este recurso para tu marca [recurso]. Es justo para lo de depender de la pauta. Arrancá por la parte de cómo hacer que tus clientas te vuelvan a comprar y después contame cómo te fue."] },
           { type: "wa", head: "WhatsApp a Lucía · si son los márgenes", lines: ["Te paso lo que te prometí: te armé este recurso para tu marca [recurso]. Es justo para lo de que no te queda nada. Arrancá por la parte de cuánto te deja cada clienta en el tiempo y después contame cómo te fue."] }],
      rule: "Cualquier recurso que mandamos lo crea nuestra IA con la información de la Skool de Manu. El recurso acompaña el interés por entrar a la clase: nunca le soluciona el problema." },
    { id: "nsop", t: "note", r: 0, c: 3, below: true, from: "sop", lab: "Acompaña, no resuelve", text: "Cumple la promesa y suma ganas de ver la clase, pero nunca le soluciona el problema. Pretexto del seguimiento: «¿pudiste ver el recurso?»." },
    { id: "int", t: "step", k: "sdr", r: 0, c: 4, n: "4", title: "Subís el interés por la clase", d: "Conectás su problema con lo que se va a mostrar: «esto que te pasa es justo lo que vamos a ver».",
      ex: [{ type: "call", head: "Si el dolor es el CPA", lines: [["SDR", "Esto que te pasa con el CPA es justo lo que Manu va a mostrar el lunes 19 a las 19: por qué cada venta te cuesta lo mismo que la anterior y cómo salir de eso. La clase es privada, así que entrás porque estás anotada."]] },
           { type: "call", head: "Si el dolor es la dependencia de Meta", lines: [["SDR", "Esto que te pasa con la pauta es justo lo que Manu va a mostrar el lunes 19 a las 19: cómo armar una base que te compre todos los meses aunque Meta te baje la cuenta. La clase es privada, así que entrás porque estás anotada."]] },
           { type: "call", head: "Si el dolor son los márgenes", lines: [["SDR", "Esto que te pasa con el margen es justo lo que Manu va a mostrar el lunes 19 a las 19: cómo hacer que la segunda, la tercera y la cuarta compra te entren con el margen entero. La clase es privada, así que entrás porque estás anotada."]] }] },
    { id: "nint", t: "note", r: 0, c: 4, below: true, from: "int", lab: "Personalizado o no sirve", text: "Invitar en genérico no mueve a nadie. Tiene que escuchar su propio problema en el temario." },
    { id: "confa", t: "step", k: "sdr", r: 0, c: 5, n: "5", title: "Confirmás la asistencia", d: "Día, hora y un ok explícito. El ok es lo que sube la asistencia.",
      ex: [{ type: "wa", head: "WhatsApp a Lucía", lines: ["¿Te cuento como confirmada para el lunes 19 a las 19? Tirame un ok."] }] },
    { id: "dconf", t: "dec", r: 1, c: 0, title: "¿Confirmó?",
      branches: [["Sí", "Recordatorios hasta el día."], ["No", "Sigue la cadencia hasta el evento, con el recurso como excusa."]],
      ex: [{ type: "wa", head: "Cadencia con el recurso como excusa", lines: ["Lucía, ¿pudiste ver el recurso? Contame qué te pareció, y de paso te confirmo para el lunes a las 19."] }] },
    { id: "dconfno", t: "no", r: 1, c: 0, below: true, from: "dconf", text: "Sigue en la cadencia hasta el evento: llamada, texto y audio turnándose, con el recurso como excusa.", act: "↺ Seguir la cadencia" },
    { id: "rec", t: "step", k: "sdr", r: 1, c: 1, n: "6", title: "Recordatorios hasta el día", d: "Día anterior y día de la clase, pidiendo un ok cada vez.",
      ex: [{ type: "wa", head: "Domingo 18", lines: ["Mañana a las 19 es la clase. Lo del CPA lo ves ahí. ¿Seguís firme? Tirame un ok."] }] },
    { id: "m3", t: "mile", r: 1, c: 2, lab: "Milestone", title: "Confirmada para la clase", text: "Sigue en la Fase 04. Después de la clase, Mentoría." },
    { id: "nm3", t: "note", r: 1, c: 2, below: true, from: "m3", lab: "Si resulta que sí califica", text: "Si en el camino aparece que factura más de 30M y vende un consumible químico, pasa a la ruta pre-venta y agenda con Manu. Si no, se la sostiene hasta la clase." }
   ],
   edges: [["s3","ns3","n"],["s3","edup","h"],["edup","nedup","n"],["edup","edus","h"],["edus","nedus","n"],["edus","sop","h"],["sop","nsop","n"],["sop","int","h"],["int","nint","n"],["int","confa","h"],["confa","dconf","w"],["dconf","dconfno","d","NO"],["dconf","rec","h","SÍ"],["rec","m3","h"],["m3","nm3","n"]] },

 { id: "f4", tab: "04 Día de la clase", chip: "FASE 04", title: "Arranca la clase en vivo", meta: "Paso 1: SDR · pasos 2 a 5: Matías, Santiago y José · lunes 19/10", color: "var(--p4)", rows: [140, 600],
   nodes: [
    { id: "s4", t: "start", r: 0, c: 0, title: "Arranca el vivo" },
    { id: "recf", t: "step", k: "sdr", r: 0, c: 1, n: "1", title: "Recordatorio final y link", d: "Dos horas antes y al abrir la sala. El último empujón trae a la mitad de los que aparecen.",
      ex: [{ type: "wa", head: "17:00", lines: ["Martín, hoy a las 19 es la clase en vivo con Manu. Te voy a pasar el link por acá cuando abra la sala. Tirame un ok así sé que lo tenés."] }, { type: "wa", head: "19:00", lines: ["Arrancó. Entrá acá: [LINK CLASE]"] }] },
    { id: "nrecf", t: "note", r: 0, c: 1, below: true, from: "recf", lab: "Quiénes están en la lista", text: "Los que confirmaste, los que nunca te atendieron y los que se anotaron sin hablar con nadie. Los tres reciben el recordatorio." },
    { id: "chat", t: "step", k: "team", r: 0, c: 2, n: "2", title: "Moderás el chat", d: "Contestás dudas y sostenés la conversación. Acá no se vende ni se da precio.",
      ex: [{ type: "note", head: "Respuestas en el chat", lines: ["«¿Cuánto sale?» → Depende de cada marca. Eso lo ves en una llamada con tus números; al final Manu te dice cómo agendar.", "«¿Queda grabada?» → Sí, los anotados reciben la repetición. Pero en vivo podés preguntar.", "«¿Sirve para mi rubro?» → Contame qué vendés y te digo."] }] },
    { id: "nchat", t: "note", r: 0, c: 2, below: true, from: "chat", lab: "Desde acá, el equipo", text: "Los pasos 2 a 5 los hacen Matías, Santiago y José. El SDR y los closers no hacen nada más en esta fase: siguen en la Fase 05." },
    { id: "sen", t: "step", k: "team", r: 0, c: 3, n: "3", title: "Marcás señales de compra", d: "El que pregunta precio, formas de pago o cuándo empieza queda marcado como prioridad del día siguiente.",
      ex: [{ type: "note", head: "Ejemplo en el chat", lines: ["Escribe: «¿Y esto cuándo arranca? ¿Se puede pagar en cuotas?»", "→ Etiqueta en GHL: señal de compra. Es el primero que se llama si no agenda."] }] },
    { id: "nsen", t: "note", r: 0, c: 3, below: true, from: "sen", lab: "Vale oro", text: "Esa lista es por quién empezás a llamar al día siguiente. Sin ella, llamás por orden alfabético." },
    { id: "cta", t: "step", k: "team", r: 0, c: 4, n: "4", title: "El llamado a la acción: dos opciones", d: "En la clase pueden agendar directo una llamada, o dejar sus datos en un formulario para que los contactemos si tienen dudas.",
      ex: [{ type: "wa", head: "En el chat de la clase", lines: ["Si ya lo querés ver con tus números, agendá tu llamada acá: [link de Calendly].", "Si te quedaron dudas, dejá tus datos acá y te contactamos: [link del formulario de contacto]."] }],
      rule: "El que agenda va al Grupo 1. El que deja sus datos va al Grupo 2, con prioridad." },
    { id: "ncta", t: "note", r: 0, c: 4, below: true, from: "cta", lab: "Dos puertas", text: "Agenda → Grupo 1. Deja sus datos → Grupo 2 (primero en la lista). No hace ninguna de las dos → Grupo 2, después." },
    { id: "part", t: "step", k: "team", r: 1, c: 0, n: "5", title: "Partís la lista en tres grupos", d: "El mismo día, no al siguiente. La ventana cierra el jueves 22 a las 23:59.",
      ex: [{ type: "note", head: "Cómo se arman", lines: ["Grupo 1 · agendó en la clase", "Grupo 2 · dejó sus datos (primero) o asistió sin agendar ni dejar datos (después)", "Grupo 3 · no asistió"] }] },
    { id: "nm4", t: "note", r: 1, c: 0, below: true, from: "part", lab: "Prioridad del Grupo 2", text: "Los que dejaron sus datos levantaron la mano: se llaman antes que los que asistieron y no hicieron nada." },
    { id: "g1c", t: "route", r: 1, c: 1, lab: "Grupo 1", title: "Agendó en la clase", text: "Se filtra: los mejores con Manu, el resto con el closer." },
    { id: "g2c", t: "route", r: 1, c: 2, lab: "Grupo 2", title: "Dejó sus datos o no agendó", text: "Se lo llama para resolver dudas: si califica, agenda; si no, Mentoría." },
    { id: "g3c", t: "route", r: 1, c: 3, lab: "Grupo 3", title: "No asistió", text: "Se anotó y no apareció. Hay que volver a meterlo con la repetición antes de pedirle nada." },
    { id: "m4", t: "mile", r: 1, c: 4, lab: "Milestone", title: "Los tres grupos armados", text: "Sigue en la Fase 05, cada grupo con su entrada." }
   ],
   edges: [["s4","recf","h"],["chat","nchat","n"],["recf","nrecf","n"],["recf","chat","h"],["chat","sen","h"],["sen","nsen","n"],["sen","cta","h"],["cta","ncta","n"],["cta","part","w"],["part","nm4","n"],["part","g1c","h"],["g1c","g2c","h"],["g2c","g3c","h"],["g3c","m4","h"]] },

 { id: "f5", tab: "05 Los 3 grupos", chip: "FASE 05", title: "Después de la clase: los tres grupos", meta: "SDR, Manu y closer · del 19/10 a la noche al 22/10", color: "var(--p5)", rows: [140, 600, 1060],
   nodes: [
    { id: "s51", t: "start", r: 0, c: 0, title: "Grupo 1 · Agendó en la clase" },
    { id: "g1f", t: "step", k: "team", r: 0, c: 1, n: "1", title: "Filtrás los leads: ¿Manu o closer?", d: "Lo hacen Matías y Santiago. Separan los mejores leads de los peores y definen quién toma cada llamada.",
      branches: [["Manu", "Los mejor calificados: consumible químico, facturación más alta, quieren resolverlo ya."], ["Closer", "El resto de los que agendaron. Incluye a los que no califican para Génesis: el closer les vende la Mentoría."]],
      ex: [{ type: "note", head: "Cómo se reparten", lines: ["Sofía · cosmética · entre 50M y 100M · «lo quiero resolver ya» → la toma Manu", "Lucía · limpieza ecológica · entre 10M y 30M → la toma el closer (Mentoría)"] }],
      rule: "Las llamadas de los mejor calificados las toma Manu. [CONFIRMAR: el criterio exacto para separar los mejores de los peores.]" },
    { id: "ng1f", t: "note", r: 0, c: 1, below: true, from: "g1f", lab: "Matías y Santiago", text: "El filtro lo hacen ellos, antes de armar ningún grupo. El SDR arranca cuando ya está definido si la llamada es con Manu o con el closer." },
    { id: "g1g", t: "step", k: "sdr", r: 0, c: 2, n: "2", title: "Grupo de WhatsApp", d: "Dentro de la comunidad, igual que en la pre-venta. Si la toma Manu: Manu y el lead. Si la toma el closer: Manu, el closer y el lead, y Manu le hace el traspaso.",
      ex: [{ type: "wa", head: "Si la toma Manu · grupo «Sofía · miércoles 21, 11 hs»", lines: ["Sofía, ¿cómo va? Soy Manu. Armé este grupo para que tengamos todo a mano antes de la llamada del miércoles a las 11.", "Ya vi lo que pusiste. Antes de hablar te mando un recurso armado para tu marca."] }, { type: "wa", head: "Si la toma el closer · grupo «Lucía · miércoles 21, 16 hs»", lines: ["Lucía, ¿cómo va? Soy Manu. Te presento a [closer], que es con quien vas a hablar el miércoles a las 16.", "[closer]: Lucía tiene [marca], productos de limpieza ecológica. Lo que más le pesa es que sus clientas compran una vez y no vuelven."] }],
      rule: "Nombre del grupo: [nombre del lead] · [día y hora que agendó]. La facturación no se dice en el grupo: está en lo que agendó y en la ficha de GHL." },
    { id: "ng1g", t: "note", r: 0, c: 2, below: true, from: "g1g", lab: "Traspaso", text: "Si la toma el closer, el traspaso se lo hace Manu en el grupo. La ficha completa queda en GHL." },
    { id: "g1cc", t: "step", k: "sdr", r: 0, c: 3, n: "3", title: "Cold call de bienvenida", d: "Confirmás la llamada, sacás lo que le faltó de la clase y le anticipás qué le vas a mandar.",
      ex: [{ type: "call", head: "Con Sofía (la toma Manu)", lines: [["SDR", "Hola Sofía, soy [tu nombre], del equipo de Manu. Te llamo porque vi que agendaste con Manu para el miércoles a las 11. Antes de eso: ¿qué fue lo que más te sirvió de la clase? ¿Y qué te quedó dando vueltas?"], ["Sofía", "Me quedó la duda de cómo convertir a las clientas que ya tengo."], ["SDR", "Perfecto, eso lo ven el miércoles. Te voy a mandar por el grupo un recurso armado para tu marca, así llegás con todo el panorama."]] }, { type: "call", head: "Con Lucía (la toma el closer)", lines: [["SDR", "Hola Lucía, soy [tu nombre], del equipo de Manu. Te llamo porque vi que agendaste con [closer] para el miércoles a las 16. ¿Qué fue lo que más te sirvió de la clase? ¿Y qué te quedó dando vueltas?"], ["SDR", "Buenísimo. Te mando por el grupo un recurso armado para tu marca antes de la llamada."]] }],
      rule: "Lo que le faltó de la clase va a la ficha de GHL, para Manu o el closer." },
    { id: "g1r", t: "step", k: "sdr", r: 0, c: 4, n: "4", title: "Recurso hecho con la IA", d: "Por el grupo, antes de la llamada. Lo arma la IA de la Skool con lo que respondió al agendar.",
      ex: [{ type: "wa", head: "Por el grupo", lines: ["Te armé este recurso para tu marca [recurso]. Es sobre [lo que lo frena]. Miralo antes de la llamada, así llegás con todo el panorama."] }],
      rule: "El recurso acompaña el interés por la llamada: nunca le soluciona el problema." },
    { id: "m51", t: "mile", r: 0, c: 5, lab: "Milestone", title: "Sostenido hasta la llamada", text: "Con Manu o con el closer. Entra al núcleo." },

    { id: "s52", t: "start", r: 1, c: 0, title: "Grupo 2 · Dejó sus datos o no agendó" },
    { id: "g2a", t: "step", k: "sdr", r: 1, c: 1, n: "1", title: "Los llamás por prioridad", d: "Primero los que dejaron sus datos en el formulario de la clase. Después los que asistieron y no agendaron ni dejaron datos.",
      ex: [{ type: "call", head: "Dejó sus datos", lines: [["SDR", "Hola, soy [tu nombre], del equipo de Manu. Dejaste tus datos en la clase de ayer para que te contactemos. ¿Qué dudas te quedaron?"]] }, { type: "call", head: "Asistió y no dejó datos", lines: [["SDR", "Hola, soy [tu nombre], del equipo de Manu. Te vi en la clase de ayer. ¿Qué te pareció? ¿Te quedó alguna duda?"]] }] },
    { id: "ng2a", t: "note", r: 1, c: 1, below: true, from: "g2a", lab: "Prioridad", text: "1° dejaron sus datos (levantaron la mano). 2° asistieron sin agendar ni dejar datos. Dentro de cada uno, primero los marcados con señal de compra." },
    { id: "g2b", t: "step", k: "sdr", r: 1, c: 2, n: "2", title: "Buscás la objeción real", d: "«¿Qué te faltó para dar el paso?» y te callás.",
      ex: [{ type: "call", head: "Llamada a un lead del Grupo 2", lines: [["Lead", "Muy bueno. Lo tengo que pensar."], ["SDR", "¿Qué es puntualmente lo que tenés que pensar?"], ["Lead", "No sé si con mi rubro funciona."]] }] },
    { id: "ng2b", t: "note", r: 1, c: 2, below: true, from: "g2b", lab: "La primera nunca es la real", text: "La primera es «lo tengo que pensar». La verdadera aparece cuando preguntás qué le faltó." },
    { id: "g2c2", t: "step", k: "sdr", r: 1, c: 3, n: "3", title: "La rompés", d: "Con un recurso hecho con la IA para esa objeción, no con algo genérico.",
      ex: [{ type: "wa", head: "Después de la llamada", lines: ["Te armé esto para tu caso [recurso]. Es justo sobre lo que me dijiste, si con tu rubro funciona. Miralo y lo hablamos."] }],
      rule: "El recurso acompaña: le muestra que su objeción tiene respuesta, pero no le resuelve el problema." },
    { id: "g2d", t: "dec", r: 1, c: 4, title: "¿Es miedo o falta de fit?",
      branches: [["Miedo", "Hay fit: sigue al paso 4."], ["Sin fit", "No tiene un consumible propio o no tiene intención de invertir: recibe el recurso y queda para el próximo ciclo."]],
      rule: "No calificar para Génesis no es «sin fit»: ese lead va a la Mentoría." },
    { id: "g2dno", t: "no", r: 1, c: 4, below: true, from: "g2d", text: "Si no hay fit real, no le vendas: le mandás el recurso y queda para el próximo ciclo.", act: "↺ Próximo ciclo" },
    { id: "g2q", t: "dec", r: 1, c: 5, title: "¿Califica para la de USD 5.000?", d: "Consumible químico + más de 30M por mes.",
      branches: [["Sí", "Agendás la llamada."], ["No", "Le vendés la Mentoría, mostrándole por qué la de USD 5.000 hoy no le sirve."]] },
    { id: "g2m", t: "step", k: "sdr", r: 1, c: 5, below: true, n: "4b", title: "Le vendés la Mentoría", d: "Le mostrás por qué la oferta de USD 5.000 hoy no le sirve, qué tiene la de USD 2.000 y por qué le hace más sentido.",
      ex: [{ type: "call", head: "Con un lead que no califica", lines: [["SDR", "Te voy a ser sincero: el programa de USD 5.000 hoy no te sirve. Está pensado para marcas que ya facturan más de 30 millones con un consumible químico, porque instala la suscripción sobre una base que ya vende. Si te lo vendiera hoy, te estaría cobrando por algo que todavía no podés aprovechar."], ["SDR", "Lo que sí te sirve ahora es la Mentoría: 3 meses, chat 1 a 1 con José, una clase grupal por semana con Manu y dos con José, todo el contenido grabado con SOPs, roadmaps, sistemas y contactos, y la comunidad. Es para que primero tu marca venda todos los meses de forma constante. Y cuando llegues, el paso siguiente es el de USD 5.000."], ["SDR", "La inversión es de USD 2.000, o 2 cuotas de USD 1.100."]] }],
      rule: "Nos ponemos de su lado: le explicamos por qué la más cara no le sirve ahora. El precio no se baja. [CONFIRMAR: si la vende quien llama o se agenda con un closer.]" },
    { id: "g2e", t: "step", k: "sdr", r: 1, c: 6, n: "4a", title: "Agendás la llamada", d: "Con el formulario de Calendly, y sigue como el Grupo 1: filtro, grupo y recurso.",
      ex: [{ type: "wa", head: "WhatsApp", lines: ["Dale, lo vemos con tus números. Acá elegís el horario: [link de Calendly]."] }] },

    { id: "s53", t: "start", r: 2, c: 0, title: "Grupo 3 · No asistió" },
    { id: "g3a", t: "step", k: "sdr", r: 2, c: 1, n: "1", title: "Los llamás", d: "El objetivo no es agendar: es volver a meterlo en el proceso.",
      ex: [{ type: "call", head: "Llamada a un lead del Grupo 3", lines: [["SDR", "Soy [tu nombre], del equipo de Manu. Te llamo porque te anotaste a la clase de ayer y no te vi. ¿Qué pasó? ¿Y cómo venís con la marca?"]] }] },
    { id: "ng3a", t: "note", r: 2, c: 1, below: true, from: "g3a", lab: "Excepción", text: "Si en la llamada aparece temperatura, agendás directo. No lo mandes a ver la repetición por respetar el orden." },
    { id: "g3b", t: "step", k: "sdr", r: 2, c: 2, n: "2", title: "Repetición o el recurso que le sirve", d: "Uno solo, elegido por lo que te contó. Nunca los dos links en el mismo mensaje.",
      ex: [{ type: "wa", head: "Después de la llamada", lines: ["Te paso la repetición: [LINK REPLAY]. Si vas con poco tiempo, arrancá en [minuto], que es donde Manu habla de los CPA."] }] },
    { id: "g3d", t: "dec", r: 2, c: 3, title: "¿Lo vio?",
